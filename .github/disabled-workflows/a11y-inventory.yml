name: Accessibility Inventory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/a11y-inventory.yml"
      - "scripts/a11y_inventory.py"
      - "app/src/main/java/**"
  pull_request:
    paths:
      - ".github/workflows/a11y-inventory.yml"
      - "scripts/a11y_inventory.py"
      - "app/src/main/java/**"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory interactive accessibility controls
        run: python3 scripts/a11y_inventory.py
