name: Diagnose Android AAR metadata

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aar-metadata-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Bootstrap Gradle Wrapper
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh
      - name: Capture metadata failure
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:checkDebugAarMetadata 2>&1 | tee /tmp/aar.log
          status=${PIPESTATUS[0]}
          {
            echo "GRADLE_EXIT=$status"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo
            cat /tmp/aar.log
          } > AAR_METADATA_DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AAR_METADATA_DIAGNOSTIC.txt
          git commit -m "build: record AAR metadata diagnostic"
          git push origin HEAD:main
