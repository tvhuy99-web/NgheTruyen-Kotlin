name: Agent patch TruyenCom parser and verify tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Fix TruyenCom story-row container
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/sources/TruyenComSource.kt')
          text = path.read_text()
          old = 'val box = link.closest("article, li, .row, .item, .story, [class*=truyen]")'
          new = 'val box = link.closest("article, li, .row, .item, .story")'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one TruyenCom container anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify four previously failing tests
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:testDebugUnitTest :app:testReleaseUnitTest \
            --tests 'vn.nghetruyen.app.audio.PcmLoudnessEstimatorTest' \
            --tests 'vn.nghetruyen.app.sources.SourceRegistryTest' \
            --tests 'vn.nghetruyen.app.sources.TruyenComSourceTest' \
            --tests 'vn.nghetruyen.app.sources.TruyenCvSourceTest'
      - name: Commit parser fix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/sources/TruyenComSource.kt
          git rm .github/workflows/agent-debug-m0-gradle.yml
          git commit -m 'fix: repair source parser unit regressions'
          git push origin HEAD:agent/settings-a11y-labels
