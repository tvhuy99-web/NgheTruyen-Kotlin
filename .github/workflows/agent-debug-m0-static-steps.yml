name: Agent isolate M0 static gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
      - name: preflight
        run: python3 scripts/m0_preflight.py --json /tmp/preflight.json --markdown /tmp/preflight.md --strict
      - name: validate_release
        run: python3 scripts/validate_release.py
      - name: source_platform_foundation
        run: python3 scripts/check_source_platform_foundation.py
      - name: milestone2_source_platform
        run: python3 scripts/check_milestone2_source_platform.py
      - name: milestone4_foundation
        run: python3 scripts/check_milestone4_foundation.py
      - name: milestone4_complete
        run: python3 scripts/check_milestone4_complete.py
      - name: milestone5_foundation
        run: python3 scripts/check_milestone5_foundation.py
      - name: audio_export_static
        run: python3 scripts/check_audio_export_static.py
      - name: p1_ui_static
        run: python3 scripts/check_p1_ui_static.py
      - name: p2_ui_static
        run: python3 scripts/check_p2_ui_static.py
      - name: p4_transfer_static
        run: python3 scripts/check_p4_transfer_static.py
      - name: milestone3_ui_static
        run: python3 scripts/check_milestone3_ui_static.py
      - name: milestone3_download_static
        run: python3 scripts/check_milestone3_download_static.py
      - name: milestone3_kindle
        run: python3 scripts/check_milestone3_kindle.py
      - name: ui_control_parity
        run: python3 scripts/check_ui_control_parity.py
      - name: reference_workflow_parity
        run: python3 scripts/check_reference_workflow_parity.py
      - name: music_runtime_parity
        run: python3 scripts/check_music_runtime_parity.py
      - name: music_playback_parity
        run: python3 scripts/check_music_playback_parity.py
      - name: music_normalization_flow_parity
        run: python3 scripts/check_music_normalization_flow_parity.py
      - name: xpk_final_ui_parity
        run: python3 scripts/check_xpk_final_ui_parity.py
