name: Agent fix browser diagnostic probes

on:
  push:
    branches:
      - agent/fix-browser-diagnostic-probes
    paths:
      - .github/workflows/agent-fix-browser-diagnostic-probes.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-browser-diagnostic-probes
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply browser diagnostic fix
        run: python3 scripts/agent_fix_browser_diagnostic_probes.py

      - name: Run focused regression test
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests vn.nghetruyen.app.sourceplatform.BrowserPageStabilityPolicyTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/BrowserPageStabilityPolicy.kt
          git add app/src/test/java/vn/nghetruyen/app/sourceplatform/BrowserPageStabilityPolicyTest.kt
          git rm .github/workflows/agent-fix-browser-diagnostic-probes.yml
          git rm scripts/agent_fix_browser_diagnostic_probes.py
          git diff --cached --check
          git commit -m "fix: stop false browser stability timeout warnings"
          git push origin HEAD:agent/fix-browser-diagnostic-probes
