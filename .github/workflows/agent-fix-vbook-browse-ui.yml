name: Agent fix vBook browse UI

on:
  push:
    branches:
      - agent/generalize-browser-session-fetch
    paths:
      - scripts/agent_fix_vbook_browse_ui.py
      - .github/workflows/agent-fix-vbook-browse-ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generalize-browser-session-fetch
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply browse/presentation fix
        id: patch
        continue-on-error: true
        run: python3 scripts/agent_fix_vbook_browse_ui.py

      - name: Verify diff
        id: diffcheck
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Run focused presentation test and compile
        id: tests
        if: steps.patch.outcome == 'success' && steps.diffcheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'vn.nghetruyen.app.sourceplatform.VBookBrowsePresentationStaticTest' :source-vbook:test :app:compileDebugKotlin --stacktrace 2>&1 | tee /tmp/vbook-browse-ui.log

      - name: Publish verified fix or failure beacon
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p .agent
          printf 'patch=%s\ndiffcheck=%s\ntests=%s\n' "$PATCH_OUTCOME" "$DIFF_OUTCOME" "$TEST_OUTCOME" > .agent/vbook-browse-ui-status.txt
          if [ -f /tmp/vbook-browse-ui.log ] && [ "$TEST_OUTCOME" != success ]; then
            tail -n 600 /tmp/vbook-browse-ui.log > .agent/vbook-browse-ui-test.log
          fi
          if [ "$PATCH_OUTCOME" = success ] && [ "$DIFF_OUTCOME" = success ] && [ "$TEST_OUTCOME" = success ]; then
            rm -f scripts/agent_fix_vbook_browse_ui.py .github/workflows/agent-fix-vbook-browse-ui.yml .agent/vbook-browse-ui-status.txt .agent/vbook-browse-ui-test.log
            message='fix: expose dynamic vBook genre navigation'
          else
            message='ci: record vBook browse UI verification failure'
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$message"
          git push origin HEAD:agent/generalize-browser-session-fetch

      - name: Fail on verification failure
        if: always() && (steps.patch.outcome != 'success' || steps.diffcheck.outcome != 'success' || steps.tests.outcome != 'success')
        run: exit 1
