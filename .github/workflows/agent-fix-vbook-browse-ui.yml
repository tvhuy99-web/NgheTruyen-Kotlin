name: Agent fix vBook browse UI

on:
  push:
    branches:
      - agent/generalize-browser-session-fetch
    paths:
      - scripts/agent_fix_vbook_browse_ui.py
      - scripts/agent_refine_vbook_genre_entries.py
      - scripts/agent_finish_vbook_genre_compile.py
      - .github/workflows/agent-fix-vbook-browse-ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generalize-browser-session-fetch
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply complete browse/presentation architecture
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          if ! grep -q 'val supportsGenre: Boolean' app/src/main/java/vn/nghetruyen/app/sources/StorySource.kt; then
            python3 scripts/agent_fix_vbook_browse_ui.py
          fi
          if ! grep -q 'data class SourceBrowseEntry' app/src/main/java/vn/nghetruyen/app/sources/StorySource.kt; then
            python3 scripts/agent_refine_vbook_genre_entries.py
          fi
          if ! grep -q 'fun browseGenreEntry(categoryKey: String, displayName: String)' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt; then
            python3 scripts/agent_finish_vbook_genre_compile.py
          fi

      - name: Verify diff
        id: diffcheck
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Run full source platform, presentation regression and app compile
        id: tests
        if: steps.patch.outcome == 'success' && steps.diffcheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :source-api:test :source-js-sandbox:test :source-compat-testkit:test :source-store:test :source-runtime:test :source-diagnostics:test :source-network:test :source-repository:test :source-vbook:test :source-lua:test :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace 2>&1 | tee /tmp/vbook-browse-ui.log

      - name: Publish verified fix or failure beacon
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p .agent
          printf 'patch=%s\ndiffcheck=%s\ntests=%s\n' "$PATCH_OUTCOME" "$DIFF_OUTCOME" "$TEST_OUTCOME" > .agent/vbook-browse-ui-status.txt
          if [ -f /tmp/vbook-browse-ui.log ] && [ "$TEST_OUTCOME" != success ]; then
            tail -n 800 /tmp/vbook-browse-ui.log > .agent/vbook-browse-ui-test.log
          fi
          if [ "$PATCH_OUTCOME" = success ] && [ "$DIFF_OUTCOME" = success ] && [ "$TEST_OUTCOME" = success ]; then
            rm -f scripts/agent_fix_vbook_browse_ui.py scripts/agent_refine_vbook_genre_entries.py scripts/agent_finish_vbook_genre_compile.py .github/workflows/agent-fix-vbook-browse-ui.yml .agent/vbook-browse-ui-status.txt .agent/vbook-browse-ui-test.log
            message='fix: expose complete dynamic vBook genre navigation'
          else
            message='ci: record complete vBook browse UI verification failure'
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$message"
          git push origin HEAD:agent/generalize-browser-session-fetch

      - name: Fail on verification failure
        if: always() && (steps.patch.outcome != 'success' || steps.diffcheck.outcome != 'success' || steps.tests.outcome != 'success')
        run: exit 1

      # Final pass covers both UI shells, host-kernel refresh, duplicate labels and full app tests.
