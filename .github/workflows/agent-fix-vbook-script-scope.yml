name: Agent fix vBook script scope

on:
  push:
    branches:
      - agent/generalize-browser-session-fetch
    paths:
      - scripts/agent_fix_vbook_script_scope.py
      - .github/workflows/agent-fix-vbook-script-scope.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/generalize-browser-session-fetch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply generic vBook script compiler fix
        run: python3 scripts/agent_fix_vbook_script_scope.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Run source-vBook tests
        run: ./gradlew --no-daemon :source-vbook:test

      - name: Commit verified runtime fix
        run: |
          rm -f scripts/agent_fix_vbook_script_scope.py .github/workflows/agent-fix-vbook-script-scope.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: compile vBook loads in one lexical scope'
          git push origin HEAD:agent/generalize-browser-session-fetch
