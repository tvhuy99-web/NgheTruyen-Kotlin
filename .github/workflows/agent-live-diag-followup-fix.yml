# Temporary diagnostic workflow; will be removed before the functional commit.
name: Inspect exact STV chapter pipeline

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity

      - name: Print chapters action from exact compressed fixture
        run: |
          python3 - <<'PY'
          import gzip, re
          from pathlib import Path
          path = Path('source-lua/src/test/resources/xpk-defaults/nguon_sangtacviet_native.lua.gz')
          text = gzip.decompress(path.read_bytes()).decode('utf-8')
          lines = text.splitlines()
          patterns = [r'chapters\s*=', r'stv_page_window', r'op\s*=\s*["\x27](?:split|map|filter|unique)["\x27]']
          hits = set()
          for i, line in enumerate(lines):
              if any(re.search(p, line) for p in patterns):
                  hits.add(i)
          ranges = []
          for i in sorted(hits):
              start, end = max(0, i - 18), min(len(lines), i + 35)
              if ranges and start <= ranges[-1][1] + 1:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          print('fixture_bytes=', len(text.encode('utf-8')), 'lines=', len(lines), 'hit_count=', len(hits))
          for start, end in ranges:
              print(f'===== LINES {start+1}-{end} =====')
              for j in range(start, end):
                  print(f'{j+1:04d}: {lines[j]}')
          PY
