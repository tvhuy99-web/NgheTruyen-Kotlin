# Temporary self-removing workflow. It commits only after exact patching and focused regressions pass.
name: Apply live diagnostics follow-up fix

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact live diagnostics patch
        run: |
          python3 scripts/agent_live_diag_followup_fix.py
          sed -i 's/native\/\* bytes/native archive bytes/' source-lua/src/main/kotlin/vn/nghetruyen/source/lua/NativeLuaRuntimeOverlay.kt
          python3 scripts/agent_native_heap_overhead_patch.py

      - name: Diagnose live-size STV regression
        run: |
          set +e
          ./gradlew --no-daemon :source-lua:test --tests 'vn.nghetruyen.source.lua.SangTacVietTocBudgetRegressionTest'
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== STV JUNIT XML ====='
            find source-lua/build/test-results/test -type f -name '*SangTacVietTocBudgetRegressionTest*.xml' -print -exec cat {} \;
            exit "$status"
          fi

      - name: Run remaining focused regressions
        run: ./gradlew --no-daemon :source-lua:test :source-vbook:test :app:testDebugUnitTest :app:compileDebugKotlin

      - name: Commit verified patch
        run: |
          rm scripts/agent_live_diag_followup_fix.py
          rm scripts/agent_native_heap_overhead_patch.py
          rm .github/workflows/agent-live-diag-followup-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): refresh installed Native Lua diagnostics"
          git push origin HEAD:fix/diagnostics-screen-runtime-parity
