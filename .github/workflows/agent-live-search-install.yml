name: Agent live search and install UX

on:
  push:
    branches:
      - agent/lua-extension-ui-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lua-extension-ui-parity
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply UX patch
        run: python3 .github/agent/live_search_install_patch.py
      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Commit verified patch and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/agent/live_search_install_patch.py .github/workflows/agent-live-search-install.yml
          git add app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          git diff --cached --check
          git commit -m "Simplify extension search and install flow"
          git push origin HEAD:agent/lua-extension-ui-parity
