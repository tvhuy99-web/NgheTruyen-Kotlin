name: Agent live search and install UX

on:
  push:
    branches:
      - agent/lua-extension-ui-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lua-extension-ui-parity
          fetch-depth: 0
      - name: Apply already-compiled UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/agent/live_search_install_patch.py')
          text = path.read_text()
          text = text.replace(
              'pattern.subn(replacement, text, count=1)',
              'pattern.subn(lambda _: replacement, text, count=1)',
          )
          path.write_text(text)
          PY
          python3 .github/agent/live_search_install_patch.py
      - name: Commit compiled patch and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/agent/live_search_install_patch.py .github/workflows/agent-live-search-install.yml
          git add app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          git diff --cached --check
          git commit -m "Simplify extension search and install flow"
          git push origin HEAD:agent/lua-extension-ui-parity
