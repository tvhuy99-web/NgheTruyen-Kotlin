name: Agent mode isolation fix

on:
  push:
    branches:
      - agent/freesound-stage-1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message != 'Apply story audio mode isolation fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # 1) UI component: make the three modes render genuinely separate controls.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt')
          t = p.read_text()
          t = replace_once(
              t,
              'import vn.nghetruyen.app.audio.SceneMusicAnalysisWorker\n',
              'import vn.nghetruyen.app.audio.SceneMusicAnalysisWorker\nimport vn.nghetruyen.app.audio.StoryAudioSourceMode\n',
              'AudioDirectionLayerSwitches import',
          )
          t = replace_once(
              t,
              '    onManageMusic: (() -> Unit)? = null,\n    modifier: Modifier = Modifier,\n',
              '    onManageMusic: (() -> Unit)? = null,\n    onSourceModeChanged: (StoryAudioSourceMode) -> Unit = {},\n    modifier: Modifier = Modifier,\n',
              'AudioDirectionLayerSwitches signature',
          )
          t = replace_once(
              t,
              '    var managerKind by remember { mutableStateOf<AudioAssetKind?>(null) }\n',
              '    var managerKind by remember { mutableStateOf<AudioAssetKind?>(null) }\n    var sourceMode by remember { mutableStateOf(application.container.storyAudioSourceModeStore.get()) }\n',
              'AudioDirectionLayerSwitches mode state',
          )
          t = replace_once(
              t,
              '        StoryAudioSourceModeSelector()\n',
              '''        StoryAudioSourceModeSelector(\n            onModeChanged = { mode ->\n                sourceMode = mode\n                managerKind = null\n                onSourceModeChanged(mode)\n            },\n        )\n''',
              'AudioDirectionLayerSwitches selector',
          )
          start_marker = '        AudioLayerSwitchRow(\n            title = "Nhạc cảnh AI",'
          end_marker = '    }\n\n    if (showNormalizationDialog) {'
          start = t.find(start_marker)
          end = t.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('AudioDirectionLayerSwitches mode body markers not found')
          mode_body = '''        fun openNormalization() {\n            normalizationMusicDraft = musicNormalizationTarget\n            normalizationAmbienceDraft = snapshot.ambienceNormalizationTargetLufs\n            normalizationSfxDraft = snapshot.soundEffectsNormalizationTargetLufs\n            normalizationPersistenceError = null\n            normalizationSaving = false\n            showNormalizationDialog = true\n        }\n\n        fun showLibraryManagers(): Boolean = sourceMode != StoryAudioSourceMode.AI_FREESOUND\n\n        when (sourceMode) {\n            StoryAudioSourceMode.LOCAL_MANUAL -> {\n                Text("THƯ VIỆN TRONG MÁY — THỦ CÔNG")\n                Text("AI không tự chọn MUSIC, AMBIENCE hoặc SFX ở chế độ này.")\n            }\n            StoryAudioSourceMode.AI_LOCAL -> {\n                AudioLayerSwitchRow(\n                    title = "Nhạc cảnh AI từ thư viện trong máy",\n                    checked = musicEnabled,\n                    onCheckedChange = { enabled ->\n                        musicEnabled = enabled\n                        scope.launch { settingsRepository.setAutoSceneMusicEnabled(enabled) }\n                    },\n                )\n                AudioLayerSwitchRow(\n                    title = "Âm thanh môi trường AI từ thư viện trong máy",\n                    checked = snapshot.ambienceEnabled,\n                    onCheckedChange = preferences::setAmbienceEnabled,\n                )\n                AudioLayerSwitchRow(\n                    title = "Hiệu ứng âm thanh AI từ thư viện trong máy",\n                    checked = snapshot.soundEffectsEnabled,\n                    onCheckedChange = preferences::setSoundEffectsEnabled,\n                )\n            }\n            StoryAudioSourceMode.AI_FREESOUND -> {\n                AudioLayerSwitchRow(\n                    title = "Tự tìm nhạc nền trên Freesound",\n                    checked = musicEnabled,\n                    onCheckedChange = { enabled ->\n                        musicEnabled = enabled\n                        scope.launch { settingsRepository.setAutoSceneMusicEnabled(enabled) }\n                    },\n                )\n                AudioLayerSwitchRow(\n                    title = "Tự tìm âm thanh môi trường trên Freesound",\n                    checked = snapshot.ambienceEnabled,\n                    onCheckedChange = preferences::setAmbienceEnabled,\n                )\n                AudioLayerSwitchRow(\n                    title = "Tự tìm hiệu ứng âm thanh trên Freesound",\n                    checked = snapshot.soundEffectsEnabled,\n                    onCheckedChange = preferences::setSoundEffectsEnabled,\n                )\n                Text("Mode 3 chỉ dùng asset Freesound đã resolve cho kế hoạch AI. Nếu không tìm được thì lớp tương ứng giữ im lặng; không lấy asset thường của Mode 2 để thay thế.")\n            }\n        }\n\n        HorizontalDivider(Modifier.padding(vertical = 6.dp))\n        AudioIntSlider(\n            title = "Attack",\n            value = attackMillis,\n            maximum = 2_000,\n            onValueChange = { value ->\n                attackMillis = value\n                dynamicsSettingsDirty = true\n            },\n        )\n        AudioIntSlider(\n            title = "Release",\n            value = releaseMillis,\n            maximum = 5_000,\n            onValueChange = { value ->\n                releaseMillis = value\n                dynamicsSettingsDirty = true\n            },\n        )\n        AudioManagerButton(\n            label = "CHUẨN HÓA TOÀN BỘ ÂM THANH",\n            enabled = tracks.isNotEmpty(),\n            onClick = ::openNormalization,\n        )\n\n        if (showLibraryManagers()) {\n            HorizontalDivider(Modifier.padding(vertical = 6.dp))\n            AudioManagerButton(\n                label = "QUẢN LÝ NHẠC ($musicTrackCount)",\n                onClick = { managerKind = AudioAssetKind.MUSIC },\n            )\n            AudioManagerButton(\n                label = "QUẢN LÝ ÂM THANH MÔI TRƯỜNG (${tracks.count { AudioAssetClassifier.classify(it) == AudioAssetKind.AMBIENCE }})",\n                onClick = { managerKind = AudioAssetKind.AMBIENCE },\n            )\n            AudioManagerButton(\n                label = "QUẢN LÝ HIỆU ỨNG ÂM THANH (${tracks.count { AudioAssetClassifier.classify(it) == AudioAssetKind.SFX }})",\n                onClick = { managerKind = AudioAssetKind.SFX },\n            )\n        }\n'''
          t = t[:start] + mode_body + t[end:]
          p.write_text(t)

          # 2) Selector: AI modes own their music enable gate, so hidden manual toggle cannot disable them.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/components/StoryAudioSourceModeSelector.kt')
          t = p.read_text()
          t = replace_once(
              t,
              '                store.set(mode)\n',
              '''                store.set(mode)\n                if (mode != StoryAudioSourceMode.LOCAL_MANUAL) {\n                    application.container.settingsRepository.setBackgroundMusicEnabled(true)\n                }\n''',
              'StoryAudioSourceModeSelector AI music enable',
          )
          p.write_text(t)

          # 3) Reader dialog: sequential/random belongs only to manual Mode 1.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          t = p.read_text()
          t = replace_once(
              t,
              'import vn.nghetruyen.app.audio.AudioAssetKind\n',
              'import vn.nghetruyen.app.audio.AudioAssetKind\nimport vn.nghetruyen.app.audio.StoryAudioSourceMode\n',
              'ReaderScreen mode import',
          )
          t = replace_once(
              t,
              '    var musicReleaseMs by remember { mutableIntStateOf(2050) }\n',
              '    var musicReleaseMs by remember { mutableIntStateOf(2050) }\n    var storyAudioSourceMode by remember { mutableStateOf(app.container.storyAudioSourceModeStore.get()) }\n',
              'ReaderScreen mode state',
          )
          t = replace_once(
              t,
              '            musicReleaseMs = settings.backgroundMusicReleaseMillis\n',
              '            musicReleaseMs = settings.backgroundMusicReleaseMillis\n            storyAudioSourceMode = app.container.storyAudioSourceModeStore.get()\n',
              'ReaderScreen refresh mode',
          )
          dialog_start = '''                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                    Text("Bật nhạc nền", Modifier.weight(1f))\n                    Switch(musicEnabled, { musicEnabled = it })\n                }\n                HorizontalDivider(Modifier.padding(vertical = 8.dp))\n                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(\n'''
          start = t.find(dialog_start)
          end_marker = '                ReaderFloatSlider("Giảm nhạc khi giọng đọc phát", musicDuckDb, 0f, 24f, steps = 23, shown = { "%.0f dB".format(it) }) { musicDuckDb = it }\n'
          end = t.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('ReaderScreen music dialog markers not found')
          end += len(end_marker)
          replacement = '''                if (storyAudioSourceMode == StoryAudioSourceMode.LOCAL_MANUAL) {\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                        Text("Bật nhạc nền thủ công", Modifier.weight(1f))\n                        Switch(musicEnabled, { musicEnabled = it })\n                    }\n                    HorizontalDivider(Modifier.padding(vertical = 8.dp))\n                }\n                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(\n                    musicTrackCount = musicTracks.size,\n                    onManageMusic = {\n                        val rows = musicTracks.sortedWith(compareBy<SceneMusicTrackEntity> { it.orderIndex }.thenBy { it.title.lowercase() })\n                        musicLibraryDraft = rows.mapIndexed { index, row -> row.copy(orderIndex = index) }\n                        musicLibraryBaselineIds = rows.mapTo(linkedSetOf()) { it.id }\n                        musicSearch = ""\n                        showMusicLibrary = true\n                    },\n                    onSourceModeChanged = { mode ->\n                        storyAudioSourceMode = mode\n                        if (mode != StoryAudioSourceMode.LOCAL_MANUAL) musicEnabled = true\n                    },\n                    modifier = Modifier.fillMaxWidth(),\n                )\n                if (storyAudioSourceMode == StoryAudioSourceMode.LOCAL_MANUAL) {\n                    HorizontalDivider(Modifier.padding(vertical = 8.dp))\n                    Text("Chế độ phát", fontWeight = FontWeight.SemiBold)\n                    Button(onClick = { musicModeExpanded = true }, modifier = Modifier.fillMaxWidth()) {\n                        Text(if (musicMode == SceneMusicPlaybackMode.SHUFFLE) "Phát ngẫu nhiên" else "Phát lần lượt")\n                    }\n                    DropdownMenu(expanded = musicModeExpanded, onDismissRequest = { musicModeExpanded = false }) {\n                        DropdownMenuItem(text = { Text("Phát lần lượt") }, onClick = { musicMode = SceneMusicPlaybackMode.SEQUENTIAL; musicModeExpanded = false })\n                        DropdownMenuItem(text = { Text("Phát ngẫu nhiên") }, onClick = { musicMode = SceneMusicPlaybackMode.SHUFFLE; musicModeExpanded = false })\n                    }\n                }\n                ReaderFloatSlider("Giảm nhạc khi giọng đọc phát", musicDuckDb, 0f, 24f, steps = 23, shown = { "%.0f dB".format(it) }) { musicDuckDb = it }\n'''
          t = t[:start] + replacement + t[end:]
          t = replace_once(
              t,
              '                if (musicEnabled && activeCount == 0) onMessage("Hãy bật ít nhất một bài trong danh sách nhạc trước.")\n',
              '                if (storyAudioSourceMode == StoryAudioSourceMode.LOCAL_MANUAL && musicEnabled && activeCount == 0) onMessage("Hãy bật ít nhất một bài trong danh sách nhạc trước.")\n',
              'ReaderScreen manual validation',
          )
          t = replace_once(
              t,
              '''                    settings.setBackgroundMusicEnabled(musicEnabled)\n                    settings.setSceneMusicPlaybackMode(musicMode)\n''',
              '''                    settings.setBackgroundMusicEnabled(\n                        if (storyAudioSourceMode == StoryAudioSourceMode.LOCAL_MANUAL) musicEnabled else true,\n                    )\n                    if (storyAudioSourceMode == StoryAudioSourceMode.LOCAL_MANUAL) {\n                        settings.setSceneMusicPlaybackMode(musicMode)\n                    }\n''',
              'ReaderScreen mode save',
          )
          p.write_text(t)

          # 4) Pure playback policy used by runtime and unit tests.
          policy = Path('app/src/main/java/vn/nghetruyen/app/audio/StoryAudioModePlaybackPolicy.kt')
          policy.write_text('''package vn.nghetruyen.app.audio\n\n/** Playback gates that keep manual playlist behavior out of AI source modes. */\nobject StoryAudioModePlaybackPolicy {\n    fun usesManualPlaylist(mode: StoryAudioSourceMode): Boolean =\n        mode == StoryAudioSourceMode.LOCAL_MANUAL\n\n    fun shouldUseAiMusicPlan(\n        mode: StoryAudioSourceMode,\n        backgroundMusicEnabled: Boolean,\n        autoSceneMusicEnabled: Boolean,\n    ): Boolean =\n        mode != StoryAudioSourceMode.LOCAL_MANUAL && backgroundMusicEnabled && autoSceneMusicEnabled\n}\n''')

          # 5) Reader runtime: AI modes never fall back to manual local playlists or legacy URI music.
          p = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          t = p.read_text()
          t = replace_once(
              t,
              'import vn.nghetruyen.app.audio.PcmLoudnessEstimator\n',
              'import vn.nghetruyen.app.audio.PcmLoudnessEstimator\nimport vn.nghetruyen.app.audio.StoryAudioModePlaybackPolicy\nimport vn.nghetruyen.app.audio.StoryAudioSourceMode\n',
              'ReaderPlaybackService mode imports',
          )
          t = replace_once(
              t,
              '    private var sceneMusicPlaybackMode = SceneMusicPlaybackMode.SEQUENTIAL\n',
              '    private var sceneMusicPlaybackMode = SceneMusicPlaybackMode.SEQUENTIAL\n    private var storyAudioSourceMode = StoryAudioSourceMode.AI_LOCAL\n',
              'ReaderPlaybackService mode state',
          )
          t = replace_once(
              t,
              '''        val settings = container.settingsRepository.snapshot()\n        applyRuntimeSettings(settings)\n        val storyId = PlaybackQueueStore.state.value.storyId\n''',
              '''        val settings = container.settingsRepository.snapshot()\n        applyRuntimeSettings(settings)\n        val previousAudioSourceMode = storyAudioSourceMode\n        storyAudioSourceMode = container.narrationPlanCoordinator.storyAudioSourceMode()\n        if (previousAudioSourceMode != storyAudioSourceMode) {\n            narrationPlanJob?.cancel()\n            narrationPlanningChapterId = ""\n            narrationPreparedChapterId = ""\n            backgroundMusicShuffleBag.clear()\n        }\n        val storyId = PlaybackQueueStore.state.value.storyId\n''',
              'ReaderPlaybackService refresh source mode',
          )
          t = replace_once(
              t,
              '''        val previousTrackIds = backgroundMusicTracks.map(SceneMusicTrackEntity::id)\n        backgroundMusicTracks = orderedMusicTracks\n        if (previousTrackIds != orderedMusicTracks.map(SceneMusicTrackEntity::id)) backgroundMusicShuffleBag.clear()\n        val musicPlanUsable = backgroundMusicEnabled && autoSceneMusicEnabled && musicPlan?.sourceSha256 == musicSourceHash\n''',
              '''        val previousTrackIds = backgroundMusicTracks.map(SceneMusicTrackEntity::id)\n        backgroundMusicTracks = if (StoryAudioModePlaybackPolicy.usesManualPlaylist(storyAudioSourceMode)) {\n            orderedMusicTracks\n        } else {\n            emptyList()\n        }\n        if (previousTrackIds != backgroundMusicTracks.map(SceneMusicTrackEntity::id)) backgroundMusicShuffleBag.clear()\n        val musicPlanUsable = StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(\n            storyAudioSourceMode,\n            backgroundMusicEnabled,\n            autoSceneMusicEnabled,\n        ) && musicPlan?.sourceSha256 == musicSourceHash\n''',
              'ReaderPlaybackService plan-vs-playlist gate',
          )
          t = replace_once(
              t,
              '''                    configureBackgroundMusic(\n                        settings.backgroundMusicUri,\n                        settings.backgroundMusicEnabled,\n                        settings.backgroundMusicVolume,\n                        settings.backgroundMusicDuckFactor,\n                    )\n''',
              '''                    if (StoryAudioModePlaybackPolicy.usesManualPlaylist(storyAudioSourceMode)) {\n                        configureBackgroundMusic(\n                            settings.backgroundMusicUri,\n                            settings.backgroundMusicEnabled,\n                            settings.backgroundMusicVolume,\n                            settings.backgroundMusicDuckFactor,\n                        )\n                    } else {\n                        configureBackgroundMusic(null, false, 0f, settings.backgroundMusicDuckFactor)\n                    }\n''',
              'ReaderPlaybackService legacy URI gate',
          )
          t = replace_once(
              t,
              '    private fun shouldPlanAutoSceneMusic(): Boolean = backgroundMusicEnabled && autoSceneMusicEnabled\n',
              '''    private fun shouldPlanAutoSceneMusic(): Boolean = StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(\n        storyAudioSourceMode,\n        backgroundMusicEnabled,\n        autoSceneMusicEnabled,\n    )\n''',
              'ReaderPlaybackService auto music gate',
          )
          start = t.find('    private fun prepareCurrentNarrationBeforePlayback(snapshot: PlaybackSnapshot): Boolean {')
          end = t.find('    private fun maybePrefetchNarrationPlans(', start)
          if start < 0 or end < 0:
              raise SystemExit('ReaderPlaybackService narration preparation markers not found')
          new_prepare = '''    private fun prepareCurrentNarrationBeforePlayback(snapshot: PlaybackSnapshot): Boolean {\n        val planVoice = currentStoryAutoVoiceCastEnabled\n        val planMusic = shouldPlanAutoSceneMusic()\n        if ((!planVoice && !planMusic) || snapshot.chapterId.isBlank()) return false\n        if (narrationPreparedChapterId == snapshot.chapterId) return false\n        pendingPlay = true\n        PlaybackQueueStore.setPlaying(false)\n        if (narrationPlanningChapterId == snapshot.chapterId && narrationPlanJob?.isActive == true) return true\n\n        narrationPlanningChapterId = snapshot.chapterId\n        narrationPlanJob?.cancel()\n        narrationPlanJob = serviceScope.launch {\n            var attempt = 0\n            while (PlaybackQueueStore.state.value.chapterId == snapshot.chapterId) {\n                if (planVoice && !currentStoryAutoVoiceCastEnabled) break\n                if (!planVoice && !shouldPlanAutoSceneMusic()) break\n                attempt += 1\n                val taskLabel = when {\n                    planVoice && planMusic -> "phân vai và lập nhạc cảnh"\n                    planVoice -> "phân vai"\n                    else -> "lập nhạc cảnh AI"\n                }\n                PlaybackQueueStore.setNarrationAutomation(\n                    stage = NarrationAutomationStage.CURRENT_PLANNING,\n                    progress = 0.35f,\n                    message = if (attempt == 1) {\n                        "Đang $taskLabel cho chương hiện tại."\n                    } else {\n                        "Đang thử $taskLabel lại lần $attempt."\n                    },\n                )\n                transitionMessage = "Đang chuẩn bị kế hoạch kể chuyện…"\n                withContext(Dispatchers.Main) {\n                    updateMediaState()\n                    updateNotification()\n                }\n\n                val content = container.libraryRepository.loadCachedChapter(snapshot.chapterId)\n                val planningAttempt = if (content == null) {\n                    Result.failure(IllegalStateException("Không tải được chương để chuẩn bị kế hoạch."))\n                } else {\n                    runCatching {\n                        container.narrationPlanCoordinator.ensurePlans(\n                            content = content,\n                            voice = planVoice,\n                            music = planMusic,\n                            activeTrackId = sceneMusicController.activeTrackId,\n                        )\n                    }\n                }\n                val planResult = planningAttempt.getOrNull()\n                val warnings = planResult?.warnings ?: listOf(\n                    planningAttempt.exceptionOrNull()?.message ?: "Không chuẩn bị được kế hoạch kể chuyện.",\n                )\n                val assignmentCount = if (!planVoice || content == null) 0\n                else container.narrationPlanCoordinator.voicePlanAssignmentCount(content)\n                val voiceReady = !planVoice || assignmentCount > 0\n\n                if (planResult != null && voiceReady) {\n                    PlaybackQueueStore.setNarrationAutomation(\n                        stage = NarrationAutomationStage.CURRENT_APPLYING,\n                        progress = 0.85f,\n                        message = when {\n                            planVoice && planMusic -> "Đã phân vai $assignmentCount mục. Đang áp dụng giọng và nhạc cảnh."\n                            planVoice -> "Đã phân vai $assignmentCount mục. Đang áp dụng giọng."\n                            else -> "Đã lập kế hoạch nhạc cảnh. Đang áp dụng âm thanh."\n                        },\n                    )\n                    val configured = applyConfiguredVoice(useStoryProfile = true)\n                    withContext(Dispatchers.Main) {\n                        if (PlaybackQueueStore.state.value.chapterId != snapshot.chapterId) return@withContext\n                        narrationPreparedChapterId = snapshot.chapterId\n                        narrationPlanningChapterId = ""\n                        voiceSettingsReady = configured\n                        val musicApplied = hasSceneMusicPlan()\n                        PlaybackQueueStore.setNarrationAutomation(\n                            stage = NarrationAutomationStage.CURRENT_READY,\n                            progress = 1f,\n                            message = when {\n                                planVoice -> "Đã phân vai xong $assignmentCount mục${if (musicApplied) " và đã áp dụng nhạc cảnh" else ""}. Đang bắt đầu phát."\n                                musicApplied -> "Đã áp dụng nhạc cảnh AI. Đang bắt đầu phát."\n                                else -> "Không có nhạc cảnh phù hợp; chương sẽ tiếp tục với lớp nhạc im lặng."\n                            },\n                        )\n                        transitionMessage = null\n                        if (configured && pendingPlay) {\n                            pendingPlay = false\n                            play()\n                        } else {\n                            updateMediaState()\n                            updateNotification()\n                        }\n                    }\n                    return@launch\n                }\n\n                if (!planVoice) {\n                    val configured = applyConfiguredVoice(useStoryProfile = true)\n                    withContext(Dispatchers.Main) {\n                        if (PlaybackQueueStore.state.value.chapterId != snapshot.chapterId) return@withContext\n                        narrationPreparedChapterId = snapshot.chapterId\n                        narrationPlanningChapterId = ""\n                        voiceSettingsReady = configured\n                        PlaybackQueueStore.setNarrationAutomation(\n                            stage = NarrationAutomationStage.CURRENT_READY,\n                            progress = 1f,\n                            message = "Không tạo được nhạc cảnh AI; tiếp tục phát với lớp nhạc im lặng.",\n                        )\n                        transitionMessage = warnings.firstOrNull()?.take(180)\n                        if (configured && pendingPlay) {\n                            pendingPlay = false\n                            play()\n                        } else {\n                            updateMediaState()\n                            updateNotification()\n                        }\n                    }\n                    return@launch\n                }\n\n                val castDisabled = warnings.any { warning ->\n                    warning.contains("phân vai TTS đang tắt", ignoreCase = true)\n                }\n                if (castDisabled) {\n                    withContext(Dispatchers.Main) {\n                        narrationPlanningChapterId = ""\n                        pendingPlay = false\n                        PlaybackQueueStore.setPlaying(false)\n                        PlaybackQueueStore.setNarrationAutomation(\n                            stage = NarrationAutomationStage.FAILED,\n                            progress = 1f,\n                            message = "Phân vai TTS đang tắt cho truyện này. Chưa tự động phát.",\n                        )\n                        transitionMessage = warnings.firstOrNull()?.take(180)\n                        updateMediaState()\n                        updateNotification()\n                    }\n                    return@launch\n                }\n\n                val warningSuffix = warnings.firstOrNull()?.takeIf(String::isNotBlank)\n                    ?.let { " ${it.take(120)}" }\n                    .orEmpty()\n                withContext(Dispatchers.Main) {\n                    if (PlaybackQueueStore.state.value.chapterId != snapshot.chapterId) return@withContext\n                    PlaybackQueueStore.setPlaying(false)\n                    PlaybackQueueStore.setNarrationAutomation(\n                        stage = NarrationAutomationStage.FAILED,\n                        progress = 1f,\n                        message = "Phân vai chưa thành công. Sẽ tự thử lại sau 5 giây.$warningSuffix",\n                    )\n                    transitionMessage = "Phân vai chưa thành công; đang chờ thử lại."\n                    updateMediaState()\n                    updateNotification()\n                }\n                delay(NARRATION_RETRY_DELAY_MS)\n            }\n            narrationPlanningChapterId = ""\n        }\n        return true\n    }\n\n'''
          t = t[:start] + new_prepare + t[end:]
          p.write_text(t)

          # 6) Ambience/SFX runtime: Mode 3 must call Freesound even when no local asset exists yet,
          # then rebuild its asset snapshot after imports complete.
          p = Path('app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt')
          t = p.read_text()
          t = replace_once(
              t,
              'import vn.nghetruyen.app.audio.SoundEffectCue\n',
              'import vn.nghetruyen.app.audio.SoundEffectCue\nimport vn.nghetruyen.app.audio.StoryAudioModeRouter\n',
              'AudioDirectionRuntime mode import',
          )
          t = replace_once(
              t,
              '        val now = System.currentTimeMillis()\n        val fastKey = buildFastKey(snapshot, settings)\n',
              '        val now = System.currentTimeMillis()\n        val sourceMode = narrationPlanCoordinator.storyAudioSourceMode()\n        val fastKey = buildFastKey(snapshot, settings)\n',
              'AudioDirectionRuntime source mode',
          )
          t = replace_once(
              t,
              '        if (activeAudioAssets.isEmpty()) {\n',
              '        if (activeAudioAssets.isEmpty() && !StoryAudioModeRouter.usesAiFreesound(sourceMode)) {\n',
              'AudioDirectionRuntime empty asset short circuit',
          )
          t = replace_once(
              t,
              '''            if (outcome == null) {\n                markFailure(signature)\n                return false\n            }\n            plan = narrationPlanCoordinator.loadAudioDirectionPlan(content)\n''',
              '''            if (outcome == null) {\n                markFailure(signature)\n                return false\n            }\n            if (StoryAudioModeRouter.usesAiFreesound(sourceMode) && outcome.freesoundResolvedAssets > 0) {\n                clearPreparedPlan()\n                return ensurePlan(snapshot, settings, force = false)\n            }\n            plan = narrationPlanCoordinator.loadAudioDirectionPlan(content)\n''',
              'AudioDirectionRuntime rebuild after Freesound import',
          )
          p.write_text(t)

          # 7) Mode 3 is Freesound-only for auto resolution; no Mode-2 local semantic fallback.
          p = Path('app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt')
          t = p.read_text()
          t = t.replace('private enum class FreesoundAutoResolutionSource { CACHE, FREESOUND, LOCAL_FALLBACK, UNRESOLVED }',
                        'private enum class FreesoundAutoResolutionSource { CACHE, FREESOUND, UNRESOLVED }')
          t = t.replace(' * network search/import -> semantic local fallback -> silence. This keeps Freesound as the primary\n * source without downloading the same need again in later chapters.\n',
                        ' * network search/import -> silence. Mode 3 never substitutes a normal Mode-2 local-library asset.\n * Previously resolved Freesound assets may still be reused from the query cache.\n')
          fallback_start = t.find('            val fallbackTracks = runCatching { existingTracksProvider() }')
          fallback_end_marker = '            }\n        }\n        return FreesoundAutoResolveResult(resolutions, warnings.distinct(), imported)\n'
          fallback_end = t.find(fallback_end_marker, fallback_start)
          if fallback_start < 0 or fallback_end < 0:
              raise SystemExit('FreesoundAutoAudioResolver fallback markers not found')
          unresolved = '''            resolutions += FreesoundAutoResolvedNeed(need, null, FreesoundAutoResolutionSource.UNRESOLVED.name)\n            val prefix = if (need.importance == FreesoundRequirementImportance.REQUIRED) "Âm thanh quan trọng" else "Âm thanh tùy chọn"\n            warnings += "$prefix ‘${need.query}’ chưa tìm được trên Freesound; khoảng đó sẽ im lặng ở lớp tương ứng."\n'''
          t = t[:fallback_start] + unresolved + t[fallback_end:]
          t = t.replace('        private const val LOCAL_FALLBACK_MIN_SCORE = 0.62\n', '')
          p.write_text(t)

          # 8) Unit policy test.
          test = Path('app/src/test/java/vn/nghetruyen/app/audio/StoryAudioModePlaybackPolicyTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package vn.nghetruyen.app.audio\n\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass StoryAudioModePlaybackPolicyTest {\n    @Test\n    fun manualPlaylistIsExclusiveToModeOne() {\n        assertTrue(StoryAudioModePlaybackPolicy.usesManualPlaylist(StoryAudioSourceMode.LOCAL_MANUAL))\n        assertFalse(StoryAudioModePlaybackPolicy.usesManualPlaylist(StoryAudioSourceMode.AI_LOCAL))\n        assertFalse(StoryAudioModePlaybackPolicy.usesManualPlaylist(StoryAudioSourceMode.AI_FREESOUND))\n    }\n\n    @Test\n    fun aiMusicPlanIsNeverEnabledForManualMode() {\n        assertFalse(StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(StoryAudioSourceMode.LOCAL_MANUAL, true, true))\n        assertTrue(StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(StoryAudioSourceMode.AI_LOCAL, true, true))\n        assertTrue(StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(StoryAudioSourceMode.AI_FREESOUND, true, true))\n        assertFalse(StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(StoryAudioSourceMode.AI_FREESOUND, false, true))\n        assertFalse(StoryAudioModePlaybackPolicy.shouldUseAiMusicPlan(StoryAudioSourceMode.AI_FREESOUND, true, false))\n    }\n}\n''')
          PY

      - name: Verify targeted source invariants
        shell: bash
        run: |
          grep -q 'onSourceModeChanged' app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt
          grep -q 'StoryAudioModePlaybackPolicy.usesManualPlaylist' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          grep -q 'usesAiFreesound(sourceMode)' app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt
          ! grep -q 'LOCAL_FALLBACK' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt

      - name: Run unit tests and compile debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Commit verified fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt \
            app/src/main/java/vn/nghetruyen/app/ui/components/StoryAudioSourceModeSelector.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/audio/StoryAudioModePlaybackPolicy.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/test/java/vn/nghetruyen/app/audio/StoryAudioModePlaybackPolicyTest.kt
          git commit -m 'Apply story audio mode isolation fixes'
          git push origin HEAD:agent/freesound-stage-1
