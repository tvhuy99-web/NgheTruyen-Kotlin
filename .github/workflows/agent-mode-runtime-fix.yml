name: One-shot story audio runtime isolation

on:
  push:
    branches: [agent/freesound-stage-1]

permissions:
  contents: write

concurrency:
  group: agent-mode-runtime-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/freesound-stage-1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply consolidated mode isolation patch
        run: python3 .github/scripts/agent_mode_runtime_fix.py

      - name: Normalize duplicate imports after overlapping one-shot fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          lines = path.read_text().splitlines()
          seen = set()
          out = []
          for line in lines:
              if line.startswith('import '):
                  if line in seen:
                      continue
                  seen.add(line)
              out.append(line)
          path.write_text('\n'.join(out) + '\n')
          PY

      - name: Verify strict source invariants
        shell: bash
        run: |
          grep -q 'if (manualMode)' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
          grep -q 'onSourceModeChanged = { mode ->' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
          ! grep -q 'KHO NHẠC ĐÃ TẢI / FALLBACK' app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt
          grep -q 'StoryAudioModeRouter.allowsManualPlaylist(storyAudioSourceMode)' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          grep -q 'requestedTrackId == XpkSceneMusicParity.SILENCE_TRACK_ID' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          grep -q 'val planAudio = shouldPlanAutoStoryAudio()' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          grep -q 'mode=${sourceMode.name}' app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt
          grep -q 'usesAiFreesound(sourceMode)' app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt
          ! grep -q 'LOCAL_FALLBACK' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -q 'AI_AUDIO_SOURCE_MODE_MIXED' app/src/main/java/vn/nghetruyen/app/ai/XpkNarrationAiServices.kt
          grep -q 'validatedAmbience' app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt
          grep -q 'validatedSfx' app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Commit only verified source fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/main/java/vn/nghetruyen/app/ai/XpkNarrationAiServices.kt \
            app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix strict story audio runtime isolation'
          git push origin HEAD:agent/freesound-stage-1
