name: Apply native hook bridge fix

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact bridge patch
        run: python3 scripts/agent_fix_native_hook_bridge.py

      - name: Run vBook regression tests
        run: ./gradlew --no-daemon --stacktrace :source-vbook:test

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(vbook): preserve native hook bridge payload'
          git push origin HEAD:fix/diagnostics-screen-runtime-parity
