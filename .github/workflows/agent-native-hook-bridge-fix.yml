name: Apply native hook bridge fix

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch native hook bridge and add regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt')
          runtime = runtime_path.read_text(encoding='utf-8')

          old = '''                ScriptableObject.putProperty(scope, "__ngheNativeInput", inputObject)
                val inputJson = Context.toString(cx.evaluateString(
                    scope,
                    "JSON.stringify({value:__ngheNativeInput.value,args:__ngheNativeInput.args||{},context:__ngheNativeInput.context||{}})",
                    "native-hook-input",
                    1,
                    null,
                ))
                diagnostics.emit(event(manifest, request, "VBOOK_BRIDGE_NATIVE_HOOK_STARTED", DiagnosticSeverity.DEBUG, attributes = mapOf(
                    "hook" to hookName.take(160),
                    "inputBytes" to inputJson.toByteArray(Charsets.UTF_8).size.toString(),
                    "sourceBytes" to sourceCode.size.toString(),
                    "remainingMs" to (budget.deadlineMs - clockMs()).coerceAtLeast(0L).toString(),
                )))
                captureEvidence(manifest, request, "bridge-$hookName-input.json", "application/json", inputJson, mapOf("hook" to hookName))
'''

          new = '''                val bridgeInput = VBookNativeHookBridgeInputCodec.resolve(inputObject.propertyString("input")) {
                    ScriptableObject.putProperty(scope, "__ngheNativeInput", inputObject)
                    try {
                        Context.toString(cx.evaluateString(
                            scope,
                            "JSON.stringify({value:__ngheNativeInput.value,args:__ngheNativeInput.args||{},context:__ngheNativeInput.context||{}})",
                            "native-hook-input-legacy",
                            1,
                            null,
                        ))
                    } finally {
                        ScriptableObject.deleteProperty(scope, "__ngheNativeInput")
                    }
                }
                val inputJson = bridgeInput.json
                diagnostics.emit(event(manifest, request, "VBOOK_BRIDGE_NATIVE_HOOK_STARTED", DiagnosticSeverity.DEBUG, attributes = mapOf(
                    "hook" to hookName.take(160),
                    "bridgeInputMode" to bridgeInput.mode,
                    "inputBytes" to inputJson.toByteArray(Charsets.UTF_8).size.toString(),
                    "sourceBytes" to sourceCode.size.toString(),
                    "remainingMs" to (budget.deadlineMs - clockMs()).coerceAtLeast(0L).toString(),
                )))
                captureEvidence(
                    manifest,
                    request,
                    "bridge-$hookName-input.json",
                    "application/json",
                    inputJson,
                    mapOf("hook" to hookName, "bridgeInputMode" to bridgeInput.mode),
                )
'''

          count = runtime.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one native_hook bridge block, found {count}')
          runtime_path.write_text(runtime.replace(old, new), encoding='utf-8')

          codec_path = Path('source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookNativeHookBridgeInputCodec.kt')
          codec_path.write_text(r'''package vn.nghetruyen.source.vbook

import vn.nghetruyen.source.api.JsonCodec
import vn.nghetruyen.source.api.JsonValue

internal data class VBookNativeHookBridgeInput(
    val json: String,
    val mode: String,
)

/**
 * Decodes the Native Source API 2 bridge contract without losing the payload value.
 *
 * Current adapters send `{name, input: JSON.stringify({value,args,context})}`. Older callers may
 * still send `{name,value,args,context}` directly, so that shape remains a compatibility fallback.
 */
internal object VBookNativeHookBridgeInputCodec {
    fun resolve(
        packedInput: String?,
        legacyDirectInput: () -> String,
    ): VBookNativeHookBridgeInput {
        val (raw, mode) = if (!packedInput.isNullOrBlank()) {
            packedInput to MODE_PACKED
        } else {
            legacyDirectInput() to MODE_LEGACY_DIRECT
        }
        val bytes = raw.toByteArray(Charsets.UTF_8).size
        require(bytes <= MAX_INPUT_BYTES) { "NATIVE_LUA_HOOK_INPUT_TOO_LARGE:$bytes" }
        val parsed = runCatching {
            JsonCodec.parse(raw, maxDepth = 96, maxNodes = 100_000)
        }.getOrElse { error ->
            throw IllegalArgumentException("NATIVE_LUA_HOOK_INPUT_INVALID:${error.message}", error)
        }
        require(parsed is JsonValue.Obj) { "NATIVE_LUA_HOOK_INPUT_OBJECT_REQUIRED" }
        return VBookNativeHookBridgeInput(
            json = JsonCodec.stringify(parsed),
            mode = mode,
        )
    }

    const val MODE_PACKED = "packed-input"
    const val MODE_LEGACY_DIRECT = "legacy-direct"
    private const val MAX_INPUT_BYTES = 512 * 1024
}
''', encoding='utf-8')

          test_path = Path('source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookNativeHookBridgeInputCodecTest.kt')
          test_path.write_text(r'''package vn.nghetruyen.source.vbook

import org.junit.Assert.assertEquals
import org.junit.Assert.assertFalse
import org.junit.Assert.assertThrows
import org.junit.Assert.assertTrue
import org.junit.Test
import vn.nghetruyen.source.api.JsonCodec
import vn.nghetruyen.source.api.JsonValue

class VBookNativeHookBridgeInputCodecTest {
    @Test
    fun packedAdapterContractPreservesValueArgsAndContext() {
        val storyUrl = "https://sangtacviet.com/truyen/qidian/1/1049557954/"
        val packed = JsonCodec.stringify(JsonValue.Obj(linkedMapOf(
            "value" to JsonValue.Str(storyUrl),
            "args" to JsonValue.Obj(linkedMapOf("kind" to JsonValue.Str("toc"))),
            "context" to JsonValue.Obj(linkedMapOf(
                "input" to JsonValue.Str(storyUrl),
                "current_url" to JsonValue.Str(storyUrl),
            )),
        )))
        var fallbackCalled = false

        val decoded = VBookNativeHookBridgeInputCodec.resolve(packed) {
            fallbackCalled = true
            "{}"
        }
        val root = JsonCodec.parse(decoded.json) as JsonValue.Obj

        assertEquals(VBookNativeHookBridgeInputCodec.MODE_PACKED, decoded.mode)
        assertFalse(fallbackCalled)
        assertEquals(storyUrl, (root["value"] as JsonValue.Str).value)
        assertEquals("toc", ((root["args"] as JsonValue.Obj)["kind"] as JsonValue.Str).value)
        assertEquals(storyUrl, ((root["context"] as JsonValue.Obj)["input"] as JsonValue.Str).value)
    }

    @Test
    fun legacyDirectShapeRemainsSupported() {
        val legacy = "{\"value\":\"legacy\",\"args\":{},\"context\":{}}"
        var fallbackCalled = false

        val decoded = VBookNativeHookBridgeInputCodec.resolve(null) {
            fallbackCalled = true
            legacy
        }
        val root = JsonCodec.parse(decoded.json) as JsonValue.Obj

        assertEquals(VBookNativeHookBridgeInputCodec.MODE_LEGACY_DIRECT, decoded.mode)
        assertTrue(fallbackCalled)
        assertEquals("legacy", (root["value"] as JsonValue.Str).value)
    }

    @Test
    fun malformedPackedInputFailsInsteadOfSilentlyDroppingValue() {
        var fallbackCalled = false
        val failure = assertThrows(IllegalArgumentException::class.java) {
            VBookNativeHookBridgeInputCodec.resolve("{broken") {
                fallbackCalled = true
                "{}"
            }
        }

        assertFalse(fallbackCalled)
        assertTrue(failure.message.orEmpty().contains("NATIVE_LUA_HOOK_INPUT_INVALID"))
    }
}
''', encoding='utf-8')

          workflow = Path('.github/workflows/agent-native-hook-bridge-fix.yml')
          workflow.unlink()
          PY

      - name: Run vBook regression tests
        run: ./gradlew --no-daemon --stacktrace :source-vbook:test

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt \
                  source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookNativeHookBridgeInputCodec.kt \
                  source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookNativeHookBridgeInputCodecTest.kt \
                  .github/workflows/agent-native-hook-bridge-fix.yml
          git diff --cached --check
          git commit -m 'fix(vbook): preserve native hook bridge payload'
          git push origin HEAD:fix/diagnostics-screen-runtime-parity
