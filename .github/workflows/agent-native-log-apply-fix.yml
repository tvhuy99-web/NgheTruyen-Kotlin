name: Agent NativeV2 log apply fix

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity
    paths:
      - scripts/agent-native-log-apply-fix.py
      - .github/workflows/agent-native-log-apply-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact NativeV2 log fix
        run: python3 scripts/agent-native-log-apply-fix.py

      - name: Verify patch shape
        run: |
          grep -F 'prototype = ScriptableObject.getFunctionPrototype(scope)' source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt
          grep -F 'Log.log.apply(null, ["NATIVE_V2", "TRANSFORM_START"' source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookNativeLogApplyIntegrationTest.kt
          grep -F 'NATIVE_V2_TRANSFORM_DONE' source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookNativeLogApplyIntegrationTest.kt

      - name: Run exact regression
        run: >-
          ./gradlew
          :source-vbook:test
          --tests vn.nghetruyen.source.vbook.VBookNativeLogApplyIntegrationTest
          --stacktrace

      - name: Run source and app regression suite
        run: >-
          ./gradlew
          :source-vbook:test
          :source-lua:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Commit functional patch and remove staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt
          git add source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookNativeLogApplyIntegrationTest.kt
          git rm scripts/agent-native-log-apply-fix.py .github/workflows/agent-native-log-apply-fix.yml
          git diff --cached --check
          git commit -m 'fix(vbook): restore NativeV2 transform diagnostics'
          git push origin HEAD:fix/diagnostics-screen-runtime-parity
