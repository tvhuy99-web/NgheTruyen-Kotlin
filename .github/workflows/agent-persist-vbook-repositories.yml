name: Agent persist vBook repositories

on:
  push:
    branches:
      - fix/persist-vbook-repositories

permissions:
  contents: write

concurrency:
  group: agent-persist-vbook-repositories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/persist-vbook-repositories
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Apply persistence patch
        run: python3 .github/agent/persist_vbook_repositories.py
      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Commit verified fix and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/agent/persist_vbook_repositories.py .github/workflows/agent-persist-vbook-repositories.yml
          git add app/src/main/java/vn/nghetruyen/app/AppContainer.kt \
                  app/src/main/java/vn/nghetruyen/app/sourceplatform/UnifiedSourcePlatformManager.kt \
                  app/src/main/java/vn/nghetruyen/app/sourceplatform/VBookRepositorySubscriptionStore.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          git diff --cached --check
          git commit -m "fix: persist vBook repositories across restarts"
          git push origin HEAD:fix/persist-vbook-repositories
