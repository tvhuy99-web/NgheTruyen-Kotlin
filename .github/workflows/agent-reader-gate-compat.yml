name: Agent Reader Gate Compat

on:
  push:
    branches:
      - fix/generalize-navigation-diagnostics-handoff

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/generalize-navigation-diagnostics-handoff
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply reader gate compatibility patch
        run: python3 scripts/agent_restore_reader_gate_shape.py

      - name: Run exact legacy reader static gate
        run: python3 scripts/check_milestone1_reader_core.py

      - name: Run navigation regression and compile
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'vn.nghetruyen.app.sourceplatform.CausalNavigationDiagnosticsTest' :app:compileDebugKotlin

      - name: Commit functional patch and remove staging files
        shell: bash
        run: |
          rm -f scripts/agent_restore_reader_gate_shape.py
          rm -f .github/workflows/agent-reader-gate-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix(reader): preserve core normalization gate with causal handoff'
          git push origin HEAD:fix/generalize-navigation-diagnostics-handoff
