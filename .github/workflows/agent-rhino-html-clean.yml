name: Agent Rhino Html clean

on:
  push:
    branches:
      - agent/generalize-browser-session-fetch
    paths:
      - scripts/agent_add_rhino_html_clean.py
      - .github/workflows/agent-rhino-html-clean.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/generalize-browser-session-fetch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Rhino Html.clean support
        id: patch
        continue-on-error: true
        run: python3 scripts/agent_add_rhino_html_clean.py

      - name: Verify patch formatting
        id: diffcheck
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Run source-vBook tests
        id: tests
        if: steps.patch.outcome == 'success' && steps.diffcheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :source-vbook:test --stacktrace 2>&1 | tee /tmp/rhino-html-clean-test.log

      - name: Publish verified fix or failure details
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          DIFF_OUTCOME: ${{ steps.diffcheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p .agent
          printf 'patch=%s\ndiffcheck=%s\ntests=%s\n' "$PATCH_OUTCOME" "$DIFF_OUTCOME" "$TEST_OUTCOME" > .agent/rhino-html-clean-status.txt
          if [ -f /tmp/rhino-html-clean-test.log ] && [ "$TEST_OUTCOME" != success ]; then
            tail -n 500 /tmp/rhino-html-clean-test.log > .agent/rhino-html-clean-test.log
          fi
          if [ "$PATCH_OUTCOME" = success ] && [ "$DIFF_OUTCOME" = success ] && [ "$TEST_OUTCOME" = success ]; then
            rm -f scripts/agent_add_rhino_html_clean.py .github/workflows/agent-rhino-html-clean.yml .agent/rhino-html-clean-status.txt .agent/rhino-html-clean-test.log
            message='fix: add native Rhino Html.clean support'
          else
            message='ci: record Rhino Html.clean verification failure'
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$message"
          git push origin HEAD:agent/generalize-browser-session-fetch

      - name: Fail when verification failed
        if: always() && (steps.patch.outcome != 'success' || steps.diffcheck.outcome != 'success' || steps.tests.outcome != 'success')
        run: exit 1
