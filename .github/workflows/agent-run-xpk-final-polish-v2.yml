name: Agent XPK final UI parity polish v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-final-polish-v2
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final XPK UI parity fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Fix the legacy 2.9 static gate to verify the actual XPK Reader menu.
          p = Path('scripts/check_xpk_parity_v290.py')
          s = p.read_text()
          needle = '    require(\n        "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",'
          start = s.find(needle)
          if start < 0:
              raise SystemExit('Reader require block not found in XPK 2.9 gate')
          end = s.find('    forbid(\n        "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",', start)
          if end < 0:
              raise SystemExit('Reader forbid block not found in XPK 2.9 gate')
          replacement = '''    require(
              "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",
              "display.layoutMode == ReaderLayoutMode.SCROLL",
              "TRỞ LẠI DANH SÁCH CHƯƠNG",
              "LƯU VỊ TRÍ ĐỌC",
              "HIỂN THỊ VĂN BẢN",
              "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)",
              "THIẾT LẬP AI CHO TRUYỆN NÀY",
              "PHÂN VAI TTS CHO TRUYỆN NÀY",
              "CÀI ĐẶT TTS",
              "TIẾP TỤC BẰNG BẢN GỐC",
              "AudioExportRequest(",
          )
          '''.replace('\n          ', '\n')
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 2) Reader TTS diagnostic button is a fallback only when discovery finds no engine.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          s = p.read_text()
          if 'if (!ttsLoading && state.ttsEngines.isEmpty()) {' not in s:
              diag_start = s.find('                ReaderMenuButton("SAO CHÉP CHẨN ĐOÁN BỘ ĐỌC") {')
              if diag_start < 0:
                  raise SystemExit('TTS diagnostic button not found')
              diag_end_marker = '                    onMessage("Đã sao chép chẩn đoán bộ đọc.")\n                }\n'
              diag_end = s.find(diag_end_marker, diag_start)
              if diag_end < 0:
                  raise SystemExit('TTS diagnostic block end not found')
              diag_end += len(diag_end_marker)
              block = s[diag_start:diag_end]
              block = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
              wrapped = '                if (!ttsLoading && state.ttsEngines.isEmpty()) {\n' + block + '                }\n'
              s = s[:diag_start] + wrapped + s[diag_end:]

          # 3) Music library stats and wording follow MusicLibrary.stats from the XPK.
          stats_anchor = '        val describedCount = musicLibraryDraft.count { it.tagsCsv.isNotBlank() }\n'
          if 'val estimatedCatalogTokens' not in s:
              pos = s.find(stats_anchor)
              if pos < 0:
                  raise SystemExit('music stats anchor not found')
              insert_at = pos + len(stats_anchor)
              extra = '''        val catalogChars = musicLibraryDraft.sumOf { track ->
              if (track.enabled) track.id.length + track.title.length + track.tagsCsv.trim().length + 8 else 0
          }
          val estimatedCatalogTokens = ((catalogChars + 3) / 4).coerceAtLeast(0)
          '''.replace('\n          ', '\n')
              s = s[:insert_at] + extra + s[insert_at:]

          compact = '                    "${musicLibraryDraft.size} bài • $enabledCount bật • $normalizedCount chuẩn hóa • $describedCount mô tả",\n'
          if compact in s:
              detailed = '''                    "Kho nhạc: ${musicLibraryDraft.size} bài\\n" +
                          "Bài đang bật: $enabledCount bài\\n" +
                          "Đã chuẩn hóa: $normalizedCount bài\\n" +
                          "Đã có mô tả: $describedCount bài\\n" +
                          "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
              '''.replace('\n              ', '\n')
              s = s.replace(compact, detailed, 1)
          if 'Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token' not in s:
              raise SystemExit('music summary replacement failed')

          # 4) Per-track AI metadata editor labels and guidance match the XPK.
          edit_anchor = '            var description by remember(track.id, track.tagsCsv) { mutableStateOf(track.tagsCsv) }\n'
          edit_start = s.find(edit_anchor)
          if edit_start < 0:
              raise SystemExit('music metadata editor anchor not found')
          text_start = s.find('                text = { Column {\n', edit_start)
          text_end = s.find('                } },\n                confirmButton', text_start)
          if text_start < 0 or text_end < 0:
              raise SystemExit('music metadata editor text block not found')
          segment = s[text_start:text_end]
          title_field = '                    OutlinedTextField(title, { title = it.take(120) }, placeholder = { Text("Tên bài") }, singleLine = true, modifier = Modifier.fillMaxWidth())\n'
          if 'Tên bài gửi cho AI' not in segment:
              if title_field not in segment:
                  raise SystemExit('music title field not found')
              segment = segment.replace(title_field, '                    Text("Tên bài gửi cho AI")\n' + title_field, 1)
          segment = segment.replace('Text("Mô tả cho AI", modifier = Modifier.padding(top = 8.dp))', 'Text("Mô tả tham khảo cho AI, không bắt buộc AI làm theo", modifier = Modifier.padding(top = 8.dp))', 1)
          segment = segment.replace('placeholder = { Text("Mô tả ngắn") }', 'placeholder = { Text("Tông/diễn biến: ...; Dùng: ...; Tránh: ...") }', 1)
          if 'Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.' not in segment:
              segment += '                    Text("Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(top = 6.dp))\n'
          s = s[:text_start] + segment + s[text_end:]
          p.write_text(s)

          # 5) Exact expressive voice-cast behavioral explanation from the XPK.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt')
          story = p.read_text()
          short = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm giữ giọng Người kể chuyện ở thông số gốc.'
          exact = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%.'
          if exact not in story:
              if short not in story:
                  raise SystemExit('voice expressive guidance marker not found')
              story = story.replace(short, exact, 1)
          p.write_text(story)

          # 6) Final parity gate locks these details against regression.
          Path('scripts/check_xpk_final_ui_parity.py').write_text('''#!/usr/bin/env python3
          from pathlib import Path

          reader = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt").read_text()
          story = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt").read_text()
          xpk_gate = Path("scripts/check_xpk_parity_v290.py").read_text()

          for marker in [
              "if (!ttsLoading && state.ttsEngines.isEmpty())",
              "Kho nhạc: ${musicLibraryDraft.size} bài",
              "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
              "Tên bài gửi cho AI",
              "Mô tả tham khảo cho AI, không bắt buộc AI làm theo",
              "Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.",
          ]:
              if marker not in reader:
                  raise SystemExit("XPK_FINAL_UI Reader marker missing: " + marker)

          exact_voice = "AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%."
          if exact_voice not in story:
              raise SystemExit("XPK_FINAL_UI exact expressive voice guidance missing")

          reader_gate_start = xpk_gate.find('    require(\n        "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",')
          reader_gate_end = xpk_gate.find('    forbid(\n        "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",', reader_gate_start)
          reader_gate = xpk_gate[reader_gate_start:reader_gate_end]
          for marker in ["TRỞ LẠI DANH SÁCH CHƯƠNG", "LƯU VỊ TRÍ ĐỌC", "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)", "THIẾT LẬP AI CHO TRUYỆN NÀY", "PHÂN VAI TTS CHO TRUYỆN NÀY"]:
              if marker not in reader_gate:
                  raise SystemExit("XPK_FINAL_UI release gate missing Reader marker: " + marker)
          for obsolete in ["showNoteDialog = true", '"ÁP DỤNG VIETPHRASE"', '"CẢI THIỆN VIETPHRASE"', '"PHÂN VAI + NHẠC"']:
              if obsolete in reader_gate:
                  raise SystemExit("XPK_FINAL_UI stale Reader release-gate marker remains: " + obsolete)

          print("XPK_FINAL_UI_PARITY=PASS")
          '''.replace('\n          ', '\n').lstrip())

          p = Path('scripts/m0_gate.sh')
          gate = p.read_text()
          if 'scripts/check_xpk_final_ui_parity.py' not in gate:
              anchor = '  scripts/check_music_playback_parity.py\n'
              if anchor not in gate:
                  raise SystemExit('m0 music playback gate anchor missing')
              gate = gate.replace(anchor, anchor + '  scripts/check_xpk_final_ui_parity.py\n', 1)
              p.write_text(gate)
          PY
      - name: Run all XPK parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
          python3 scripts/check_music_playback_parity.py
          python3 scripts/check_xpk_final_ui_parity.py
          python3 scripts/check_xpk_parity_v290.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit final XPK UI parity fixes
        shell: bash
        run: |
          rm -f .github/workflows/agent-run-xpk-final-polish-v2.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finish XPK reader and music UI parity"
          git push origin HEAD:agent/settings-a11y-labels