name: Agent XPK final UI parity polish v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-final-polish-v3
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch final XPK parity details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Legacy release gate: validate the actual standard XPK Reader menu.
          p = Path('scripts/check_xpk_parity_v290.py')
          gate = p.read_text()
          path_token = '"app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt"'
          path_pos = gate.find(path_token)
          if path_pos < 0: raise SystemExit('Reader gate path missing')
          start = gate.rfind('    require(', 0, path_pos)
          end = gate.find('    forbid(', path_pos)
          if start < 0 or end < 0: raise SystemExit('Reader gate bounds missing')
          reader_require = '''    require(
              "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",
              "display.layoutMode == ReaderLayoutMode.SCROLL",
              "TRỞ LẠI DANH SÁCH CHƯƠNG",
              "LƯU VỊ TRÍ ĐỌC",
              "HIỂN THỊ VĂN BẢN",
              "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)",
              "THIẾT LẬP AI CHO TRUYỆN NÀY",
              "PHÂN VAI TTS CHO TRUYỆN NÀY",
              "CÀI ĐẶT TTS",
              "TIẾP TỤC BẰNG BẢN GỐC",
              "AudioExportRequest(",
          )
          '''.replace('\n          ', '\n')
          p.write_text(gate[:start] + reader_require + gate[end:])

          # Reader details.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          reader = p.read_text()

          if 'if (!ttsLoading && state.ttsEngines.isEmpty()) {' not in reader:
              a = reader.find('                ReaderMenuButton("SAO CHÉP CHẨN ĐOÁN BỘ ĐỌC") {')
              zmark = '                    onMessage("Đã sao chép chẩn đoán bộ đọc.")\n                }\n'
              z = reader.find(zmark, a)
              if a < 0 or z < 0: raise SystemExit('TTS diagnostic block missing')
              z += len(zmark)
              block = reader[a:z]
              indented = ''.join(('    ' + line if line.strip() else line) for line in block.splitlines(keepends=True))
              reader = reader[:a] + '                if (!ttsLoading && state.ttsEngines.isEmpty()) {\n' + indented + '                }\n' + reader[z:]

          if 'val estimatedCatalogTokens' not in reader:
              anchor = '        val describedCount = musicLibraryDraft.count { it.tagsCsv.isNotBlank() }\n'
              pos = reader.find(anchor)
              if pos < 0: raise SystemExit('Music stats anchor missing')
              pos += len(anchor)
              extra = '''        val catalogChars = musicLibraryDraft.sumOf { track ->
              if (track.enabled) track.id.length + track.title.length + track.tagsCsv.trim().length + 8 else 0
          }
          val estimatedCatalogTokens = ((catalogChars + 3) / 4).coerceAtLeast(0)
          '''.replace('\n          ', '\n')
              reader = reader[:pos] + extra + reader[pos:]

          compact = '                    "${musicLibraryDraft.size} bài • $enabledCount bật • $normalizedCount chuẩn hóa • $describedCount mô tả",\n'
          if compact in reader:
              detailed = '''                    "Kho nhạc: ${musicLibraryDraft.size} bài\\n" +
                          "Bài đang bật: $enabledCount bài\\n" +
                          "Đã chuẩn hóa: $normalizedCount bài\\n" +
                          "Đã có mô tả: $describedCount bài\\n" +
                          "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
              '''.replace('\n              ', '\n')
              reader = reader.replace(compact, detailed, 1)

          edit_anchor = '            var description by remember(track.id, track.tagsCsv) { mutableStateOf(track.tagsCsv) }\n'
          e = reader.find(edit_anchor)
          ts = reader.find('                text = { Column {\n', e)
          te = reader.find('                } },\n                confirmButton', ts)
          if e < 0 or ts < 0 or te < 0: raise SystemExit('Music metadata editor missing')
          seg = reader[ts:te]
          field = '                    OutlinedTextField(title, { title = it.take(120) }, placeholder = { Text("Tên bài") }, singleLine = true, modifier = Modifier.fillMaxWidth())\n'
          if 'Tên bài gửi cho AI' not in seg:
              if field not in seg: raise SystemExit('Music name field missing')
              seg = seg.replace(field, '                    Text("Tên bài gửi cho AI")\n' + field, 1)
          seg = seg.replace('Text("Mô tả cho AI", modifier = Modifier.padding(top = 8.dp))', 'Text("Mô tả tham khảo cho AI, không bắt buộc AI làm theo", modifier = Modifier.padding(top = 8.dp))', 1)
          seg = seg.replace('placeholder = { Text("Mô tả ngắn") }', 'placeholder = { Text("Tông/diễn biến: ...; Dùng: ...; Tránh: ...") }', 1)
          if 'Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.' not in seg:
              seg += '                    Text("Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(top = 6.dp))\n'
          reader = reader[:ts] + seg + reader[te:]
          p.write_text(reader)

          # Exact XPK expressive guidance.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt')
          story = p.read_text()
          short = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm giữ giọng Người kể chuyện ở thông số gốc.'
          exact = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%.'
          if exact not in story:
              if short not in story: raise SystemExit('Voice guidance marker missing')
              story = story.replace(short, exact, 1)
          p.write_text(story)

          # Stable final gate, avoiding embedded multiline string literals.
          final_gate = '''#!/usr/bin/env python3
          from pathlib import Path

          reader = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt").read_text()
          story = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt").read_text()
          release_gate = Path("scripts/check_xpk_parity_v290.py").read_text()

          for marker in [
              "if (!ttsLoading && state.ttsEngines.isEmpty())",
              "Kho nhạc: ${musicLibraryDraft.size} bài",
              "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
              "Tên bài gửi cho AI",
              "Mô tả tham khảo cho AI, không bắt buộc AI làm theo",
              "Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.",
          ]:
              if marker not in reader:
                  raise SystemExit("XPK_FINAL_UI Reader marker missing: " + marker)

          exact = "AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%."
          if exact not in story:
              raise SystemExit("XPK_FINAL_UI exact voice guidance missing")

          path_token = '"app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt"'
          path_pos = release_gate.find(path_token)
          start = release_gate.rfind("    require(", 0, path_pos)
          end = release_gate.find("    forbid(", path_pos)
          reader_gate = release_gate[start:end]
          for marker in ["TRỞ LẠI DANH SÁCH CHƯƠNG", "LƯU VỊ TRÍ ĐỌC", "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)", "THIẾT LẬP AI CHO TRUYỆN NÀY", "PHÂN VAI TTS CHO TRUYỆN NÀY"]:
              if marker not in reader_gate:
                  raise SystemExit("XPK_FINAL_UI release gate missing: " + marker)
          for obsolete in ["showNoteDialog = true", '"ÁP DỤNG VIETPHRASE"', '"CẢI THIỆN VIETPHRASE"', '"PHÂN VAI + NHẠC"']:
              if obsolete in reader_gate:
                  raise SystemExit("XPK_FINAL_UI stale Reader gate marker: " + obsolete)

          print("XPK_FINAL_UI_PARITY=PASS")
          '''.replace('\n          ', '\n').lstrip()
          Path('scripts/check_xpk_final_ui_parity.py').write_text(final_gate)

          p = Path('scripts/m0_gate.sh')
          m0 = p.read_text()
          if 'scripts/check_xpk_final_ui_parity.py' not in m0:
              anchor = '  scripts/check_music_playback_parity.py\n'
              if anchor not in m0: raise SystemExit('M0 music gate anchor missing')
              p.write_text(m0.replace(anchor, anchor + '  scripts/check_xpk_final_ui_parity.py\n', 1))
          PY
      - name: Validate parity and compile
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
          python3 scripts/check_music_playback_parity.py
          python3 scripts/check_xpk_final_ui_parity.py
          python3 scripts/check_xpk_parity_v290.py
          ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit final parity fixes
        shell: bash
        run: |
          rm -f .github/workflows/agent-run-xpk-final-polish-v3.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finish XPK reader and music UI parity"
          git push origin HEAD:agent/settings-a11y-labels