name: Agent XPK final UI parity polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-final-polish
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply final XPK UI parity fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          # Release/static gate: validate the actual XPK Reader menu instead of old Kotlin-only actions.
          p = Path('scripts/check_xpk_parity_v290.py')
          s = p.read_text()
          old = '''    require(
              "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",
              "display.layoutMode == ReaderLayoutMode.SCROLL",
              "showNoteDialog = true",
              "ÁP DỤNG VIETPHRASE",
              "CẢI THIỆN VIETPHRASE",
              "PHÂN VAI + NHẠC",
              "TIẾP TỤC BẰNG BẢN GỐC",
              "AudioExportRequest(",
          )
          '''
          new = '''    require(
              "app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt",
              "display.layoutMode == ReaderLayoutMode.SCROLL",
              "TRỞ LẠI DANH SÁCH CHƯƠNG",
              "LƯU VỊ TRÍ ĐỌC",
              "HIỂN THỊ VĂN BẢN",
              "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)",
              "THIẾT LẬP AI CHO TRUYỆN NÀY",
              "PHÂN VAI TTS CHO TRUYỆN NÀY",
              "CÀI ĐẶT TTS",
              "TIẾP TỤC BẰNG BẢN GỐC",
              "AudioExportRequest(",
          )
          '''
          s = replace_once(s, old, new, 'XPK 2.9 Reader markers')
          p.write_text(s)

          # Reader: diagnostic copy is an error/no-engine fallback in the XPK, not a normal action.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          s = p.read_text()
          old = '''                ReaderMenuButton("QUÉT LẠI BỘ ĐỌC") { onRefreshVoices() }
                  ReaderMenuButton("SAO CHÉP CHẨN ĐOÁN BỘ ĐỌC") {
                      clipboard.setText(AnnotatedString("Bộ đọc: ${ttsDraft.enginePackage ?: "Mặc định hệ thống"}\\nNgôn ngữ: ${ttsDraft.languageTag}\\nGiọng: ${ttsDraft.voiceName ?: "Mặc định"}\\nSố bộ đọc/giọng: ${state.ttsEngines.size}/${ttsVoices.size}"))
                      onMessage("Đã sao chép chẩn đoán bộ đọc.")
                  }
          '''
          new = '''                ReaderMenuButton("QUÉT LẠI BỘ ĐỌC") { onRefreshVoices() }
                  if (!ttsLoading && state.ttsEngines.isEmpty()) {
                      ReaderMenuButton("SAO CHÉP CHẨN ĐOÁN BỘ ĐỌC") {
                          clipboard.setText(AnnotatedString("Bộ đọc: ${ttsDraft.enginePackage ?: "Mặc định hệ thống"}\\nNgôn ngữ: ${ttsDraft.languageTag}\\nGiọng: ${ttsDraft.voiceName ?: "Mặc định"}\\nSố bộ đọc/giọng: ${state.ttsEngines.size}/${ttsVoices.size}"))
                          onMessage("Đã sao chép chẩn đoán bộ đọc.")
                      }
                  }
          '''
          s = replace_once(s, old, new, 'conditional TTS diagnostic')

          # Music library summary follows MusicLibrary.stats from the XPK.
          old = '''        val enabledCount = musicLibraryDraft.count(SceneMusicTrackEntity::enabled)
                  val normalizedCount = musicLibraryDraft.count { it.normalizationVersion >= PcmLoudnessEstimator.VERSION && it.normalizationError.isBlank() }
                  val describedCount = musicLibraryDraft.count { it.tagsCsv.isNotBlank() }
          '''
          new = '''        val enabledCount = musicLibraryDraft.count(SceneMusicTrackEntity::enabled)
                  val normalizedCount = musicLibraryDraft.count { it.normalizationVersion >= PcmLoudnessEstimator.VERSION && it.normalizationError.isBlank() }
                  val describedCount = musicLibraryDraft.count { it.tagsCsv.isNotBlank() }
                  val catalogChars = musicLibraryDraft.sumOf { track ->
                      if (track.enabled) track.id.length + track.title.length + track.tagsCsv.trim().length + 8 else 0
                  }
                  val estimatedCatalogTokens = ((catalogChars + 3) / 4).coerceAtLeast(0)
          '''
          s = replace_once(s, old, new, 'music library stats')
          old = '''                Text(
                          "${musicLibraryDraft.size} bài • $enabledCount bật • $normalizedCount chuẩn hóa • $describedCount mô tả",
                          style = MaterialTheme.typography.bodySmall,
                          modifier = Modifier.padding(bottom = 6.dp),
                      )
          '''
          new = '''                Text(
                          "Kho nhạc: ${musicLibraryDraft.size} bài\\n" +
                              "Bài đang bật: $enabledCount bài\\n" +
                              "Đã chuẩn hóa: $normalizedCount bài\\n" +
                              "Đã có mô tả: $describedCount bài\\n" +
                              "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
                          style = MaterialTheme.typography.bodySmall,
                          modifier = Modifier.padding(bottom = 6.dp),
                      )
          '''
          s = replace_once(s, old, new, 'music library summary')

          # Match the XPK wording in the per-track AI metadata editor.
          old = '''                text = { Column {
                      OutlinedTextField(title, { title = it.take(120) }, placeholder = { Text("Tên bài") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Text("Mô tả cho AI", modifier = Modifier.padding(top = 8.dp))
                      OutlinedTextField(
                          description,
                          { description = it.take(301) },
                          placeholder = { Text("Mô tả ngắn") },
                          minLines = 4,
                          maxLines = 7,
                          modifier = Modifier.fillMaxWidth(),
                      )
                  } },
          '''
          new = '''                text = { Column {
                      Text("Tên bài gửi cho AI")
                      OutlinedTextField(title, { title = it.take(120) }, placeholder = { Text("Tên bài") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                      Text("Mô tả tham khảo cho AI, không bắt buộc AI làm theo", modifier = Modifier.padding(top = 8.dp))
                      OutlinedTextField(
                          description,
                          { description = it.take(301) },
                          placeholder = { Text("Tông/diễn biến: ...; Dùng: ...; Tránh: ...") },
                          minLines = 4,
                          maxLines = 7,
                          modifier = Modifier.fillMaxWidth(),
                      )
                      Text("Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(top = 6.dp))
                  } },
          '''
          s = replace_once(s, old, new, 'music AI metadata labels')
          p.write_text(s)

          # Voice-casting explanation: use the exact behavioral constraints from the XPK.
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt')
          s = p.read_text()
          old = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm giữ giọng Người kể chuyện ở thông số gốc.'
          new = 'AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%.'
          s = replace_once(s, old, new, 'voice expressive explanation')
          p.write_text(s)

          # Dedicated final parity gate so stale UI cannot silently return.
          Path('scripts/check_xpk_final_ui_parity.py').write_text('''#!/usr/bin/env python3
          from pathlib import Path

          reader = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt").read_text()
          story = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/StoryReferenceAdvancedDialogs.kt").read_text()
          xpk_gate = Path("scripts/check_xpk_parity_v290.py").read_text()

          required_reader = [
              "if (!ttsLoading && state.ttsEngines.isEmpty())",
              "Kho nhạc: ${musicLibraryDraft.size} bài",
              "Ước tính khi gửi danh mục AI: khoảng $estimatedCatalogTokens token",
              "Tên bài gửi cho AI",
              "Mô tả tham khảo cho AI, không bắt buộc AI làm theo",
              "Tối đa 300 ký tự. Chỉ ghi thông tin thực sự giúp AI phân biệt và chọn bài.",
          ]
          for marker in required_reader:
              if marker not in reader:
                  raise SystemExit("XPK_FINAL_UI Reader marker missing: " + marker)

          exact_voice = "AI xử lý phân vai và ba thông số phần trăm trong cùng một lượt. Không dùng nhãn buồn, vui hay tức giận. Chỉ lời thoại trực tiếp được đổi giọng và thông số; lời kể cùng nội tâm luôn giữ giọng Người kể chuyện ở thông số gốc. Mức AI trả về được áp trực tiếp trong giới hạn bên dưới. Âm lượng chỉ có thể tăng khi mức gốc còn dưới 100%."
          if exact_voice not in story:
              raise SystemExit("XPK_FINAL_UI exact expressive voice guidance missing")

          for marker in [
              "TRỞ LẠI DANH SÁCH CHƯƠNG",
              "LƯU VỊ TRÍ ĐỌC",
              "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)",
              "THIẾT LẬP AI CHO TRUYỆN NÀY",
              "PHÂN VAI TTS CHO TRUYỆN NÀY",
          ]:
              if marker not in xpk_gate:
                  raise SystemExit("XPK_FINAL_UI release gate missing Reader marker: " + marker)

          for obsolete in ["showNoteDialog = true", '"ÁP DỤNG VIETPHRASE"', '"CẢI THIỆN VIETPHRASE"', '"PHÂN VAI + NHẠC"']:
              reader_gate = xpk_gate[xpk_gate.find('"app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt"'):]
              reader_gate = reader_gate[:1800]
              if obsolete in reader_gate:
                  raise SystemExit("XPK_FINAL_UI stale Reader release-gate marker remains: " + obsolete)

          print("XPK_FINAL_UI_PARITY=PASS")
          '''.replace('\n          ', '\n').lstrip())

          p = Path('scripts/m0_gate.sh')
          s = p.read_text()
          marker = '  scripts/check_music_playback_parity.py\n'
          if 'scripts/check_xpk_final_ui_parity.py' not in s:
              if marker not in s:
                  raise SystemExit('m0 music playback gate anchor missing')
              s = s.replace(marker, marker + '  scripts/check_xpk_final_ui_parity.py\n', 1)
              p.write_text(s)
          PY
      - name: Run all XPK parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
          python3 scripts/check_music_playback_parity.py
          python3 scripts/check_xpk_final_ui_parity.py
          python3 scripts/check_xpk_parity_v290.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit final XPK UI parity fixes
        shell: bash
        run: |
          rm -f .github/workflows/agent-run-xpk-final-polish.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finish XPK reader and music UI parity"
          git push origin HEAD:agent/settings-a11y-labels