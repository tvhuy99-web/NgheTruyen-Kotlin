name: Agent XPK music runtime parity phase 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-music-phase2
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply XPK music runtime patch
        run: python3 scripts/agent_apply_xpk_music_phase2.py
      - name: Run parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
      - name: Compile Kotlin and generate Room schema
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Verify Room schema 23
        shell: bash
        run: |
          test -f app/schemas/vn.nghetruyen.app.data.local.AppDatabase/23.json
          grep -q 'normalizationGainDb' app/schemas/vn.nghetruyen.app.data.local.AppDatabase/23.json
          grep -q 'normalizationVersion' app/schemas/vn.nghetruyen.app.data.local.AppDatabase/23.json
      - name: Commit music runtime parity fixes
        shell: bash
        run: |
          rm -f scripts/agent_apply_xpk_music_phase2.py
          rm -f .github/workflows/agent-run-xpk-music-phase2.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align XPK music normalization and preview runtime"
          git push origin HEAD:agent/settings-a11y-labels
