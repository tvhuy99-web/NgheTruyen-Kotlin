name: Agent XPK music normalization flow phase 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-music-phase4
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix and apply normalization flow patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/agent_apply_xpk_music_phase4.py')
          s = p.read_text()
          old = """marker = '    if (showMusicLibrary) {\\n'\nprogress = '''"""
          new = """marker = '    if (showMusicLibrary) {\\n'\nprogress = '''"""
          if old not in s:
              raise SystemExit('phase4 progress marker declaration missing')
          # Replace the final generic rep with a scoped insertion after the actual music dialog.
          old_tail = "s = rep(s, marker, progress + marker, 'normalization progress dialog')"
          new_tail = "music_dialog = s.index('title = { Text(\\\"NHẠC NỀN\\\") }')\nmarker_pos = s.index(marker, music_dialog)\ns = s[:marker_pos] + progress + s[marker_pos:]"
          if old_tail not in s:
              raise SystemExit('phase4 generic insertion missing')
          p.write_text(s.replace(old_tail, new_tail, 1))
          PY
          python3 scripts/agent_apply_xpk_music_phase4.py
      - name: Run parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
          python3 scripts/check_music_playback_parity.py
          python3 scripts/check_music_normalization_flow_parity.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit normalization flow parity fixes
        shell: bash
        run: |
          rm -f scripts/agent_apply_xpk_music_phase4.py
          rm -f .github/workflows/agent-run-xpk-music-phase4.yml
          rm -f .github/workflows/agent-inspect-phase4-line.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align XPK music normalization flow"
          git push origin HEAD:agent/settings-a11y-labels
