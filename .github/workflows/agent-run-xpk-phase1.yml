name: Agent XPK functional parity phase 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-phase1
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply reference workflow patch
        shell: bash
        run: |
          set +e
          output="$(python3 scripts/agent_apply_xpk_phase1.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -ne 0 && "$output" != *"missing marker: m0 gate"* ]]; then
            exit "$rc"
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/m0_gate.sh')
          s = p.read_text()
          marker = '  scripts/check_ui_control_parity.py\n'
          if 'check_reference_workflow_parity.py' not in s:
              if marker not in s:
                  raise SystemExit('could not insert workflow parity gate')
              p.write_text(s.replace(marker, marker + '  scripts/check_reference_workflow_parity.py\n', 1))

          Path('scripts/check_reference_workflow_parity.py').write_text(r'''#!/usr/bin/env python3
          from pathlib import Path

          reader = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt").read_text()
          vm = Path("app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt").read_text()
          library = Path("app/src/main/java/vn/nghetruyen/app/ui/screens/LibraryScreen.kt").read_text()
          settings = Path("app/src/main/java/vn/nghetruyen/app/data/settings/SettingsRepository.kt").read_text()
          narration = Path("app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt").read_text()

          required_reader = [
              "TRỞ LẠI DANH SÁCH CHƯƠNG",
              "LƯU VỊ TRÍ ĐỌC",
              "HIỂN THỊ VĂN BẢN",
              "XUẤT ÂM THANH (CẦN CHẾ ĐỘ TTS)",
              "THIẾT LẬP AI CHO TRUYỆN NÀY",
              "PHÂN VAI TTS CHO TRUYỆN NÀY",
              "StoryReferenceAdvancedDialogs(",
              "Trao toàn quyền giữ và đổi nhạc cho AI",
              "CHUẨN HÓA TOÀN BỘ KHO NHẠC",
              "QUẢN LÝ DANH SÁCH NHẠC",
              "displayFontSizeDraft",
              "displayLineHeightDraft",
          ]
          missing = [item for item in required_reader if item not in reader]
          if missing:
              raise SystemExit("REFERENCE_WORKFLOW missing Reader markers: " + repr(missing))

          for obsolete in [
              'title = { Text("AI & CHUYỂN NGỮ") }',
              'title = { Text("KHÁC") }',
              "musicAdvanced",
          ]:
              if obsolete in reader:
                  raise SystemExit("REFERENCE_WORKFLOW obsolete Reader navigation: " + obsolete)

          if "destination = Destination.Story," in vm and "storyAdvancedOptionsRequested = true" in vm:
              legacy = vm[vm.find("private fun openStoryAdvancedOptions"):]
              legacy = legacy[:1200]
              if "destination = Destination.Story" in legacy:
                  raise SystemExit("REFERENCE_WORKFLOW story settings still force destination change")

          for marker in ["ĐỌC TIẾP", "XÓA KHỎI ĐANG ĐỌC", "MỞ TRUYỆN", "BỎ ĐÁNH DẤU", "BỎ THEO DÕI"]:
              if marker not in library:
                  raise SystemExit("REFERENCE_WORKFLOW missing Library action: " + marker)

          for marker in [
              "backgroundMusicAttackMillis: Int = 1850",
              "backgroundMusicReleaseMillis: Int = 2050",
              "sceneMusicTargetLufs: Float = -24.0f",
              "SceneMusicPlaybackMode.SEQUENTIAL",
          ]:
              if marker not in settings:
                  raise SystemExit("REFERENCE_WORKFLOW music default missing: " + marker)

          if "tagsCsv.split(',')" in narration:
              raise SystemExit("REFERENCE_WORKFLOW music description is still split as CSV tags")

          print("REFERENCE_WORKFLOW_PARITY=PASS")
          '''.replace('\n          ', '\n').lstrip())
          PY
      - name: Run parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit functional parity fixes
        shell: bash
        run: |
          rm -f scripts/agent_apply_xpk_phase1.py
          rm -f .github/workflows/agent-run-xpk-phase1.yml
          rm -f .github/workflows/agent-xpk-parity-patch.yml
          rm -f .github/workflows/agent-xpk-inspect.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align XPK reader navigation and workflows"
          git push origin HEAD:agent/settings-a11y-labels
