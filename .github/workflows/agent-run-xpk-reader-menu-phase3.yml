name: Agent XPK reader menu parity phase 3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-xpk-reader-menu-phase3
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/settings-a11y-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/settings-a11y-labels
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove Kotlin-only actions from standard Reader options
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reader_path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          reader = reader_path.read_text()
          start_marker = '                Text("MỞ RỘNG", fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 12.dp, bottom = 4.dp))\n'
          end_marker = '                ReaderMenuButton("XEM NHẬT KÝ CHẨN ĐOÁN") { showReaderOptions = false; showDiagnosticLogDialog = true }\n'
          start = reader.find(start_marker)
          if start < 0:
              raise SystemExit('Reader MỞ RỘNG block start missing')
          end = reader.find(end_marker, start)
          if end < 0:
              raise SystemExit('Reader MỞ RỘNG block end missing')
          end += len(end_marker)
          reader = reader[:start] + reader[end:]
          reader_path.write_text(reader)

          gate_path = Path('scripts/check_reference_workflow_parity.py')
          gate = gate_path.read_text()
          anchor = 'missing = [item for item in required_reader if item not in reader]\nif missing:\n    raise SystemExit("REFERENCE_WORKFLOW missing Reader markers: " + repr(missing))\n\n'
          addition = '''missing = [item for item in required_reader if item not in reader]\nif missing:\n    raise SystemExit("REFERENCE_WORKFLOW missing Reader markers: " + repr(missing))\n\nreader_options_start = reader.find('    if (showReaderOptions) {')\nreader_options_end = reader.find('    if (showReaderModeDialog) {', reader_options_start)\nif reader_options_start < 0 or reader_options_end < 0:\n    raise SystemExit("REFERENCE_WORKFLOW standard Reader options block missing")\nreader_options = reader[reader_options_start:reader_options_end]\nfor extra in [\n    'Text("MỞ RỘNG"',\n    'ĐÁNH DẤU ĐOẠN',\n    'GHI CHÚ ĐOẠN',\n    'SỬA GHI CHÚ ĐOẠN',\n    'ÁP DỤNG VIETPHRASE',\n    'CẢI THIỆN VIETPHRASE',\n    'LẬP NHẠC CẢNH',\n    'PHÂN VAI + NHẠC',\n    'XEM NHẬT KÝ CHẨN ĐOÁN',\n]:\n    if extra in reader_options:\n        raise SystemExit("REFERENCE_WORKFLOW Kotlin-only action leaked into standard Reader options: " + extra)\n\n'''
          if anchor not in gate:
              raise SystemExit('workflow parity gate anchor missing')
          gate = gate.replace(anchor, addition, 1)
          gate_path.write_text(gate)
          PY
      - name: Run parity gates
        run: |
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          python3 scripts/check_music_runtime_parity.py
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit exact Reader menu parity
        shell: bash
        run: |
          rm -f .github/workflows/agent-run-xpk-reader-menu-phase3.yml
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: match XPK reader options menu exactly"
          git push origin HEAD:agent/settings-a11y-labels