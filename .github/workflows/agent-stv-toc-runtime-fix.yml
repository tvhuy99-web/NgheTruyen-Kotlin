# Temporary self-removing workflow. It commits only after exact patching and regression tests pass.
name: Apply STV TOC runtime fix

on:
  push:
    branches:
      - fix/diagnostics-screen-runtime-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/diagnostics-screen-runtime-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply exact STV TOC patch
        run: python3 scripts/agent_stv_toc_runtime_fix.py

      - name: Run focused Native Lua and vBook tests
        run: ./gradlew --no-daemon :source-lua:test :source-vbook:test

      - name: Commit verified patch
        run: |
          rm scripts/agent_stv_toc_runtime_fix.py
          rm .github/workflows/agent-stv-toc-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(vbook): bound Native Lua TOC transform overhead"
          git push origin HEAD:fix/diagnostics-screen-runtime-parity
