name: Agent vBook fetch parity fix

on:
  push:
    branches:
      - agent/fix-vbook-qidian-fetch-parity
    paths:
      - .github/workflows/agent-vbook-5in1-probe.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-vbook-qidian-fetch-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply vBook browser identity parity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path("app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt")
          test_path = Path("app/src/test/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookNetworkCompatibilityTest.kt")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              '''            val headers = payload.obj("headers")?.values.orEmpty().mapNotNull { (key, value) ->
              (value as? JsonValue.Str)?.value?.let { key to it }
          }.toMap(LinkedHashMap())''',
              '''            val requestedHeaders = payload.obj("headers")?.values.orEmpty().mapNotNull { (key, value) ->
              (value as? JsonValue.Str)?.value?.let { key to it }
          }.toMap(LinkedHashMap())
          val headers = ChromiumVBookNetworkCompatibility.withDefaultUserAgent(
              headers = requestedHeaders,
              userAgent = WebSettings.getDefaultUserAgent(appContext),
          )''',
              "default vBook fetch to WebView user agent",
          )
          runtime = replace_once(
              runtime,
              '''internal object ChromiumVBookNetworkCompatibility {
      fun normalizeUrl(raw: String): String {
          val schemeEnd = raw.indexOf("://")
          if (schemeEnd <= 0 || raw.substring(0, schemeEnd).lowercase(Locale.ROOT) !in setOf("http", "https")) return raw
          val authorityStart = schemeEnd + 3
          val pathStart = raw.indexOfAny(charArrayOf('/', '?', '#'), authorityStart)
          if (pathStart < 0 || raw[pathStart] != '/') return raw
          var duplicateEnd = pathStart
          while (duplicateEnd + 1 < raw.length && raw[duplicateEnd + 1] == '/') duplicateEnd += 1
          return if (duplicateEnd == pathStart) raw else raw.removeRange(pathStart + 1, duplicateEnd + 1)
      }
  }''',
              '''internal object ChromiumVBookNetworkCompatibility {
      fun normalizeUrl(raw: String): String {
          val schemeEnd = raw.indexOf("://")
          if (schemeEnd <= 0 || raw.substring(0, schemeEnd).lowercase(Locale.ROOT) !in setOf("http", "https")) return raw
          val authorityStart = schemeEnd + 3
          val pathStart = raw.indexOfAny(charArrayOf('/', '?', '#'), authorityStart)
          if (pathStart < 0 || raw[pathStart] != '/') return raw
          var duplicateEnd = pathStart
          while (duplicateEnd + 1 < raw.length && raw[duplicateEnd + 1] == '/') duplicateEnd += 1
          return if (duplicateEnd == pathStart) raw else raw.removeRange(pathStart + 1, duplicateEnd + 1)
      }

      fun withDefaultUserAgent(
          headers: Map<String, String>,
          userAgent: String,
      ): Map<String, String> {
          if (userAgent.isBlank() || headers.keys.any { it.equals("User-Agent", ignoreCase = true) }) return headers
          return LinkedHashMap(headers).apply { put("User-Agent", userAgent) }
      }
  }''',
              "add browser user-agent compatibility helper",
          )
          runtime_path.write_text(runtime)

          test = test_path.read_text()
          test = replace_once(
              test,
              '''class ChromiumVBookNetworkCompatibilityTest {
      @Test''',
              '''class ChromiumVBookNetworkCompatibilityTest {
      @Test
      fun defaultsVBookFetchToBrowserUserAgent() {
          val headers = ChromiumVBookNetworkCompatibility.withDefaultUserAgent(
              headers = linkedMapOf("Accept" to "application/json"),
              userAgent = "Mozilla/5.0 Android WebView",
          )

          assertEquals("Mozilla/5.0 Android WebView", headers["User-Agent"])
          assertEquals("application/json", headers["Accept"])
      }

      @Test
      fun explicitUserAgentWinsCaseInsensitively() {
          val original = linkedMapOf("user-agent" to "Extension-UA", "Accept" to "*/*")

          val headers = ChromiumVBookNetworkCompatibility.withDefaultUserAgent(
              headers = original,
              userAgent = "Mozilla/5.0 Android WebView",
          )

          assertEquals(original, headers)
          assertEquals("Extension-UA", headers["user-agent"])
      }

      @Test''',
              "add user-agent parity regression tests",
          )
          test_path.write_text(test)
          PY

      - name: Run focused network and replay regression tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests vn.nghetruyen.app.sourceplatform.ChromiumVBookNetworkCompatibilityTest \
            --tests vn.nghetruyen.app.sourceplatform.ChromiumVBookBrowserReplayRuntimeTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt \
            app/src/test/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookNetworkCompatibilityTest.kt
          git rm .github/workflows/agent-vbook-5in1-probe.yml
          git diff --cached --check
          git commit -m "fix: align vBook fetch identity with browser session"
          git push origin HEAD:agent/fix-vbook-qidian-fetch-parity
