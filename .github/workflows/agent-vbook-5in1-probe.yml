name: Agent vBook fetch parity fix

on:
  push:
    branches:
      - agent/fix-vbook-qidian-fetch-parity
    paths:
      - .github/workflows/agent-vbook-5in1-probe.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-vbook-qidian-fetch-parity
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply vBook browser identity parity fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_patch.py
          python3 /tmp/apply_patch.py

      - name: Run focused network and replay regression tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests vn.nghetruyen.app.sourceplatform.ChromiumVBookNetworkCompatibilityTest --tests vn.nghetruyen.app.sourceplatform.ChromiumVBookBrowserReplayRuntimeTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt app/src/test/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookNetworkCompatibilityTest.kt
          git rm .github/workflows/agent-vbook-5in1-probe.yml
          git diff --cached --check
          git commit -m "fix: align vBook fetch identity with browser session"
          git push origin HEAD:agent/fix-vbook-qidian-fetch-parity
