name: Agent vBook 5in1 probe

on:
  push:
    branches:
      - agent/fix-vbook-qidian-fetch-parity
    paths:
      - .github/workflows/agent-vbook-5in1-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect catalog package and Qidian response shape
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, http.cookiejar, zipfile, io, re

          def get(url, opener=None, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              return (opener or urllib.request.build_opener()).open(req, timeout=30).read()

          print('=== catalog ===')
          raw = get('https://www.vbookext.me/api/plugin.json')
          catalog = json.loads(raw)
          entries = catalog.get('data', catalog if isinstance(catalog, list) else [])
          matches = [x for x in entries if str(x.get('name','')).strip().lower() == '5in1']
          print('matches=', len(matches))
          if not matches:
              # Search nested/list-shaped catalogs defensively.
              stack=[catalog]
              while stack:
                  v=stack.pop()
                  if isinstance(v, dict):
                      if str(v.get('name','')).strip().lower() == '5in1': matches.append(v)
                      stack.extend(v.values())
                  elif isinstance(v, list): stack.extend(v)
          if not matches:
              raise SystemExit('5in1 not found in catalog')
          item=matches[0]
          print('name=', item.get('name'), 'version=', item.get('version'), 'author=', item.get('author'))
          print('path=', item.get('path'))
          package=get(item['path'])
          z=zipfile.ZipFile(io.BytesIO(package))
          print('zip entries=', len(z.namelist()))
          for target in ['plugin.json','src/home.js','src/gen0.js','src/gen1.js']:
              if target in z.namelist():
                  text=z.read(target).decode('utf-8','replace')
                  print('\n===', target, '===')
                  for i,line in enumerate(text.splitlines(),1):
                      print(f'{i:03d}: {line}')

          print('\n=== qidian response shape ===')
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          ua='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/138.0.0.0 Mobile Safari/537.36'
          headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          try:
              get('https://my.qidian.com/author/9639927/', opener, headers)
          except Exception as e:
              print('author navigation warning=', type(e).__name__, str(e)[:160])
          csrf=''
          for c in cj:
              if c.name == '_csrfToken': csrf=c.value
          print('csrf present=', bool(csrf), 'cookie names=', sorted({c.name for c in cj}))
          qs=urllib.parse.urlencode({'gender':'male','pageNum':'1','_csrfToken':csrf})
          endpoint='https://m.qidian.com/majax/rank/yuepiaolist?'+qs
          api_headers={'User-Agent':ua,'Accept':'application/json, text/plain, */*','Referer':'https://m.qidian.com/'}
          body=get(endpoint, opener, api_headers)
          print('bytes=', len(body))
          obj=json.loads(body.decode('utf-8','replace'))
          print('root type=', type(obj).__name__)
          if isinstance(obj,dict):
              print('root keys=', sorted(obj.keys()))
              data=obj.get('data')
              print('data type=', type(data).__name__)
              if isinstance(data,dict): print('data keys=', sorted(data.keys()))
              for k,v in obj.items():
                  if isinstance(v,dict) and 'pageNum' in v:
                      print('pageNum container=', k, 'value=', v.get('pageNum'))
          PY
