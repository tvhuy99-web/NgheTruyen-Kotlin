name: Agent vBook 5in1 probe

on:
  push:
    branches:
      - agent/fix-vbook-qidian-fetch-parity
    paths:
      - .github/workflows/agent-vbook-5in1-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact 5in1 v70 package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' \
            'https://raw.githubusercontent.com/dat-bi/ext-vbook/main/extensions/5in1/plugin.zip' \
            -o /tmp/5in1.zip
          echo "package_sha256=$(sha256sum /tmp/5in1.zip | awk '{print $1}')"
          echo "package_bytes=$(stat -c%s /tmp/5in1.zip)"
          unzip -l /tmp/5in1.zip | head -80
          for f in plugin.json src/config.js src/gen0.js src/home.js; do
            echo
            echo "===== $f ====="
            unzip -p /tmp/5in1.zip "$f" | nl -ba
          done
