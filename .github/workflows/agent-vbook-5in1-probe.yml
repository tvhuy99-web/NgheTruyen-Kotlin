name: Agent vBook 5in1 probe

on:
  push:
    branches:
      - agent/fix-vbook-qidian-fetch-parity
    paths:
      - .github/workflows/agent-vbook-5in1-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Qidian response shape under vBook-like headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, http.cookiejar, urllib.error

          def open_bytes(url, opener, headers=None):
              req=urllib.request.Request(url, headers=headers or {})
              with opener.open(req, timeout=30) as r:
                  return r.status, r.geturl(), dict(r.headers.items()), r.read()

          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          ua='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/138.0.0.0 Mobile Safari/537.36'
          nav_headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          try:
              status, final_url, _, body=open_bytes('https://my.qidian.com/author/9639927/', opener, nav_headers)
              print('navigation status=',status,'final=',final_url,'bytes=',len(body))
          except Exception as e:
              print('navigation warning=', type(e).__name__, str(e)[:200])

          csrf=''
          for c in cj:
              if c.name == '_csrfToken': csrf=c.value
          print('csrf present=',bool(csrf),'cookies=',sorted({c.name for c in cj}))
          qs=urllib.parse.urlencode({'gender':'male','pageNum':'1','_csrfToken':csrf})
          endpoint='https://m.qidian.com/majax/rank/yuepiaolist?'+qs

          variants=[
              ('minimal', {'User-Agent':''}),
              ('ua', {'User-Agent':ua}),
              ('browser', {'User-Agent':ua,'Accept':'application/json, text/plain, */*','Referer':'https://m.qidian.com/'}),
          ]
          for label,headers in variants:
              print('\n===',label,'===')
              try:
                  status, final_url, response_headers, body=open_bytes(endpoint, opener, headers)
                  print('status=',status,'final=',final_url,'bytes=',len(body),'content-type=',response_headers.get('Content-Type',''))
                  text=body.decode('utf-8','replace')
                  try:
                      obj=json.loads(text)
                  except Exception as e:
                      print('json error=',type(e).__name__,'prefix=',repr(text[:300]))
                      continue
                  print('root type=',type(obj).__name__)
                  if isinstance(obj,dict):
                      print('root keys=',sorted(obj.keys()))
                      for candidate in ('code','msg','message','status','pageNum','pageSize'):
                          if candidate in obj: print(candidate,'=',repr(obj.get(candidate)))
                      data=obj.get('data')
                      print('data type=',type(data).__name__)
                      if isinstance(data,dict):
                          print('data keys=',sorted(data.keys()))
                          for candidate in ('pageNum','pageSize','total','list','records','bookList'):
                              if candidate in data:
                                  v=data.get(candidate)
                                  if isinstance(v,list): print('data.'+candidate,'= list(len=%d)'%len(v))
                                  else: print('data.'+candidate,'=',repr(v))
                      # Search shallowly for any pageNum-bearing object.
                      stack=[('$',obj,0)]
                      found=[]
                      while stack:
                          p,v,d=stack.pop()
                          if d>4: continue
                          if isinstance(v,dict):
                              if 'pageNum' in v: found.append((p,v.get('pageNum'),sorted(v.keys())[:20]))
                              for k,x in v.items(): stack.append((p+'.'+str(k),x,d+1))
                          elif isinstance(v,list):
                              for i,x in enumerate(v[:5]): stack.append((p+'[%d]'%i,x,d+1))
                      print('pageNum objects=',found[:10])
              except Exception as e:
                  print('request error=',type(e).__name__,str(e)[:300])

          # Catalog is optional: try only to discover the exact live 5in1 package; never fail the probe on 403.
          print('\n=== optional catalog ===')
          try:
              cat_opener=urllib.request.build_opener()
              status, final_url, _, raw=open_bytes('https://www.vbookext.me/api/plugin.json',cat_opener,{'User-Agent':ua,'Accept':'application/json,*/*'})
              print('catalog status=',status,'bytes=',len(raw),'final=',final_url)
              catalog=json.loads(raw)
              stack=[catalog]; matches=[]
              while stack:
                  v=stack.pop()
                  if isinstance(v,dict):
                      if str(v.get('name','')).strip().lower()=='5in1': matches.append(v)
                      stack.extend(v.values())
                  elif isinstance(v,list): stack.extend(v)
              print('5in1 matches=',len(matches))
              for item in matches[:3]: print({k:item.get(k) for k in ('name','version','author','path','source')})
          except Exception as e:
              print('catalog unavailable=',type(e).__name__,str(e)[:200])
          PY
