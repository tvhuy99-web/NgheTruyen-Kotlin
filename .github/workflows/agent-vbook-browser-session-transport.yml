name: Agent generic vBook browser session transport

on:
  push:
    branches:
      - agent/vbook-browser-session-transport
    paths:
      - .github/workflows/agent-vbook-browser-session-transport.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/vbook-browser-session-transport
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply generic browser-session transport patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_generic_vbook_patch.py
          python3 /tmp/apply_generic_vbook_patch.py
          rm -f /tmp/apply_generic_vbook_patch.py

      - name: Run focused generic replay tests
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'vn.nghetruyen.app.sourceplatform.ChromiumVBookBrowserReplayRuntimeTest' --tests 'vn.nghetruyen.app.sourceplatform.ChromiumVBookNetworkCompatibilityTest' --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify source-agnostic production patch
        shell: bash
        run: |
          ! grep -RinE 'qidian|5in1' source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookRawNetworkBroker.kt app/src/main/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookBrowserReplayRuntime.kt
          git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          rm -f .github/workflows/agent-vbook-browser-session-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookRawNetworkBroker.kt app/src/main/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookBrowserReplayRuntime.kt app/src/test/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookBrowserReplayRuntimeTest.kt app/src/test/java/vn/nghetruyen/app/sourceplatform/ChromiumVBookNetworkCompatibilityTest.kt .github/workflows/agent-vbook-browser-session-transport.yml
          git commit -m 'fix: generalize vBook browser-session network replay'
          git push origin HEAD:agent/vbook-browser-session-transport
