name: Agent XPK parity inspect

on:
  push:
    branches: [agent/settings-a11y-labels]
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect parity implementation points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SCENE MUSIC ENTITY ==='
          grep -RIn -B4 -A38 'data class SceneMusicTrackEntity' app/src/main/java || true
          echo '=== SCENE MUSIC DAO / LOUDNESS ==='
          grep -RIn -B5 -A30 'updateSceneMusicLoudness\|SceneMusicTrackDao' app/src/main/java || true
          echo '=== DATABASE VERSION / MIGRATIONS ==='
          grep -RIn -B3 -A12 '@Database\|Migration(' app/src/main/java/vn/nghetruyen/app/data || true
          echo '=== MAIN UI MUSIC FIELDS ==='
          grep -RIn -B4 -A25 'sceneMusicTargetLufs\|backgroundMusicAttackMillis' app/src/main/java/vn/nghetruyen/app/ui | head -n 220 || true
          echo '=== LIBRARY VM ACTIONS ==='
          grep -RIn -B4 -A18 'fun toggleFollowing\|fun deleteBookmark\|fun remove.*Reading\|fun openReading\|fun openFollow' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt || true
          echo '=== PLAYBACK ACTIONS ==='
          grep -n -B8 -A32 'ACTION_REFRESH\|onStartCommand' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt | head -n 300 || true
          echo '=== MUSIC OPTION MODEL ==='
          grep -RIn -B4 -A20 'data class SceneMusicTrackOption' app/src/main/java || true
