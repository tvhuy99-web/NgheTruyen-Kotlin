name: AI sound director patch

on:
  push:
    branches:
      - feat/ai-sound-director
    paths:
      - tools/ai_sound_director_patch.py
      - .github/workflows/ai-sound-director-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-sound-director
          fetch-depth: 0
      - name: Apply targeted UI patch
        run: python3 tools/ai_sound_director_patch.py
      - name: Remove temporary patch machinery
        run: rm -f tools/ai_sound_director_patch.py .github/workflows/ai-sound-director-patch.yml
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(ui): wire AI sound director switches"
          git push origin HEAD:feat/ai-sound-director
