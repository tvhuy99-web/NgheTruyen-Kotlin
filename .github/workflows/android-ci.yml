name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-phase3-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v6
        with:
          ref: agent/reference-ui-position-parity

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Specialize phase 3 repository patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_reference_parity_phase3.py')
          text = path.read_text()
          old = '''text = replace_once(text, 'rate = rate.coerceIn(0.5f, 2.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0.05f, 1.0f),',
                    'rate = rate.coerceIn(0.25f, 3.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0f, 2.0f),',
                    "story TTS profile ranges")'''
          new = '''_old_story_ranges = 'rate = rate.coerceIn(0.5f, 2.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0.05f, 1.0f),'
_new_story_ranges = 'rate = rate.coerceIn(0.25f, 3.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0f, 2.0f),'
if _old_story_ranges not in text:
    raise SystemExit("story TTS profile ranges: source block not found")
text = text.replace(_old_story_ranges, _new_story_ranges, 1)'''
          if text.count(old) != 1:
              raise SystemExit('phase3 repository replacement block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          print('PHASE3_REPOSITORY_PATCH_SPECIALIZED')
          PY

      - name: Apply phase 3 patch
        run: python3 scripts/apply_reference_parity_phase3.py

      - name: Assert XPK voice behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          personal = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReferencePersonalScreen.kt').read_text()
          story = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt').read_text()
          playback = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt').read_text()
          export = Path('app/src/main/java/vn/nghetruyen/app/audio/AudioExportWorker.kt').read_text()
          repo = Path('app/src/main/java/vn/nghetruyen/app/data/repository/LibraryRepository.kt').read_text()
          for token in [
              'CÀI ĐẶT ỨNG DỤNG','HỒ SƠ GIỌNG TTS','Android, tối đa 100%',
              'Sonic, tối đa 200%','Chế độ Sonic','LƯU HỒ SƠ','XÓA HỒ SƠ',
              'KHÔI PHỤC HỒ SƠ MẪU','Tải và cài bộ dữ liệu VietPhrase từ mạng?',
          ]: assert token in personal, token
          for token in [
              'HỒ SƠ GIỌNG RIÊNG','SAO CHÉP CẤU HÌNH CHUNG',
              'Android, tối đa 100%','Sonic, tối đa 200%','Chế độ Sonic',
          ]: assert token in story, token
          assert 'rate.coerceIn(0.25f, 3.0f)' in repo
          assert 'volume.coerceIn(0f, 2.0f)' in repo
          assert 'ReferenceVoiceRoleExtras.load(this@ReaderPlaybackService, id)' in playback
          assert 'EXTRA_PREVIEW_SONIC_ENABLED' in playback
          assert 'EXTRA_PREVIEW_SONIC_ACCURATE' in playback
          assert 'ReferenceVoiceRoleExtras.load(applicationContext, it.id)' in export
          print('REFERENCE_PHASE3_ASSERTIONS_OK')
          PY

      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Milestone 0 gate
        run: ./scripts/m0_gate.sh

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/**
            app/schemas/**
            build/reports/m0/**

  migration-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room migration tests on API 33
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-instrumentation-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
