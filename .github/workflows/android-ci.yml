name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-coordinator-alignment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: agent/xpk-six-parity-fixes
          fetch-depth: 0

      - name: Apply correction and restore workflow
        shell: bash
        run: |
          python3 scripts/patch_manual_auto_coordinator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_manual_auto_coordinator.py
          git checkout origin/main -- .github/workflows/android-ci.yml
          git add app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt .github/workflows/android-ci.yml
          git commit -m "fix: keep manual voice-cast aligned with auto coordinator"
          git push origin HEAD:agent/xpk-six-parity-fixes
