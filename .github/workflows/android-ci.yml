name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_DEBUG_CERT_SHA256: 534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile app and instrumentation APKs
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee xpk-verify-compile.log
      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xpk-verify-compile-log-${{ github.run_number }}
          path: xpk-verify-compile.log
          if-no-files-found: warn
      - name: Verify stable debug APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -f "${APK}"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          ACTUAL_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_DEBUG_CERT_SHA256}"
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-xpk-verified-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/*.apk
