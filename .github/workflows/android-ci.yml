name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_DEBUG_CERT_SHA256: 534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/compact-ui-parity
          fetch-depth: 0

      - name: Sync compact UI markers
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/compact-ui-parity' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "NHẬP FILE ZIP": "NHẬP ZIP",
              "XUẤT TỪ ĐIỂN ZIP": "XUẤT ZIP",
              "TẢI TỰ ĐỘNG TỪ MẠNG": "TẢI TỪ MẠNG",
              "Dùng Hán Việt khi không tìm thấy cụm": "Hán Việt khi thiếu cụm",
              "AI CẢI THIỆN VIETPHRASE": "CẢI THIỆN VIETPHRASE",
              "AI PHÂN VAI + NHẠC CẢNH": "PHÂN VAI + NHẠC",
              "Lời nhắc riêng khi dịch": "Lời nhắc dịch",
              "Lời nhắc riêng khi cải thiện VietPhrase": "Lời nhắc VietPhrase",
              "Tự động dịch khi mở chương": "Tự động dịch",
              "Tự động phân vai rồi đọc khi mở chương ở chế độ TTS": "Tự động phân vai",
              "AI tự điều chỉnh tốc độ, cao độ và âm lượng": "AI điều chỉnh giọng",
              "TAI NGHE, SONIC & TỰ ĐỘNG": "TAI NGHE & TỰ ĐỘNG",
              "GỢI Ý AI CHỜ DUYỆT": "GỢI Ý AI",
              "BẢN KHÔI PHỤC": "KHÔI PHỤC",
              "THÊM VAI HOẶC NHÂN VẬT": "THÊM VAI",
          }
          changed = []
          for path in Path("scripts").glob("*.py"):
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("\n".join(changed) if changed else "No stale markers found")
          PY
          if git diff --quiet -- scripts; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "test: sync release gates with compact UI labels"
          git push origin HEAD:agent/compact-ui-parity
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Run Milestone 0 gate
        run: bash scripts/m0_gate.sh

      - name: Verify stable debug APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -f "${APK}"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          ACTUAL_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          echo "Expected certificate: ${EXPECTED_DEBUG_CERT_SHA256}"
          echo "Actual certificate:   ${ACTUAL_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_DEBUG_CERT_SHA256}"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/**
            app/schemas/**
            build/reports/m0/**

  migration-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Room migration tests on API 33
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-instrumentation-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
