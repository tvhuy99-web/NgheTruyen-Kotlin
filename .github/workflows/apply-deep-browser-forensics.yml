name: Apply deep browser forensics

on:
  push:
    branches:
      - agent/three-mode-lua-diagnostics
    paths:
      - .github/workflows/apply-deep-browser-forensics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/three-mode-lua-diagnostics
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply forensic wiring
        run: python3 scripts/apply_deep_browser_forensics_patch.py
      - name: Verify deep diagnostics
        run: |
          python3 scripts/check_lua_deep_diagnostics_parity.py
          python3 scripts/check_lua_diagnostics_ui_parity.py
          ./gradlew --no-daemon --stacktrace :source-diagnostics:test :app:compileDebugKotlin
      - name: Commit and clean helpers
        shell: bash
        run: |
          rm -f scripts/apply_deep_browser_forensics_patch.py
          rm -f .github/workflows/apply-deep-browser-forensics.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Lua browser forensic diagnostics"
          git push origin HEAD:agent/three-mode-lua-diagnostics
