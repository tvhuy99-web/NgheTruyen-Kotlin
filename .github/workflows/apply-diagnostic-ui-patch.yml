name: Apply diagnostic UI patch

on:
  push:
    branches:
      - agent/three-mode-lua-diagnostics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/three-mode-lua-diagnostics
          fetch-depth: 0
      - name: Apply focused diagnostics patch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt
          python3 .github/patch_diagnostics.py
          git diff --check
      - name: Verify diagnostics build
        run: |
          python3 scripts/check_lua_diagnostics_ui_parity.py
          ./gradlew :source-diagnostics:test :app:compileDebugKotlin --stacktrace
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Finish three-mode Lua-style diagnostics"
          git push origin HEAD:agent/three-mode-lua-diagnostics
