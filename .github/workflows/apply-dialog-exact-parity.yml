name: Apply exact dialog parity

on:
  push:
    branches:
      - agent/settings-a11y-labels
    paths:
      - .github/workflows/apply-dialog-exact-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact dialog structure
        run: python3 scripts/apply_dialog_exact_parity.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'LƯU HỒ SƠ' app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          grep -q 'Tự động dịch khi mở chương' app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt
          grep -q 'Bật mặc định cho truyện dùng cấu hình chung' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          ! grep -q 'label = { Text("Bí danh") }' app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt
          git commit -m 'ui: match reference dialog structure'
          git push origin HEAD:agent/settings-a11y-labels
