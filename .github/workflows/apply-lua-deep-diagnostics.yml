name: Apply Lua deep diagnostics parity

on:
  push:
    branches:
      - agent/three-mode-lua-diagnostics
    paths:
      - .github/workflows/apply-lua-deep-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/three-mode-lua-diagnostics
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Recover and apply deep diagnostic patch
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          old = subprocess.check_output(
              ["git", "show", "01f2a7fc4fedb7a1dad9b968d0ffad6c78f55788:.github/workflows/apply-lua-deep-diagnostics.yml"],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          raw_lines = old[start:end].splitlines()

          output = []
          in_raw_string = False
          for line in raw_lines:
              current = line
              if not in_raw_string and current.startswith("          "):
                  current = current[10:]
              output.append(current)
              triple_count = current.count("'''")
              if triple_count % 2 == 1:
                  in_raw_string = not in_raw_string

          patch = Path("/tmp/apply_lua_deep_diagnostics_patch.py")
          patch.write_text("\n".join(output) + "\n", encoding="utf-8")
          subprocess.run(["python3", str(patch)], check=True)

          test_path = Path("source-diagnostics/src/test/kotlin/vn/nghetruyen/source/diagnostics/DiagnosticRetentionStatsTest.kt")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "import kotlin.test.Test\nimport kotlin.test.assertEquals\n",
              "import org.junit.Assert.assertEquals\nimport org.junit.Test\n",
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Verify focused diagnostics
        run: |
          python3 scripts/check_lua_diagnostics_ui_parity.py
          ./gradlew --no-daemon --stacktrace :source-diagnostics:test :app:compileDebugKotlin
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-lua-deep-diagnostics.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Port Lua deep black-box diagnostics"
          git push origin HEAD:agent/three-mode-lua-diagnostics
