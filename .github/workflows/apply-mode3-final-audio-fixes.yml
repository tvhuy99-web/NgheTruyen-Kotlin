name: Apply Mode3 Final Audio Fixes

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0
      - name: Apply final patch
        run: python3 scripts/patch_mode3_clean_metadata_final.py
      - name: Verify requested behavior
        run: |
          ! grep -q 'draft.size < 500' app/src/main/java/vn/nghetruyen/app/ui/components/UnifiedAudioAssetManagerDialog.kt
          ! grep -q 'draft.size > 500' app/src/main/java/vn/nghetruyen/app/ui/components/UnifiedAudioAssetManagerDialog.kt
          ! grep -q 'take(500)' app/src/main/java/vn/nghetruyen/app/ui/components/UnifiedAudioAssetManagerDialog.kt
          grep -q 'COMPLETED_CYCLE_REUSE resolved=' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -q 'assertEquals("type:sfx, Close thunder", provenance)' app/src/test/java/vn/nghetruyen/app/freesound/FreesoundImporterTest.kt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt').read_text()
          body = text.split('internal fun tagsForImport(',1)[1].split('/** Returns a completed local Freesound id.',1)[0]
          for bad in ['pieces += "freesound_id:', 'pieces += "freesound_user:', 'pieces += "freesound_license:', 'pieces += "freesound_url:']:
              assert bad not in body, bad
          PY
      - name: Commit patch and remove helper files
        run: |
          rm -f scripts/patch_mode3_clean_metadata_final.py .github/workflows/apply-mode3-final-audio-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mode3): clean metadata and short-circuit completed cycles'
          git push origin HEAD:fix/mode3-resolution-quality-20260822
