name: Apply Reference Parity v4.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-reference-parity-v41.yml"

permissions:
  contents: write

jobs:
  apply-v41:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final reference parity polish
        run: python3 scripts/finalize_reference_parity_v41.py

      - name: Persist source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-reference-parity-v41.yml
          git add app/src/main/java/vn/nghetruyen/app/data/settings/SettingsRepository.kt
          git add app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          git add app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
          git add -A .github/workflows/apply-reference-parity-v41.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ui: finalize reference parity v4.1"
          git pull --rebase origin main
          git push origin HEAD:main
