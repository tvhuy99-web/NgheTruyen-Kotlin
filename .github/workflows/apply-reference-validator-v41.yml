name: Apply Reference Validator v4.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-reference-validator-v41.yml"

permissions:
  contents: write

jobs:
  apply-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validator parity update
        run: python3 scripts/finalize_reference_validator_v41.py

      - name: Persist validator update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-reference-validator-v41.yml
          git add scripts/validate_release.py
          git add -A .github/workflows/apply-reference-validator-v41.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: align validator with reference parity v4.1"
          git pull --rebase origin main
          git push origin HEAD:main
