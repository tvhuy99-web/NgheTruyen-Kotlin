name: Apply Reference Workflow Shared Audio Fix

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0
      - name: Update stale reference workflow markers
        run: |
          python3 scripts/patch_reference_workflow_shared_audio.py
          python3 scripts/check_reference_workflow_parity.py
      - name: Commit and clean helper files
        run: |
          rm -f scripts/patch_reference_workflow_shared_audio.py .github/workflows/apply-reference-workflow-shared-audio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): align reference workflow with shared audio library'
          git push origin HEAD:fix/mode3-resolution-quality-20260822
