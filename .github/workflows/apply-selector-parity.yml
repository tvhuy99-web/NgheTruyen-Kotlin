name: Apply selector parity

on:
  push:
    branches:
      - agent/settings-a11y-labels
    paths:
      - .github/workflows/apply-selector-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply selector structure
        run: python3 scripts/apply_selector_parity.py
      - name: Verify generated UI
        shell: bash
        run: |
          git diff --check
          grep -q 'processingExpanded' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
          grep -q 'sonicQualityExpanded' app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          grep -q 'selectedEngineLabel' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -q 'Chế độ phát khi không dùng nhạc theo cảnh' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          git commit -m 'ui: match reference selector structure'
          git push origin HEAD:agent/settings-a11y-labels
