name: Apply Shared Audio Parity Fix

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0
      - name: Update parity gate for shared library UI
        run: |
          python3 scripts/patch_ui_parity_shared_audio.py
          python3 scripts/check_ui_control_parity.py
      - name: Commit and clean helper files
        run: |
          rm -f scripts/patch_ui_parity_shared_audio.py .github/workflows/apply-shared-audio-parity-fix.yml .github/workflows/mode3-final-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): align audio parity gate with shared library UI'
          git push origin HEAD:fix/mode3-resolution-quality-20260822
