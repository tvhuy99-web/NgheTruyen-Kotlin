name: Apply UI consistency patch

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/global-voice-role-editor]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-voice-role-editor
          fetch-depth: 0
      - name: Patch Reader and Voice Cast UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          reader_path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          reader = reader_path.read_text()
          reader = replace_once(
              reader,
              '    var musicMode by remember { mutableStateOf(if (state.sceneMusicPlaybackMode == SceneMusicPlaybackMode.SHUFFLE) SceneMusicPlaybackMode.SHUFFLE else SceneMusicPlaybackMode.SEQUENTIAL) }\n    var musicTargetLufs by remember { mutableStateOf(state.sceneMusicTargetLufs.coerceIn(-36f, -18f)) }',
              '    var musicMode by remember { mutableStateOf(state.sceneMusicPlaybackMode) }\n    var musicTargetLufs by remember { mutableStateOf(state.sceneMusicTargetLufs.coerceIn(-36f, -18f)) }\n    var musicCrossfadeMs by remember { mutableIntStateOf(state.sceneMusicCrossfadeMillis) }\n    var musicContinueAcrossChapters by remember { mutableStateOf(state.sceneMusicContinueAcrossChapters) }\n    var musicAvoidRepeatWindow by remember { mutableIntStateOf(state.sceneMusicAvoidRepeatWindow) }',
              'reader music state',
          )
          reader = replace_once(
              reader,
              '            musicMode = if (settings.sceneMusicPlaybackMode == SceneMusicPlaybackMode.SHUFFLE) SceneMusicPlaybackMode.SHUFFLE else SceneMusicPlaybackMode.SEQUENTIAL\n            musicTargetLufs = settings.sceneMusicTargetLufs.coerceIn(-36f, -18f)',
              '            musicMode = settings.sceneMusicPlaybackMode\n            musicTargetLufs = settings.sceneMusicTargetLufs.coerceIn(-36f, -18f)\n            musicCrossfadeMs = settings.sceneMusicCrossfadeMillis\n            musicContinueAcrossChapters = settings.sceneMusicContinueAcrossChapters\n            musicAvoidRepeatWindow = settings.sceneMusicAvoidRepeatWindow',
              'reader music reload',
          )
          reader = replace_once(
              reader,
              '''                Row(Modifier.fillMaxWidth()) {
                    TextButton({ musicMode = SceneMusicPlaybackMode.SEQUENTIAL }, Modifier.weight(1f)) { Text((if (musicMode == SceneMusicPlaybackMode.SEQUENTIAL) "✓ " else "") + "PHÁT LẦN LƯỢT") }
                    TextButton({ musicMode = SceneMusicPlaybackMode.SHUFFLE }, Modifier.weight(1f)) { Text((if (musicMode == SceneMusicPlaybackMode.SHUFFLE) "✓ " else "") + "PHÁT NGẪU NHIÊN") }
                }
                Text("CÂN BẰNG ÂM THANH", fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 12.dp))''',
              '''                Row(Modifier.fillMaxWidth()) {
                    TextButton({ musicMode = SceneMusicPlaybackMode.SEQUENTIAL }, Modifier.weight(1f)) { Text((if (musicMode == SceneMusicPlaybackMode.SEQUENTIAL) "✓ " else "") + "LẦN LƯỢT") }
                    TextButton({ musicMode = SceneMusicPlaybackMode.SHUFFLE }, Modifier.weight(1f)) { Text((if (musicMode == SceneMusicPlaybackMode.SHUFFLE) "✓ " else "") + "NGẪU NHIÊN") }
                    TextButton({ musicMode = SceneMusicPlaybackMode.SMART_AVOID_REPEAT }, Modifier.weight(1f)) { Text((if (musicMode == SceneMusicPlaybackMode.SMART_AVOID_REPEAT) "✓ " else "") + "TRÁNH LẶP") }
                }
                if (musicMode == SceneMusicPlaybackMode.SMART_AVOID_REPEAT) {
                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        Text("Tránh lặp $musicAvoidRepeatWindow bài", Modifier.weight(1f))
                        TextButton({ musicAvoidRepeatWindow = (musicAvoidRepeatWindow - 1).coerceAtLeast(0) }) { Text("−") }
                        TextButton({ musicAvoidRepeatWindow = (musicAvoidRepeatWindow + 1).coerceAtMost(20) }) { Text("+") }
                    }
                }
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    Text("Giữ nhạc qua chương", Modifier.weight(1f))
                    Switch(musicContinueAcrossChapters, { musicContinueAcrossChapters = it })
                }
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                    Text("Crossfade $musicCrossfadeMs ms", Modifier.weight(1f))
                    TextButton({ musicCrossfadeMs = (musicCrossfadeMs - 400).coerceAtLeast(0) }) { Text("−") }
                    TextButton({ musicCrossfadeMs = (musicCrossfadeMs + 400).coerceAtMost(8_000) }) { Text("+") }
                }
                Text("CÂN BẰNG ÂM THANH", fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 12.dp))''',
              'reader scene mode controls',
          )
          reader = replace_once(
              reader,
              '                    settings.setSceneMusicPlaybackMode(musicMode)\n                    settings.setSceneMusicTargetLufs(musicTargetLufs)',
              '                    settings.setSceneMusicPlaybackMode(musicMode)\n                    settings.setSceneMusicCrossfadeMillis(musicCrossfadeMs)\n                    settings.setSceneMusicContinueAcrossChapters(musicContinueAcrossChapters)\n                    settings.setSceneMusicAvoidRepeatWindow(musicAvoidRepeatWindow)\n                    settings.setSceneMusicTargetLufs(musicTargetLufs)',
              'reader scene mode save',
          )
          reader_path.write_text(reader)

          story_path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt')
          story = story_path.read_text()
          story = replace_once(
              story,
              'import vn.nghetruyen.app.ui.components.LoadingRow\n',
              'import vn.nghetruyen.app.ui.components.GlobalVoiceRoleEditorDialog\nimport vn.nghetruyen.app.ui.components.LoadingRow\n',
              'story editor import',
          )
          story = replace_once(
              story,
              '                            text = role.roleName + role.description.takeIf(String::isNotBlank)?.let { "\\n$it" }.orEmpty(),',
              '                            text = role.roleName + "\\n" + (role.enginePackage ?: "Hệ thống") + " • " + (role.voiceName ?: "Mặc định"),',
              'private role visible voice',
          )
          story = story.replace('                                onLoadRoleVoices(role.enginePackage)\n', '', 1)
          story = replace_once(
              story,
              '                    ReferenceActionButton("THÊM VAI HOẶC NHÂN VẬT", { roleDraft = defaultRoleDraft(); showVoiceRoleDialog = true; onLoadRoleVoices(roleDraft.enginePackage) }, modifier = Modifier.fillMaxWidth().padding(top = 6.dp))',
              '                    ReferenceActionButton("THÊM VAI HOẶC NHÂN VẬT", { roleDraft = defaultRoleDraft(); showVoiceRoleDialog = true }, modifier = Modifier.fillMaxWidth().padding(top = 6.dp))',
              'private role add',
          )
          story = story.replace('                    Text("Đây là bộ hồ sơ độc lập của truyện hiện tại. Bạn có thể tự đặt tên nhân vật, tên gọi khác và mô tả nhận diện. Thay đổi ở đây không ảnh hưởng cấu hình chung hoặc truyện khác.", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(vertical = 6.dp))\n', '', 1)
          new_private_editor = '''
    if (showVoiceRoleDialog) {
        GlobalVoiceRoleEditorDialog(
            draft = roleDraft,
            engines = state.ttsEngines,
            title = "HỒ SƠ GIỌNG RIÊNG",
            onDraftChange = { roleDraft = it },
            onPreview = onPreviewVoiceRole,
            onSave = { saved ->
                onSaveVoiceRole(
                    if (saved.isNarrator) saved.copy(roleName = "Người kể chuyện", enabled = true) else saved,
                )
                showVoiceRoleDialog = false
            },
            onDelete = if (!roleDraft.isNarrator && roleDraft.originalRoleId != null) {
                {
                    deletePrivateRole = privateRoles.firstOrNull { it.id == roleDraft.originalRoleId }
                    showVoiceRoleDialog = false
                }
            } else null,
            onDismiss = { showVoiceRoleDialog = false },
        )
    }
'''
          story, count = re.subn(
              r'\n    if \(showVoiceRoleDialog\) \{.*?\n    \}\n\n    if \(copyGlobalConfirm\) \{',
              new_private_editor + '\n    if (copyGlobalConfirm) {',
              story,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('missing patch anchor: private editor block')
          story_path.write_text(story)

          personal_path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt')
          personal = personal_path.read_text()
          personal = replace_once(
              personal,
              '                        Row(Modifier.fillMaxWidth()) {\n                            Button(onClick = {',
              '                        Text((role.enginePackage ?: "Hệ thống") + " • " + (role.voiceName ?: "Mặc định"), style = MaterialTheme.typography.bodySmall)\n                        Row(Modifier.fillMaxWidth()) {\n                            Button(onClick = {',
              'global role visible voice',
          )
          personal, count = re.subn(
              r'\n\s+if \(!role\.isNarrator\) \{\n\s+Button\(onClick = \{ onDeleteGlobalVoiceRole\(role\.id\) \}, modifier = Modifier\.weight\(1f\)\.padding\(2\.dp\)\) \{ Text\("XÓA"\) \}\n\s+\}',
              '',
              personal,
              count=1,
          )
          if count != 1:
              raise SystemExit('missing patch anchor: global list delete')
          personal = replace_once(
              personal,
              '            onSave = {\n                onSaveGlobalVoiceRole(it)\n                editDraft = null\n            },\n            onDismiss = { editDraft = null },',
              '            onSave = {\n                onSaveGlobalVoiceRole(it)\n                editDraft = null\n            },\n            onDelete = if (!draft.isNarrator && draft.originalRoleId != null) {\n                { onDeleteGlobalVoiceRole(draft.originalRoleId); editDraft = null }\n            } else null,\n            onDismiss = { editDraft = null },',
              'global editor delete',
          )
          personal_path.write_text(personal)
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-ui-consistency.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt \
                  .github/workflows/apply-ui-consistency.yml
          git commit -m "feat: align scene music and voice role UI"
          git push origin HEAD:fix/global-voice-role-editor
