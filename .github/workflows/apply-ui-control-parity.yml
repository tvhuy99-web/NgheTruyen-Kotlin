name: Apply UI control parity

on:
  push:
    branches:
      - agent/settings-a11y-labels
    paths:
      - .github/workflows/apply-ui-control-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reference control parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_ui_control_parity.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('(raw - minimum) / safeStep', '(raw - minimum.toFloat()) / safeStep.toFloat()')
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/apply_ui_control_parity.py

      - name: Verify slider policy
        shell: bash
        run: |
          git diff --check
          grep -q 'ReferenceFloatSettingsSlider' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -q 'ReaderIntSlider("Cỡ chữ"' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt
          grep -q 'steps = 99' app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt
          ! grep -q 'Text("CHẬM")' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          ! grep -q 'Text("NHANH")' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          ! grep -q 'ValueStepper(' app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          git commit -m 'ui: match reference slider controls'
          git push origin HEAD:agent/settings-a11y-labels
