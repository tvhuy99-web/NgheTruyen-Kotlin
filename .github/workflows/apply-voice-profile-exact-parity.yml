name: Apply exact voice profile parity

on:
  push:
    branches:
      - agent/settings-a11y-labels
    paths:
      - .github/workflows/apply-voice-profile-exact-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact profile structure
        run: python3 scripts/apply_voice_profile_exact_parity.py
      - name: Verify profile structure
        run: |
          git diff --check
          ! grep -q 'CompactVoiceValueRow("Tốc độ Sonic"' app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          ! grep -q 'CompactVoiceValueRow("Cao độ Sonic"' app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          git commit -m 'ui: remove non-reference Sonic profile sliders'
          git push origin HEAD:agent/settings-a11y-labels
