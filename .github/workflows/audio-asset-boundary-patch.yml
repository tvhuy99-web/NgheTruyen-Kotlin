name: Audio asset boundary patch

on:
  push:
    branches:
      - feat/ai-sound-director
    paths:
      - tools/audio_asset_boundary_patch.py
      - .github/workflows/audio-asset-boundary-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-sound-director
          fetch-depth: 0
      - name: Apply targeted asset-boundary patch
        run: python3 tools/audio_asset_boundary_patch.py
      - name: Remove temporary patch machinery
        run: rm -f tools/audio_asset_boundary_patch.py .github/workflows/audio-asset-boundary-patch.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(audio): isolate music ambience and sfx assets"
          git push origin HEAD:feat/ai-sound-director
