name: Audit Freesound merge readiness

on:
  push:
    branches:
      - agent/freesound-stage-1
    paths:
      - ".github/workflows/audit-freesound-merge-readiness-20260821.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-freesound-merge-readiness
  cancel-in-progress: true

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_DEBUG_CERT_SHA256: 534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/freesound-stage-1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Run canonical Milestone 0 gate
        run: bash scripts/m0_gate.sh

      - name: Run all JVM tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify stable debug APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -f "${APK}"
          test -x "${APKSIGNER}"
          ACTUAL_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          echo "Expected certificate: ${EXPECTED_DEBUG_CERT_SHA256}"
          echo "Actual certificate:   ${ACTUAL_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_DEBUG_CERT_SHA256}"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freesound-merge-readiness-static-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/**
            build/reports/m0/**
            app/build/outputs/apk/debug/*.apk

  instrumentation:
    needs: static-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/freesound-stage-1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests on API 33
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freesound-merge-readiness-instrumentation-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
