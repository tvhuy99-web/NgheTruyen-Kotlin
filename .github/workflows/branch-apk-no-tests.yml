name: Branch APK build no tests

on:
  push:
    branches:
      - agent/unified-audio-library-modes
    paths:
      - ".github/workflows/branch-apk-no-tests.yml"

permissions:
  contents: read

concurrency:
  group: branch-apk-no-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Build debug APK only
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-mode3-localdiag.apk
          sha256sum dist/NgheTruyen-mode3-localdiag.apk > dist/NgheTruyen-mode3-localdiag.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-mode3-localdiag-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/NgheTruyen-mode3-localdiag.apk
            dist/NgheTruyen-mode3-localdiag.apk.sha256

# build trigger after CI suppression
