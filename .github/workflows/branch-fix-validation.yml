name: Branch Fix Validation

on:
  push:
    branches:
      - fix/freesound-latency-status-cloudflare
    paths:
      - scripts/apply_mode3_runtime_fixes.py
      - scripts/fix_mode3_test_framework.py
      - .github/workflows/branch-fix-validation.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_mode3_runtime_fixes.py
      - scripts/fix_mode3_test_framework.py
      - .github/workflows/branch-fix-validation.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply fixes
        run: |
          python3 scripts/apply_mode3_runtime_fixes.py
          python3 scripts/fix_mode3_test_framework.py

      - name: Validate focused tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :source-vbook:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Show changed files
        run: git status --short

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply_mode3_runtime_fixes.py
          rm -f scripts/fix_mode3_test_framework.py
          rm -f .github/workflows/branch-fix-validation.yml

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/main/java/vn/nghetruyen/app/playback/FreesoundPlaybackStatusFormatter.kt \
            app/src/main/java/vn/nghetruyen/app/playback/NarrationAutomationStatusFormatter.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt \
            app/src/test/java/vn/nghetruyen/app/playback/FreesoundPlaybackStatusFormatterTest.kt \
            app/src/test/java/vn/nghetruyen/app/playback/NarrationAutomationStatusFormatterTest.kt \
            source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt \
            source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookBrowserChallengeDetectorTest.kt \
            scripts/apply_mode3_runtime_fixes.py \
            scripts/fix_mode3_test_framework.py \
            .github/workflows/branch-fix-validation.yml
          git commit -m "fix: stabilize Mode 3 preparation and status [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-mode3-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
