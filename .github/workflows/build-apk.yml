name: Build APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-reader-music-ui:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ai-sound-director'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-sound-director
          fetch-depth: 2

      - name: Nest AI audio controls under Background Music
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reader_path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          reader = reader_path.read_text(encoding='utf-8')

          outside = '''                ReaderMenuButton("NHẠC NỀN") { showReaderOptions = false; showMusicDialog = true }
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(
                    modifier = Modifier.fillMaxWidth(),
                )
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
'''
          if reader.count(outside) != 1:
              raise SystemExit(f'Expected one outer AI-audio block, found {reader.count(outside)}')
          reader = reader.replace(
              outside,
              '''                ReaderMenuButton("NHẠC NỀN") { showReaderOptions = false; showMusicDialog = true }
''',
              1,
          )

          anchor = '''            title = { Text("NHẠC NỀN") },
            text = { Column(Modifier.heightIn(max = 620.dp).verticalScroll(rememberScrollState())) {
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
'''
          nested = '''            title = { Text("NHẠC NỀN") },
            text = { Column(Modifier.heightIn(max = 620.dp).verticalScroll(rememberScrollState())) {
                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(
                    modifier = Modifier.fillMaxWidth(),
                )
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
'''
          if reader.count(anchor) != 1:
              raise SystemExit(f'Expected one Background Music dialog anchor, found {reader.count(anchor)}')
          reader = reader.replace(anchor, nested, 1)
          reader_path.write_text(reader, encoding='utf-8')

          check_path = Path('scripts/check_audio_direction_ui_wiring.py')
          check = check_path.read_text(encoding='utf-8')
          check = check.replace(
              '# Personal > Music must remain the legacy/manual music surface. The AI controls belong to Reader options.',
              '# Personal > Music remains the legacy/manual surface. AI audio controls live inside Reader > Background Music.',
          )
          check = check.replace(
              '# Reader > TÙY CHỌN > TÙY CHỌN ĐỌC is the single control surface requested by the product flow.',
              '# Reader options keep a single Background Music entry; AI audio controls are nested inside that dialog.',
          )
          check = check.replace(
              'assert "AudioDirectionLayerSwitches(" in reader_options, "AI sound controls must render directly inside reader options"',
              'assert "AudioDirectionLayerSwitches(" not in reader_options, "AI sound controls must not spill into reader options"',
          )
          old_music_checks = '''assert "Trao toàn quyền giữ và đổi nhạc cho AI" not in music_dialog, "Music AI switch must not be duplicated in the manual music dialog"
assert "setAutoSceneMusicEnabled" not in music_dialog, "manual music dialog must not mutate the Music AI switch"
'''
          new_music_checks = '''assert "AudioDirectionLayerSwitches(" in music_dialog, "AI sound controls must render inside Background Music"
assert music_dialog.find("AudioDirectionLayerSwitches(") < music_dialog.find("Bật nhạc nền khi đọc bằng TTS"), "AI audio block should be grouped at the top of Background Music"
'''
          if old_music_checks not in check:
              raise SystemExit('Could not locate old music-dialog wiring assertions')
          check = check.replace(old_music_checks, new_music_checks, 1)
          check = check.replace(
              'assert "Nghe Truyện • AI Sound Director" in debug_strings, "debug APK must be visibly distinguishable from the normal app"',
              'assert "<string name=\\\"app_name\\\">Nghe Truyện</string>" in debug_strings, "debug APK must keep the product name Nghe Truyện"\nassert "AI Sound Director" not in debug_strings, "feature labels must not be appended to the app name"',
          )
          check_path.write_text(check, encoding='utf-8')
          PY

      - name: Restore workflow and commit product fix
        shell: bash
        run: |
          git show HEAD^:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt scripts/check_audio_direction_ui_wiring.py .github/workflows/build-apk.yml
          git commit -m "fix: nest AI audio controls inside background music"
          git push origin HEAD:feat/ai-sound-director

  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Run targeted vBook routing tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          :source-vbook:test
          --tests vn.nghetruyen.source.vbook.PrimaryFallbackVBookActionRuntimeTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify exact default Lua assets in APK
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          expected = {
              "assets/source-lua/nguon_sangtacviet_native.lua.gz": "f51d7eeed874eb93220fda0750670d9bf72dcdcd6648440f43f41315d83b0577",
              "assets/source-lua/nguon_truyencom_native.lua.gz": "1052cddf2059b973f04a7a2e02d0ddea06d0f4e0ef49210a359fc4651102d58f",
              "assets/source-lua/nguon_truyencv_native.lua.gz": "5bcb34b1c6e87ab0c63f430e34b3b14e41eb2903cff99f1a8310e650b1a83d8b",
              "assets/source-lua/nguon_truyenfull_native.lua.gz": "77d4a70859592c391763ed883048d219bb973931aef4131c0ae4e5a10b8d3c68",
              "assets/source-lua/nguon_truyenyy_native.lua.gz": "2f9b40b0c7fa2274ef57e1994b314472b937be5dd13bb9287bdbfd7557f7bffc",
              "assets/source-lua/nguon_wattpad_vbook.lua.gz": "bd678f1a7245dbf979d24f0423920bb3c4f00654ae89b4beca03164ec4d79b0b",
              "assets/source-lua/nguon_wikidich_native.lua.gz": "d49c62c4cd14f2111e43b53491e8d5623a7f2eaf6821233bc1aa7d0950501ecc",
          }

          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for path, expected_sha in expected.items():
                  if path not in names:
                      raise SystemExit(f"Missing runtime Lua asset: {path}")
                  try:
                      raw = gzip.decompress(archive.read(path))
                  except Exception as error:
                      raise SystemExit(f"Runtime Lua asset is not gzip: {path}: {error}") from error
                  actual_sha = hashlib.sha256(raw).hexdigest()
                  if actual_sha != expected_sha:
                      raise SystemExit(
                          f"Runtime Lua SHA mismatch: {path}: expected {expected_sha}, got {actual_sha}"
                      )
                  print(f"OK {path} {actual_sha}")
          PY

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-debug.apk
          sha256sum dist/NgheTruyen-debug.apk | tee dist/NgheTruyen-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-debug.apk
            dist/NgheTruyen-debug.apk.sha256
