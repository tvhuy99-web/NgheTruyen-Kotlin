name: Build APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-parity-five-milestones
          fetch-depth: 0

      - name: Commit nullable XPK voice-plan source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'xpkVoiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {',
                  'xpkVoiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {',
              ),
              (
                  'voiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {',
                  'voiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {',
              ),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'neither old nor new condition found: {old}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt; then
            echo "Playback source is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          git commit -m "fix: guard nullable XPK voice transform"
          git push origin HEAD:agent/xpk-parity-five-milestones

      - name: Temporary patch workflow completed
        run: echo "Playback source fix is present on the locked branch."
