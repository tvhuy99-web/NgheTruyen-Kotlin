name: Build APK

on:
  pull_request:
    branches:
      - main
      - agent/apk-build-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh scripts/m0_gate.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Run release gate
        run: bash scripts/m0_gate.sh

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-debug.apk
          sha256sum dist/NgheTruyen-debug.apk | tee dist/NgheTruyen-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-debug.apk
            dist/NgheTruyen-debug.apk.sha256

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-gate-evidence
          if-no-files-found: warn
          retention-days: 30
          path: build/reports/m0
