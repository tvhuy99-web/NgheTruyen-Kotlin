name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Validate source
        run: python3 scripts/validate_release.py

      - name: Build installable debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Record checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: NgheTruyen-v2.8.0-debug-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Record successful build
        shell: bash
        run: |
          {
            echo "STATUS=success"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "ARTIFACT_ID=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=NgheTruyen-v2.8.0-debug-apk"
            cat app-debug.apk.sha256
          } > BUILD_APK_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_APK_RESULT.txt
          git commit -m "build: record APK artifact"
          git push origin HEAD:main
