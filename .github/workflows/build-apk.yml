name: Build APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-parity-five-milestones
          fetch-depth: 0

      - name: Commit nullable XPK voice-plan fix and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        xpkVoiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {
              runCatching {
                  XpkPlaybackRuntime.parseVoiceAssignments(voicePlan.transformedText, validRuntimeUnitIds)
              }.getOrDefault(emptyMap())
          } else emptyMap()
          voiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {
              container.libraryRepository.listVoiceAssignments(chapterId).associateBy { it.paragraphIndex }
          } else emptyMap()
          '''
          new = '''        xpkVoiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {
              runCatching {
                  XpkPlaybackRuntime.parseVoiceAssignments(voicePlan.transformedText, validRuntimeUnitIds)
              }.getOrDefault(emptyMap())
          } else emptyMap()
          voiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {
              container.libraryRepository.listVoiceAssignments(chapterId).associateBy { it.paragraphIndex }
          } else emptyMap()
          '''
          if old not in text:
              raise SystemExit('expected nullable voice-plan block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/build-apk.yml
          git rm -f .github/workflows/one-time-fix-nullable.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt .github/workflows/build-apk.yml
          git commit -m "fix: guard nullable XPK voice transform"
          git push origin HEAD:agent/xpk-parity-five-milestones

      - name: Stop temporary run after patch push
        run: echo "Source fix pushed; the synchronized PR run will perform the authoritative build."
