name: Build APK
# Reference parity v4.1 final clean-build trigger.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build start
        shell: bash
        run: |
          {
            echo "STATUS=running"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "ARTIFACT_ID="
            echo "ARTIFACT_NAME=NgheTruyen-v2.8.0-debug-apk"
          } > BUILD_APK_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_APK_RESULT.txt
          git commit -m "build: record APK build start"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Validate source
        id: validate
        run: python3 scripts/validate_release.py

      - name: Build installable debug APK
        id: build
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Record checksum
        id: checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-v2.8.0-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Record build result
        if: always()
        shell: bash
        run: |
          CHECKSUM_LINE=""
          if [[ -f app-debug.apk.sha256 ]]; then
            CHECKSUM_LINE="$(cat app-debug.apk.sha256)"
          fi
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          {
            echo "STATUS=${{ job.status }}"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "VALIDATE_OUTCOME=${{ steps.validate.outcome }}"
            echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "UPLOAD_OUTCOME=${{ steps.upload_apk.outcome }}"
            echo "ARTIFACT_ID=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=NgheTruyen-v2.8.0-debug-apk"
            if [[ -n "${CHECKSUM_LINE}" ]]; then
              echo "${CHECKSUM_LINE}"
            fi
          } > BUILD_APK_RESULT.txt
          git add BUILD_APK_RESULT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: record APK build result"
          git push origin HEAD:main