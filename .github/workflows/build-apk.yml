name: Build APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-parity-five-milestones
          fetch-depth: 0

      - name: Commit nullable XPK voice-plan fix and restore workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          text = path.read_text(encoding='utf-8')
          old_xpk = 'xpkVoiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {'
          new_xpk = 'xpkVoiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {'
          old_legacy = 'voiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {'
          new_legacy = 'voiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {'
          if text.count(old_xpk) != 1 or text.count(old_legacy) != 1:
              raise SystemExit(f'unexpected voice-plan conditions: xpk={text.count(old_xpk)} legacy={text.count(old_legacy)}')
          text = text.replace(old_xpk, new_xpk, 1).replace(old_legacy, new_legacy, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git checkout HEAD^ -- .github/workflows/build-apk.yml
          git rm -f .github/workflows/one-time-fix-nullable.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt .github/workflows/build-apk.yml
          git commit -m "fix: guard nullable XPK voice transform"
          git push origin HEAD:agent/xpk-parity-five-milestones

      - name: Stop temporary run after patch push
        run: echo "Source fix pushed; the synchronized PR run will perform the authoritative build."
