name: Build Chapter Scoped Status Fix

on:
  push:
    branches:
      - fix/freesound-latency-status-cloudflare
    paths:
      - scripts/apply_chapter_scoped_prefetch_status.py
      - .github/workflows/build-chapter-scoped-status-fix.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply chapter-scoped status fix
        run: python3 scripts/apply_chapter_scoped_prefetch_status.py

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-chapter-status-fix.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-chapter-status-fix-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-chapter-status-fix.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_chapter_scoped_prefetch_status.py
          rm -f .github/workflows/build-chapter-scoped-status-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/playback/PlaybackQueueStore.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            scripts/apply_chapter_scoped_prefetch_status.py \
            .github/workflows/build-chapter-scoped-status-fix.yml
          git commit -m "fix: keep Freesound transfer status chapter-scoped [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare
