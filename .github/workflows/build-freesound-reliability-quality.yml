name: Build Freesound Reliability Quality Fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-freesound-reliability-quality.yml
      - scripts/apply_freesound_reliability_quality_fix.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Freesound reliability and quality fixes
        run: python3 scripts/apply_freesound_reliability_quality_fix.py

      - name: Verify intended policy changes
        run: |
          set -euxo pipefail
          grep -n 'freesound_auto_query_cache_v2' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -n 'rememberFailedSound' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -n 'FreesoundCategory.ALL' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -n 'partialPlaybackAllowed' app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          grep -n 'PARTIAL' app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt
          grep -n 'previewHqMp3, sound.previewHqOgg' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-freesound-reliability-quality.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-freesound-reliability-quality-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-freesound-reliability-quality.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_freesound_reliability_quality_fix.py
          rm -f .github/workflows/build-freesound-reliability-quality.yml
          git restore --worktree -- gradlew || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt \
            app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/main/java/vn/nghetruyen/app/ai/XpkUnifiedNarrationPrompt.kt \
            scripts/apply_freesound_reliability_quality_fix.py \
            .github/workflows/build-freesound-reliability-quality.yml
          git commit -m "fix: make Freesound retries selective and partial plans playable [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare
