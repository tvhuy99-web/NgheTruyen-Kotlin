name: Build latest APK

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-latest-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-latest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
