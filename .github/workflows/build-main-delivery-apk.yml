name: Build Main APK Delivery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-main-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: 080943f14e9df4f5c3eb0593c87a1b59d7b40b11

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Build debug APK from merged main only
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-main-20260822.apk
          sha256sum dist/NgheTruyen-main-20260822.apk > dist/NgheTruyen-main-20260822.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-main-20260822-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-main-20260822.apk
            dist/NgheTruyen-main-20260822.apk.sha256
