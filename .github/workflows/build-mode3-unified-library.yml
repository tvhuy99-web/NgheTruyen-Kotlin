name: Build Final Mode3 Semantic Accuracy APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  patch-and-build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Extract and apply final semantic patch
        shell: bash
        run: |
          python3 -c 'import subprocess,pathlib; src=subprocess.check_output(["git","show","HEAD^:.github/workflows/build-mode3-unified-library.yml"], text=True); m="          python3 - <<'"'"'PY'"'"'\n"; s=src.index(m)+len(m); e=src.index("\n          PY",s); block=src[s:e]; lines=[line[10:] if line.startswith("          ") else line for line in block.splitlines()]; pathlib.Path("/tmp/final_mode3_patch.py").write_text("\n".join(lines)+"\n", encoding="utf-8")'
          python3 /tmp/final_mode3_patch.py
          printf '%s\n' "$GITHUB_RUN_ID" > .mode3-semantic-description-last-run

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app \
                  .mode3-semantic-description-last-run
          git commit -m "fix(mode3): semantic matching, cycle reuse and description diagnostics [skip ci]" || true
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then xargs -r sdkmanager < .sdk-packages; fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Mode3-Semantic-Final.apk
          sha256sum NgheTruyen-Mode3-Semantic-Final.apk > NgheTruyen-Mode3-Semantic-Final.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-Semantic-Final
          path: |
            NgheTruyen-Mode3-Semantic-Final.apk
            NgheTruyen-Mode3-Semantic-Final.apk.sha256
          retention-days: 30