name: Build Mode3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  build-apk-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then
            xargs -r sdkmanager < .sdk-packages
          else
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Build debug APK without tests
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          env -u GITHUB_SHA NGHETRUYEN_BUILD_SHA="$SOURCE_SHA" ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-Mode3-open-description-local-20260823.apk
          sha256sum dist/NgheTruyen-Mode3-open-description-local-20260823.apk > dist/NgheTruyen-Mode3-open-description-local-20260823.apk.sha256
          printf '%s\n' "$SOURCE_SHA" > dist/source-commit.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-open-description-local-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-Mode3-open-description-local-20260823.apk
            dist/NgheTruyen-Mode3-open-description-local-20260823.apk.sha256
            dist/source-commit.txt

      - name: Record successful build run
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .mode3-open-description-last-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mode3-open-description-last-build
          git commit -m "ci: record Mode3 APK build [skip ci]"
          git push origin HEAD:fix/mode3-resolution-quality-20260822
