name: Build Mode3 Unified Library APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply unified-library fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected source for {label}: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('PATCHED', label)

          # Mode 3 MUSIC: use the same enabled MUSIC library as every other mode.
          replace_required(
              'app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt',
              '''            container.libraryRepository.listEnabledSceneMusicTracks()\n                .filter { AudioAssetClassifier.classify(it) == AudioAssetKind.MUSIC }\n                .filter { track ->\n                    !StoryAudioModeRouter.usesAiFreesound(storyAudioSourceMode) ||\n                        (FreesoundImporter.soundIdFromManagedUri(track.uri) != null &&\n                            FreesoundImporter.managedFileExists(applicationContext, track.uri))\n                }''',
              '''            container.libraryRepository.listEnabledSceneMusicTracks()\n                .filter { AudioAssetClassifier.classify(it) == AudioAssetKind.MUSIC }''',
              'mode3 music shared library',
          )

          # Mode 3 AMBIENCE/SFX: stop discarding user/local assets at playback time.
          replace_required(
              'app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt',
              '''    ): List<AudioDirectionAsset> = rawTracks\n        .asSequence()\n        .filter { track ->\n            !StoryAudioModeRouter.usesAiFreesound(sourceMode) ||\n                (FreesoundImporter.soundIdFromManagedUri(track.uri) != null &&\n                    FreesoundImporter.managedFileExists(appContext, track.uri))\n        }\n        .map { track ->''',
              '''    ): List<AudioDirectionAsset> = rawTracks\n        .asSequence()\n        .map { track ->''',
              'mode3 ambience sfx shared library',
          )

          # New Freesound files keep the Freesound description exactly as received.
          replace_required(
              'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt',
              'description = semanticDescription.trim().ifBlank { sound.description },',
              'description = sound.description,',
              'freesound original description',
          )
          replace_required(
              'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt',
              'val cleanDescription = description.trim().take(300)',
              'val cleanDescription = description.trim()',
              'freesound description no truncation',
          )

          # Query-only evidence (including a fresh Freesound result) must not outrank
          # structured semantic metadata merely because the search query is repeated verbatim.
          matcher = Path('app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt')
          text = matcher.read_text(encoding='utf-8')
          old = '''            (coreCoverage * 0.24 + eventCoverage * 0.24 + lexical * 0.52).coerceIn(0.0, 1.0)\n        } else {\n            (coreCoverage * 0.52 + lexical * 0.48).coerceIn(0.0, 1.0)'''
          new = '''            ((coreCoverage * 0.24 + eventCoverage * 0.24 + lexical * 0.52) * 0.84).coerceIn(0.0, 1.0)\n        } else {\n            ((coreCoverage * 0.52 + lexical * 0.48) * 0.84).coerceIn(0.0, 1.0)'''
          if old not in text:
              raise SystemExit('Missing expected remote-fit source')
          text = text.replace(old, new, 1)
          old2 = '''        val selectionBase = if (hintAware && semanticMetadata && contextEvidence > 0.0) {\n            contextEvidence * 0.65 + queryEvidence * 0.35\n        } else {\n            queryEvidence\n        }'''
          new2 = '''        val selectionBase = if (hintAware && semanticMetadata && contextEvidence > 0.0) {\n            contextEvidence * 0.65 + queryEvidence * 0.35\n        } else {\n            // Query-only candidates use the same evidence ceiling whether they are local files\n            // or fresh Freesound results. Provenance contributes zero points.\n            queryEvidence * 0.84\n        }'''
          if old2 not in text:
              raise SystemExit('Missing expected local query-only selection source')
          matcher.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          print('PATCHED source-neutral query-only fit calibration')

          # The AI semantic hint remains useful for matching/searching only; it is never persisted
          # into a newly downloaded file description.
          resolver = Path('app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt')
          r = resolver.read_text(encoding='utf-8')
          r = r.replace('semanticDescription = semanticDescriptionForImport(need),', 'semanticDescription = "",')
          resolver.write_text(r, encoding='utf-8')

          # Guard against reintroducing the two Freesound-only playback filters.
          reader = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt').read_text(encoding='utf-8')
          runtime = Path('app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt').read_text(encoding='utf-8')
          forbidden = 'FreesoundImporter.soundIdFromManagedUri(track.uri) != null'
          if forbidden in reader or forbidden in runtime:
              raise SystemExit('Freesound-only playback filter still present')
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
                  app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt
          git commit -m "fix(mode3): use one audio library and preserve Freesound metadata"
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then
            xargs -r sdkmanager < .sdk-packages
          fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Mode3-Unified-Library.apk
          sha256sum NgheTruyen-Mode3-Unified-Library.apk > NgheTruyen-Mode3-Unified-Library.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-Unified-Library
          path: |
            NgheTruyen-Mode3-Unified-Library.apk
            NgheTruyen-Mode3-Unified-Library.apk.sha256
          retention-days: 30
