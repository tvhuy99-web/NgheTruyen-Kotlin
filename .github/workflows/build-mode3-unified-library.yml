name: Build Semantic + Description Normalization APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  patch-and-build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply semantic and description fixes once
        shell: bash
        run: |
          if [ ! -f app/src/main/java/vn/nghetruyen/app/ui/components/AudioDescriptionNormalizationDialog.kt ]; then
            python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/fix-semantic-and-description-normalization.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_semantic_description.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
            python3 /tmp/apply_semantic_description.py
          else
            echo 'Semantic/description source already patched; skip duplicate patch.'
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print('PATCHED', label)
              elif new in text:
                  print('ALREADY PATCHED', label)
              else:
                  raise SystemExit(f'Missing expected source for {label}')

          dialog = 'app/src/main/java/vn/nghetruyen/app/ui/components/AudioDescriptionNormalizationDialog.kt'
          replace_once(
              dialog,
              '''internal fun audioDescriptionNeedsNormalization(tagsCsv: String): Boolean =\n    audioDescriptionText(tagsCsv).isNotBlank() && !audioDescriptionIsVietnameseStructured(tagsCsv)''',
              '''internal fun audioDescriptionNeedsNormalization(tagsCsv: String): Boolean =\n    !audioDescriptionIsVietnameseStructured(tagsCsv)''',
              'blank descriptions count as pending',
          )
          replace_once(
              dialog,
              '''        AudioDescriptionNormalizationScope.ALL_LIBRARY -> tracks.count { audioDescriptionText(it.tagsCsv).isNotBlank() }''',
              '''        AudioDescriptionNormalizationScope.ALL_LIBRARY -> tracks.size''',
              'all library includes blank rows',
          )
          replace_once(
              dialog,
              '''            val targets = tracks.filter { track ->\n                val description = audioDescriptionText(track.tagsCsv)\n                description.isNotBlank() && when (mode) {\n                    AudioDescriptionNormalizationScope.MISSING_VIETNAMESE -> !audioDescriptionIsVietnameseStructured(track.tagsCsv)\n                    AudioDescriptionNormalizationScope.ALL_LIBRARY -> true\n                }\n            }''',
              '''            val targets = tracks.filter { track ->\n                when (mode) {\n                    AudioDescriptionNormalizationScope.MISSING_VIETNAMESE -> !audioDescriptionIsVietnameseStructured(track.tagsCsv)\n                    AudioDescriptionNormalizationScope.ALL_LIBRARY -> true\n                }\n            }''',
              'normalization targets include blank rows',
          )
          replace_once(
              dialog,
              '''                    if (\n                        mode == AudioDescriptionNormalizationScope.ALL_LIBRARY &&\n                        audioDescriptionIsVietnameseStructured(track.tagsCsv)\n                    ) {''',
              '''                    if (\n                        source.isBlank() ||\n                        (mode == AudioDescriptionNormalizationScope.ALL_LIBRARY &&\n                            audioDescriptionIsVietnameseStructured(track.tagsCsv))\n                    ) {''',
              'blank Freesound rows refetch source description',
          )

          switches = 'app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt'
          replace_once(
              switches,
              '''            enabled = tracks.any { audioDescriptionText(it.tagsCsv).isNotBlank() },''',
              '''            enabled = tracks.isNotEmpty(),''',
              'description normalizer enabled for blank metadata',
          )
          PY

          printf '%s\n' "$GITHUB_RUN_ID" > .mode3-semantic-description-last-run

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app \
                  .mode3-semantic-description-last-run
          git commit -m "fix: include blank source descriptions in normalization [skip ci]" || true
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then xargs -r sdkmanager < .sdk-packages; fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Semantic-Description-Normalization.apk
          sha256sum NgheTruyen-Semantic-Description-Normalization.apk > NgheTruyen-Semantic-Description-Normalization.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Semantic-Description-Normalization
          path: |
            NgheTruyen-Semantic-Description-Normalization.apk
            NgheTruyen-Semantic-Description-Normalization.apk.sha256
          retention-days: 30
