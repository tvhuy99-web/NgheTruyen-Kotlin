name: Build Mode3 Audio Fixes APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  patch-and-build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply prepared audio fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/fix-mode3-audio-quality-description-converter.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply fixes\n'
          end_marker = '      - name: Commit fixed source\n'
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          block = src[start:end]
          run_marker = '        run: |\n'
          run_at = block.index(run_marker) + len(run_marker)
          script_lines = []
          for line in block[run_at:].splitlines():
              script_lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_audio_fixes.sh').write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply_audio_fixes.sh
          printf '%s\n' "$GITHUB_RUN_ID" > .mode3-description-converter-last-run

      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
                  app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
                  app/src/main/java/vn/nghetruyen/app/sourceplatform/DiagnosticDeepBlackBox.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/components/UnifiedAudioAssetManagerDialog.kt \
                  .mode3-description-converter-last-run
          git commit -m "fix(mode3): audio selection and AI description converter [skip ci]"
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then
            xargs -r sdkmanager < .sdk-packages
          fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Mode3-Audio-Fixes-Description-Converter.apk
          sha256sum NgheTruyen-Mode3-Audio-Fixes-Description-Converter.apk > NgheTruyen-Mode3-Audio-Fixes-Description-Converter.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-Audio-Fixes-Description-Converter
          path: |
            NgheTruyen-Mode3-Audio-Fixes-Description-Converter.apk
            NgheTruyen-Mode3-Audio-Fixes-Description-Converter.apk.sha256
          retention-days: 30
