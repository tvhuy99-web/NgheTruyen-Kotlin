name: Build Mode3 Unified Library APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/build-mode3-unified-library.yml'

permissions:
  contents: write

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then
            xargs -r sdkmanager < .sdk-packages
          fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Mode3-Unified-Library.apk
          sha256sum NgheTruyen-Mode3-Unified-Library.apk > NgheTruyen-Mode3-Unified-Library.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-Unified-Library
          path: |
            NgheTruyen-Mode3-Unified-Library.apk
            NgheTruyen-Mode3-Unified-Library.apk.sha256
          retention-days: 30

      - name: Record build run id
        if: always()
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .mode3-unified-last-run
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .mode3-unified-last-run
          git commit -m "chore: record unified library build run" || exit 0
          git push origin HEAD:fix/mode3-resolution-quality-20260822
