name: Build Narration Error Reporting Fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-narration-error-reporting.yml
      - scripts/apply_narration_error_reporting_fix.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply narration error reporting fix
        run: python3 scripts/apply_narration_error_reporting_fix.py

      - name: Run focused status tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests 'vn.nghetruyen.app.playback.FreesoundPlaybackStatusFormatterTest' --tests 'vn.nghetruyen.app.playback.NarrationAutomationStatusFormatterTest' --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-narration-error-reporting.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-narration-error-reporting-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-narration-error-reporting.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_narration_error_reporting_fix.py
          rm -f .github/workflows/build-narration-error-reporting.yml
          git restore --worktree -- gradlew || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/playback/NarrationAutomationStatusFormatter.kt \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/test/java/vn/nghetruyen/app/playback/FreesoundPlaybackStatusFormatterTest.kt \
            app/src/test/java/vn/nghetruyen/app/playback/NarrationAutomationStatusFormatterTest.kt \
            scripts/apply_narration_error_reporting_fix.py \
            .github/workflows/build-narration-error-reporting.yml
          git commit -m "fix: report narration errors inline with transfer counts [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare
