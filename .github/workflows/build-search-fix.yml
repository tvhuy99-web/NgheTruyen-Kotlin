name: Build Search Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_search_submit_fix.py
      - .github/workflows/build-search-fix.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply search fix
        run: python3 scripts/apply_search_submit_fix.py

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-search-fix.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-search-fix-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-search-fix.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_search_submit_fix.py
          rm -f .github/workflows/build-search-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ExploreScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt \
            app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt \
            scripts/apply_search_submit_fix.py \
            .github/workflows/build-search-fix.yml
          git commit -m "fix: submit search parameters atomically [skip ci]"
          git fetch origin fix/freesound-latency-status-cloudflare
          git rebase origin/fix/freesound-latency-status-cloudflare
          git push origin HEAD:fix/freesound-latency-status-cloudflare
