name: Chromium Browser Replay

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/java/vn/nghetruyen/app/sourceplatform/**"
      - "app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/**"
      - "source-vbook/**"
      - ".github/workflows/chromium-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-browser-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Chromium Browser replay test on API 33
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=vn.nghetruyen.app.sourceplatform.ChromiumBrowserReplayVBookRuntimeTest

      - name: Upload replay test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-browser-replay-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
