name: Cleanup Gradle artifacts

on:
  push:
    branches:
      - agent/reference-ui-position-parity
    paths:
      - .github/workflows/cleanup-gradle-artifacts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0
      - name: Remove generated Gradle state
        shell: bash
        run: |
          grep -qxF '.gradle/' .gitignore || printf '\n.gradle/\n' >> .gitignore
          git rm -r -f --ignore-unmatch .gradle
          rm -f .github/workflows/cleanup-gradle-artifacts.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Gradle state"
          git push origin HEAD:agent/reference-ui-position-parity
