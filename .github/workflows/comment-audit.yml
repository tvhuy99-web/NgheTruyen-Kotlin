name: Comment Audit

on:
  push:
    branches:
      - chore/remove-code-comments-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run comment audit
        run: python3 scripts/comment_audit_cleanup.py

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: comment-audit
          path: |
            comment-audit.json
            comment-audit.tsv
