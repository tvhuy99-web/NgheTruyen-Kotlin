name: Final Comment Cleanup

on:
  push:
    branches:
      - chore/remove-code-comments-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/remove-code-comments-20260816

      - name: Remove verified non-license comments
        run: python3 scripts/comment_audit_cleanup.py --write --json /tmp/comment-cleanup.json --tsv /tmp/comment-cleanup.tsv

      - name: Commit cleanup
        shell: bash
        run: |
          git add app/src/main/java/sonic/Sonic.java
          if git diff --cached --quiet; then
            echo "No comment cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove final non-license code comments"
          git push origin HEAD:chore/remove-code-comments-20260816
