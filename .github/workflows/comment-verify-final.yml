name: Final Comment Verification

on:
  push:
    branches:
      - chore/remove-code-comments-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify no removable code comments remain
        shell: bash
        run: |
          python3 scripts/comment_audit_cleanup.py --json /tmp/final-comment-audit.json --tsv /tmp/final-comment-audit.tsv
          python3 - <<'PY'
          import json
          with open('/tmp/final-comment-audit.json', encoding='utf-8') as f:
              data = json.load(f)
          remaining = data['summary']['removable_comment_occurrences']
          print('Final removable comments:', remaining)
          if remaining != 0:
              raise SystemExit(f'{remaining} removable comments remain')
          PY
