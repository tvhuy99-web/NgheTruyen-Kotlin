name: Compact one stale label

on:
  push:
    branches:
      - agent/compact-ui-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/compact-ui-parity
      - name: Shorten restore title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt')
          s = p.read_text(encoding='utf-8')
          old = 'title = { Text("BẢN KHÔI PHỤC") }'
          new = 'title = { Text("KHÔI PHỤC") }'
          if old not in s:
              raise SystemExit('target label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          git commit -m "ui: shorten VietPhrase restore title"
          git push origin HEAD:agent/compact-ui-parity
# trigger
