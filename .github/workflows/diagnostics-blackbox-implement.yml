          ''')

          # 5) vBook persistent platform shares the same recorder/evidence.
          path = 'app/src/main/java/vn/nghetruyen/app/sourceplatform/VBookSourcePlatform.kt'
          replace(path,
          'import vn.nghetruyen.source.diagnostics.DiagnosticEvent\n',
