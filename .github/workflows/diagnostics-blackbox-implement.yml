      - name: Validate source modules and app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :source-diagnostics:test :source-vbook:test :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-diagnostics-vbook-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add diagnostic black box and direct vBook catalog URLs"
          git push origin HEAD:agent/diagnostics-blackbox-vbook-url
