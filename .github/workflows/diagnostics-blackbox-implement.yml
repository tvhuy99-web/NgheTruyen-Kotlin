          # 6) High-fidelity browser black box: console + automatic DOM and request metadata snapshots.
          path = 'app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt'
          replace(path, 'import android.webkit.CookieManager\n', 'import android.webkit.CookieManager\nimport android.webkit.ConsoleMessage\n')
          replace(path,
          'import vn.nghetruyen.source.diagnostics.DiagnosticEvent\n',
          'import vn.nghetruyen.source.diagnostics.DiagnosticEvent\nimport vn.nghetruyen.source.diagnostics.DiagnosticEvidence\nimport vn.nghetruyen.source.diagnostics.DiagnosticEvidenceSink\n')
          replace(path,
          '''    private val clockMs: () -> Long = System::currentTimeMillis,
              private val resolver: (String) -> List<InetAddress> = { host -> InetAddress.getAllByName(host).toList() },
          ) : SourceBrowserBroker {''',
          '''    private val clockMs: () -> Long = System::currentTimeMillis,
              private val resolver: (String) -> List<InetAddress> = { host -> InetAddress.getAllByName(host).toList() },
              private val evidence: DiagnosticEvidenceSink = DiagnosticEvidenceSink.NONE,
          ) : SourceBrowserBroker {''')
