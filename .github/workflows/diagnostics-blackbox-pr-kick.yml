name: Run diagnostics implementation on PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply black-box implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/diagnostics-blackbox-implement.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          strict = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)
          '''
          tolerant = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, count))
                  return
              def line_pattern(line):
                  stripped = line.strip()
                  if not stripped:
                      return r"[ \\t]*"
                  parts = re.split(r"([ \\t]+)", stripped)
                  body = "".join(r"[ \\t]+" if part.isspace() else re.escape(part) for part in parts)
                  return r"[ \\t]*" + body + r"[ \\t]*"
              pattern = "\\n".join(line_pattern(line) for line in old.splitlines())
              replaced, matches = re.subn(pattern, lambda match: new, text, count=count)
              if matches == 0:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              p.write_text(replaced)
          '''
          if strict not in script:
              raise SystemExit('replace helper not found in implementation script')
          script = script.replace(strict, tolerant, 1)
          exec(compile(script, 'diagnostics-blackbox-implement.py', 'exec'))
          browser = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt')
          browser.write_text(browser.read_text().replace('joinToString("\n")', 'joinToString("\\n")'))
          story = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/VBookStorySource.kt')
          story_text = story.read_text()
          if 'import vn.nghetruyen.source.api.JsonCodec\n' not in story_text:
              story_text = story_text.replace('import vn.nghetruyen.source.api.JsonValue\n', 'import vn.nghetruyen.source.api.JsonValue\nimport vn.nghetruyen.source.api.JsonCodec\n')
          story.write_text(story_text)
          Path('.github/workflows/diagnostics-blackbox-pr-kick.yml').unlink(missing_ok=True)
          PY
      - name: Validate source modules and app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :source-diagnostics:test :source-vbook:test :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-diagnostics-vbook-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add diagnostic black box and direct vBook catalog URLs"
          git push origin HEAD:${{ github.head_ref }}
