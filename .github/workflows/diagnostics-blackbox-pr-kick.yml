name: Run diagnostics implementation on PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply black-box implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/diagnostics-blackbox-implement.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'diagnostics-blackbox-implement.py', 'exec'))
          Path('.github/workflows/diagnostics-blackbox-pr-kick.yml').unlink(missing_ok=True)
          PY
      - name: Validate source modules and app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :source-diagnostics:test :source-vbook:test :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-diagnostics-vbook-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add diagnostic black box and direct vBook catalog URLs"
          git push origin HEAD:${{ github.head_ref }}
