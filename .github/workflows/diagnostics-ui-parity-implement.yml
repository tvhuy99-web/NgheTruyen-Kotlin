name: Implement Lua-style diagnostics parity

on:
  push:
    branches:
      - agent/fix-lua-style-diagnostics-ui

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Lua diagnostics parity implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # New diagnostic chrome needs RowScope.weight.
          replace(
              'app/src/main/java/vn/nghetruyen/app/ui/components/ReferenceDiagnosticsChrome.kt',
              'import androidx.compose.foundation.layout.padding\n',
              'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.weight\n',
          )

          # 1) Put diagnostics at the global bottom chrome, immediately above bottom tabs like XPK.
          path = 'app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt'
          replace(path,
              'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.Row\n',
              'import androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\n')
          replace(path,
              'import vn.nghetruyen.app.ui.components.ReferenceDivider\n',
              'import vn.nghetruyen.app.ui.components.ReferenceDiagnosticsChrome\nimport vn.nghetruyen.app.ui.components.ReferenceDivider\n')
          replace(path,
              '''        bottomBar = {
            if (state.destination == Destination.Root) {
                ReferencePrimaryBottomBar(selected = state.rootTab, onSelect = viewModel::setRootTab)
            }
        },''',
              '''        bottomBar = {
            Column {
                ReferenceDiagnosticsChrome(
                    state = state,
                    onExport = onExportSourceDiagnostics,
                    onClear = viewModel::clearSourceDiagnostics,
                )
                if (state.destination == Destination.Root) {
                    ReferencePrimaryBottomBar(selected = state.rootTab, onSelect = viewModel::setRootTab)
                }
            }
        },''')

          # 2) Remove the incorrect always-visible Reader-only log button/dialog.
