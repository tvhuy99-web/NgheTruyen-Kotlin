          replace(path,
              '    var showChapterInfoDialog by remember { mutableStateOf(false) }\n    var showDiagnosticLogDialog by remember { mutableStateOf(false) }\n',
              '    var showChapterInfoDialog by remember { mutableStateOf(false) }\n')
          replace(path,
              '''            Row(Modifier.fillMaxWidth()) {
