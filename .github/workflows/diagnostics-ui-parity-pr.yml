name: Apply and validate Lua diagnostics parity

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  diagnostics-parity:
    if: github.event.pull_request.head.ref == 'agent/fix-lua-style-diagnostics-ui' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply deterministic parity migration
        run: python3 scripts/run_lua_diagnostics_migration.py
      - name: Persist migrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app
          if ! git diff --cached --quiet; then
            git commit -m "fix: mirror Lua diagnostics lifecycle and coverage"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Verify Lua diagnostics lifecycle
        run: python3 scripts/check_lua_diagnostics_ui_parity.py
      - name: Verify existing strict XPK parity
        run: python3 scripts/check_xpk_strict_parity.py
      - name: Compile Android Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
