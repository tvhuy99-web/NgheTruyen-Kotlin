name: Build NgheTruyen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-apk-build-v2.yml"
      - "app/build.gradle.kts"
      - "app/src/**"

permissions:
  contents: write

concurrency:
  group: build-nghetruyen-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_NAME: NgheTruyen-v2.8.0-debug-apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build start
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "STATUS=running"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "VALIDATE_OUTCOME="
            echo "BUILD_OUTCOME="
            echo "UPLOAD_OUTCOME="
            echo "ARTIFACT_ID="
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
          } > BUILD_APK_RESULT.txt
          git add BUILD_APK_RESULT.txt
          git commit -m "build: record APK build start"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Validate source
        id: validate
        run: python3 scripts/validate_release.py

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo "GRADLE_EXIT=$status"
              echo "RUN_ID=${GITHUB_RUN_ID}"
              echo
              echo "=== COMPILER ERRORS ==="
              grep -E "(^e: |^error: | error: |FAILURE:|What went wrong|Execution failed for task|Unresolved reference|Compilation error|requires libraries|requires Android Gradle plugin)" /tmp/gradle-build.log | tail -n 800 || true
              echo
              echo "=== LOG TAIL ==="
              tail -n 400 /tmp/gradle-build.log
            } > BUILD_APK_ERROR.txt
            exit $status
          fi
          rm -f BUILD_APK_ERROR.txt

      - name: Create APK checksum
        id: checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Record build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/apk-result
          CHECKSUM_LINE=""
          if [[ -f app-debug.apk.sha256 ]]; then
            CHECKSUM_LINE="$(cat app-debug.apk.sha256)"
          fi
          if [[ -f BUILD_APK_ERROR.txt ]]; then
            cp BUILD_APK_ERROR.txt /tmp/apk-result/BUILD_APK_ERROR.txt
          fi

          {
            echo "STATUS=${{ job.status }}"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "VALIDATE_OUTCOME=${{ steps.validate.outcome }}"
            echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "UPLOAD_OUTCOME=${{ steps.upload_apk.outcome }}"
            echo "ARTIFACT_ID=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            if [[ -n "$CHECKSUM_LINE" ]]; then
              echo "$CHECKSUM_LINE"
            fi
          } > /tmp/apk-result/BUILD_APK_RESULT.txt

          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          cp /tmp/apk-result/BUILD_APK_RESULT.txt BUILD_APK_RESULT.txt
          if [[ -f /tmp/apk-result/BUILD_APK_ERROR.txt ]]; then
            cp /tmp/apk-result/BUILD_APK_ERROR.txt BUILD_APK_ERROR.txt
          else
            rm -f BUILD_APK_ERROR.txt
          fi

          git add BUILD_APK_RESULT.txt
          git add -A BUILD_APK_ERROR.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: record Android APK build result"
          git push origin HEAD:main
