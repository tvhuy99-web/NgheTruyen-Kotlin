name: Build NgheTruyen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-apk-build-v2.yml"
      - "app/**"
      - "source-*/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "scripts/m0_gate.sh"
      - "scripts/validate_release.py"

permissions:
  contents: read

concurrency:
  group: build-nghetruyen-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_NAME: NgheTruyen-v2.9.0-xpk-parity-debug-apk
  EXPECTED_DEBUG_CERT_SHA256: 534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Validate and build current source
        id: build
        shell: bash
        run: bash scripts/m0_gate.sh

      - name: Verify stable debug APK signature
        id: signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -f "${APK}"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
          ACTUAL_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          echo "Expected certificate: ${EXPECTED_DEBUG_CERT_SHA256}"
          echo "Actual certificate:   ${ACTUAL_CERT_SHA256}"
          test "${ACTUAL_CERT_SHA256}" = "${EXPECTED_DEBUG_CERT_SHA256}"

      - name: Create APK checksum
        id: checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Record run result
        if: always()
        shell: bash
        run: |
          {
            echo "STATUS=${{ job.status }}"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "SIGNATURE_OUTCOME=${{ steps.signature.outcome }}"
            echo "UPLOAD_OUTCOME=${{ steps.upload_apk.outcome }}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            if [[ -f app-debug.apk.sha256 ]]; then
              cat app-debug.apk.sha256
            fi
          } > BUILD_APK_RESULT.txt

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nghe-truyen-apk-run-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            BUILD_APK_RESULT.txt
            app/build/reports/**
            build/reports/m0/**
