name: Final Story Audio 8-Step Fix + APK

on:
  push:
    branches:
      - agent/freesound-stage-1
    paths:
      - .github/workflows/final-story-audio-8step-build.yml

permissions:
  contents: write

concurrency:
  group: final-story-audio-8step-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/freesound-stage-1
          fetch-depth: 0

      - name: Publish run id
        shell: bash
        run: |
          printf 'RUN_ID=%s\nRUN_ATTEMPT=%s\nTRIGGER_SHA=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > .github/final-story-audio-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/final-story-audio-run.txt
          git commit -m "Record final story audio build run [skip ci]"
          git push origin HEAD:agent/freesound-stage-1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Apply final runtime delta
        shell: bash
        run: python3 .github/scripts/final_story_audio_runtime_delta.py

      - name: Verify eight-step invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reader = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt').read_text()
          switches = Path('app/src/main/java/vn/nghetruyen/app/ui/components/AudioDirectionLayerSwitches.kt').read_text()
          service = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt').read_text()
          runtime = Path('app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt').read_text()
          coordinator = Path('app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt').read_text()
          ai = Path('app/src/main/java/vn/nghetruyen/app/ai/XpkNarrationAiServices.kt').read_text()
          resolver = Path('app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt').read_text()

          checks = {
              'ReaderFloatSlider uses declared range': 'valueRange = minimum..maximum' in reader,
              'Mode 1 manual controls isolated': 'if (manualMode)' in reader and 'Bật nhạc nền thủ công' in reader,
              'Mode 3 UI says no local fallback': 'không dùng kho local làm fallback' in switches,
              'AI rejects mixed Mode 2/Mode 3 contract': 'AI_AUDIO_SOURCE_MODE_MIXED' in ai,
              'Mode 3 resolver fails closed': 'FreesoundAutoResolutionSource.UNRESOLVED' in resolver and 'LOCAL_FALLBACK' not in resolver,
              'Mode 3 cache accepts managed Freesound': 'FreesoundImporter.soundIdFromManagedUri' in resolver,
              'Audio runtime plans from empty Mode 3 library': 'mustPrepareFreesound' in runtime,
              'Music runtime is mode-aware': 'StoryAudioModeRouter.allowsManualPlaylist(storyAudioSourceMode)' in service,
              'Music plan validates mode ownership': 'scenePlanMatchesCurrentSourceMode' in service,
              'Mode 3 music only uses managed Freesound': 'FreesoundImporter.soundIdFromManagedUri(track.uri)' in service,
              'Intentional silence is handled': 'XpkSceneMusicParity.SILENCE_TRACK_ID' in service,
              'AI audio can prepare without voice cast': 'planAudioWithoutVoice' in service,
              'Mode 3 coordinator filters managed assets': 'FreesoundImporter.soundIdFromManagedUri(it.uri)' in coordinator,
              'Mode 3 cache generation bumped': 'freesound-auto-audio-v2' in coordinator,
              'Ambience and SFX validation are independent': 'SFX được giữ nguyên' in coordinator and 'AMBIENCE được giữ nguyên' in coordinator,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK  ' if ok else 'FAIL') + name)
          if failed:
              raise SystemExit('Eight-step invariant failures: ' + ', '.join(failed))
          PY

      - name: Run app unit tests
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/NgheTruyen-Freesound-8step-debug.apk
          sha256sum dist/NgheTruyen-Freesound-8step-debug.apk | tee dist/NgheTruyen-Freesound-8step-debug.apk.sha256

      - name: Clean one-shot patch helpers
        shell: bash
        run: |
          rm -f .github/scripts/agent_mode_runtime_fix.py
          rm -f .github/scripts/audio_mode_isolation_fix.py
          rm -f .github/scripts/final_story_audio_8step_fix.py
          rm -f .github/scripts/final_story_audio_runtime_delta.py
          rm -f .github/workflows/final-story-audio-8step-build.yml

      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ai/NarrationPlanCoordinator.kt \
            .github/scripts/agent_mode_runtime_fix.py \
            .github/scripts/audio_mode_isolation_fix.py \
            .github/scripts/final_story_audio_8step_fix.py \
            .github/scripts/final_story_audio_runtime_delta.py \
            .github/workflows/final-story-audio-8step-build.yml
          if git diff --cached --quiet; then
            echo "No source delta to commit"
          else
            git commit -m "Complete verified eight-step story audio runtime fix [skip ci]"
            git push origin HEAD:agent/freesound-stage-1
          fi

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Freesound-8step-debug-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/NgheTruyen-Freesound-8step-debug.apk
            dist/NgheTruyen-Freesound-8step-debug.apk.sha256
