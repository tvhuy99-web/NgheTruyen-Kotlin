name: Finalize verified source-pack repair

on:
  push:
    paths:
      - ".github/workflows/finalize-sourcepack-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare all eight verified binary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sourcepack-fixed
          mkdir -p /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks

          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          output = pathlib.Path("/tmp/sourcepack-fixed/app/src/main/assets/sourcepacks")
          blobs = {
              "demo.ntsource": "699ff6986368131ae0cb7cc0576e9177d40cfe4f",
              "sangtacviet.ntsource": "1751822e35dcfab5b9991137b215e660ca9044b5",
              "truyencom.ntsource": "48b6fc4b3f0ebf4e3f62e18908bd005a4d874ae9",
              "truyencv.ntsource": "0ce03d958246af2d2435276a6430286ca8e0b740",
              "truyenfull.ntsource": "85021f0abc26991829098f2bc39909f44beae66c",
          }
          for name, sha in blobs.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              (output / name).write_bytes(base64.b64decode(payload["content"]))
          PY

          curl --fail --location --retry 3 \
            --output /tmp/remaining3.tar.xz \
            https://nghetruyen-sourcepack-fix-20260807.netlify.app/remaining3.tar.xz
          echo "39459b2473d6fd112768581e7cf51d7b2779db8516c684ed923899bb09c3bdf0  /tmp/remaining3.tar.xz" \
            | sha256sum --check -
          tar -xJf /tmp/remaining3.tar.xz -C /tmp/sourcepack-fixed

          printf '%s\n' \
            "efbaafa94c4c1472d86ea0b358200ed8a383437285514d3c988a95119d4a0138  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/demo.ntsource" \
            "1b99700e6894de0181524a3127a0cf3d1954ba8268ff4d3f91b551ebdb582055  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/sangtacviet.ntsource" \
            "043bc8ad6073fb1e47c52651fc724dc2c4308edb880bd28bc4eb489cff338d38  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyencom.ntsource" \
            "7e6dea97ee79119a176b6818fd52634d64211c0a3a4895ef6e65b458700de33a  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyencv.ntsource" \
            "0462ffb4aa939dbcd6ead955ba5c752538c9a2b72d6ff79bcc914e095764ba91  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyenfull.ntsource" \
            "7abe52ec0873005956e50e5fcc9600b4333315826dd5d8e7719b1549da45daad  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyenyy.ntsource" \
            "15a51dfc16813322fccf58acab792ce2d7173f898f7011fbcec28781baa678b5  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/wattpad.ntsource" \
            "562b237cca67dae2791660ba617d159774b9f4f56ebed6dd5bb4ad8058531e56  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/wikidich.ntsource" \
            > /tmp/all-sourcepacks.sha256
          sha256sum --check /tmp/all-sourcepacks.sha256

      - name: Commit verified files with push retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -f /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/*.ntsource \
              app/src/main/assets/sourcepacks/
            rm -rf .github/sourcepack-repair
            rm -f .github/workflows/repair-sourcepacks.yml
            rm -f .github/workflows/finalize-sourcepack-repair.yml
            git add -A

            if git diff --cached --quiet; then
              echo "Repository is already repaired."
              exit 0
            fi

            git commit -m "fix: restore all verified binary source packs"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard HEAD~1
            sleep 5
          done

          echo "Unable to push verified repair after retries." >&2
          exit 1
