name: Fix reference AI settings

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix_ai_settings_reference.py
      - .github/workflows/fix-ai-settings-reference.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply reference AI settings fix
        run: python3 scripts/fix_ai_settings_reference.py
      - name: Assert reference AI settings surface
        run: |
          file=app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -q 'Bật nút AI trong màn hình đọc' "$file"
          grep -q 'Nhà cung cấp AI' "$file"
          grep -q 'Google Gemini' "$file"
          grep -q 'OpenAI-compatible / Proxy' "$file"
          grep -q 'Chế độ xử lý mặc định' "$file"
          grep -q 'Lời nhắc mặc định: Dịch chương gốc' "$file"
          grep -q 'Lời nhắc mặc định: Cải thiện VietPhrase' "$file"
          grep -q 'Timeout yêu cầu AI (ms)' "$file"
          grep -q 'Nhiệt độ AI (0.0 - 2.0)' "$file"
          grep -q 'Text("LƯU")' "$file"
          grep -q 'Text("HỦY")' "$file"
          ! grep -q 'Hạn mức AI trên thiết bị' "$file"
          ! grep -q 'YÊU CẦU +' "$file"
          ! grep -q 'KÝ TỰ +' "$file"
          ! grep -q 'RETRY +' "$file"
          ! grep -q 'BACKOFF +' "$file"
      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only
      - name: Compile Kotlin app
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-reference-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit product changes and clean temporary tooling
        run: |
          rm -rf .gradle
          rm -f scripts/fix_ai_settings_reference.py
          rm -f .github/workflows/fix-ai-settings-reference.yml
          rm -f .github/workflows/inspect-ai-settings-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: match reference AI settings dialog"
          git push origin HEAD:agent/reference-ui-position-parity
