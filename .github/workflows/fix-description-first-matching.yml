name: Fix Description-First Audio Matching + Build APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/fix-description-first-matching.yml'

permissions:
  contents: write

env:
  BRANCH_NAME: fix/mode3-resolution-quality-20260822

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working audio branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch matching policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('PATCHED', label)

          matcher = 'app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt'
          resolver = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt'

          # LOCAL LIBRARY: title must contribute zero semantic evidence.
          # Candidate discovery uses description/metadata only.
          replace_once(
              matcher,
              '(entry.englishTitleTokens + entry.englishMetadataTokens).forEach { token ->',
              'entry.englishMetadataTokens.forEach { token ->',
              'local candidate index ignores title',
          )

          # Audible/source concepts for local files also come from description only.
          replace_once(
              matcher,
              '''        val audibleText = if (sections.structured) {
            listOf(track.title, sections.shadeText, sections.useText).joinToString(" ")
        } else {
            "${track.title} ${track.tagsCsv}"
        }''',
              '''        val audibleText = if (sections.structured) {
            listOf(sections.shadeText, sections.useText).joinToString(" ")
        } else {
            track.tagsCsv
        }''',
              'local audible concepts ignore title',
          )

          # Keep the field for source compatibility, but it is deliberately always empty.
          replace_once(
              matcher,
              'englishTitleTokens = FreesoundAutoRequirementAggregator.queryTokens(track.title),',
              'englishTitleTokens = emptySet(),',
              'local title tokens disabled',
          )

          # FREESOUND ONLINE: all three fields remain valid evidence, with description strongest.
          # Exact description evidence = 1.00, exact name evidence = 0.85, exact tags evidence = 0.75.
          # This still lets name/tags rescue bad or personal uploader descriptions.
          replace_once(
              resolver,
              'return max(titleCoverage, max(tagCoverage * 0.96, descriptionCoverage * 0.78))',
              'return max(descriptionCoverage, max(titleCoverage * 0.85, tagCoverage * 0.75))',
              'remote lexical field priority description-name-tags',
          )

          # Phrase bonus follows the same priority requested by the user.
          replace_once(
              resolver,
              '''            val phraseBonus = when {
                titleNorm.contains(queryNorm) -> 0.20
                tagNorm.contains(queryNorm) -> 0.14
                descriptionNorm.contains(queryNorm) -> 0.08
                else -> 0.0
            }''',
              '''            val phraseBonus = when {
                descriptionNorm.contains(queryNorm) -> 0.20
                titleNorm.contains(queryNorm) -> 0.12
                tagNorm.contains(queryNorm) -> 0.08
                else -> 0.0
            }''',
              'remote phrase bonus description-name-tags',
          )

          # Static guards: fail the workflow if a future edit accidentally reintroduces title matching locally.
          matcher_text = Path(matcher).read_text(encoding='utf-8')
          resolver_text = Path(resolver).read_text(encoding='utf-8')
          required = [
              'entry.englishMetadataTokens.forEach { token ->',
              'englishTitleTokens = emptySet(),',
              'return max(descriptionCoverage, max(titleCoverage * 0.85, tagCoverage * 0.75))',
              'descriptionNorm.contains(queryNorm) -> 0.20',
              'titleNorm.contains(queryNorm) -> 0.12',
              'tagNorm.contains(queryNorm) -> 0.08',
          ]
          combined = matcher_text + '\n' + resolver_text
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit('Missing policy guards: ' + repr(missing))
          print('Static policy guards passed')
          PY

      - name: Add regression tests for matching policy
        shell: bash
        run: |
          cat > app/src/test/java/vn/nghetruyen/app/freesound/DescriptionFirstMatchingTest.kt <<'KOTLIN'
          package vn.nghetruyen.app.freesound

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import vn.nghetruyen.app.audio.AudioAssetKind
          import vn.nghetruyen.app.data.local.SceneMusicTrackEntity

          class DescriptionFirstMatchingTest {
              @Test
              fun localLibraryIgnoresTitleAndMatchesDescriptionOnly() {
                  val need = FreesoundAutoSearchNeed(
                      kind = AudioAssetKind.SFX,
                      query = "sword clash",
                      importance = FreesoundRequirementImportance.REQUIRED,
                      usages = emptyList(),
                  )
                  val titleOnly = track(
                      id = "title-only",
                      title = "sword clash",
                      description = "type:sfx, gentle rain on a quiet roof",
                  )
                  val descriptionMatch = track(
                      id = "description-match",
                      title = "unrelated recording 001",
                      description = "type:sfx, sword clash metal impact",
                  )

                  val titleOnlyEvaluation = Mode3LibraryAssetMatcher.evaluate(need, listOf(titleOnly), nowMillis = 0L)
                  assertNull(titleOnlyEvaluation.accepted)
                  assertTrue(titleOnlyEvaluation.candidateTracks == 0 || titleOnlyEvaluation.topCandidates.none { it.accepted })

                  val descriptionEvaluation = Mode3LibraryAssetMatcher.evaluate(need, listOf(descriptionMatch), nowMillis = 0L)
                  assertEquals("description-match", descriptionEvaluation.accepted?.track?.id)
              }

              @Test
              fun remoteSearchUsesAllThreeFieldsButDescriptionHasHighestWeight() {
                  val need = FreesoundAutoSearchNeed(
                      kind = AudioAssetKind.AMBIENCE,
                      query = "forest wind",
                      importance = FreesoundRequirementImportance.REQUIRED,
                      usages = emptyList(),
                  )
                  val common = FreesoundSound(
                      id = 1,
                      name = "misc recording",
                      description = "personal note from uploader",
                      durationSeconds = 60.0,
                      previewHqMp3 = "https://cdn.example/a.mp3",
                      previewHqOgg = null,
                      category = "Soundscapes",
                  )
                  val descriptionMatch = common.copy(
                      id = 10,
                      description = "forest wind",
                  )
                  val titleMatch = common.copy(
                      id = 11,
                      name = "forest wind",
                  )
                  val tagMatch = common.copy(
                      id = 12,
                      tags = listOf("forest", "wind"),
                  )

                  val descriptionCoverage = FreesoundAutoAudioResolver.candidateLexicalCoverage(need, descriptionMatch)
                  val titleCoverage = FreesoundAutoAudioResolver.candidateLexicalCoverage(need, titleMatch)
                  val tagCoverage = FreesoundAutoAudioResolver.candidateLexicalCoverage(need, tagMatch)

                  assertTrue(descriptionCoverage > titleCoverage)
                  assertTrue(titleCoverage > tagCoverage)
                  assertTrue(FreesoundAutoAudioResolver.candidateMeetsLexicalFloor(need, descriptionMatch))
                  assertTrue(FreesoundAutoAudioResolver.candidateMeetsLexicalFloor(need, titleMatch))
                  assertTrue(FreesoundAutoAudioResolver.candidateMeetsLexicalFloor(need, tagMatch))

                  val descriptionScore = FreesoundAutoAudioResolver.scoreCandidate(need, descriptionMatch, 0)
                  val titleScore = FreesoundAutoAudioResolver.scoreCandidate(need, titleMatch, 0)
                  val tagScore = FreesoundAutoAudioResolver.scoreCandidate(need, tagMatch, 0)
                  assertTrue(descriptionScore > titleScore)
                  assertTrue(titleScore > tagScore)
              }

              private fun track(
                  id: String,
                  title: String,
                  description: String,
              ) = SceneMusicTrackEntity(
                  id = id,
                  title = title,
                  uri = "file:///tmp/$id.mp3",
                  tagsCsv = description,
                  volume = 1.0f,
                  enabled = true,
                  updatedAt = 1L,
              )
          }
          KOTLIN

      - name: Run focused unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'vn.nghetruyen.app.freesound.DescriptionFirstMatchingTest' --tests 'vn.nghetruyen.app.freesound.FreesoundAutoAudioTest'

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/test/java/vn/nghetruyen/app/freesound/DescriptionFirstMatchingTest.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(audio): description-only local matching and description-first Freesound ranking"
            git push origin HEAD:fix/mode3-resolution-quality-20260822
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk
          sha256sum dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk | tee dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-DescriptionFirst-APK
          path: |
            dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk
            dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk.sha256
          if-no-files-found: error
          retention-days: 14
