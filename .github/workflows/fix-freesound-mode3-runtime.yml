name: Fix Freesound Mode 3 runtime

on:
  push:
    branches:
      - agent/freesound-stage-1
    paths:
      - ".github/workflows/fix-freesound-mode3-runtime.yml"

permissions:
  contents: write

concurrency:
  group: fix-freesound-mode3-runtime
  cancel-in-progress: false

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/freesound-stage-1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply Freesound Mode 3 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 occurrence, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new))

          # 1) Mode 3: if all story-audio layers are OFF, entering Mode 3 should activate
          # the three intended layers once. Preserve explicit partial choices.
          path = "app/src/main/java/vn/nghetruyen/app/ui/components/StoryAudioSourceModeSelector.kt"
          replace_once(
              path,
              "import vn.nghetruyen.app.audio.StoryAudioSourceMode\n",
              "import vn.nghetruyen.app.audio.AudioDirectionPreferences\nimport vn.nghetruyen.app.audio.StoryAudioSourceMode\n",
          )
          replace_once(
              path,
              '''                store.set(mode)
                          if (mode != StoryAudioSourceMode.LOCAL_MANUAL) {
                              // The manual background-music toggle is hidden in AI modes. Keep the shared
                              // runtime gate open so Mode 2/3 music plans cannot be disabled by stale Mode-1 state.
                              application.container.settingsRepository.setBackgroundMusicEnabled(true)
                          }
          ''',
              '''                store.set(mode)
                          val settingsRepository = application.container.settingsRepository
                          val audioPreferences = AudioDirectionPreferences.shared(application)
                          if (mode != StoryAudioSourceMode.LOCAL_MANUAL) {
                              // The manual background-music toggle is hidden in AI modes. Keep the shared
                              // runtime gate open so Mode 2/3 music plans cannot be disabled by stale Mode-1 state.
                              settingsRepository.setBackgroundMusicEnabled(true)
                          }
                          if (mode == StoryAudioSourceMode.AI_FREESOUND) {
                              // Mode 3 previously allowed all three story-audio layers to remain OFF. In that
                              // state the unified AI request legitimately contained voice-cast only, which looked
                              // exactly like a broken Freesound runtime: voices were assigned but no search ran.
                              // Activate the intended Mode-3 defaults only when the user has no active audio layer;
                              // an explicit partial selection (for example SFX-only) is preserved.
                              val appSettings = settingsRepository.snapshot()
                              val audioSettings = audioPreferences.snapshot()
                              if (!appSettings.autoSceneMusicEnabled &&
                                  !audioSettings.ambienceEnabled &&
                                  !audioSettings.soundEffectsEnabled
                              ) {
                                  settingsRepository.setAutoSceneMusicEnabled(true)
                                  audioPreferences.setAmbienceEnabled(true)
                                  audioPreferences.setSoundEffectsEnabled(true)
                              }
                          }
          ''',
          )
          replace_once(
              path,
              '''                "Freesound chỉ dùng để tìm và tải trước. Khi đọc truyện, Mode 3 chỉ phát các file local đã được resolve cho kế hoạch AI hiện tại; không dùng playlist tuần tự/ngẫu nhiên của Mode 1. Asset không resolve được thì lớp tương ứng giữ im lặng.",
          ''',
              '''                "Freesound chỉ dùng để tìm và tải trước. Khi đọc truyện, Mode 3 chỉ phát các file Freesound đã resolve cho kế hoạch AI hiện tại; không dùng playlist tuần tự/ngẫu nhiên của Mode 1. Nếu trước khi vào Mode 3 cả ba lớp âm thanh đều đang tắt, ứng dụng sẽ tự bật MUSIC + AMBIENCE + SFX để tránh trạng thái chỉ phân vai giọng nhưng không hề yêu cầu âm thanh.",
          ''',
          )

          # 2) Mode-3 runtime must never build ambience variants from Mode-1/2 local files.
          path = "app/src/main/java/vn/nghetruyen/app/playback/AudioDirectionRuntime.kt"
          replace_once(
              path,
              "import vn.nghetruyen.app.data.repository.LibraryRepository\n",
              "import vn.nghetruyen.app.data.repository.LibraryRepository\nimport vn.nghetruyen.app.freesound.FreesoundImporter\n",
          )
          replace_count(
              path,
              "buildRuntimeAssets(rawTracks, settings)",
              "buildRuntimeAssets(rawTracks, settings, sourceMode)",
              2,
          )
          replace_once(
              path,
              '''    private fun buildRuntimeAssets(
                  rawTracks: List<SceneMusicTrackEntity>,
                  settings: AudioDirectionPreferences.Snapshot,
              ): List<AudioDirectionAsset> = rawTracks.map { track ->
          ''',
              '''    private fun buildRuntimeAssets(
                  rawTracks: List<SceneMusicTrackEntity>,
                  settings: AudioDirectionPreferences.Snapshot,
                  sourceMode: StoryAudioSourceMode,
              ): List<AudioDirectionAsset> = rawTracks
                  .asSequence()
                  .filter { track ->
                      !StoryAudioModeRouter.usesAiFreesound(sourceMode) ||
                          FreesoundImporter.soundIdFromManagedUri(track.uri) != null
                  }
                  .map { track ->
          ''',
          )
          replace_once(path, "    }.filter { it.id.isNotBlank() && it.uri.isNotBlank() }\n", "    }.filter { it.id.isNotBlank() && it.uri.isNotBlank() }.toList()\n")

          # 3) Preserve Freesound network/auth/rate-limit failures and never reuse a disabled duplicate.
          path = "app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt"
          replace_once(
              path,
              '''data class FreesoundAutoResolveResult(
              val resolved: List<FreesoundAutoResolvedNeed>,
              val warnings: List<String>,
              val importedTrackIds: Set<String>,
          ) {
          ''',
              '''data class FreesoundAutoResolveResult(
              val resolved: List<FreesoundAutoResolvedNeed>,
              val warnings: List<String>,
