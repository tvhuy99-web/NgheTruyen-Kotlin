              val retryableFailure: Boolean = false,
          ) {
          ''',
          )
          replace_once(
              path,
              "private enum class FreesoundAutoResolutionSource { CACHE, FREESOUND, UNRESOLVED }\n",
              "private enum class FreesoundAutoResolutionSource { CACHE, FREESOUND, UNRESOLVED }\n\ninternal data class FreesoundAutoSearchOutcome(\n    val sound: FreesoundSound?,\n    val failureMessage: String? = null,\n    val retryable: Boolean = false,\n)\n",
          )
          replace_once(
              path,
              '''        val warnings = mutableListOf<String>()
              val imported = linkedSetOf<String>()
              val resolutions = mutableListOf<FreesoundAutoResolvedNeed>()
          ''',
              '''        val warnings = mutableListOf<String>()
              val imported = linkedSetOf<String>()
              val resolutions = mutableListOf<FreesoundAutoResolvedNeed>()
              var retryableFailure = false
          ''',
          )
          replace_once(
              path,
              '''            val remote = searchBest(need)
              var resolvedTrack: SceneMusicTrackEntity? = null
              if (remote != null) {
                  val import = importer.importPreview(
                      sound = remote,
                      kind = need.kind,
                      normalizationTargetLufs = normalizationTarget(need.kind),
                  )
                  if (import.isSuccess) {
                      val result = import.getOrThrow()
                      imported += result.trackId
                      resolvedTrack = runCatching { existingTracksProvider() }.getOrDefault(emptyList())
                          .firstOrNull { it.id == result.trackId }
                  } else if (import.exceptionOrNull() is FreesoundDuplicateException) {
