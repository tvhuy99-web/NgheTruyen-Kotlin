'''
          replace_once(
              matcher_path,
              '''    private val LOCAL_STOPWORDS = setOf(''',
              concept_map + '''    private val LOCAL_STOPWORDS = setOf(''',
              'matcher bilingual audible concept dictionary',
          )

          # 3) Diagnostics: rejectReason is not data loss; blank error= is not a warning.
          deep_path = 'app/src/main/java/vn/nghetruyen/app/sourceplatform/DiagnosticDeepBlackBox.kt'
          replace_once(
              deep_path,
              '''    private fun reportsDroppedData(event: DiagnosticEvent): Boolean = event.attributes.any { (key, rawValue) ->\n        if (!key.contains("drop", true) && !key.contains("evict", true) && !key.contains("reject", true)) {\n            return@any false\n        }''',
              '''    private fun reportsDroppedData(event: DiagnosticEvent): Boolean = event.attributes.any { (key, rawValue) ->\n        // A semantic matcher field such as rejectReason describes a candidate decision, not lost\n        // diagnostics. Only data-retention counters/flags are allowed to make lossVisible=true.\n        if (key.contains("reason", true)) return@any false\n        if (!key.contains("drop", true) && !key.contains("evict", true) && !key.contains("reject", true)) {\n            return@any false\n        }''',
