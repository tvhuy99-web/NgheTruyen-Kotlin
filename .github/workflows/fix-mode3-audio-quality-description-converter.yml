name: Fix Mode3 Audio Quality + Description Converter

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/fix-mode3-audio-quality-description-converter.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected source for {label}: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('PATCHED', label)

          # 1) Resolver: verify ALL local URIs exist before a local asset can win/skip network.
          resolver_path = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt'
          replace_once(
              resolver_path,
              'import android.content.Context\nimport java.security.MessageDigest',
              'import android.content.Context\nimport android.net.Uri\nimport java.io.File\nimport java.security.MessageDigest',
              'resolver local URI imports',
          )
          replace_once(
              resolver_path,
              '''    private fun resolutionCycleKey(needs: List<FreesoundAutoSearchNeed>): String =\n        needs.joinToString("\\u001e") { need ->\n            buildString {\n                append(need.kind.name)\n                append('\\u001f')\n                append(FreesoundAutoRequirementAggregator.normalizeQuery(need.query))\n                append('\\u001f')\n                append(need.importance.name)\n                need.usages.forEach { usage ->\n                    append('\\u001d').append(usage.localContext.trim())\n                    append('\\u001c').append(usage.startUnitId.orEmpty())\n                    append('\\u001c').append(usage.endUnitId.orEmpty())\n                    append('\\u001c').append(usage.unitId.orEmpty())\n                    append('\\u001c').append(usage.stopUnitId.orEmpty())\n                    append('\\u001c').append(usage.repeatCount)\n                    append('\\u001c').append(usage.cadence.name)\n                    append('\\u001c').append(usage.loopUntilStop)\n                }\n            }\n        }''',
              '''    private fun resolutionCycleKey(needs: List<FreesoundAutoSearchNeed>): String =\n        needs.sortedWith(\n            compareBy<FreesoundAutoSearchNeed> { it.kind.name }\n                .thenBy { FreesoundAutoRequirementAggregator.normalizeQuery(it.query) }\n                .thenBy { it.importance.name },\n        ).joinToString("\\u001e") { need ->\n            // Asset identity depends on semantic need, not on volatile unit/timeline ids.\n            // Keeping unit ids in this fingerprint made the same completed 7/7 asset set resolve again\n            // when prefetch and active playback represented the same scene with different boundaries.\n            val contexts = need.usages.asSequence()\n                .map { it.localContext.trim().replace(Regex("\\\\s+"), " ").lowercase() }\n                .filter(String::isNotBlank)\n                .distinct()\n                .sorted()\n                .toList()\n            buildString {\n                append(need.kind.name)\n                append('\\u001f')\n                append(FreesoundAutoRequirementAggregator.normalizeQuery(need.query))\n                append('\\u001f')\n                append(need.importance.name)\n                contexts.forEach { context -> append('\\u001d').append(context) }\n            }\n        }''',
              'stable semantic resolution cycle fingerprint',
          )
          replace_once(
              resolver_path,
              '''    private fun isUsableLibraryTrack(track: SceneMusicTrackEntity, kind: AudioAssetKind): Boolean {\n        if (!track.enabled || track.id.isBlank() || track.uri.isBlank()) return false\n        if (AudioAssetClassifier.classify(track) != kind) return false\n        if (!isManagedFreesoundTrack(track)) return true\n        return FreesoundImporter.soundIdFromManagedUri(track.uri) != null &&\n            FreesoundImporter.managedFileExists(appContext, track.uri)\n    }''',
              '''    private fun isUsableLibraryTrack(track: SceneMusicTrackEntity, kind: AudioAssetKind): Boolean {\n        if (!track.enabled || track.id.isBlank() || track.uri.isBlank()) return false\n        if (AudioAssetClassifier.classify(track) != kind) return false\n        if (!isManagedFreesoundTrack(track)) return libraryUriExists(track.uri)\n        return FreesoundImporter.soundIdFromManagedUri(track.uri) != null &&\n            FreesoundImporter.managedFileExists(appContext, track.uri)\n    }\n\n    private fun libraryUriExists(uriValue: String): Boolean {\n        val clean = uriValue.trim()\n        if (clean.isBlank()) return false\n        val parsed = runCatching { Uri.parse(clean) }.getOrNull()\n        return when (parsed?.scheme?.lowercase()) {\n            "content" -> runCatching {\n                appContext.contentResolver.openFileDescriptor(parsed, "r")?.use { descriptor ->\n                    descriptor.statSize != 0L\n                } ?: false\n            }.getOrDefault(false)\n            "file" -> parsed.path?.let(::File)?.let { it.isFile && it.length() > 0L } == true\n            null, "" -> File(clean).let { it.isFile && it.length() > 0L }\n            else -> runCatching {\n                appContext.contentResolver.openAssetFileDescriptor(parsed, "r")?.use { descriptor ->\n                    descriptor.length != 0L\n                } ?: false\n            }.getOrDefault(false)\n        }\n    }''',
              'reject missing local asset before matching',
          )

          # 2) Matcher: hard audible/source concepts prevent context words from turning rain into wind,
          # explosion into sword strike, etc. This is source-neutral and applies to local + remote.
          matcher_path = 'app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt'
          replace_once(
              matcher_path,
              '''        val eventToken: String?,\n        val hints: List<LocalHint>,''',
              '''        val eventToken: String?,\n        val requiredConcepts: Set<String>,\n        val hints: List<LocalHint>,''',
              'matcher need required concepts',
          )
          replace_once(
              matcher_path,
              '''        val englishAvoidTokens: Set<String>,\n        val sections: Sections,''',
              '''        val englishAvoidTokens: Set<String>,\n        val sections: Sections,\n        val audibleConcepts: Set<String>,''',
              'matcher indexed audible concepts',
          )
          replace_once(
              matcher_path,
              '''    private fun indexTrack(track: SceneMusicTrackEntity): IndexedTrack {\n        val sections = sections(track.tagsCsv)\n        return IndexedTrack(\n            track = track,\n            englishTitleTokens = FreesoundAutoRequirementAggregator.queryTokens(track.title),\n            englishMetadataTokens = FreesoundAutoRequirementAggregator.queryTokens(track.tagsCsv),\n            englishAvoidTokens = FreesoundAutoRequirementAggregator.queryTokens(sections.avoidText),\n            sections = sections,\n        )\n    }''',
              '''    private fun indexTrack(track: SceneMusicTrackEntity): IndexedTrack {\n        val sections = sections(track.tagsCsv)\n        val audibleText = if (sections.structured) {\n            listOf(track.title, sections.shadeText, sections.useText).joinToString(" ")\n        } else {\n            "${track.title} ${track.tagsCsv}"\n        }\n        return IndexedTrack(\n            track = track,\n            englishTitleTokens = FreesoundAutoRequirementAggregator.queryTokens(track.title),\n            englishMetadataTokens = FreesoundAutoRequirementAggregator.queryTokens(track.tagsCsv),\n            englishAvoidTokens = FreesoundAutoRequirementAggregator.queryTokens(sections.avoidText),\n            sections = sections,\n            audibleConcepts = audibleConcepts(audibleText),\n        )\n    }''',
              'matcher audible concepts exclude avoid section',
          )
          replace_once(
              matcher_path,
              '''            coreToken = coreToken,\n            eventToken = eventToken,\n            hints = hints,''',
              '''            coreToken = coreToken,\n            eventToken = eventToken,\n            requiredConcepts = audibleConcepts(need.query),\n            hints = hints,''',
              'matcher need concept extraction',
          )
          replace_once(
              matcher_path,
              '''        val qualified = when (need.kind) {\n            AudioAssetKind.SFX -> if (event != null) {\n                lexical >= REMOTE_SFX_STRONG_QUERY_COVERAGE ||\n                    (lexical >= REMOTE_SFX_RELAXED_QUERY_COVERAGE && (corePresent || eventPresent))\n            } else {\n                lexical >= RAW_MIN_QUERY_COVERAGE ||\n                    (corePresent && lexical >= CORE_ONLY_MIN_QUERY_COVERAGE)\n            }\n            else -> lexical >= LEGACY_MIN_QUERY_COVERAGE\n        }\n        val fit = if (!qualified) {''',
              '''        val lexicalQualified = when (need.kind) {\n            AudioAssetKind.SFX -> if (event != null) {\n                lexical >= REMOTE_SFX_STRONG_QUERY_COVERAGE ||\n                    (lexical >= REMOTE_SFX_RELAXED_QUERY_COVERAGE && (corePresent || eventPresent))\n            } else {\n                lexical >= RAW_MIN_QUERY_COVERAGE ||\n                    (corePresent && lexical >= CORE_ONLY_MIN_QUERY_COVERAGE)\n            }\n            else -> lexical >= LEGACY_MIN_QUERY_COVERAGE\n        }\n        val requiredConcepts = audibleConcepts(need.query)\n        val candidateConcepts = audibleConcepts(\n            buildString {\n                append(sound.name).append(' ')\n                append(sound.description).append(' ')\n                append(sound.tags.joinToString(" "))\n            },\n        )\n        val conceptCoverage = conceptCoverage(requiredConcepts, candidateConcepts)\n        val conceptConflict = requiredConcepts.isNotEmpty() && candidateConcepts.isNotEmpty() && conceptCoverage <= 0.0\n        val qualified = lexicalQualified && !conceptConflict\n        val fit = if (!qualified) {''',
              'remote audible concept gate',
          )
          replace_once(
              matcher_path,
              '''        val metadataQuality = when {\n            semanticMetadata -> "STRUCTURED"\n            indexed.sections.structured -> "PARTIAL"\n            else -> "RAW"\n        }\n\n        if (!hintAware && queryCoverage <= 0.0) return null''',
              '''        val metadataQuality = when {\n            semanticMetadata -> "STRUCTURED"\n            indexed.sections.structured -> "PARTIAL"\n            else -> "RAW"\n        }\n        val requiredConcepts = profile.requiredConcepts\n        val conceptCoverage = conceptCoverage(requiredConcepts, indexed.audibleConcepts)\n        val conceptConflict = requiredConcepts.isNotEmpty() &&\n            indexed.audibleConcepts.isNotEmpty() &&\n            conceptCoverage <= 0.0\n\n        if (!hintAware && queryCoverage <= 0.0) return null''',
              'local audible concept evidence',
          )
          replace_once(
              matcher_path,
              '''        val selectionScore = (\n            selectionBase -\n                avoidCoverage * 0.48 -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)''',
              '''        val conceptFactor = if (requiredConcepts.isEmpty() || indexed.audibleConcepts.isEmpty()) {\n            1.0\n        } else {\n            0.80 + conceptCoverage * 0.20\n        }\n        val selectionScore = (\n            selectionBase * conceptFactor -\n                avoidCoverage * 0.48 -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)''',
              'local concept-calibrated selection score',
          )
          replace_once(
              matcher_path,
              '''            eventCoverage = eventCoverage,\n            conflict = avoidCoverage,\n        )''',
              '''            eventCoverage = eventCoverage,\n            conflict = avoidCoverage,\n            conceptConflict = conceptConflict,\n        )''',
              'matcher reject concept argument',
          )
          replace_once(
              matcher_path,
              '''        eventCoverage: Double,\n        conflict: Double,\n    ): String {\n        val reasons = buildList {\n            if (conflict >= MAX_CONFLICT) add("conflict>=$MAX_CONFLICT")''',
              '''        eventCoverage: Double,\n        conflict: Double,\n        conceptConflict: Boolean,\n    ): String {\n        val reasons = buildList {\n            if (conceptConflict) add("sourceConceptMismatch")\n            if (conflict >= MAX_CONFLICT) add("conflict>=$MAX_CONFLICT")''',
              'matcher hard source concept rejection',
          )
          concept_helpers = r'''
    private fun audibleConcepts(value: String): Set<String> {
        val normalized = localNormalize(value)
        if (normalized.isBlank()) return emptySet()
        val padded = " $normalized "
        return AUDIBLE_CONCEPT_ALIASES.asSequence()
            .filter { (_, aliases) -> aliases.any { alias -> padded.contains(" $alias ") } }
            .mapTo(linkedSetOf()) { it.key }
    }

    private fun conceptCoverage(required: Set<String>, candidate: Set<String>): Double {
        if (required.isEmpty()) return 1.0
        if (candidate.isEmpty()) return 0.0
        return required.count(candidate::contains).toDouble() / required.size.toDouble()
    }

'''
          replace_once(
              matcher_path,
              '''    private fun firstMarker(lower: String, vararg markers: String): Int = markers''',
              concept_helpers + '''    private fun firstMarker(lower: String, vararg markers: String): Int = markers''',
              'matcher concept helpers',
          )
          concept_map = r'''
