name: Fix proxy model discovery

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix_proxy_model_discovery.py
      - .github/workflows/fix-proxy-model-discovery.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply proxy model discovery fix
        run: python3 scripts/fix_proxy_model_discovery.py
      - name: Assert proxy model discovery behavior
        run: |
          grep -q 'apiKey?.let { header("Authorization", "Bearer $it") }' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'AiProvider.GEMINI -> {' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'aiModelDiscoveryStatus' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          grep -q 'validationMessage = state.aiModelDiscoveryStatus' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -q 'versionCode = 31' app/build.gradle.kts
      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only
      - name: Compile and build stable-signed APK
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon
      - name: Verify APK signature and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi '534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4' /tmp/certs.txt
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "versionCode='31'" /tmp/badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-proxy-model-fix-v31
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit product fix and remove temporary tooling
        run: |
          rm -rf .gradle
          rm -f scripts/fix_proxy_model_discovery.py
          rm -f .github/workflows/fix-proxy-model-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make proxy model discovery work"
          git push origin HEAD:agent/reference-ui-position-parity
