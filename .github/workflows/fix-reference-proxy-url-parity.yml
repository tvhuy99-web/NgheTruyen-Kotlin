name: Fix reference proxy URL parity

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix_reference_proxy_url_parity.py
      - scripts/fix_reference_proxy_extract_followup.py
      - .github/workflows/fix-reference-proxy-url-parity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply reference proxy URL parity fix
        run: |
          python3 scripts/fix_reference_proxy_url_parity.py
          python3 scripts/fix_reference_proxy_extract_followup.py

      - name: Assert exact reference behaviors
        run: |
          grep -q 'require(value.startsWith("https://", ignoreCase = true))' app/src/main/java/vn/nghetruyen/app/ai/AiEndpointPolicy.kt
          ! grep -q 'uri.path' app/src/main/java/vn/nghetruyen/app/ai/AiEndpointPolicy.kt
          ! grep -q 'localhost' app/src/main/java/vn/nghetruyen/app/ai/AiEndpointPolicy.kt
          grep -q 'private fun openAiCandidateUrls' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'OPENAI_ENDPOINT_FALLBACK_HTTP_CODES = setOf(404, 405)' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'if (apiKey.isNotBlank()) put("Authorization", "Bearer $apiKey")' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'extractOpenAiContent' app/src/main/java/vn/nghetruyen/app/ai/OnlineAiServices.kt
          grep -q 'versionCode = 32' app/build.gradle.kts

      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only

      - name: Compile and build stable-signed APK
        run: bash ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon

      - name: Verify APK signature and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi '534bf882c96a59ccf4310d18d02b14b62aa68e2beff3b6d05bf308e9909eb2f4' /tmp/certs.txt
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "versionCode='32'" /tmp/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-reference-proxy-url-v32
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit product fix and remove temporary tooling
        run: |
          rm -rf .gradle
          rm -f scripts/fix_reference_proxy_url_parity.py
          rm -f scripts/fix_reference_proxy_extract_followup.py
          rm -f .github/workflows/fix-reference-proxy-url-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: match reference proxy URL handling"
          git push origin HEAD:agent/reference-ui-position-parity
