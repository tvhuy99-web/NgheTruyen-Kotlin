name: Apply Rhino compatibility patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-rhino-api.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Rhino API usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt")
          text = source.read_text(encoding="utf-8")
          old_shutter = "        classShutter = ClassShutter { false }"
          new_shutter = "        setClassShutter(ClassShutter { false })"
          old_ids = '    override val ids: Array<Any> get() = Array(elements.size + 1) { index -> if (index < elements.size) index else "length" }'
          new_ids = '    override fun getIds(): Array<Any> = Array(elements.size + 1) { index -> if (index < elements.size) index else "length" }'
          if old_shutter not in text:
              raise SystemExit("Rhino classShutter assignment not found")
          if old_ids not in text:
              raise SystemExit("Rhino ids override not found")
          source.write_text(text.replace(old_shutter, new_shutter).replace(old_ids, new_ids), encoding="utf-8")

          workflow = Path(".github/workflows/final-apk-build-v2.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = '      - "app/src/**"\n'
          source_trigger = '      - "source-vbook/**"\n'
          if source_trigger not in workflow_text:
              if marker not in workflow_text:
                  raise SystemExit("APK workflow path marker not found")
              workflow.write_text(workflow_text.replace(marker, marker + source_trigger), encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-rhino-api.yml
          git add -A
          git commit -m "fix: update VBook Rhino 1.9.1 API usage"
          git push origin HEAD:main
