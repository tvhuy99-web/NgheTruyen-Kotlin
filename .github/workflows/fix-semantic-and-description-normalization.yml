name: Fix Semantic Matcher + Global Description Normalization

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/fix-semantic-and-description-normalization.yml'

permissions:
  contents: write

jobs:
  patch-and-build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply four fixes and global description normalizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected source for {label}: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('PATCHED', label)

          # ------------------------------------------------------------------
          # 1 + 2) Source-concept accuracy and one common LOCAL/REMOTE fit scale.
          # ------------------------------------------------------------------
          matcher = 'app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt'

          replace_once(
              matcher,
              '''    data class RemoteFit(\n        val score: Double,\n        val coreCoverage: Double,\n        val eventCoverage: Double,\n        val qualified: Boolean,\n    )''',
              '''    data class RemoteFit(\n        val score: Double,\n        val coreCoverage: Double,\n        val eventCoverage: Double,\n        val qualified: Boolean,\n        val sourceConceptCoverage: Double = 0.0,\n        val sourceConflictConfidence: Double = 0.0,\n    )''',
              'remote fit common semantic fields',
          )

          old_remote = '''        val requiredConcepts = audibleConcepts(need.query)\n        val candidateConcepts = audibleConcepts(\n            buildString {\n                append(sound.name).append(' ')\n                append(sound.description).append(' ')\n                append(sound.tags.joinToString(" "))\n            },\n        )\n        val conceptCoverage = conceptCoverage(requiredConcepts, candidateConcepts)\n        val conceptConflict = requiredConcepts.isNotEmpty() && candidateConcepts.isNotEmpty() && conceptCoverage <= 0.0\n        val qualified = lexicalQualified && !conceptConflict\n        val fit = if (!qualified) {\n            0.0\n        } else if (need.kind == AudioAssetKind.SFX && event != null) {\n            // Do not require both exact source and exact event words. A strong combined lexical match\n            // is valid evidence on its own; exact core/event tokens add confidence when present.\n            ((coreCoverage * 0.24 + eventCoverage * 0.24 + lexical * 0.52) * 0.84).coerceIn(0.0, 1.0)\n        } else {\n            ((coreCoverage * 0.52 + lexical * 0.48) * 0.84).coerceIn(0.0, 1.0)\n        }\n        return RemoteFit(\n            score = fit,\n            coreCoverage = coreCoverage,\n            eventCoverage = eventCoverage,\n            qualified = qualified,\n        )'''
          new_remote = '''        val requiredConcepts = audibleConcepts(need.query)\n        val candidateConcepts = audibleConcepts(\n            buildString {\n                append(sound.name).append(' ')\n                append(sound.description).append(' ')\n                append(sound.tags.joinToString(" "))\n            },\n        )\n        val sourceCoverage = sourceConceptCoverage(requiredConcepts, candidateConcepts)\n        val sourceConflict = sourceConflictConfidence(requiredConcepts, candidateConcepts)\n        val qualified = lexicalQualified && sourceConflict < HARD_SOURCE_CONFLICT_CONFIDENCE\n        val fit = if (!qualified) {\n            0.0\n        } else {\n            commonSemanticFit(\n                kind = need.kind,\n                lexicalCoverage = lexical,\n                coreCoverage = coreCoverage,\n                eventCoverage = eventCoverage,\n                sourceCoverage = sourceCoverage,\n                hasSourceRequirement = requiredConcepts.any(AUDIBLE_SOURCE_CONCEPTS::contains),\n                contextScore = 0.0,\n                hasStructuredContext = false,\n            )\n        }\n        return RemoteFit(\n            score = fit,\n            coreCoverage = coreCoverage,\n            eventCoverage = eventCoverage,\n            qualified = qualified,\n            sourceConceptCoverage = sourceCoverage,\n            sourceConflictConfidence = sourceConflict,\n        )'''
          replace_once(matcher, old_remote, new_remote, 'remote common semantic fit')

          old_local_concepts = '''        val requiredConcepts = profile.requiredConcepts\n        val conceptCoverage = conceptCoverage(requiredConcepts, indexed.audibleConcepts)\n        val conceptConflict = requiredConcepts.isNotEmpty() &&\n            indexed.audibleConcepts.isNotEmpty() &&\n            conceptCoverage <= 0.0'''
          new_local_concepts = '''        val requiredConcepts = profile.requiredConcepts\n        val sourceCoverage = sourceConceptCoverage(requiredConcepts, indexed.audibleConcepts)\n        val sourceConflict = sourceConflictConfidence(requiredConcepts, indexed.audibleConcepts)'''
          replace_once(matcher, old_local_concepts, new_local_concepts, 'local source concept confidence')

          old_selection = '''        val contextEvidence = if (hintAware && semanticMetadata && contextScore > 0.0) {\n            (0.55 + contextScore * 0.45).coerceIn(0.0, 1.0)\n        } else 0.0\n        val queryEvidence = if (profile.kind == AudioAssetKind.SFX && profile.eventToken != null) {\n            (\n                coreCoverage * 0.36 +\n                    eventCoverage * 0.36 +\n                    queryCoverage * 0.23 +\n                    titleQueryCoverage * 0.05\n                ).coerceIn(0.0, 1.0)\n        } else {\n            (\n                coreCoverage * 0.52 +\n                    queryCoverage * 0.43 +\n                    titleQueryCoverage * 0.05\n                ).coerceIn(0.0, 1.0)\n        }\n        val selectionBase = if (hintAware && semanticMetadata && contextEvidence > 0.0) {\n            contextEvidence * 0.65 + queryEvidence * 0.35\n        } else {\n            // Query-only candidates use the same evidence ceiling whether they are local files\n            // or fresh Freesound results. Provenance contributes zero points.\n            queryEvidence * 0.84\n        }\n        val conceptFactor = if (requiredConcepts.isEmpty() || indexed.audibleConcepts.isEmpty()) {\n            1.0\n        } else {\n            0.80 + conceptCoverage * 0.20\n        }\n        val selectionScore = (\n            selectionBase * conceptFactor -\n                avoidCoverage * 0.48 -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)'''
          new_selection = '''        // LOCAL and fresh Freesound candidates now share the exact same base fit formula.\n        // Structured Vietnamese context is only a small refinement; it no longer creates a separate\n        // lower/higher score universe depending on where the file came from.\n        val selectionBase = commonSemanticFit(\n            kind = profile.kind,\n            lexicalCoverage = queryCoverage,\n            coreCoverage = coreCoverage,\n            eventCoverage = eventCoverage,\n            sourceCoverage = sourceCoverage,\n            hasSourceRequirement = requiredConcepts.any(AUDIBLE_SOURCE_CONCEPTS::contains),\n            contextScore = contextScore,\n            hasStructuredContext = hintAware && semanticMetadata,\n        )\n        val selectionScore = (\n            selectionBase -\n                avoidCoverage * 0.48 -\n                sourceConflict * SOFT_SOURCE_CONFLICT_PENALTY -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)'''
          replace_once(matcher, old_selection, new_selection, 'one source-neutral fit scale')

          replace_once(
              matcher,
              '''            conflict = avoidCoverage,\n            conceptConflict = conceptConflict,\n        )''',
              '''            conflict = avoidCoverage,\n            sourceConflictConfidence = sourceConflict,\n        )''',
              'reject source conflict confidence arg',
          )
          replace_once(
              matcher,
              '''        conflict: Double,\n        conceptConflict: Boolean,\n    ): String {\n        val reasons = buildList {\n            if (conceptConflict) add("sourceConceptMismatch")''',
              '''        conflict: Double,\n        sourceConflictConfidence: Double,\n    ): String {\n        val reasons = buildList {\n            if (sourceConflictConfidence >= HARD_SOURCE_CONFLICT_CONFIDENCE) {\n                add("sourceConceptMismatch>=${HARD_SOURCE_CONFLICT_CONFIDENCE}")\n            }''',
              'confidence-aware source rejection',
          )

          old_helpers = '''    private fun conceptCoverage(required: Set<String>, candidate: Set<String>): Double {\n        if (required.isEmpty()) return 1.0\n        if (candidate.isEmpty()) return 0.0\n        return required.count(candidate::contains).toDouble() / required.size.toDouble()\n    }'''
          new_helpers = '''    private fun conceptCoverage(required: Set<String>, candidate: Set<String>): Double {\n        if (required.isEmpty()) return 1.0\n        if (candidate.isEmpty()) return 0.0\n        return required.count(candidate::contains).toDouble() / required.size.toDouble()\n    }\n\n    private fun sourceConceptCoverage(required: Set<String>, candidate: Set<String>): Double {\n        val requiredSources = required.filterTo(linkedSetOf(), AUDIBLE_SOURCE_CONCEPTS::contains)\n        if (requiredSources.isEmpty()) return 1.0\n        val candidateSources = candidate.filterTo(linkedSetOf(), AUDIBLE_SOURCE_CONCEPTS::contains)\n        if (candidateSources.isEmpty()) return 0.0\n        return requiredSources.count(candidateSources::contains).toDouble() / requiredSources.size.toDouble()\n    }\n\n    /**\n     * Hard mismatch is reserved for a clear, specific audible-source contradiction. Missing concept\n     * vocabulary is not a contradiction. This prevents a high-quality classroom chatter description\n     * from being rejected merely because one alias was unknown, while rain-vs-wind or explosion-vs-sword\n     * remain strongly contradictory when both sources are explicitly present.\n     */\n    private fun sourceConflictConfidence(required: Set<String>, candidate: Set<String>): Double {\n        val requiredSources = required.filterTo(linkedSetOf(), AUDIBLE_SOURCE_CONCEPTS::contains)\n        val candidateSources = candidate.filterTo(linkedSetOf(), AUDIBLE_SOURCE_CONCEPTS::contains)\n        if (requiredSources.isEmpty() || candidateSources.isEmpty()) return 0.0\n        if (requiredSources.any(candidateSources::contains)) return 0.0\n        fun specificity(size: Int): Double = when (size) {\n            1 -> 1.0\n            2 -> 0.86\n            else -> 0.70\n        }\n        return ((specificity(requiredSources.size) + specificity(candidateSources.size)) / 2.0)\n            .coerceIn(0.0, 1.0)\n    }\n\n    private fun commonSemanticFit(\n        kind: AudioAssetKind,\n        lexicalCoverage: Double,\n        coreCoverage: Double,\n        eventCoverage: Double,\n        sourceCoverage: Double,\n        hasSourceRequirement: Boolean,\n        contextScore: Double,\n        hasStructuredContext: Boolean,\n    ): Double {\n        val lexical = lexicalCoverage.coerceIn(0.0, 1.0)\n        val core = coreCoverage.coerceIn(0.0, 1.0)\n        val event = eventCoverage.coerceIn(0.0, 1.0)\n        val source = sourceCoverage.coerceIn(0.0, 1.0)\n        val base = when (kind) {\n            AudioAssetKind.SFX -> if (hasSourceRequirement) {\n                lexical * 0.30 + core * 0.20 + event * 0.20 + source * 0.30\n            } else {\n                lexical * 0.45 + core * 0.30 + event * 0.25\n            }\n            AudioAssetKind.MUSIC, AudioAssetKind.AMBIENCE -> if (hasSourceRequirement) {\n                lexical * 0.35 + core * 0.25 + source * 0.40\n            } else {\n                lexical * 0.58 + core * 0.42\n            }\n        }\n        val contextAdjustment = if (hasStructuredContext) {\n            ((contextScore.coerceIn(0.0, 1.0) - 0.50) * 0.18).coerceIn(-0.09, 0.09)\n        } else 0.0\n        return (base + contextAdjustment).coerceIn(0.0, 1.0)\n    }'''
          replace_once(matcher, old_helpers, new_helpers, 'shared semantic fit helpers')

          replace_once(
              matcher,
              '''    private const val MAX_CONFLICT = 0.48\n    private const val MAX_LOCAL_TOKENS = 72''',
              '''    private const val MAX_CONFLICT = 0.48\n    private const val HARD_SOURCE_CONFLICT_CONFIDENCE = 0.82\n    private const val SOFT_SOURCE_CONFLICT_PENALTY = 0.18\n    private const val MAX_LOCAL_TOKENS = 72''',
              'source conflict thresholds',
          )

          replace_once(
              matcher,
              '''        "CROWD" to setOf("crowd", "chatter", "people", "conversation", "dam dong", "đám đông", "tro chuyen", "trò chuyện", "tieng nguoi", "tiếng người"),''',
              '''        "CROWD" to setOf("crowd", "chatter", "people", "conversation", "talk", "talking", "students", "student", "voices", "dam dong", "đám đông", "tro chuyen", "trò chuyện", "noi chuyen", "nói chuyện", "hoc sinh", "học sinh", "tieng nguoi", "tiếng người"),''',
              'crowd chatter aliases',
          )
          replace_once(
              matcher,
              '''        "COMBAT" to setOf("battle", "combat", "fight", "fighting", "war", "chien dau", "chiến đấu", "dai chien", "đại chiến", "giao chien", "giao chiến"),\n        "BIRD"''',
              '''        "COMBAT" to setOf("battle", "combat", "fight", "fighting", "war", "chien dau", "chiến đấu", "dai chien", "đại chiến", "giao chien", "giao chiến"),\n        "PUNCH" to setOf("punch", "punching", "fist", "dam", "đấm", "cu dam", "cú đấm", "quyen", "quyền"),\n        "KICK" to setOf("kick", "kicking", "da", "đá", "cu da", "cú đá"),\n        "FALL" to setOf("fall", "falling", "body fall", "drop", "collapse", "nga", "ngã", "roi", "rơi", "do nguoi", "đổ người"),\n        "CLOTH" to setOf("cloth", "clothes", "clothing", "fabric", "jacket", "ao", "áo", "quan ao", "quần áo", "vai", "vải"),\n        "GRAB" to setOf("grab", "grabbing", "grip", "grasp", "nam", "nắm", "chop", "chộp", "giat", "giật"),\n        "BIRD"''',
              'combat action/material aliases',
          )
          replace_once(
              matcher,
              '''    private val LOCAL_STOPWORDS = setOf(''',
              '''    private val AUDIBLE_SOURCE_CONCEPTS = setOf(\n        "WIND", "RAIN", "WATER", "FIRE", "THUNDER", "LIGHTNING", "EXPLOSION",\n        "SWORD", "SHIELD", "WHOOSH", "FOOTSTEP", "DOOR", "BELL", "CROWD",\n        "TRAFFIC", "BICYCLE", "PIANO", "GUITAR", "ORCHESTRA", "STRINGS", "DRUMS",\n        "FLUTE", "VOCAL", "BIRD", "PUNCH", "KICK", "CLOTH",\n    )\n\n    private val LOCAL_STOPWORDS = setOf(''',
              'audible source taxonomy',
          )

          # ------------------------------------------------------------------
          # 4) Close AI auxiliary diagnostic operations with the same trace id.
          # ------------------------------------------------------------------
          xpk = 'app/src/main/java/vn/nghetruyen/app/ai/XpkNarrationAiServices.kt'
          old_aux = '''    suspend fun completeAuxiliaryJson(\n        storyId: String,\n        prompt: String,\n    ): AppResult<AiAuxiliaryJsonResult> {\n        val clean = prompt.trim()\n        if (clean.isBlank()) return failure("AI_EMPTY_INPUT", "Yêu cầu AI đang trống.")\n        if (clean.length > MAX_PROMPT_CHARS) {\n            return failure("AI_INPUT_TOO_LARGE", "Yêu cầu AI vượt giới hạn gửi trong một lượt.")\n        }\n        val config = resolveConfiguration(storyId)\n        validateConfiguration(config)?.let { return it }\n        diagnostic(\n            "AI_AUXILIARY_JSON_START",\n            attributes = mapOf(\n                "storyId" to storyId,\n                "provider" to config.provider.name,\n                "model" to config.model,\n                "inputChars" to clean.length.toString(),\n            ),\n        )\n        return when (val response = chat(clean, config)) {\n            is AppResult.Failure -> response\n            is AppResult.Success -> AppResult.Success(\n                AiAuxiliaryJsonResult(\n                    content = response.value,\n                    provider = config.provider.name,\n                    model = config.model,\n                ),\n            )\n        }\n    }'''
          new_aux = '''    suspend fun completeAuxiliaryJson(\n        storyId: String,\n        prompt: String,\n    ): AppResult<AiAuxiliaryJsonResult> {\n        val clean = prompt.trim()\n        if (clean.isBlank()) return failure("AI_EMPTY_INPUT", "Yêu cầu AI đang trống.")\n        if (clean.length > MAX_PROMPT_CHARS) {\n            return failure("AI_INPUT_TOO_LARGE", "Yêu cầu AI vượt giới hạn gửi trong một lượt.")\n        }\n        val config = resolveConfiguration(storyId)\n        validateConfiguration(config)?.let { return it }\n        val traceId = "ai-aux:${UUID.randomUUID()}"\n        val startedNanos = System.nanoTime()\n        diagnostic(\n            "AI_AUXILIARY_JSON_START",\n            DiagnosticSeverity.INFO,\n            attributes = mapOf(\n                "storyId" to storyId,\n                "provider" to config.provider.name,\n                "model" to config.model,\n                "inputChars" to clean.length.toString(),\n            ),\n            traceId = traceId,\n        )\n        return when (val response = chat(clean, config)) {\n            is AppResult.Failure -> {\n                diagnostic(\n                    "AI_AUXILIARY_JSON_FAILED",\n                    DiagnosticSeverity.WARN,\n                    attributes = mapOf(\n                        "storyId" to storyId,\n                        "provider" to config.provider.name,\n                        "model" to config.model,\n                        "elapsedMs" to ((System.nanoTime() - startedNanos) / 1_000_000L).toString(),\n                        "code" to response.code,\n                        "message" to response.message.take(300),\n                    ),\n                    traceId = traceId,\n                )\n                response\n            }\n            is AppResult.Success -> {\n                diagnostic(\n                    "AI_AUXILIARY_JSON_COMPLETED",\n                    DiagnosticSeverity.INFO,\n                    attributes = mapOf(\n                        "storyId" to storyId,\n                        "provider" to config.provider.name,\n                        "model" to config.model,\n                        "elapsedMs" to ((System.nanoTime() - startedNanos) / 1_000_000L).toString(),\n                        "outputChars" to response.value.length.toString(),\n                    ),\n                    traceId = traceId,\n                )\n                AppResult.Success(\n                    AiAuxiliaryJsonResult(\n                        content = response.value,\n                        provider = config.provider.name,\n                        model = config.model,\n                    ),\n                )\n            }\n        }\n    }'''
          replace_once(xpk, old_aux, new_aux, 'auxiliary AI terminal diagnostics')

          # ------------------------------------------------------------------
          # 3) Recover original Freesound description by sound id when rebuilding old metadata.
          # ------------------------------------------------------------------
          fsclient = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundClient.kt'
          sound_lookup = r'''
    /** Fetch one sound by id so legacy AI-written metadata can be rebuilt from Freesound's source description. */
    suspend fun sound(soundId: Int): FreesoundSound? = withContext(Dispatchers.IO) {
        if (soundId <= 0) return@withContext null
        val apiKey = credentialStore.apiKey() ?: return@withContext null
        awaitLocalRatePermit()
        val url = API_BASE_URL.toHttpUrl().newBuilder()
            .addPathSegment("sounds")
            .addPathSegment(soundId.toString())
            .addPathSegment("")
            .addQueryParameter("fields", SEARCH_FIELDS)
            .build()
        val request = Request.Builder()
            .url(url)
            .header("Authorization", "Token $apiKey")
            .header("Accept", "application/json")
            .header("User-Agent", USER_AGENT)
            .get()
            .build()
        runCatching {
            httpClient.newCall(request).execute().use { response ->
                if (!response.isSuccessful) return@use null
                val item = JSONObject(response.body.string())
                val id = item.optInt("id", -1)
                if (id <= 0) return@use null
                val previews = item.optJSONObject("previews")
                FreesoundSound(
                    id = id,
                    name = item.optString("name").trim().ifBlank { "Sound #$id" },
                    description = item.optString("description").trim().take(4_000),
                    durationSeconds = item.optDouble("duration", 0.0).coerceAtLeast(0.0),
                    previewHqMp3 = previews?.optString("preview-hq-mp3")
                        ?.trim()?.takeIf { it.startsWith("https://", ignoreCase = true) },
                    previewHqOgg = previews?.optString("preview-hq-ogg")
                        ?.trim()?.takeIf { it.startsWith("https://", ignoreCase = true) },
                    username = item.optString("username").trim().take(120),
                    license = item.optString("license").trim().take(240),
                    webUrl = item.optString("url").trim()
                        .takeIf { it.startsWith("https://freesound.org/", ignoreCase = true) }.orEmpty(),
                    tags = buildList {
                        val array = item.optJSONArray("tags")
                        if (array != null) for (index in 0 until array.length()) {
                            array.optString(index).trim().takeIf(String::isNotBlank)?.let(::add)
                        }
                    },
                    category = item.optString("category").trim().take(120),
                    subcategory = item.optString("subcategory").trim().take(160),
                    categoryCode = item.optString("category_code").trim().take(40),
                    avgRating = item.optDouble("avg_rating", 0.0).takeIf(Double::isFinite)?.coerceIn(0.0, 5.0) ?: 0.0,
                    numRatings = item.optInt("num_ratings", 0).coerceAtLeast(0),
                    numDownloads = item.optInt("num_downloads", 0).coerceAtLeast(0),
                    searchScore = item.optDouble("score", 0.0).takeIf(Double::isFinite)?.coerceAtLeast(0.0) ?: 0.0,
                )
            }
        }.getOrNull()
    }

'''
          replace_once(
              fsclient,
              '''    fun clearSearchCache() {''',
              sound_lookup + '''    fun clearSearchCache() {''',
              'Freesound source description lookup',
          )

          # ------------------------------------------------------------------
          # Global description normalizer UI: one button for MUSIC + AMBIENCE + SFX.
          # ------------------------------------------------------------------
          normalizer_path = Path('app/src/main/java/vn/nghetruyen/app/ui/components/AudioDescriptionNormalizationDialog.kt')
          normalizer_path.write_text(r'''package vn.nghetruyen.app.ui.components

import androidx.compose.foundation.layout.Column
import androidx.compose.foundation.layout.Row
