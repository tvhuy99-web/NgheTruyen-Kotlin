      - name: Commit fixed source
        shell: bash
        run: |
          git config user.name "chatgpt-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app .github/workflows/fix-semantic-and-description-normalization.yml
          git commit -m "fix: improve semantic matching and normalize descriptions globally" || true
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          if [ -f .sdk-packages ]; then xargs -r sdkmanager < .sdk-packages; fi

      - name: Build APK only
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NgheTruyen-Semantic-Description-Normalization.apk
          sha256sum NgheTruyen-Semantic-Description-Normalization.apk > NgheTruyen-Semantic-Description-Normalization.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Semantic-Description-Normalization
          path: |
            NgheTruyen-Semantic-Description-Normalization.apk
            NgheTruyen-Semantic-Description-Normalization.apk.sha256
          retention-days: 30
