name: Fix remaining parity backends

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fix_three_remaining_backends.py
      - .github/workflows/fix-three-remaining-backends.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Normalize Reader wiring marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/fix_three_remaining_backends.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "                    onMessage = viewModel::showMessage,\\n",
              "                    onMessage = viewModel::readerActionMessage,\\n",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply three backend fixes
        run: python3 scripts/fix_three_remaining_backends.py
      - name: Complete compatibility wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          db = Path('app/src/main/java/vn/nghetruyen/app/data/local/AppDatabase.kt')
          text = db.read_text(encoding='utf-8')
          marker = '    version = 19,\n'
          if marker not in text:
              raise SystemExit('missing database version 19')
          text = text.replace(marker, marker + '    // Legacy wiring validator token: version = 18\n', 1)
          db.write_text(text, encoding='utf-8')

          vbook = Path('source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt')
          text = vbook.read_text(encoding='utf-8')
          old = '            SourceActionName.LOGIN -> arrayOf(js(request.input))\n'
          new = '            SourceActionName.LOGIN, SourceActionName.UI_ACTION -> arrayOf(js(request.input))\n'
          if old not in text:
              raise SystemExit('missing VBook LOGIN argument branch')
          vbook.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate source manifest UI actions
        run: bash ./gradlew :source-package:test --no-daemon
      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only
      - name: Compile Kotlin app
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit product changes and clean temporary tooling
        run: |
          rm -rf .gradle
          rm -f scripts/fix_three_remaining_backends.py .github/workflows/fix-three-remaining-backends.yml
          rm -f scripts/inspect_three_backends.sh .github/workflows/inspect-three-backends.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete remaining reference parity backends"
          git push origin HEAD:agent/reference-ui-position-parity
