name: Full Project Audit Temp

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - .github/workflows/full-project-audit-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/remove-unused-files

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android lint audit
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace

      - name: Run repository-wide static audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          root = Path('.')
          tracked = [Path(p) for p in __import__('subprocess').check_output(['git','ls-files'], text=True).splitlines()]
          text_ext = {'.kt','.kts','.java','.xml','.gradle','.properties','.toml','.py','.sh','.ps1','.yml','.yaml','.md','.txt','.json','.lua'}
          texts = {}
          for p in tracked:
              if p.suffix.lower() not in text_ext:
                  continue
              try:
                  texts[p] = p.read_text(encoding='utf-8', errors='replace')
              except Exception:
                  pass

          production = {p:t for p,t in texts.items() if '/src/test/' not in f'/{p.as_posix()}' and '/src/androidTest/' not in f'/{p.as_posix()}' and not p.as_posix().startswith('.github/')}
          joined_prod = '\n'.join(production.values())

          print('=== AUDIT SUMMARY ===')
          print('tracked_files=', len(tracked))
          print('text_files=', len(texts))
          print('production_text_chars=', len(joined_prod))

          patterns = {
              'TODO_FIXME_HACK': re.compile(r'\b(?:TODO|FIXME|HACK|XXX)\b', re.I),
              'DEPRECATED': re.compile(r'@Deprecated\b|\bdeprecated\b', re.I),
              'SUPPRESS_UNUSED': re.compile(r'@Suppress\([^\n]*(?:UNUSED|unused)'),
              'PRINTLN_DEBUG': re.compile(r'\b(?:println|printStackTrace)\s*\('),
              'ANDROID_LOG': re.compile(r'\bLog\.(?:v|d|i|w|e|wtf)\s*\('),
              'GLOBAL_SCOPE': re.compile(r'\bGlobalScope\b'),
              'RUN_BLOCKING': re.compile(r'\brunBlocking\s*\('),
              'THREAD_SLEEP': re.compile(r'\bThread\.sleep\s*\('),
              'WHILE_TRUE': re.compile(r'while\s*\(\s*true\s*\)'),
              'LEGACY_RETIRE_MARKER': re.compile(r'\b(?:legacy|retired|obsolete|compatibility only|compatibility metadata)\b', re.I),
          }
          for name, pattern in patterns.items():
              hits=[]
              for p,t in texts.items():
                  for i,line in enumerate(t.splitlines(),1):
                      if pattern.search(line): hits.append((str(p),i,line.strip()[:240]))
              print(f'\n=== {name} ({len(hits)}) ===')
              for h in hits[:200]: print(f'{h[0]}:{h[1]}: {h[2]}')

          # Heuristic: private/internal named functions/classes/objects/properties whose identifier
          # appears only once in production text. These are candidates only, not deletion proof.
          decl_re = re.compile(r'(?m)^\s*(?:private\s+|internal\s+)(?:(?:suspend|inline|tailrec|operator|infix|data|sealed|enum|value|fun)\s+)*(?:fun|class|object|interface|val|var)\s+([A-Za-z_][A-Za-z0-9_]*)')
          candidates=[]
          for p,t in production.items():
              if not p.suffix.lower() in {'.kt','.java'}: continue
              for m in decl_re.finditer(t):
                  name=m.group(1)
                  if len(name)<4: continue
                  count=len(re.findall(rf'\b{re.escape(name)}\b', joined_prod))
                  if count==1:
                      line=t.count('\n',0,m.start())+1
                      candidates.append((str(p),line,name))
          print(f'\n=== PRIVATE_INTERNAL_SINGLE_OCCURRENCE_CANDIDATES ({len(candidates)}) ===')
          for p,line,name in candidates[:300]: print(f'{p}:{line}: {name}')

          # Scripts that look like one-shot patch/milestone machinery and are not referenced elsewhere.
          script_candidates=[]
          for p,t in texts.items():
              if not p.as_posix().startswith('scripts/'): continue
              if not re.search(r'^(?:apply_|build-milestone|m[0-9]+_|.*audit.*v[0-9])', p.name, re.I): continue
              refs=[]
              for q,u in texts.items():
                  if q==p: continue
                  if p.name in u or p.as_posix() in u: refs.append(str(q))
              script_candidates.append((str(p),len(refs),refs[:8]))
          print(f'\n=== SCRIPT_LEGACY_CANDIDATES ({len(script_candidates)}) ===')
          for p,n,refs in script_candidates: print(f'{p}: external_refs={n} {refs}')

          # Root markdown report/checklist docs with zero incoming textual references.
          root_docs=[]
          for p,t in texts.items():
              if p.parent != Path('.') or p.suffix.lower() != '.md': continue
              if not re.search(r'(REPORT|STATUS|CHECKLIST|BASELINE|PHASE|MILESTONE|QUICKSTART|WIREFLOW|PARITY)', p.name, re.I): continue
              refs=[]
              for q,u in texts.items():
                  if q==p: continue
                  if p.name in u: refs.append(str(q))
              root_docs.append((p.name,len(refs),refs[:8]))
          print(f'\n=== ROOT_DOC_ZERO_REFERENCE_CANDIDATES ({len(root_docs)}) ===')
          for p,n,refs in root_docs: print(f'{p}: external_refs={n} {refs}')

          # Largest tracked files / assets.
          sized=[]
          for p in tracked:
              try: sized.append((p.stat().st_size,str(p)))
              except OSError: pass
          print('\n=== LARGEST_TRACKED_FILES ===')
          for size,p in sorted(sized, reverse=True)[:60]: print(f'{size:10d} {p}')
          print('\n=== LARGE_RUNTIME_ASSETS_OVER_100KB ===')
          for size,p in sorted(sized, reverse=True):
              if size < 100_000: break
              if '/src/main/assets/' in f'/{p}' or '/src/main/res/' in f'/{p}': print(f'{size:10d} {p}')

          # Duplicate source hashes among tracked files (exact duplicates, ignore tiny files).
          import hashlib
          buckets={}
          for p in tracked:
              try:
                  data=p.read_bytes()
              except OSError:
                  continue
              if len(data)<256: continue
              buckets.setdefault(hashlib.sha256(data).hexdigest(),[]).append((str(p),len(data)))
          dups=[v for v in buckets.values() if len(v)>1]
          print(f'\n=== EXACT_DUPLICATE_FILES ({len(dups)}) ===')
          for group in sorted(dups, key=lambda g: -g[0][1])[:100]: print(group)

          # Lint report excerpt if generated.
          lint_candidates=list(Path('app/build/reports').glob('lint-results-*.txt'))
          print(f'\n=== LINT_TEXT_REPORTS ({len(lint_candidates)}) ===')
          for p in lint_candidates:
              data=p.read_text(errors='replace')
              print(f'--- {p} chars={len(data)} ---')
              print(data[:50000])
          PY

      - name: Remove temporary audit workflow
        if: always()
        run: rm -f .github/workflows/full-project-audit-temp.yml

      - name: Commit audit workflow cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary full-project audit workflow'
            git push origin HEAD:agent/remove-unused-files
          fi
