name: Reconstruct source packs from history and build APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/history-repair-build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_NAME: NgheTruyen-v2.8.0-debug-apk
  CHUNK_REF: de03bfd84ec28d5e57b8f080d2e70b72810b25d1

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run start
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "STATUS=reconstructing"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "ARTIFACT_ID="
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
          } > BUILD_APK_RESULT.txt
          git add BUILD_APK_RESULT.txt
          git commit -m "build: record historical repair start"
          git push origin HEAD:main

      - name: Reconstruct all verified source packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sourcepack-fixed
          mkdir -p /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks

          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import itertools
          import json
          import os
          import pathlib
          import subprocess
          import tarfile
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          ref = os.environ["CHUNK_REF"]
          output = pathlib.Path("/tmp/sourcepack-fixed/app/src/main/assets/sourcepacks")

          blobs = {
              "demo.ntsource": "699ff6986368131ae0cb7cc0576e9177d40cfe4f",
              "sangtacviet.ntsource": "1751822e35dcfab5b9991137b215e660ca9044b5",
              "truyencom.ntsource": "48b6fc4b3f0ebf4e3f62e18908bd005a4d874ae9",
              "truyencv.ntsource": "0ce03d958246af2d2435276a6430286ca8e0b740",
              "truyenfull.ntsource": "85021f0abc26991829098f2bc39909f44beae66c",
          }
          for name, sha in blobs.items():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              (output / name).write_bytes(base64.b64decode(payload["content"]))

          listed = subprocess.check_output([
              "git", "ls-tree", "-r", "--name-only", ref,
              ".github/sourcepack-repair",
          ], text=True).splitlines()
          paths = [p for p in listed if p]
          if not paths:
              raise SystemExit("No historical repair chunks found")
          chunks = {}
          for path in paths:
              raw = subprocess.check_output(["git", "show", f"{ref}:{path}"])
              chunks[path] = b"".join(raw.split()).decode("ascii")
              print(f"CHUNK {path} chars={len(chunks[path])}")

          expected = {
              "truyenyy.ntsource": "7abe52ec0873005956e50e5fcc9600b4333315826dd5d8e7719b1549da45daad",
              "wattpad.ntsource": "15a51dfc16813322fccf58acab792ce2d7173f898f7011fbcec28781baa678b5",
              "wikidich.ntsource": "562b237cca67dae2791660ba617d159774b9f4f56ebed6dd5bb4ad8058531e56",
          }

          found = None
          keys = list(chunks)
          for count in range(1, len(keys) + 1):
              for order in itertools.permutations(keys, count):
                  joined = "".join(chunks[p] for p in order)
                  try:
                      payload = base64.b64decode(joined, validate=True)
                  except Exception:
                      continue
                  try:
                      with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as archive:
                          extracted = {}
                          for member in archive.getmembers():
                              if not member.isfile():
                                  continue
                              name = pathlib.PurePosixPath(member.name).name
                              if name in expected:
                                  handle = archive.extractfile(member)
                                  if handle is not None:
                                      extracted[name] = handle.read()
                  except Exception:
                      continue
                  if set(extracted) != set(expected):
                      continue
                  actual = {name: hashlib.sha256(data).hexdigest() for name, data in extracted.items()}
                  if actual != expected:
                      continue
                  found = (order, extracted, hashlib.sha256(payload).hexdigest())
                  break
              if found:
                  break

          if not found:
              raise SystemExit("Historical chunks did not reconstruct the verified archive")

          order, extracted, archive_sha = found
          print("RECONSTRUCTED_ORDER=" + ",".join(order))
          print("RECONSTRUCTED_ARCHIVE_SHA256=" + archive_sha)
          for name, data in extracted.items():
              (output / name).write_bytes(data)
          PY

          cat > /tmp/all-sourcepacks.sha256 <<'EOF'
          efbaafa94c4c1472d86ea0b358200ed8a383437285514d3c988a95119d4a0138  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/demo.ntsource
          1b99700e6894de0181524a3127a0cf3d1954ba8268ff4d3f91b551ebdb582055  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/sangtacviet.ntsource
          043bc8ad6073fb1e47c52651fc724dc2c4308edb880bd28bc4eb489cff338d38  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyencom.ntsource
          7e6dea97ee79119a176b6818fd52634d64211c0a3a4895ef6e65b458700de33a  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyencv.ntsource
          0462ffb4aa939dbcd6ead955ba5c752538c9a2b72d6ff79bcc914e095764ba91  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyenfull.ntsource
          7abe52ec0873005956e50e5fcc9600b4333315826dd5d8e7719b1549da45daad  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/truyenyy.ntsource
          15a51dfc16813322fccf58acab792ce2d7173f898f7011fbcec28781baa678b5  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/wattpad.ntsource
          562b237cca67dae2791660ba617d159774b9f4f56ebed6dd5bb4ad8058531e56  /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/wikidich.ntsource
          EOF
          sed -i 's/^          //' /tmp/all-sourcepacks.sha256
          sha256sum --check /tmp/all-sourcepacks.sha256
          cp -f /tmp/sourcepack-fixed/app/src/main/assets/sourcepacks/*.ntsource \
            app/src/main/assets/sourcepacks/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Validate repaired source
        id: validate
        run: python3 scripts/validate_release.py

      - name: Build debug APK
        id: build
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Create checksum
        id: checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Commit repair and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM_LINE=""
          if [[ -f app-debug.apk.sha256 ]]; then
            CHECKSUM_LINE="$(cat app-debug.apk.sha256)"
          fi
          rm -f .github/workflows/history-repair-build.yml
          rm -rf .github/sourcepack-repair .github/apk-repair
          {
            echo "STATUS=${{ job.status }}"
            echo "COMMIT_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "VALIDATE_OUTCOME=${{ steps.validate.outcome }}"
            echo "BUILD_OUTCOME=${{ steps.build.outcome }}"
            echo "UPLOAD_OUTCOME=${{ steps.upload_apk.outcome }}"
            echo "ARTIFACT_ID=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
            if [[ -n "${CHECKSUM_LINE}" ]]; then
              echo "${CHECKSUM_LINE}"
            fi
          } > BUILD_APK_RESULT.txt
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore source packs and record APK build"
          git push origin HEAD:main
