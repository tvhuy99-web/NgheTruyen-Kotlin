name: Inspect AI settings parity

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-ai-settings-parity.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
      - name: Inspect AI settings wiring
        run: |
          echo '=== AI contracts ==='
          grep -R -n 'data class TranslationRequest\|class TranslationRequest\|data class VietPhraseImprovementRequest' app/src/main/java/vn/nghetruyen/app/ai
          echo '=== Settings read/write AI ==='
          n=$(grep -n 'private fun JsonWriter.writeSettings' app/src/main/java/vn/nghetruyen/app/transfer/BackupTransferManager.kt | cut -d: -f1 | head -1)
          sed -n "${n},$((n+230))p" app/src/main/java/vn/nghetruyen/app/transfer/BackupTransferManager.kt
          echo '=== Personal settings dispatch ==='
          n=$(grep -n 'if (showSettingsDialog)' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt | cut -d: -f1 | head -1)
          sed -n "$((n-20)),$((n+80))p" app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          echo '=== App AI wiring ==='
          sed -n '155,200p' app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt
