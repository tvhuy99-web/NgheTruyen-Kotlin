name: Build Six Diagnostics Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-six-fixes.yml
      - scripts/apply_six_log_fixes.py

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply all six fixes
        run: |
          python3 scripts/apply_six_log_fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt')
          text = p.read_text(encoding='utf-8')
          text = text.replace('event.name.uppercase(Locale.ROOT)', 'event.name.uppercase()')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched TruyenFull source
        run: |
          set -euxo pipefail
          gzip -dc app/src/main/assets/source-lua/nguon_truyenfull_native.lua.gz.gz > /tmp/truyenfull.gz
          gzip -dc /tmp/truyenfull.gz > /tmp/truyenfull.lua
          grep -n 'version = 14' /tmp/truyenfull.lua
          grep -n "href.*/chuong-" /tmp/truyenfull.lua | head
          grep -n 'Truyenfull' /tmp/truyenfull.lua | head

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-six-log-fixes.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-six-log-fixes-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-six-log-fixes.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_six_log_fixes.py
          rm -f .github/workflows/inspect-six-fixes.yml
          git restore --worktree -- gradlew || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/vn/nghetruyen/app/data/repository/LibraryRepository.kt \
            app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePackStorySource.kt \
            app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt \
            app/src/main/java/vn/nghetruyen/app/sourceplatform/DiagnosticDeepBlackBox.kt \
            source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt \
            app/src/main/assets/source-lua/nguon_truyenfull_native.lua.gz.gz \
            scripts/apply_six_log_fixes.py \
            .github/workflows/inspect-six-fixes.yml
          git commit -m "fix: repair stale cache toc ids and diagnostics [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare
