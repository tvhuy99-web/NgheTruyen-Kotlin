name: Inspect Six Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-six-fixes.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Inspect exact targets
        run: |
          set -euxo pipefail
          echo '=== LibraryRepository loadCachedChapter ==='
          f=app/src/main/java/vn/nghetruyen/app/data/repository/LibraryRepository.kt
          grep -n 'loadCachedChapter' "$f" || true
          line=$(grep -n 'loadCachedChapter' "$f" | head -1 | cut -d: -f1 || true); if [ -n "$line" ]; then sed -n "$((line-35)),$((line+65))p" "$f"; fi
          echo '=== AppViewModel open chapter ==='
          sed -n '2600,2735p' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          echo '=== SourceDiagnosticRuntime critical store/policy/export ==='
          sed -n '1,180p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt
          sed -n '280,410p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt
          sed -n '455,510p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt
          echo '=== PersistentCriticalDiagnosticPolicy ==='
          grep -R -n -A120 -B20 'object PersistentCriticalDiagnosticPolicy\|class PersistentCriticalDiagnosticPolicy' app/src/main/java app/src/test || true
          echo '=== DiagnosticDeepBlackBox data loss ==='
          sed -n '220,285p' app/src/main/java/vn/nghetruyen/app/sourceplatform/DiagnosticDeepBlackBox.kt
          echo '=== SourcePackStorySource paging ==='
          sed -n '315,375p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePackStorySource.kt
          sed -n '480,535p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePackStorySource.kt
          sed -n '560,600p' app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePackStorySource.kt
          echo '=== VBookJsRuntime TOC storyId ==='
          sed -n '980,1020p' source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt
          sed -n '1105,1148p' source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt
          echo '=== Native source relevant ==='
          gzip -dc app/src/main/assets/source-lua/nguon_truyenfull_native.lua.gz.gz > /tmp/a.gz
          gzip -dc /tmp/a.gz > /tmp/source.lua
          sed -n '45,65p' /tmp/source.lua
          sed -n '345,420p' /tmp/source.lua
          sed -n '390,425p' /tmp/source.lua
