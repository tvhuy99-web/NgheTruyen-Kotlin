name: Inspect TruyenFull Sourcepack

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Inspect normalizeResult
        run: |
          set -euxo pipefail
          f=source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt
          line=$(grep -n 'private fun normalizeResult' "$f" | head -1 | cut -d: -f1)
          start=$((line-20)); end=$((line+260))
          echo "normalizeResult line=$line"
          sed -n "${start},${end}p" "$f"
