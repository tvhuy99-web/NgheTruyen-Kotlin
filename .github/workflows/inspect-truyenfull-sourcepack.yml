name: Inspect TruyenFull Sourcepack

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Locate native-v2 generator
        run: |
          set -euxo pipefail
          echo '=== htmlParagraphs references ==='
          grep -R -n --exclude-dir=.git --exclude='*.ntsource' 'htmlParagraphs' . | head -n 300 || true
          echo '=== native_v2_core references ==='
          grep -R -n --exclude-dir=.git --exclude='*.ntsource' 'native_v2_core' . | head -n 300 || true
          echo '=== chapter parser/generator references ==='
          grep -R -n --exclude-dir=.git --exclude='*.ntsource' -E 'NATIVE_V2|selectHtmlObject|selectHtmlArray|wholeText\(\)|chapter-c' source-* app/src/main/java | head -n 500 || true
