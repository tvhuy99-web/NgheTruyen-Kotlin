name: Inspect TruyenFull Sourcepack

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Locate result normalization
        run: |
          set -euxo pipefail
          echo '=== NORMALIZED MARKER ==='
          grep -R -n --exclude-dir=.git 'VBOOK_STAGE_RESULT_NORMALIZED' source-* app/src/main/java || true
          echo '=== RAW MARKER ==='
          grep -R -n --exclude-dir=.git 'VBOOK_STAGE_RESULT_STRINGIFIED\|executor-result-normalized\|executor-result-raw' source-* app/src/main/java || true
          echo '=== chapterBody calls ==='
          grep -R -n --exclude-dir=.git 'chapterBody(' source-* app/src/main/java || true
          echo '=== VBookStoryNormalizer calls ==='
          grep -R -n --exclude-dir=.git 'VBookStoryNormalizer' source-* app/src/main/java || true
