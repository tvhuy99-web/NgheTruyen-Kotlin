name: Inspect TruyenFull Sourcepack

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Inspect sourcepack
        run: |
          set -euxo pipefail
          rm -rf /tmp/truyenfull-pack
          mkdir -p /tmp/truyenfull-pack
          unzip -q app/src/main/assets/sourcepacks/truyenfull.ntsource -d /tmp/truyenfull-pack
          echo '=== FILES ==='
          find /tmp/truyenfull-pack -maxdepth 3 -type f -printf '%P\n' | sort
          echo '=== SOURCE JSON ==='
          cat /tmp/truyenfull-pack/source.json
          echo '=== CHAPTER ACTION ==='
          cat /tmp/truyenfull-pack/actions/chapter.json
          echo '=== CHAPTER FIXTURE HTTP ==='
          cat /tmp/truyenfull-pack/fixtures/chapter.http.json
          echo '=== CHAPTER FIXTURE EXPECTED ==='
          cat /tmp/truyenfull-pack/fixtures/chapter.expected.json
          echo '=== ALL CHAPTER-RELATED ACTION MATCHES ==='
          grep -R -n -E 'content|paragraph|chapter|selector|remove|hidden|display' /tmp/truyenfull-pack/actions /tmp/truyenfull-pack/source.json | head -n 400 || true
