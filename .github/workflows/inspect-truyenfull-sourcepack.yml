name: Inspect TruyenFull Sourcepack

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
      - name: Inspect TruyenFull native Lua
        run: |
          set -euxo pipefail
          cp app/src/main/assets/source-lua/nguon_truyenfull_native.lua.gz.gz /tmp/source.gz.gz
          gzip -dc /tmp/source.gz.gz > /tmp/source.gz
          gzip -dc /tmp/source.gz > /tmp/source.lua
          echo '=== SIZE ==='
          wc -c -l /tmp/source.lua
          echo '=== CHAPTER MATCHES ==='
          grep -n -E 'chapter|chapters|paragraph|chapter-c|chapter-content|articleBody|remove|selector|content' /tmp/source.lua | head -n 500 || true
          echo '=== SOURCE ==='
          sed -n '1,520p' /tmp/source.lua
