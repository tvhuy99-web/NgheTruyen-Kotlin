name: Build Native Chapter Content Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_native_chapter_content_normalization_fix.py
      - .github/workflows/inspect-truyenfull-sourcepack.yml

permissions:
  contents: write

jobs:
  patch-test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/freesound-latency-status-cloudflare
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply chapter normalization fix
        run: python3 scripts/apply_native_chapter_content_normalization_fix.py

      - name: Run focused regression test
        run: |
          chmod +x ./gradlew
          ./gradlew :source-vbook:test --tests 'vn.nghetruyen.source.vbook.VBookChapterContentNormalizationRegressionTest' --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/NgheTruyen-native-chapter-content-fix.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-native-chapter-content-fix-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/NgheTruyen-native-chapter-content-fix.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        run: |
          rm -f scripts/apply_native_chapter_content_normalization_fix.py
          rm -f .github/workflows/inspect-truyenfull-sourcepack.yml
          git restore --worktree -- gradlew || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/VBookJsRuntime.kt \
            source-vbook/src/test/kotlin/vn/nghetruyen/source/vbook/VBookChapterContentNormalizationRegressionTest.kt \
            scripts/apply_native_chapter_content_normalization_fix.py \
            .github/workflows/inspect-truyenfull-sourcepack.yml
          git commit -m "fix: preserve direct chapter text in native results [skip ci]"
          git push origin HEAD:fix/freesound-latency-status-cloudflare
