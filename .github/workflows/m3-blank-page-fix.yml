name: M3 Blank Page Fix

on:
  push:
    branches:
      - agent/m3-chromium-js-engine
    paths:
      - '.github/workflows/m3-blank-page-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m3-chromium-js-engine
          fetch-depth: 0
      - name: Patch Chromium page initialization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt')
          text = path.read_text(encoding='utf-8')

          old = '''        val webViewRef = AtomicReference<WebView?>()\n        val completed = AtomicBoolean(false)'''
          new = '''        val webViewRef = AtomicReference<WebView?>()\n        val completed = AtomicBoolean(false)\n        val evaluationStarted = AtomicBoolean(false)'''
          if text.count(old) != 1:
              raise SystemExit('completed/evaluation marker mismatch')
          text = text.replace(old, new, 1)

          old = '''                webView.webViewClient = object : WebViewClient() {\n                    override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse = blockedResponse()\n\n                    override fun onRenderProcessGone(view: WebView, detail: RenderProcessGoneDetail): Boolean {\n                        finish(Result.failure(IllegalStateException("CHROMIUM_RENDERER_GONE:${detail.didCrash()}")))\n                        return true\n                    }\n                }\n                webView.evaluateJavascript(program) { encoded ->\n                    runCatching {\n                        val decoded = JSONTokener(encoded ?: "null").nextValue()\n                        when (decoded) {\n                            is String -> decoded\n                            null -> error("CHROMIUM_RESULT_NULL")\n                            else -> decoded.toString()\n                        }\n                    }.let(::finish)\n                }'''
          new = '''                webView.webViewClient = object : WebViewClient() {\n                    override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse = blockedResponse()\n\n                    override fun onPageFinished(view: WebView, url: String?) {\n                        if (!evaluationStarted.compareAndSet(false, true) || completed.get()) return\n                        view.evaluateJavascript(program) { encoded ->\n                            runCatching {\n                                val decoded = JSONTokener(encoded ?: "null").nextValue()\n                                when (decoded) {\n                                    is String -> decoded\n                                    null -> error("CHROMIUM_RESULT_NULL")\n                                    else -> decoded.toString()\n                                }\n                            }.let(::finish)\n                        }\n                    }\n\n                    override fun onRenderProcessGone(view: WebView, detail: RenderProcessGoneDetail): Boolean {\n                        finish(Result.failure(IllegalStateException("CHROMIUM_RENDERER_GONE:${detail.didCrash()}")))\n                        return true\n                    }\n                }\n                webView.loadUrl("about:blank")'''
          if text.count(old) != 1:
              raise SystemExit('webView evaluation block mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          gate = Path('scripts/check_vbook_chromium_static.py')
          gate_text = gate.read_text(encoding='utf-8')
          old_gate = '''        "main.post {",\n        "engine.post {",\n        "override fun onJsPrompt(",'''
          new_gate = '''        "main.post {",\n        "engine.post {",\n        "override fun onJsPrompt(",\n        "override fun onPageFinished(view: WebView, url: String?)",\n        'webView.loadUrl("about:blank")','''
          if gate_text.count(old_gate) != 1:
              raise SystemExit('static gate marker mismatch')
          gate.write_text(gate_text.replace(old_gate, new_gate, 1), encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt scripts/check_vbook_chromium_static.py
          git commit -m 'fix: initialize Chromium action page before evaluation'
          git push origin HEAD:agent/m3-chromium-js-engine
