name: M3 Dispatch Decoder Fix

on:
  push:
    branches:
      - agent/m3-chromium-js-engine
    paths:
      - '.github/workflows/m3-dispatch-decoder-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m3-chromium-js-engine
          fetch-depth: 0
      - name: Wire strict dispatch decoder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt')
          text = path.read_text(encoding='utf-8')

          old_call = '                    val normalized = decodeCompatibilityResult(raw)'
          new_call = '                    val normalized = ChromiumVBookDispatchDecoder.decode(raw)'
          if text.count(old_call) != 1:
              raise SystemExit('decoder call marker mismatch')
          text = text.replace(old_call, new_call, 1)

          old_fn = '''    private fun decodeCompatibilityResult(raw: String): JsonValue {\n        val first = JsonCodec.parse(raw, maxDepth = 96, maxNodes = 200_000)\n        val decoded = if (first is JsonValue.Str) {\n            runCatching { JsonCodec.parse(first.value, maxDepth = 96, maxNodes = 200_000) }.getOrDefault(first)\n        } else first\n        val obj = decoded as? JsonValue.Obj ?: return decoded\n        val code = obj.int("code")\n        if (code != null && code != 0) error("VBOOK_RESPONSE_ERROR:${obj.string("data") ?: obj.string("error").orEmpty()}")\n        if (obj.bool("success") == false) error("VBOOK_RESPONSE_ERROR:${obj.string("error").orEmpty()}")\n        return when {\n            code == 0 -> obj.values["data"] ?: JsonValue.Null\n            obj.bool("success") == true -> obj.values["data"] ?: JsonValue.Null\n            else -> decoded\n        }\n    }\n\n'''
          if text.count(old_fn) != 1:
              raise SystemExit('old decoder function marker mismatch')
          text = text.replace(old_fn, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt
          git commit -m 'fix: decode Chromium dispatcher ABI layers'
          git push origin HEAD:agent/m3-chromium-js-engine
