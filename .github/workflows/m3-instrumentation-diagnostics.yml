name: M3 Instrumentation Diagnostics Patch

on:
  push:
    branches:
      - agent/m3-chromium-js-engine
    paths:
      - '.github/workflows/m3-instrumentation-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m3-chromium-js-engine
          fetch-depth: 0
      - name: Add useful failure messages to Chromium fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntimeTest.kt'),
              Path('app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookLegacyTest.kt'),
              Path('app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookLifecycleTest.kt'),
              Path('app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookBrowserParityTest.kt'),
          ]
          old = '            assertTrue(result is SourcePlatformResult.Success)'
          new = '''            assertTrue(
                (result as? SourcePlatformResult.Failure)?.let { "${it.error.code}:${it.error.message}" } ?: "expected success",
                result is SourcePlatformResult.Success,
            )'''
          total = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'no success assertion found in {path}')
              text = text.replace(old, new)
              total += count
              path.write_text(text, encoding='utf-8')
          if total != 5:
              raise SystemExit(f'expected 5 assertions, patched {total}')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBook*.kt
          git commit -m 'test: surface Chromium instrumentation failures'
          git push origin HEAD:agent/m3-chromium-js-engine
