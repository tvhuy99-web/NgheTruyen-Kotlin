name: M3 Threading Fix

on:
  push:
    branches:
      - agent/m3-chromium-js-engine
    paths:
      - '.github/workflows/m3-threading-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m3-chromium-js-engine
          fetch-depth: 0

      - name: Patch Chromium WebView threading boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  ''' * A fresh headless WebView is created on a dedicated HandlerThread for every action. Extension code\n * cannot navigate the action WebView and no Java object is installed with addJavascriptInterface.\n * Synchronous vBook host APIs cross one random-token prompt channel as bounded JSON, then re-enter\n * the same SourceCapabilityBrokers used by Rhino.''',
                  ''' * A fresh headless WebView is created and driven on Android's main thread for every action, while\n * synchronous host work is dispatched to a dedicated HandlerThread. Extension code cannot navigate\n * the action WebView and no Java object is installed with addJavascriptInterface. Synchronous vBook\n * host APIs cross one random-token prompt channel as bounded JSON, then re-enter the same\n * SourceCapabilityBrokers used by Rhino without blocking the main thread.'''
              ),
              (
                  '''    private val engineThread = HandlerThread("NgheTruyen-VBook-Chromium").apply { start() }\n    private val engine = Handler(engineThread.looper)\n    private val closed = AtomicBoolean(false)''',
                  '''    private val engineThread = HandlerThread("NgheTruyen-VBook-Chromium").apply { start() }\n    private val engine = Handler(engineThread.looper)\n    private val main = Handler(Looper.getMainLooper())\n    private val closed = AtomicBoolean(false)'''
              ),
              (
                  '''        if (closed.get()) return unavailable("CHROMIUM_RUNTIME_CLOSED", request)\n        if (manifest.runtime.mode != SourceRuntimeMode.VBOOK_JS_COMPAT) {''',
                  '''        if (closed.get()) return unavailable("CHROMIUM_RUNTIME_CLOSED", request)\n        if (Looper.myLooper() == Looper.getMainLooper()) {\n            return unavailable("CHROMIUM_MAIN_THREAD_CALLER_UNSUPPORTED", request)\n        }\n        if (manifest.runtime.mode != SourceRuntimeMode.VBOOK_JS_COMPAT) {'''
              ),
              (
                  '''        fun finish(result: Result<String>) {\n            if (!completed.compareAndSet(false, true)) return\n            outcome.set(result)\n            webViewRef.getAndSet(null)?.let { view -> runCatching { view.stopLoading(); view.destroy() } }\n            latch.countDown()\n        }\n\n        engine.post {\n            runCatching {\n                val webView = WebView(appContext)''',
                  '''        fun destroyWebView() {\n            val view = webViewRef.getAndSet(null) ?: return\n            val destroy = { runCatching { view.stopLoading(); view.destroy() }; Unit }\n            if (Looper.myLooper() == Looper.getMainLooper()) destroy() else main.post(destroy)\n        }\n\n        fun finish(result: Result<String>) {\n            if (!completed.compareAndSet(false, true)) return\n            outcome.set(result)\n            destroyWebView()\n            latch.countDown()\n        }\n\n        main.post {\n            runCatching {\n                val webView = WebView(appContext)'''
              ),
              (
                  '''                        val raw = defaultValue.orEmpty()\n                        val response = runCatching { bridge.handle(raw) }\n                            .getOrElse { error -> bridgeEnvelopeError(error.message ?: error.javaClass.simpleName) }\n                        result.confirm(response)\n                        return true''',
                  '''                        val raw = defaultValue.orEmpty()\n                        engine.post {\n                            val response = runCatching { bridge.handle(raw) }\n                                .getOrElse { error -> bridgeEnvelopeError(error.message ?: error.javaClass.simpleName) }\n                            main.post {\n                                if (completed.get()) runCatching { result.cancel() }\n                                else runCatching { result.confirm(response) }\n                            }\n                        }\n                        return true'''
              ),
              (
                  '''        if (!latch.await(timeoutMs + CALLBACK_GRACE_MS, TimeUnit.MILLISECONDS)) {\n            engine.post {\n                webViewRef.getAndSet(null)?.let { view -> runCatching { view.stopLoading(); view.destroy() } }\n            }\n            return Result.failure(IllegalStateException("CHROMIUM_ACTION_TIMEOUT"))\n        }''',
                  '''        if (!latch.await(timeoutMs + CALLBACK_GRACE_MS, TimeUnit.MILLISECONDS)) {\n            if (completed.compareAndSet(false, true)) {\n                destroyWebView()\n                latch.countDown()\n            }\n            return Result.failure(IllegalStateException("CHROMIUM_ACTION_TIMEOUT"))\n        }'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidChromiumVBookRuntime.kt
          git commit -m 'fix: run Chromium WebView on Android main thread'
          git push origin HEAD:agent/m3-chromium-js-engine
