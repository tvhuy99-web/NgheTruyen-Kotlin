name: Mode 3 patch and APK only

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/unified-audio-library-modes
          fetch-depth: 0

      - name: Fix temporary patch marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/mode3_bestfit_patch.py')
          t = p.read_text(encoding='utf-8')
          old = 'text = replace_between(text, "    private fun rejectReason(\\n", "    private fun sections(\\n", new_reject, "matcher reject")'
          new = 'text = replace_between(text, "    private fun rejectReason(\\n", "    private fun sections(raw: String): Sections {\\n", new_reject, "matcher reject")'
          if old not in t:
              raise SystemExit('temporary matcher marker pattern not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Mode 3 fixes
        run: python3 scripts/mode3_bestfit_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Build debug APK only
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-mode3-bestfit.apk
          sha256sum dist/NgheTruyen-mode3-bestfit.apk > dist/NgheTruyen-mode3-bestfit.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-mode3-bestfit-apk
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/NgheTruyen-mode3-bestfit.apk
            dist/NgheTruyen-mode3-bestfit.apk.sha256

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
                  app/src/main/java/vn/nghetruyen/app/ai/XpkUnifiedNarrationPrompt.kt
          git commit -m "Make Mode 3 source-neutral and improve local matching [skip ci]"
          git push origin HEAD:agent/unified-audio-library-modes
