name: Mode3 Final Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh
      - name: Run targeted regression tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :source-network:test --tests vn.nghetruyen.source.network.PartitionedSourceCookieJarTest
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --tests vn.nghetruyen.app.sources.ExploreDiagnosticScreenContextTest
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/NgheTruyen_Mode3_Unlimited_Dedupe.apk
          sha256sum artifact/NgheTruyen_Mode3_Unlimited_Dedupe.apk > artifact/NgheTruyen_Mode3_Unlimited_Dedupe.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-mode3-unlimited-dedupe
          path: artifact/
          if-no-files-found: error
