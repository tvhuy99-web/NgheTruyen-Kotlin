name: One-shot strict parity M0 repair

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.ref == 'integration/freesound-stage-1-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: integration/freesound-stage-1-clean
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Patch strict coordinator wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_xpk_strict_parity.py')
          s = p.read_text()
          old = '    "NarrationPlanCoordinator(libraryRepository, settingsRepository, xpkNarrationAiServices)",\n'
          new = '''    "NarrationPlanCoordinator(",
              "library = libraryRepository",
              "settings = settingsRepository",
              "ai = xpkNarrationAiServices",
              "storyAudioModeStore = storyAudioSourceModeStore",
              "freesoundResolver = freesoundAutoAudioResolver",
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old coordinator anchor, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          python3 scripts/check_xpk_strict_parity.py

      - name: Run full Milestone 0 gate
        run: bash scripts/m0_gate.sh

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-strict-parity-m0.yml
          git add scripts/check_xpk_strict_parity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update strict parity for Freesound coordinator wiring"
          git push origin HEAD:integration/freesound-stage-1-clean
