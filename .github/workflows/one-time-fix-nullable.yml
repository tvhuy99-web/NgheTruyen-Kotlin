name: One-time playback compile fix

on:
  push:
    branches:
      - agent/xpk-parity-five-milestones

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-parity-five-milestones
          fetch-depth: 0

      - name: Patch nullable voice plan and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          text = path.read_text(encoding='utf-8')
          old = '''        xpkVoiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {
              runCatching {
                  XpkPlaybackRuntime.parseVoiceAssignments(voicePlan.transformedText, validRuntimeUnitIds)
              }.getOrDefault(emptyMap())
          } else emptyMap()
          voiceAssignments = if (voicePlan?.sourceSha256 == originalHash) {
              container.libraryRepository.listVoiceAssignments(chapterId).associateBy { it.paragraphIndex }
          } else emptyMap()
          '''
          new = '''        xpkVoiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {
              runCatching {
                  XpkPlaybackRuntime.parseVoiceAssignments(voicePlan.transformedText, validRuntimeUnitIds)
              }.getOrDefault(emptyMap())
          } else emptyMap()
          voiceAssignments = if (voicePlan != null && voicePlan.sourceSha256 == originalHash) {
              container.libraryRepository.listVoiceAssignments(chapterId).associateBy { it.paragraphIndex }
          } else emptyMap()
          '''
          if old not in text:
              raise SystemExit('expected nullable voice-plan block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/one-time-fix-nullable.yml

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt
          git commit -m "fix: guard nullable XPK voice transform"
          git push origin HEAD:agent/xpk-parity-five-milestones
