name: One-time package APK and clean branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-package-clean.yml"

permissions:
  contents: write

concurrency:
  group: one-time-package-clean
  cancel-in-progress: false

jobs:
  package-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Validate source
        run: python3 scripts/validate_release.py

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Create checksum
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-main-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Remove merged auxiliary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            agent/reference-ui-position-parity \
            agent/stable-debug-signing \
            agent/talkback-settings-reader
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Record package result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHECKSUM_LINE=""
          if [[ -f app-debug.apk.sha256 ]]; then
            CHECKSUM_LINE="$(cat app-debug.apk.sha256)"
          fi
          git fetch origin main
          git reset --hard origin/main
          {
            echo "STATUS=${{ job.status }}"
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "ARTIFACT_ID=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "ARTIFACT_NAME=NgheTruyen-main-debug-apk"
            echo "DELETED_BRANCHES=agent/reference-ui-position-parity,agent/stable-debug-signing,agent/talkback-settings-reader"
            if [[ -n "$CHECKSUM_LINE" ]]; then
              echo "$CHECKSUM_LINE"
            fi
          } > PACKAGE_CLEAN_RESULT.txt
          git add PACKAGE_CLEAN_RESULT.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: record packaged APK and branch cleanup"
          git push origin HEAD:main
