name: Patch clean Mode 3 builder contradictions

on:
  push:
    branches:
      - integration/freesound-stage-1-clean
    paths:
      - ".github/workflows/patch-clean-music-boundary-20260821.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/freesound-stage-1-clean
          fetch-depth: 0
      - name: Patch exact Mode 3 builder contradictions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt')
          text = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '        stabilizeMusicAssignments(selectedByUnit)\n',
              '',
              'musicCues stabilizer call',
          )
          replace_once(
              '        stabilizeMusicAssignments(selected)\n',
              '',
              'salvageMusicCues stabilizer call',
          )

          stabilize_block = '\n'.join([
              '    private fun stabilizeMusicAssignments(rows: MutableList<String>) {',
              '        if (rows.size < 3) return',
              '        while (true) {',
              '            val runs = musicRuns(rows)',
              '            if (runs.size <= 2) return',
              '            val short = runs.subList(1, runs.lastIndex).firstOrNull { it.end - it.start + 1 < 2 } ?: return',
              '            val runIndex = runs.indexOf(short)',
              '            val left = runs[runIndex - 1]',
              '            val right = runs[runIndex + 1]',
              '            val replacement = when {',
              '                left.trackId == right.trackId -> left.trackId',
              '                left.trackId != XpkSceneMusicParity.SILENCE_TRACK_ID -> left.trackId',
              '                else -> right.trackId',
              '            }',
              '            for (index in short.start..short.end) rows[index] = replacement',
              '        }',
              '    }',
              '',
              '',
          ])
          replace_once(stabilize_block, '', 'hidden minimum music-scene function')

          retry_old = '\n'.join([
              '                retryable = result.httpCode == null || result.httpCode in setOf(401, 403, 429) ||',
              '                    (result.httpCode ?: 0) >= 500,',
          ])
          replace_once(
              retry_old,
              '                retryable = isRetryableSearchFailure(result.httpCode),',
              'HTTP retry classification',
          )

          helper_anchor = '        internal fun searchQueryForRetry(query: String, retryAttempt: Int): String {'
          helper = '\n'.join([
              '        internal fun isRetryableSearchFailure(httpCode: Int?): Boolean =',
              '            httpCode == null || httpCode == 429 || httpCode >= 500',
              '',
          ])
          replace_once(helper_anchor, helper + helper_anchor, 'retry helper insertion')

          duplicate_old = '\n'.join([
              '            val duplicate = accepted.any { existing ->',
              '                existing.scene.ambienceId == candidate.scene.ambienceId &&',
              '                    rangesOverlap(start, end, order.getValue(existing.scene.startUnitId), order.getValue(existing.scene.endUnitId))',
              '            }',
          ])
          duplicate_new = '\n'.join([
              '            val duplicate = accepted.any { existing ->',
              '                existing.scene.ambienceId == candidate.scene.ambienceId &&',
              '                    existing.scene.startUnitId == candidate.scene.startUnitId &&',
              '                    existing.scene.endUnitId == candidate.scene.endUnitId',
              '            }',
          ])
          replace_once(duplicate_old, duplicate_new, 'partial-overlap ambience deduplication')

          overlap_helper = '\n'.join([
              '    private fun rangesOverlap(firstStart: Int, firstEnd: Int, secondStart: Int, secondEnd: Int): Boolean =',
              '        firstStart <= secondEnd && secondStart <= firstEnd',
              '',
          ])
          replace_once(overlap_helper, '', 'obsolete overlap helper')

          if 'stabilizeMusicAssignments' in text or 'rangesOverlap(' in text:
              raise SystemExit('obsolete hidden policy remains after patch')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit product fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          git rm -- .github/workflows/patch-clean-music-boundary-20260821.yml
          git commit -m "Align Mode 3 builder with audio directing contract"
          git push origin HEAD:integration/freesound-stage-1-clean
