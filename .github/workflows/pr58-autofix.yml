name: PR58 Autofix

on:
  push:
    branches:
      - agent/improve-source-diagnostics

permissions:
  contents: write

jobs:
  fix-return-statements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/improve-source-diagnostics

      - name: Patch missing return statements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePlatformManager.kt")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "        preparePack(pack)\n    }\n\n    /**\n     * Preview a raw vBook ZIP",
                  "        return preparePack(pack)\n    }\n\n    /**\n     * Preview a raw vBook ZIP",
              ),
              (
                  "        SourceInstallPreview(\n            sourceId = hostManifest.id,",
                  "        return SourceInstallPreview(\n            sourceId = hostManifest.id,",
              ),
              (
                  "        preparePack(pack)\n    }\n\n    fun pendingInstallWarnings(): List<String> = pendingWarnings",
                  "        return preparePack(pack)\n    }\n\n    fun pendingInstallWarnings(): List<String> = pendingWarnings",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr58-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePlatformManager.kt .github/workflows/pr58-autofix.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Fix SourcePlatformManager return statements"
          git push origin HEAD:agent/improve-source-diagnostics
