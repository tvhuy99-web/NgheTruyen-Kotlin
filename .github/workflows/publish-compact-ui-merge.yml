name: Publish compact UI merge

on:
  workflow_run:
    workflows: ["Validate compact UI merge"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'agent/compact-merge-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Recreate validated merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/compact-ui-parity
          git checkout -B agent/compact-ui-integrated origin/main
          git merge --no-ff -X ours origin/agent/compact-ui-parity -m "Merge compact UI parity into main"
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git status --short >&2
            exit 1
          fi
          git push --force origin HEAD:refs/heads/agent/compact-ui-integrated
