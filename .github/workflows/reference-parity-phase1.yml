name: Reference parity phase 1

on:
  push:
    branches:
      - agent/reference-ui-position-parity

permissions:
  contents: write

jobs:
  parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reference parity phase 1
        run: |
          python3 scripts/apply_reference_parity_phase1.py
          python3 scripts/apply_reference_parity_phase1_fix.py
      - name: Assert reference menu hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          explore = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ExploreScreen.kt').read_text()
          library = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/LibraryScreen.kt').read_text()
          story = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt').read_text()
          for token in ['LỊCH SỬ TÌM KIẾM','Tìm trong nguồn hiện tại','Tìm đa nguồn','CHỌN NGUỒN TÌM KIẾM','Gom truyện trùng tên','Tên truyện A-Z','Theo nguồn']:
              assert token in explore, token
          assert 'SearchSortMode.AUTHOR to "TÁC GIẢ"' not in explore
          for token in ['HÀNG ĐỢI TẢI','LỊCH SỬ ĐỌC','NHẬP TRUYỆN','SẮP XẾP ĐANG ĐỌC','SẮP XẾP TRUYỆN ĐÃ TẢI','SẮP XẾP ĐÁNH DẤU','TÌM TRUYỆN ĐANG THEO DÕI']:
              assert token in library, token
          assert 'SẮP XẾP DANH SÁCH CHƯƠNG' in story
          print('REFERENCE_PHASE1_UI_ASSERTIONS_OK')
          PY
      - name: Validate release wiring
        run: python3 scripts/validate_release.py --wiring-only
      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon
      - name: Commit product changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_reference_parity_phase1.py scripts/apply_reference_parity_phase1_fix.py .github/workflows/reference-parity-phase1.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align search library and chapter controls with reference"
          git push origin HEAD:agent/reference-ui-position-parity
