name: Reference voice parity phase 3

on:
  push:
    branches:
      - agent/reference-ui-position-parity
    paths:
      - .github/workflows/reference-parity-phase3.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reference-parity-phase3.yml
      - scripts/apply_reference_parity_phase3.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Specialize repository range patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_reference_parity_phase3.py')
          text = path.read_text()
          old = '''text = replace_once(text, 'rate = rate.coerceIn(0.5f, 2.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0.05f, 1.0f),',
                    'rate = rate.coerceIn(0.25f, 3.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0f, 2.0f),',
                    "story TTS profile ranges")'''
          new = '''_old_story_ranges = 'rate = rate.coerceIn(0.5f, 2.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0.05f, 1.0f),'
_new_story_ranges = 'rate = rate.coerceIn(0.25f, 3.0f),\\n                pitch = pitch.coerceIn(0.5f, 2.0f),\\n                volume = volume.coerceIn(0f, 2.0f),'
if _old_story_ranges not in text:
    raise SystemExit("story TTS profile ranges: source block not found")
text = text.replace(_old_story_ranges, _new_story_ranges, 1)'''
          if text.count(old) != 1:
              raise SystemExit('phase3 repository replacement block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          print('PHASE3_REPOSITORY_PATCH_SPECIALIZED')
          PY

      - name: Apply voice parity patch
        run: python3 scripts/apply_reference_parity_phase3.py

      - name: Assert exact XPK profile options
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          personal = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReferencePersonalScreen.kt').read_text()
          story = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt').read_text()
          model = Path('app/src/main/java/vn/nghetruyen/app/core/model/Models.kt').read_text()
          repo = Path('app/src/main/java/vn/nghetruyen/app/data/repository/LibraryRepository.kt').read_text()
          playback = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt').read_text()
          export = Path('app/src/main/java/vn/nghetruyen/app/audio/AudioExportWorker.kt').read_text()
          required_personal = [
              'CÀI ĐẶT ỨNG DỤNG', 'Từ hoặc cụm từ gốc', 'TTS sẽ đọc thành',
              'HỒ SƠ GIỌNG TTS', 'Tên vai hoặc tên nhân vật', 'Mô tả để AI nhận biết',
              'Bật hồ sơ này', 'Người kể chuyện luôn được bật', 'Giọng nói',
              'Android, tối đa 100%', 'Sonic, tối đa 200%', 'Chế độ Sonic',
              'Nhanh', 'Chính xác', 'NGHE THỬ', 'LƯU HỒ SƠ', 'XÓA HỒ SƠ',
              'NGƯỜI KỂ CHUYỆN BẮT BUỘC', 'KHÔI PHỤC HỒ SƠ MẪU',
              'Khôi phục tên và mô tả của 7 hồ sơ mẫu?',
              'Tải và cài bộ dữ liệu VietPhrase từ mạng?',
              'XÓA TOÀN BỘ VIETPHRASE', 'Xóa tất cả dữ liệu VietPhrase?',
          ]
          for token in required_personal:
              assert token in personal, token
          required_story = [
              'BỘ GIỌNG RIÊNG CỦA TRUYỆN', 'HỒ SƠ GIỌNG RIÊNG',
              'THÊM VAI HOẶC NHÂN VẬT', 'SAO CHÉP LẠI TỪ CẤU HÌNH CHUNG',
              'SAO CHÉP CẤU HÌNH CHUNG',
              'Thay toàn bộ bộ giọng riêng hiện tại bằng một bản sao mới của cấu hình chung?',
              'Android, tối đa 100%', 'Sonic, tối đa 200%', 'Chế độ Sonic',
              'LƯU HỒ SƠ', 'XÓA HỒ SƠ', 'NGƯỜI KỂ CHUYỆN BẮT BUỘC',
          ]
          for token in required_story:
              assert token in story, token
          assert 'processingMethod: String = "system"' in model
          assert 'sonicAccurate: Boolean = false' in model
          assert 'rate.coerceIn(0.25f, 3.0f)' in repo
          assert 'volume.coerceIn(0f, 2.0f)' in repo
          assert 'sonicSpeed.coerceIn(0.25f, 3.0f)' in repo
          assert 'ReferenceVoiceRoleExtras.load(this@ReaderPlaybackService, id)' in playback
          assert 'sonicEnabled = sonic' in playback
          assert 'coerceIn(0.25f, 3f)' in playback
          assert 'coerceIn(0f, 2f)' in playback
          assert 'EXTRA_PREVIEW_SONIC_ENABLED' in playback
          assert 'EXTRA_PREVIEW_SONIC_ACCURATE' in playback
          assert 'ReferenceVoiceRoleExtras.load(applicationContext, it.id)' in export
          assert 'SonicPcmProcessor.process(pcmOutput, normalizedOutput, sonicSpeed, sonicPitch, accurateSonic)' in export
          print('REFERENCE_VOICE_PARITY_ASSERTIONS_OK')
          PY

      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only

      - name: Compile Kotlin
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Remove temporary phase tooling
        if: github.event_name != 'pull_request'
        run: rm -f scripts/apply_reference_parity_phase3.py .github/workflows/reference-parity-phase3.yml

      - name: Commit verified product changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m "fix: make voice profiles match reference behavior"
          git push origin HEAD:agent/reference-ui-position-parity
