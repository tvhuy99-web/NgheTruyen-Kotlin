name: Publish verified voice parity phase 3

on:
  push:
    branches:
      - agent/reference-ui-position-parity
    paths:
      - .github/workflows/reference-parity-phase3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply verified phase 3 patch
        run: python3 scripts/apply_reference_parity_phase3.py

      - name: Remove shim-only source artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt')
          text = app.read_text()
          text = text.replace('import vn.nghetruyen.app.ui.reference.ReferenceVoiceRolePersistence\n', '', 1)
          app.write_text(text)

          story = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt')
          text = story.read_text()
          local = '''    if (showVoiceProfiles) {\n        val privateRoles = state.voiceRoles.filter { it.storyId == detail.story.id }\n        val globalRoles = state.voiceRoles.filter { it.storyId == GLOBAL_VOICE_PROFILE_STORY_ID }.take(7)\n'''
          if local in text:
              text = text.replace(local, '    if (showVoiceProfiles) {\n', 1)
          story.write_text(text)
          print('PHASE3_SHIM_SOURCE_CLEANED')
          PY

      - name: Revalidate verified product source
        shell: bash
        run: |
          python3 scripts/validate_release.py --wiring-only
          bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Restore standard Android CI and remove temporary tooling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/android-ci.yml')
          text = path.read_text()
          marker = '  reference-phase3-verify:\n'
          if marker in text:
              start = text.index(marker)
              end = text.index('  build:\n', start)
              text = text[:start] + text[end:]
              path.write_text(text)
          print('ANDROID_CI_RESTORED')
          PY
          rm -f scripts/apply_reference_parity_phase3.py scripts/pathlib.py .phase3-status.log .github/workflows/reference-parity-phase3.yml

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make voice profiles match reference behavior"
          git push origin HEAD:agent/reference-ui-position-parity
