name: Reference UI parity apply

on:
  push:
    branches:
      - agent/reference-ui-position-parity
    paths:
      - scripts/reference_ui_parity_all.py
      - scripts/fix_reference_patch.py
      - scripts/after_reference_patch.py
      - .github/workflows/reference-ui-parity-all.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/reference_ui_parity_all.py
      - scripts/fix_reference_patch.py
      - scripts/after_reference_patch.py
      - .github/workflows/reference-ui-parity-all.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Normalize and apply reference UI parity patch
        run: |
          python3 scripts/fix_reference_patch.py
          python3 scripts/reference_ui_parity_all.py
          python3 scripts/after_reference_patch.py

      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only

      - name: Compile Kotlin UI
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit product changes and remove patch machinery
        run: |
          rm scripts/reference_ui_parity_all.py scripts/fix_reference_patch.py scripts/after_reference_patch.py .github/workflows/reference-ui-parity-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: complete reference placement parity"
          git push origin HEAD:agent/reference-ui-position-parity
