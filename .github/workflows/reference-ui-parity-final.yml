name: Reference UI parity final audit

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/reference_ui_parity_final.py
      - .github/workflows/reference-ui-parity-final.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/reference-ui-position-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-ui-position-parity
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply final placement fix and assertions
        run: python3 scripts/reference_ui_parity_final.py

      - name: Validate wiring
        run: python3 scripts/validate_release.py --wiring-only

      - name: Compile Kotlin UI
        run: bash ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit final product change and clean build artifacts
        run: |
          rm -rf .gradle
          rm -f app/schemas/vn.nghetruyen.app.data.local.AppDatabase/18.json
          rm scripts/reference_ui_parity_final.py .github/workflows/reference-ui-parity-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: lock final reference action placement"
          git push origin HEAD:agent/reference-ui-position-parity
