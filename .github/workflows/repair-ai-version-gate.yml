name: One-shot historical gate repair

on:
  push:
    branches: [agent/remove-unused-files]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography
      - name: Repair historical gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ai = Path('scripts/check_ai_gemini_story_vietphrase.py')
          text = ai.read_text(encoding='utf-8')
          helper = '''def verify_version_floor() -> None:\n    build = text("app/build.gradle.kts")\n    code_match = re.search(r"\\bversionCode\\s*=\\s*(\\d+)", build)\n    name_match = re.search(r'\\bversionName\\s*=\\s*"([^"]+)"', build)\n    if code_match is None or name_match is None:\n        raise AssertionError("app/build.gradle.kts: cannot parse versionCode/versionName")\n    parts = name_match.group(1).split("-", 1)[0].split(".")\n    if len(parts) != 3 or any(not part.isdigit() for part in parts):\n        raise AssertionError(f"app/build.gradle.kts: invalid semantic version: {name_match.group(1)}")\n    if int(code_match.group(1)) < 28 or tuple(map(int, parts)) < (2, 8, 0):\n        raise AssertionError("app/build.gradle.kts: AI narration baseline requires versionCode >= 28 and versionName >= 2.8.0")\n\n\n'''
          if 'def verify_version_floor() -> None:' not in text:
              text = text.replace('def main() -> int:\n', helper + 'def main() -> int:\n', 1)
          old = '''    require(\n        "app/build.gradle.kts",\n        "versionCode = 28",\n        'versionName = "2.8.0-ai-narration-priority2-complete"',\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'AI exact-version block count={text.count(old)}')
          ai.write_text(text.replace(old, '    verify_version_floor()\n', 1), encoding='utf-8')

          p2 = Path('scripts/check_priority2_complete.py')
          text = p2.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
          old = '''\n\nrequire('app/build.gradle.kts', 'versionCode = 28', 'versionName = "2.8.0-ai-narration-priority2-complete"')\n'''
          new = '''\n\ndef verify_version_floor() -> None:\n    build = read('app/build.gradle.kts')\n    code_match = re.search(r'\\bversionCode\\s*=\\s*(\\d+)', build)\n    name_match = re.search(r'\\bversionName\\s*=\\s*"([^"]+)"', build)\n    if code_match is None or name_match is None:\n        raise AssertionError('app/build.gradle.kts: cannot parse versionCode/versionName')\n    parts = name_match.group(1).split('-', 1)[0].split('.')\n    if len(parts) != 3 or any(not part.isdigit() for part in parts):\n        raise AssertionError(f'app/build.gradle.kts: invalid semantic version: {name_match.group(1)}')\n    if int(code_match.group(1)) < 28 or tuple(map(int, parts)) < (2, 8, 0):\n        raise AssertionError('app/build.gradle.kts: Priority 2 baseline requires versionCode >= 28 and versionName >= 2.8.0')\n\n\nverify_version_floor()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Priority2 exact-version line count={text.count(old)}')
          p2.write_text(text.replace(old, new, 1), encoding='utf-8')

          p1 = Path('scripts/check_priority1_complete.py')
          text = p1.read_text(encoding='utf-8')
          old = '''    build = (ROOT / "app/build.gradle.kts").read_text(encoding="utf-8")\n    assert 'versionName = "2.8.0-ai-narration-priority2-complete"' in build\n    assert "versionCode = 28" in build\n'''
          new = '''    build = (ROOT / "app/build.gradle.kts").read_text(encoding="utf-8")\n    code_match = re.search(r"\\bversionCode\\s*=\\s*(\\d+)", build)\n    name_match = re.search(r'\\bversionName\\s*=\\s*"([^"]+)"', build)\n    assert code_match is not None and name_match is not None, "Không đọc được versionCode/versionName"\n    parts = name_match.group(1).split("-", 1)[0].split(".")\n    assert len(parts) == 3 and all(part.isdigit() for part in parts), f"Version không hợp lệ: {name_match.group(1)}"\n    assert int(code_match.group(1)) >= 28 and tuple(map(int, parts)) >= (2, 8, 0), (\n        f"Priority 1 baseline cần versionCode >= 28 và versionName >= 2.8.0; "\n        f"found versionCode={code_match.group(1)}, versionName={name_match.group(1)}"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Priority1 exact-version block count={text.count(old)}')
          p1.write_text(text.replace(old, new, 1), encoding='utf-8')

          validator = Path('scripts/validate_release.py')
          text = validator.read_text(encoding='utf-8')
          old = '''        "CÀI .NTSOURCE / VBOOK / LUA API 2",\n        "THÊM / LÀM MỚI REPOSITORY",\n        "Self-test:",\n        "ROLLBACK PHIÊN BẢN NGUỒN",\n'''
          new = '''        "CÀI .NTSOURCE / VBOOK / LUA API 2",\n        "THÊM / LÀM MỚI REPOSITORY",\n        "Self-test:",\n        "onRollback = onRollbackSourcePack",\n        "onLogin = onOpenSourceLogin",\n        "val retainedRuntimeActions = listOf(onRollback, onLogin)",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'legacy rollback UI assertion count={text.count(old)}')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/repair-ai-version-gate.yml').unlink()
          PY
      - name: Validate aggregate release gates
        shell: bash
        run: |
          git diff --check
          python3 scripts/check_ai_gemini_story_vietphrase.py
          python3 scripts/check_priority2_complete.py
          python3 scripts/check_priority1_complete.py
          python3 scripts/validate_release.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: modernize historical release gates'
          git push origin HEAD:agent/remove-unused-files
