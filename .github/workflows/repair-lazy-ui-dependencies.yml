name: One-shot lazy UI dependency repair

on:
  push:
    branches:
      - agent/remove-unused-files

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair lazy dependency wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path: str):
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write_lines(path: str, lines):
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          reference_app = "app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt"
          lines = read_lines(reference_app)
          marker = "    LaunchedEffect(state.diagnosticsMode, diagnosticScreenKey) {"
          if lines.count(marker) != 1:
              raise SystemExit(f"Reference diagnostics marker count={lines.count(marker)}")
          start = lines.index(marker)
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == "    }")
          addition = [
              "",
              "    // Keep Room observers demand-driven, but guarantee that every visible destination",
              "    // activates the data groups declared for it.",
              "    LaunchedEffect(state.destination, state.rootTab, state.librarySection) {",
              "        viewModel.ensureRoomObserversForUi(",
              "            destination = state.destination,",
              "            rootTab = state.rootTab,",
              "            librarySection = state.librarySection,",
              "        )",
              "    }",
          ]
          if not any("ensureRoomObserversForUi(" in line for line in lines):
              lines[end + 1:end + 1] = addition
          write_lines(reference_app, lines)

          view_model = "app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt"
          lines = read_lines(view_model)
          page_line = "        activePersonalPage = page"
          if lines.count(page_line) != 1:
              raise SystemExit(f"activePersonalPage marker count={lines.count(page_line)}")
          idx = lines.index(page_line)
          additions = [
              "        mutablePersonalPage.value = page",
              "        ensureRoomObserversForPersonalPage(page)",
          ]
          for offset, line in enumerate(additions, start=1):
              if line not in lines:
                  lines.insert(idx + offset, line)

          startup_seed = "            withContext(Dispatchers.IO) { container.libraryRepository.ensureGlobalVoiceProfiles() }"
          seed_indexes = [i for i, line in enumerate(lines) if line == startup_seed]
          if len(seed_indexes) != 1:
              raise SystemExit(f"startup seed marker count={len(seed_indexes)}")
          del lines[seed_indexes[0]]

          role_marker = "            RoomObserverGroup.VOICE_ROLES -> viewModelScope.launch {"
          if lines.count(role_marker) != 1:
              raise SystemExit(f"VOICE_ROLES marker count={lines.count(role_marker)}")
          role_idx = lines.index(role_marker)
          observe_idx = next(
              i for i in range(role_idx + 1, min(role_idx + 12, len(lines)))
              if "container.libraryRepository.observeVoiceRoles()" in lines[i]
          )
          role_addition = [
              "                // Seed required role names only when a screen actually needs voice roles.",
              "                // Voice/engine selection intentionally remains empty for the user to choose.",
              "                withContext(Dispatchers.IO) { container.libraryRepository.ensureGlobalVoiceProfiles() }",
          ]
          lines[observe_idx:observe_idx] = role_addition
          write_lines(view_model, lines)

          gate = "app/src/main/java/vn/nghetruyen/app/startup/StartupWorkGate.kt"
          lines = read_lines(gate)
          gate_marker = "    fun awaitFirstFrame(timeoutMillis: Long = FIRST_FRAME_WAIT_TIMEOUT_MILLIS): Boolean {"
          if lines.count(gate_marker) != 1:
              raise SystemExit(f"Startup gate marker count={lines.count(gate_marker)}")
          start = lines.index(gate_marker)
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == "    }")
          replacement = [
              gate_marker,
              "        if (!isBeforeFirstFrame()) return true",
              "        val reachedFirstFrame = firstFrameLatch.await(timeoutMillis, TimeUnit.MILLISECONDS)",
              "        if (!reachedFirstFrame) {",
              "            // The gate is only an optimization; timeout must never cancel initialization.",
              "            firstActivityStartupActive = false",
              "            firstFrameLatch.countDown()",
              "        }",
              "        return true",
              "    }",
          ]
          lines[start:end + 1] = replacement
          write_lines(gate, lines)

          demand_test = "app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt"
          lines = read_lines(demand_test)
          viet_marker = '            roomObserverGroupsForPersonalPage("settings_vietphrase"),'
          if lines.count(viet_marker) != 1:
              raise SystemExit(f"VietPhrase test marker count={lines.count(viet_marker)}")
          marker_idx = lines.index(viet_marker)
          insert_at = marker_idx + 2
          extra_tests = [
              "        assertEquals(",
              "            setOf(RoomObserverGroup.VOICE_ROLES),",
              '            roomObserverGroupsForPersonalPage("settings_automation"),',
              "        )",
              "        assertEquals(",
              "            setOf(RoomObserverGroup.SCENE_MUSIC),",
              '            roomObserverGroupsForPersonalPage("settings_music"),',
              "        )",
              "        assertEquals(",
              "            setOf(RoomObserverGroup.FOLLOWING),",
              '            roomObserverGroupsForPersonalPage("settings_following"),',
              "        )",
          ]
          if not any('settings_automation' in line for line in lines):
              lines[insert_at:insert_at] = extra_tests
          write_lines(demand_test, lines)

          Path(".github/workflows/repair-lazy-ui-dependencies.yml").unlink()
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          grep -F 'viewModel.ensureRoomObserversForUi(' app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt
          grep -F 'mutablePersonalPage.value = page' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          grep -F 'ensureRoomObserversForPersonalPage(page)' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          test "$(grep -c 'ensureGlobalVoiceProfiles()' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt)" -ge 2
          grep -F 'val reachedFirstFrame = firstFrameLatch.await' app/src/main/java/vn/nghetruyen/app/startup/StartupWorkGate.kt
          grep -F 'settings_automation' app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt
          grep -F 'settings_music' app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt
          grep -F 'settings_following' app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt

      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: wire lazy UI dependencies'
          git push origin HEAD:agent/remove-unused-files
