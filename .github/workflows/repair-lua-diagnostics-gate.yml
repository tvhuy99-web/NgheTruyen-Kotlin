name: One-shot diagnostics parity gate repair

on:
  push:
    branches:
      - agent/remove-unused-files

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update diagnostics gate for lazy UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_lua_diagnostics_ui_parity.py')
          text = path.read_text(encoding='utf-8')
          old = '    "large live event window": "takeLast(2_000)" in vm and "visibleDiagnosticSummaries" in vm,\n'
          new = '''    "large live event window is bounded and lazy": (\n        "takeLast(2_000)" in vm\n        and "diagnosticSummaries" in vm\n        and "shouldMaterializeDiagnosticDetails" in vm\n        and "refreshDiagnosticUi(loadDetails = visible || shouldMaterializeDiagnosticDetails())" in vm\n    ),\n'''
          if text.count(old) != 1:
              raise SystemExit(f'old live-event gate count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-lua-diagnostics-gate.yml').unlink()
          PY

      - name: Verify diagnostics gate
        shell: bash
        run: |
          git diff --check
          python3 scripts/check_lua_diagnostics_ui_parity.py
          grep -F 'large live event window is bounded and lazy' scripts/check_lua_diagnostics_ui_parity.py
          grep -F 'shouldMaterializeDiagnosticDetails' scripts/check_lua_diagnostics_ui_parity.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align diagnostics parity gate with lazy UI'
          git push origin HEAD:agent/remove-unused-files
