name: One-shot Milestone 1 gate invocation repair

on:
  push:
    branches: [agent/remove-unused-files]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Milestone 1 gate with current Android CI invocation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_milestone1_foundation.py')
          text = path.read_text(encoding='utf-8')
          old = '        "./scripts/m0_gate.sh",\n'
          new = '        "bash scripts/m0_gate.sh",\n'
          if text.count(old) != 1:
              raise SystemExit(f'old m0 invocation assertion count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-m1-gate-call.yml').unlink()
          PY
          git diff --check
          grep -F '"bash scripts/m0_gate.sh"' scripts/check_milestone1_foundation.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align Milestone 1 CI gate assertion'
          git push origin HEAD:agent/remove-unused-files
