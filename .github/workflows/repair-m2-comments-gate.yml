name: One-shot Milestone 2 comments gate repair

on:
  push:
    branches: [agent/remove-unused-files]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align comment cache assertion with ViewModel ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_milestone2_comments.py')
          text = path.read_text(encoding='utf-8')
          vm_anchor = '        "commentsLoadJob?.cancel()",\n'
          if text.count(vm_anchor) != 1:
              raise SystemExit(f'VM anchor count={text.count(vm_anchor)}')
          text = text.replace(vm_anchor, vm_anchor + '        "storyCommentsFromCache",\n', 1)
          ui_token = '        "state.storyCommentsFromCache",\n'
          if text.count(ui_token) != 1:
              raise SystemExit(f'UI cache token count={text.count(ui_token)}')
          text = text.replace(ui_token, '', 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/repair-m2-comments-gate.yml').unlink()
          PY
          git diff --check
          python3 scripts/check_milestone2_comments.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align comments cache gate with ViewModel'
          git push origin HEAD:agent/remove-unused-files
