name: One-shot Milestone 2 demo-pack gate repair

on:
  push:
    branches: [agent/remove-unused-files]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete demo-pack dependency from Milestone 2 gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_milestone2_complete.py')
          text = path.read_text(encoding='utf-8')
          old = 'PACK_NAMES = ["demo", "truyenfull", "truyencv", "truyencom", "truyenyy", "wikidich", "sangtacviet", "wattpad"]\n'
          new = 'PACK_NAMES = ["truyenfull", "truyencv", "truyencom", "truyenyy", "wikidich", "sangtacviet", "wattpad"]\n'
          if text.count(old) != 1:
              raise SystemExit(f'PACK_NAMES demo marker count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    assert signers["demo"] == "nghe-truyen-builtin-p256-v1"\n    for name in PACK_NAMES[1:]:\n        assert signers[name] == "nghe-truyen-priority1-p256-v2", f"unexpected signer for {name}"\n'''
          new = '''    for name in PACK_NAMES:\n        assert signers[name] == "nghe-truyen-priority1-p256-v2", f"unexpected signer for {name}"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'demo signer block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/repair-m2-demo-pack-gate.yml').unlink()
          PY
          git diff --check
          ! grep -F 'demo.ntsource' scripts/check_milestone2_complete.py
          ! grep -F 'signers["demo"]' scripts/check_milestone2_complete.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: drop obsolete demo pack gate dependency'
          git push origin HEAD:agent/remove-unused-files
