name: Repair remaining binary source packs

on:
  push:
    paths:
      - ".github/workflows/repair-sourcepacks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify repair payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/remaining3.tar.xz \
            https://nghetruyen-sourcepack-fix-20260807.netlify.app/remaining3.tar.xz
          echo "39459b2473d6fd112768581e7cf51d7b2779db8516c684ed923899bb09c3bdf0  /tmp/remaining3.tar.xz" \
            | sha256sum --check -

      - name: Restore and verify source packs
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/remaining3.tar.xz
          printf '%s\n' \
            "7abe52ec0873005956e50e5fcc9600b4333315826dd5d8e7719b1549da45daad  app/src/main/assets/sourcepacks/truyenyy.ntsource" \
            "15a51dfc16813322fccf58acab792ce2d7173f898f7011fbcec28781baa678b5  app/src/main/assets/sourcepacks/wattpad.ntsource" \
            "562b237cca67dae2791660ba617d159774b9f4f56ebed6dd5bb4ad8058531e56  app/src/main/assets/sourcepacks/wikidich.ntsource" \
            > /tmp/sourcepacks.sha256
          sha256sum --check /tmp/sourcepacks.sha256

      - name: Commit repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/sourcepacks/truyenyy.ntsource \
                  app/src/main/assets/sourcepacks/wattpad.ntsource \
                  app/src/main/assets/sourcepacks/wikidich.ntsource \
                  .gitattributes
          if [[ -d .github/sourcepack-repair ]]; then
            git rm -r .github/sourcepack-repair
          fi
          git rm .github/workflows/repair-sourcepacks.yml
          git commit -m "fix: restore remaining binary source packs"
          git push
