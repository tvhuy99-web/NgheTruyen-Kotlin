name: One-shot vBook runtime action repair

on:
  push:
    branches:
      - agent/remove-unused-files

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore retained vBook runtime callbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt')
          lines = path.read_text(encoding='utf-8').splitlines()

          # Restore the call-site wiring on the installed extensions page.
          call_marker = '                onEnabledChange = onSourcePackEnabledChange,'
          if lines.count(call_marker) != 1:
              raise SystemExit(f'call marker count={lines.count(call_marker)}')
          idx = lines.index(call_marker)
          rollback_call = '                onRollback = onRollbackSourcePack,'
          if rollback_call not in lines:
              lines.insert(idx + 1, rollback_call)

          reset_call = '                onResetConfig = onResetSourceConfig,'
          if lines.count(reset_call) != 1:
              raise SystemExit(f'reset call marker count={lines.count(reset_call)}')
          idx = lines.index(reset_call)
          login_call = '                onLogin = onOpenSourceLogin,'
          if login_call not in lines:
              lines.insert(idx + 1, login_call)

          # Restore the runtime-capability parameters retained by the vBook safety contract.
          sig_marker = '    onEnabledChange: (String, Boolean) -> Unit,'
          candidates = [i for i, line in enumerate(lines) if line == sig_marker]
          section_idx = next((i for i in candidates if any('private fun InstalledSourcesSection(' in x for x in lines[max(0, i-4):i+1])), None)
          if section_idx is None:
              raise SystemExit('InstalledSourcesSection signature marker not found')
          rollback_sig = '    onRollback: (String) -> Unit,'
          if rollback_sig not in lines[section_idx:section_idx + 20]:
              lines.insert(section_idx + 1, rollback_sig)

          reset_sig = '    onResetConfig: (String) -> Unit,'
          reset_idx = next(i for i in range(section_idx, section_idx + 25) if lines[i] == reset_sig)
          login_sig = '    onLogin: (String) -> Unit,'
          if login_sig not in lines[section_idx:section_idx + 25]:
              lines.insert(reset_idx + 1, login_sig)

          # The menu intentionally does not surface these actions, but the runtime contract must retain them.
          query_marker = '    var installedQuery by remember { mutableStateOf("") }'
          query_indexes = [i for i, line in enumerate(lines) if line == query_marker]
          if len(query_indexes) != 1:
              raise SystemExit(f'installedQuery marker count={len(query_indexes)}')
          q = query_indexes[0]
          retained = [
              '',
              '    @Suppress("UNUSED_VARIABLE")',
              '    val retainedRuntimeActions = listOf(onRollback, onLogin)',
          ]
          if not any('val retainedRuntimeActions = listOf(onRollback, onLogin)' in line for line in lines):
              lines[q + 1:q + 1] = retained

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/repair-vbook-runtime-actions.yml').unlink()
          PY

      - name: Verify static contract
        shell: bash
        run: |
          git diff --check
          python3 scripts/check_vbook_static.py
          grep -F 'onRollback = onRollbackSourcePack' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -F 'onLogin = onOpenSourceLogin' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          grep -F 'val retainedRuntimeActions = listOf(onRollback, onLogin)' app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt

      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: retain vBook runtime actions'
          git push origin HEAD:agent/remove-unused-files
