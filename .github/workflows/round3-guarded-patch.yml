name: Round 3 guarded patch

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - '.github/workflows/round3-guarded-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded follow-up patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          diagnostic = 'app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt'
          replace_once(
              diagnostic,
              'import kotlinx.coroutines.flow.asStateFlow\n',
              'import kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.update\n',
          )
          replace_once(
              diagnostic,
              '''    private fun signalChanged() {\n        changeVersion.value = if (changeVersion.value == Long.MAX_VALUE) 1L else changeVersion.value + 1L\n    }\n''',
              '''    private fun signalChanged() {\n        changeVersion.update { version -> if (version == Long.MAX_VALUE) 1L else version + 1L }\n    }\n''',
          )

          viewmodel = 'app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt'
          replace_once(
              viewmodel,
              'import vn.nghetruyen.app.sourceplatform.SourceTrustKeyUi\n',
              'import vn.nghetruyen.app.sourceplatform.SourceTrustKeyUi\nimport vn.nghetruyen.app.startup.StartupWorkGate\n',
          )
          replace_once(
              viewmodel,
              '''    private var searchJob: Job? = null\n    private var suggestionJob: Job? = null\n    private var storyLoadJob: Job? = null\n''',
              '''    private var searchJob: Job? = null\n    private var suggestionJob: Job? = null\n    private var sourceSessionRefreshJob: Job? = null\n    private var storyLoadJob: Job? = null\n''',
          )
          replace_once(
              viewmodel,
              '''    fun refreshSourceSessions() {\n        val active = container.sourceRegistry.descriptors()\n            .filter { container.sourceSessionStore.hasSession(it.id) }\n            .mapTo(linkedSetOf()) { it.id }\n        mutableState.update { it.copy(sourceSessions = active) }\n    }\n''',
              '''    fun refreshSourceSessions() {\n        sourceSessionRefreshJob?.cancel()\n        sourceSessionRefreshJob = viewModelScope.launch {\n            if (!StartupWorkGate.awaitFirstFrameAsync()) return@launch\n            val descriptors = container.sourceRegistry.descriptors()\n            val active = withContext(Dispatchers.IO) {\n                descriptors\n                    .filter { container.sourceSessionStore.hasSession(it.id) }\n                    .mapTo(linkedSetOf()) { it.id }\n            }\n            mutableState.update { it.copy(sourceSessions = active) }\n        }\n    }\n''',
          )
          PY

      - name: Verify patch diff
        run: |
          git diff --check
          git diff --stat
          git diff -- app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt \
            app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt

      - name: Compile and test follow-up
        run: >-
          ./gradlew
          :source-diagnostics:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Commit verified follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/nghetruyen/app/sourceplatform/SourceDiagnosticRuntime.kt \
            app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          git commit -m 'perf: defer source session scan past first frame'
          git push origin HEAD:agent/remove-unused-files
