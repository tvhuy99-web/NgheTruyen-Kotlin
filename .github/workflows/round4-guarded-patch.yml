name: Round 4 guarded patch

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - '.github/workflows/round4-guarded-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded round 4 patches
        run: python3 .github/scripts/round4_patch.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f app/src/main/java/vn/nghetruyen/app/ui/RoomObserverDemand.kt
          test -f app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt
          if grep -q 'private fun observeLibrary()' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt; then exit 1; fi
          if grep -q '^        observeLibrary()$' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt; then exit 1; fi
          grep -q 'RoomObserverGroup.STORAGE' app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
          grep -q 'ensureRoomObserversForPersonalPage' app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt

      - name: Compile and test round 4
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace

      - name: Commit verified round 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt app/src/main/java/vn/nghetruyen/app/ui/RoomObserverDemand.kt app/src/test/java/vn/nghetruyen/app/ui/RoomObserverDemandTest.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: scope Room observers to active features'
          git push origin HEAD:agent/remove-unused-files
