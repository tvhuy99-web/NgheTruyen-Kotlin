name: Round 5 Browser Performance

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - scripts/apply_round5_browser_perf.py
      - .github/workflows/round5-browser-perf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-files

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded browser lifecycle patch
        run: python3 scripts/apply_round5_browser_perf.py

      - name: Verify patch shape
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt').read_text()
          assert 'source-browser-idle' in p
          assert 'session.webView.onPause()' in p
          assert 'session.webView.onResume()' in p
          assert 'WebView(appContext).apply { clearCache(true)' not in p
          assert 'session.webView.clearCache(true)' not in p
          assert 'SESSION_SUSPEND_AFTER_MS = 30_000L' in p
          assert 'SESSION_DESTROY_AFTER_MS = 10 * 60_000L' in p
          print('Round 5 structural guards passed.')
          PY

      - name: Verify source platform and app
        run: >-
          ./gradlew
          :source-api:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-vbook:test
          :source-lua:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_round5_browser_perf.py
          rm .github/workflows/round5-browser-perf.yml

      - name: Commit verified round 5 patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: suspend and reap idle source WebViews'
          git push origin HEAD:agent/remove-unused-files
