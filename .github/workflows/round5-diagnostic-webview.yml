name: Round 5 Diagnostic WebView Lifecycle

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - scripts/apply_round5_diagnostic_webview_lifecycle.py
      - .github/workflows/round5-diagnostic-webview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-files

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded diagnostic WebView lifecycle patch
        run: python3 scripts/apply_round5_diagnostic_webview_lifecycle.py

      - name: Verify patch shape
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/sources/SourceDiagnosticBrowserActivity.kt').read_text()
          assert 'override fun onResume()' in p
          assert 'webView.onResume()' in p
          assert 'webView.onPause()' in p
          print('Diagnostic WebView lifecycle guards passed.')
          PY

      - name: Verify app
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_round5_diagnostic_webview_lifecycle.py
          rm .github/workflows/round5-diagnostic-webview.yml

      - name: Commit verified diagnostic WebView lifecycle patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: pause diagnostic WebView with activity lifecycle'
          git push origin HEAD:agent/remove-unused-files
