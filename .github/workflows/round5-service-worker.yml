name: Round 5 ServiceWorker Routing

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - scripts/apply_round5_service_worker.py
      - .github/workflows/round5-service-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-files

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded ServiceWorker patch
        run: python3 scripts/apply_round5_service_worker.py

      - name: Verify patch shape
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt').read_text()
          assert p.count('setServiceWorkerClient(object : ServiceWorkerClient()') == 1
          assert 'serviceWorkerOwner.set(this)' in p
          assert 'serviceWorkerOwner.compareAndSet(this, null)' in p
          assert 'SOURCE_BROWSER_SESSION_ACTION_FAST_PATH_MISSED' in p
          assert 'val existing = active?.takeIf { it.manifest.id == manifest.id }' in p
          assert 'ensureServiceWorkerClientInstalled()' not in p
          print('Round 5 ServiceWorker structural guards passed.')
          PY

      - name: Verify source platform and app
        run: >-
          ./gradlew
          :source-api:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-vbook:test
          :source-lua:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_round5_service_worker.py
          rm .github/workflows/round5-service-worker.yml

      - name: Commit verified ServiceWorker patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: route source ServiceWorker through one process client'
          git push origin HEAD:agent/remove-unused-files
