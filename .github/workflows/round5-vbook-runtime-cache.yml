name: Round 5 vBook Runtime Cache

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - scripts/apply_round5_vbook_runtime_cache.py
      - .github/workflows/round5-vbook-runtime-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-files

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply guarded vBook runtime/cache patch
        run: python3 scripts/apply_round5_vbook_runtime_cache.py

      - name: Verify patch shape
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          rhino = Path('source-vbook/src/main/kotlin/vn/nghetruyen/source/vbook/RhinoVBookActionRuntime.kt').read_text()
          story = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/VBookStorySource.kt').read_text()
          platform = Path('app/src/main/java/vn/nghetruyen/app/sourceplatform/VBookSourcePlatform.kt').read_text()
          assert 'private val selected: VBookActionRuntime by lazy' in rhino
          assert 'ConcurrentHashMap' not in story
          assert 'MAX_PAGE_CACHE_ENTRIES = 128' in story
          assert 'MAX_CHAPTER_CACHE_ENTRIES = 4_096' in story
          assert 'storySourceCache.getOrLoad(artifact.artifactId, cacheNull = false)' in platform
          assert 'manifestCache.retainKeys' in platform
          print('Round 5 vBook runtime/cache structural guards passed.')
          PY

      - name: Verify source platform and app
        run: >-
          ./gradlew
          :source-api:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-vbook:test
          :source-lua:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_round5_vbook_runtime_cache.py
          rm .github/workflows/round5-vbook-runtime-cache.yml

      - name: Commit verified vBook runtime/cache patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'perf: lazily initialize and reuse vBook runtimes'
          git push origin HEAD:agent/remove-unused-files
