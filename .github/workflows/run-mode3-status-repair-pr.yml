name: One-shot Mode 3 status repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/run-mode3-status-repair-pr.yml
      - .github/scripts/fix_mode3_status_and_ci.py

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Apply and verify repair
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          python3 .github/scripts/fix_mode3_status_and_ci.py
          python3 scripts/check_ui_control_parity.py
          python3 scripts/check_reference_workflow_parity.py
          ./gradlew :app:testDebugUnitTest --tests 'vn.nghetruyen.app.playback.FreesoundPlaybackStatusFormatterTest' --tests 'vn.nghetruyen.app.freesound.FreesoundAutoAudioTest' --stacktrace
          ./gradlew :app:assembleDebug --stacktrace
      - name: Commit verified repair and remove one-shot tooling
        shell: bash
        run: |
          rm -f \
            .github/workflows/fix-mode3-status-and-ci.yml \
            .github/workflows/run-mode3-status-repair-pr.yml \
            .github/scripts/fix_mode3_status_and_ci.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: report Mode 3 downloads and cache reuse accurately'
          git push origin HEAD:${{ github.head_ref }}
