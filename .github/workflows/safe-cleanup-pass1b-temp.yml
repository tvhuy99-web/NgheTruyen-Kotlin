name: Safe Cleanup Pass 1B Temp

on:
  push:
    branches:
      - agent/remove-unused-files
    paths:
      - .github/workflows/safe-cleanup-pass1b-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/remove-unused-files
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply guarded safe cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          TEMP = Path('.github/workflows/safe-cleanup-pass1b-temp.yml')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('patched', path)

          replace_once(
              'source-runtime/src/main/kotlin/vn/nghetruyen/source/runtime/DeclarativeSourceRuntime.kt',
              'else -> scalar(value ?: JsonValue.Null)',
              'else -> scalar(value)',
          )
          replace_once(
              'source-runtime/src/main/kotlin/vn/nghetruyen/source/runtime/DeclarativeSourceRuntime.kt',
              'return scalar(value ?: JsonValue.Null)',
              'return scalar(value)',
          )
          replace_once(
              'source-runtime/src/main/kotlin/vn/nghetruyen/source/runtime/DeclarativeSourceRuntime.kt',
              'put(name, value ?: JsonValue.Null)',
              'put(name, value)',
          )
          replace_once(
              'app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePlatformManager.kt',
              'if (installedByBootstrap && legacyInstalled != null && legacyInstalled.enabled != exactInstalled.enabled) {',
              'if (installedByBootstrap && legacyInstalled.enabled != exactInstalled.enabled) {',
          )
          replace_once(
              'app/build.gradle.kts',
              '        // Legacy release-gate tokens: versionCode = 28, versionName = "2.8.0-ai-narration-priority2-complete"\n',
              '',
          )

          targets = [
              'scripts/apply_android_build_fixes.py',
              'scripts/apply_navigation_audit_v3.py',
              'scripts/apply_reference_ui_polish_v2.py',
              'scripts/finalize_reference_parity_v41.py',
              'scripts/finalize_reference_validator_v41.py',
          ]
          tracked = [Path(x) for x in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()]
          text_suffixes = {'.kt','.kts','.java','.xml','.gradle','.properties','.toml','.py','.sh','.ps1','.yml','.yaml','.md','.txt','.json','.lua','.patch','.b64'}
          texts = {}
          for p in tracked:
              if p == TEMP or (p.as_posix().startswith('.github/workflows/') and '-temp.' in p.name):
                  continue
              if p.suffix.lower() not in text_suffixes:
                  continue
              try:
                  texts[p] = p.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  pass

          incoming = {}
          for target in targets:
              tp = Path(target)
              refs = []
              for p, text in texts.items():
                  if p == tp:
                      continue
                  if target in text or tp.name in text:
                      refs.append(str(p))
              incoming[target] = refs
              print('incoming', target, refs)

          expected = {
              'scripts/apply_android_build_fixes.py': [],
              'scripts/apply_navigation_audit_v3.py': ['scripts/apply_android_build_fixes.py'],
              'scripts/apply_reference_ui_polish_v2.py': [],
              'scripts/finalize_reference_parity_v41.py': [],
              'scripts/finalize_reference_validator_v41.py': [],
          }
          for target, refs in incoming.items():
              if sorted(refs) != sorted(expected[target]):
                  raise SystemExit(f'{target}: incoming refs changed; refusing deletion: {refs}')
          for target in targets:
              Path(target).unlink()
              print('deleted', target)
          PY

          git diff --check
          git status --short

      - name: Validate source and app
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace \
            :source-api:test \
            :source-runtime:test \
            :source-network:test \
            :source-repository:test \
            :source-vbook:test \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-runtime/src/main/kotlin/vn/nghetruyen/source/runtime/DeclarativeSourceRuntime.kt \
                  app/src/main/java/vn/nghetruyen/app/sourceplatform/SourcePlatformManager.kt \
                  app/build.gradle.kts scripts
          git commit -m 'chore: remove compiler-proven dead code and obsolete scripts'
          git push origin HEAD:agent/remove-unused-files

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          rm -f .github/workflows/safe-cleanup-pass1b-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary safe cleanup runner'
            git push origin HEAD:agent/remove-unused-files
          fi
