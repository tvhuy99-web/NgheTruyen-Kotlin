name: Safe Dead Code Sweep Temp

on:
  push:
    branches: [agent/remove-unused-files]
    paths: [.github/workflows/safe-dead-code-sweep-temp.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/remove-unused-files
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply guarded dead-code sweep
        run: |
          python3 scripts/safe_dead_code_sweep_temp.py
          git diff --check
          git status --short
      - name: Validate
        run: |
          ./gradlew --no-daemon --stacktrace \
            :source-runtime:test \
            :source-vbook:test \
            :source-diagnostics:test \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/safe-dead-code-sweep-temp.yml scripts/safe_dead_code_sweep_temp.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore: remove unreferenced app and Room dead code'
          git push origin HEAD:agent/remove-unused-files
      - name: Remove temporary sweep files
        if: always()
        run: |
          git reset --hard HEAD
          rm -f .github/workflows/safe-dead-code-sweep-temp.yml scripts/safe_dead_code_sweep_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary dead-code sweep files'
            git push origin HEAD:agent/remove-unused-files
          fi
