name: Simplify extension UI runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/diagnostics-blackbox-vbook-url'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Run embedded UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/simplify-extension-ui.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = []
          for line in workflow[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/simplify_extension_ui.py').write_text('\n'.join(script) + '\n')
          PY
          python3 /tmp/simplify_extension_ui.py

      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit result and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/simplify-extension-ui.yml .github/workflows/simplify-extension-ui-runner.yml .github/simplify-extension-ui.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt .github/workflows .github/simplify-extension-ui.trigger || true
          git commit -m "feat: simplify extension screens to Lua-style navigation"
          git push origin HEAD:${{ github.head_ref }}
