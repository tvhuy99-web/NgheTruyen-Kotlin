name: Source live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1,4"

permissions:
  contents: read

jobs:
  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source endpoints without bypassing anti-bot
        run: python3 scripts/live_source_smoke.py --timeout 25 --output source-live-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-live-smoke
          path: source-live-smoke.json
