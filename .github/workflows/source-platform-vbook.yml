name: Source Platform vBook

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply_diagnostics_final_hotfix.py'
      - '.github/workflows/source-platform-vbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-lua-style-diagnostics-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply final browser hotfix
        run: python3 scripts/apply_diagnostics_final_hotfix.py

      - name: Verify diagnostics gate
        run: |
          python3 scripts/check_lua_diagnostics_ui_parity.py
          python3 scripts/validate_release.py --wiring-only

      - name: Compile app and diagnostics tests
        run: ./gradlew :source-diagnostics:test :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Commit final browser hotfix
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/sources/SourceDiagnosticBrowserActivity.kt scripts/check_lua_diagnostics_ui_parity.py
          if git diff --cached --quiet; then
            echo "No hotfix changes to commit"
          else
            git commit -m "fix: keep browser HTTP errors in global diagnostics"
            git push origin HEAD:agent/fix-lua-style-diagnostics-ui
          fi
