name: Source Platform vBook

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/java/vn/nghetruyen/app/sourceplatform/**'
      - 'app/src/main/java/vn/nghetruyen/app/sources/**'
      - 'app/src/main/java/vn/nghetruyen/app/ai/**'
      - 'source-diagnostics/**'
      - 'source-vbook/**'
      - 'scripts/apply_diagnostics_deepening.py'
      - 'scripts/apply_diagnostics_stage_c.py'
      - 'scripts/apply_diagnostics_stage_d.py'
      - 'scripts/check_lua_diagnostics_ui_parity.py'
      - '.github/workflows/source-platform-vbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-lua-style-diagnostics-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Stage B codegen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_diagnostics_deepening.py')
          value = path.read_text(encoding='utf-8')
          old = "write(path, '''package vn.nghetruyen.app.ai.vietphrase\n\nimport android.content.Context"
          new = "write(path, r'''package vn.nghetruyen.app.ai.vietphrase\n\nimport android.content.Context"
          if old in value:
              value = value.replace(old, new, 1)
              path.write_text(value, encoding='utf-8')
          elif new not in value:
              raise SystemExit('VietPhrase exporter codegen anchor not found')
          PY

      - name: Apply core diagnostics stages
        run: |
          python3 scripts/apply_diagnostics_deepening.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_lua_diagnostics_ui_parity.py')
          value = path.read_text(encoding='utf-8')
          browser = 'browser = text("app/src/main/java/vn/nghetruyen/app/sourceplatform/AndroidSourceBrowserBroker.kt")\n'
          if browser not in value:
              anchor = 'audio = text("app/src/main/java/vn/nghetruyen/app/audio/AudioExportWorker.kt")\n'
              if anchor not in value:
                  raise SystemExit('parity insertion anchor not found')
              value = value.replace(anchor, browser + anchor, 1)
              path.write_text(value, encoding='utf-8')
          PY
          python3 scripts/apply_diagnostics_stage_c.py
          python3 scripts/apply_diagnostics_stage_d.py

      - name: Verify diagnostics and vBook gates
        run: |
          python3 scripts/check_lua_diagnostics_ui_parity.py
          python3 scripts/validate_release.py --wiring-only
          python3 scripts/check_vbook_static.py
          python3 scripts/check_source_engine_specificity.py

      - name: Test and compile
        run: >-
          ./gradlew
          :source-api:test
          :source-js-sandbox:test
          :source-compat-testkit:test
          :source-store:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-repository:test
          :source-vbook:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Commit hardened diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-diagnostics app source-vbook scripts/check_lua_diagnostics_ui_parity.py scripts/validate_release.py
          if git diff --cached --quiet; then
            echo "No diagnostics changes to commit"
          else
            git commit -m "fix: harden unified diagnostics black box"
            git push origin HEAD:agent/fix-lua-style-diagnostics-ui
          fi
