name: Source Platform vBook

on:
  pull_request:
    paths:
      - 'app/src/main/java/vn/nghetruyen/app/sourceplatform/**'
      - 'app/src/main/java/vn/nghetruyen/app/AppContainer.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/SourcePackConfigDialog.kt'
      - 'source-api/**'
      - 'source-package/**'
      - 'source-store/**'
      - 'source-runtime/**'
      - 'source-diagnostics/**'
      - 'source-network/**'
      - 'source-repository/**'
      - 'source-vbook/**'
      - 'source-js-sandbox/**'
      - 'source-compat-testkit/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/check_source_engine_specificity.py'
      - 'scripts/check_vbook_static.py'
      - 'scripts/check_vbook_differential_coverage.py'
      - 'scripts/capture_vbook_reference.py'
      - 'scripts/capture_vbook_reference_matrix.py'
      - 'scripts/fetch_vbook_corpus.py'
      - 'scripts/run_vbook_compat_lab.py'
      - 'scripts/vbook-reference-plan*.json'
      - 'scripts/apply_diagnostics_deepening.py'
      - '.github/workflows/source-platform-vbook.yml'
  push:
    branches:
      - 'agent/source-platform-s0-s1'
      - 'agent/vbook-*'
    paths:
      - 'app/src/main/java/vn/nghetruyen/app/sourceplatform/**'
      - 'app/src/main/java/vn/nghetruyen/app/AppContainer.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt'
      - 'source-api/**'
      - 'source-package/**'
      - 'source-store/**'
      - 'source-runtime/**'
      - 'source-diagnostics/**'
      - 'source-network/**'
      - 'source-repository/**'
      - 'source-vbook/**'
      - 'source-js-sandbox/**'
      - 'source-compat-testkit/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/check_source_engine_specificity.py'
      - 'scripts/check_vbook_static.py'
      - 'scripts/check_vbook_differential_coverage.py'
      - 'scripts/capture_vbook_reference.py'
      - 'scripts/capture_vbook_reference_matrix.py'
      - 'scripts/fetch_vbook_corpus.py'
      - 'scripts/run_vbook_compat_lab.py'
      - 'scripts/vbook-reference-plan*.json'
      - '.github/workflows/source-platform-vbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-lua-style-diagnostics-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize diagnostics codegen quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_diagnostics_deepening.py')
          value = path.read_text(encoding='utf-8')
          old = "write(path, '''package vn.nghetruyen.app.ai.vietphrase\n\nimport android.content.Context"
          new = "write(path, r'''package vn.nghetruyen.app.ai.vietphrase\n\nimport android.content.Context"
          if old in value:
              value = value.replace(old, new, 1)
              path.write_text(value, encoding='utf-8')
          elif new not in value:
              raise SystemExit('VietPhrase exporter codegen anchor not found')
          PY

      - name: Apply diagnostics migration
        run: python3 scripts/apply_diagnostics_deepening.py

      - name: Verify vBook architecture and engine specificity
        run: |
          python3 scripts/check_lua_diagnostics_ui_parity.py
          python3 scripts/validate_release.py --wiring-only
          python3 scripts/check_vbook_static.py
          python3 scripts/check_source_engine_specificity.py

      - name: Verify source platform and compile app
        run: >-
          ./gradlew
          :source-api:test
          :source-js-sandbox:test
          :source-compat-testkit:test
          :source-store:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-repository:test
          :source-vbook:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Print vBook test failures
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=(source-vbook/build/test-results/test/TEST-*.xml)
          if ((${#files[@]} == 0)); then
            echo 'No vBook XML test results were produced.'
            exit 0
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('source-vbook/build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      print(f"\n=== {root.get('name')} :: {case.get('name')} ===")
                      print(failure.get('message', ''))
                      text = (failure.text or '').splitlines()
                      print('\n'.join(text[:45]))
          PY

      - name: Commit diagnostics migration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-diagnostics app source-vbook scripts/check_lua_diagnostics_ui_parity.py scripts/validate_release.py
          if git diff --cached --quiet; then
            echo "No diagnostics changes to commit"
          else
            git commit -m "fix: deepen diagnostic black box"
            git push origin HEAD:agent/fix-lua-style-diagnostics-ui
          fi
