name: Source Platform vBook

on:
  pull_request:
    paths:
      - 'app/src/main/java/vn/nghetruyen/app/sourceplatform/**'
      - 'app/src/main/java/vn/nghetruyen/app/AppContainer.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/SourcePackConfigDialog.kt'
      - 'app/src/main/res/xml/backup_rules.xml'
      - 'app/src/main/res/xml/data_extraction_rules.xml'
      - 'source-api/**'
      - 'source-package/**'
      - 'source-store/**'
      - 'source-runtime/**'
      - 'source-diagnostics/**'
      - 'source-network/**'
      - 'source-repository/**'
      - 'source-vbook/**'
      - 'source-js-sandbox/**'
      - 'source-compat-testkit/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/check_source_engine_specificity.py'
      - 'scripts/check_vbook_static.py'
      - 'scripts/check_vbook_differential_coverage.py'
      - 'scripts/capture_vbook_reference.py'
      - 'scripts/capture_vbook_reference_matrix.py'
      - 'scripts/fetch_vbook_corpus.py'
      - 'scripts/run_vbook_compat_lab.py'
      - 'scripts/vbook-reference-plan*.json'
      - '.github/workflows/source-platform-vbook.yml'
  push:
    branches:
      - 'agent/source-platform-s0-s1'
      - 'agent/vbook-*'
    paths:
      - 'app/src/main/java/vn/nghetruyen/app/sourceplatform/**'
      - 'app/src/main/java/vn/nghetruyen/app/AppContainer.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt'
      - 'app/src/main/java/vn/nghetruyen/app/ui/screens/SourcePackConfigDialog.kt'
      - 'app/src/main/res/xml/backup_rules.xml'
      - 'app/src/main/res/xml/data_extraction_rules.xml'
      - 'source-api/**'
      - 'source-package/**'
      - 'source-store/**'
      - 'source-runtime/**'
      - 'source-diagnostics/**'
      - 'source-network/**'
      - 'source-repository/**'
      - 'source-vbook/**'
      - 'source-js-sandbox/**'
      - 'source-compat-testkit/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/check_source_engine_specificity.py'
      - 'scripts/check_vbook_static.py'
      - 'scripts/check_vbook_differential_coverage.py'
      - 'scripts/capture_vbook_reference.py'
      - 'scripts/capture_vbook_reference_matrix.py'
      - 'scripts/fetch_vbook_corpus.py'
      - 'scripts/run_vbook_compat_lab.py'
      - 'scripts/vbook-reference-plan*.json'
      - '.github/workflows/source-platform-vbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-lua-ui:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/diagnostics-blackbox-vbook-url'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Lua-style extensions UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_lua_ui_patch.py')
          text = path.read_text()
          old = 'text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'text, count = re.subn(pattern, lambda _m, replacement=replacement: replacement, text, count=1, flags=re.S)'
          if text.count(old) != 1:
              raise SystemExit('patch-script hotfix anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/apply_lua_ui_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and build APK
        run: >-
          ./gradlew
          :source-diagnostics:test
          :source-vbook:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          :app:assembleDebug
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-lua-extensions-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit final UI and clean temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-platform-vbook.yml
          git rm -f .github/workflows/apply-lua-extensions-ui.yml scripts/apply_lua_ui_patch.py
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt .github/workflows/source-platform-vbook.yml
          git commit -m "simplify extensions UI like Lua version"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify vBook architecture and engine specificity
        run: |
          python3 scripts/check_vbook_static.py
          python3 scripts/check_source_engine_specificity.py

      - name: Verify source platform and compile app
        run: >-
          ./gradlew
          :source-api:test
          :source-js-sandbox:test
          :source-compat-testkit:test
          :source-store:test
          :source-runtime:test
          :source-diagnostics:test
          :source-network:test
          :source-repository:test
          :source-vbook:test
          :app:testDebugUnitTest
          :app:compileDebugKotlin
          --stacktrace

      - name: Print vBook test failures
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=(source-vbook/build/test-results/test/TEST-*.xml)
          if ((${#files[@]} == 0)); then
            echo 'No vBook XML test results were produced.'
            exit 0
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('source-vbook/build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      print(f"\n=== {root.get('name')} :: {case.get('name')} ===")
                      print(failure.get('message', ''))
                      text = (failure.text or '').splitlines()
                      print('\n'.join(text[:45]))
          PY
