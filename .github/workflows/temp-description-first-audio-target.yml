name: Temporary Description-First Audio Target Runner

on:
  pull_request_target:
    types: [synchronize]
    branches:
      - fix/mode3-resolution-quality-20260822

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.event.pull_request.head.ref == 'build/description-first-audio-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/description-first-audio-20260823
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply description-first policy
        run: python3 scripts/apply_description_first_audio_fix.py

      - name: Run focused regression tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'vn.nghetruyen.app.freesound.DescriptionFirstMatchingTest' --tests 'vn.nghetruyen.app.freesound.FreesoundAutoAudioTest'

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Commit verified source changes to audio branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
                  app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(audio): description-only local matching and description-first Freesound ranking"
            git push origin HEAD:build/description-first-audio-20260823
          fi

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk
          sha256sum dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk > dist/NgheTruyen_Mode3_DescriptionFirst_20260823.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Mode3-DescriptionFirst-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14
