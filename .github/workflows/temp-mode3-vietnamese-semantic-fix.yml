name: Temporary Mode3 Vietnamese semantic patch

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch Mode 3 semantic matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print('patched:', label)
                  return
              if new in text:
                  print('already patched:', label)
                  return
              raise SystemExit(f'Patch anchor not found: {label}')

          matcher = 'app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt'
          resolver = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt'
          importer = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt'
          requirements = 'app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoRequirements.kt'
          prompt = 'app/src/main/java/vn/nghetruyen/app/ai/XpkUnifiedNarrationPrompt.kt'

          replace_exact(
              requirements,
              '     * Expected form: "Dùng: ...; Tránh: ...". The name is kept source-compatible with the previous\n',
              '     * Expected form: "Sắc thái: ...; Dùng: ...; Tránh: ...". The name is kept source-compatible with the previous\n',
              'requirement localContext schema',
          )
          replace_exact(
              requirements,
              '    private const val MAX_LOCAL_HINT_CHARS = 240\n',
              '    private const val MAX_LOCAL_HINT_CHARS = 300\n',
              'local hint max length',
          )

          replace_exact(
              prompt,
              '                add("local_hint phải do chính AI viết từ hiểu biết về cảnh, không phải bản dịch máy móc của query. Viết ngắn nhưng PHẢI có tín hiệu phân biệt tình tiết/nguồn âm cụ thể của cảnh và các near-miss dễ chọn nhầm; không chỉ liệt kê mood chung như buồn, bí ẩn, căng thẳng.")\n',
              '                add("local_hint phải do chính AI viết bằng tiếng Việt theo đúng schema Sắc thái / Dùng / Tránh giống metadata thư viện. Mô tả phải nêu bản chất âm nghe được, ngữ cảnh dùng và near-miss dễ chọn nhầm; không chỉ liệt kê mood chung hoặc dịch máy móc query.")\n',
              'prompt local hint semantic rule',
          )
          old_rule = '            12. Mỗi requirement BẮT BUỘC thêm local_hint bằng tiếng Việt, tối đa 240 ký tự, đúng dạng "Dùng: ...; Tránh: ...". Phần Dùng dùng 3–6 cụm ngắn; ít nhất 2 cụm phải phân biệt đúng tình tiết/không gian/vật liệu/cách phát âm của cảnh, không chỉ là mood chung. Phần Tránh dùng 2–4 near-miss dễ bị chọn nhầm nhưng nghe/cảm xúc khác cảnh. Không kể lại cốt truyện, không tên nhân vật, không ID, không tên file. Ví dụ MUSIC: "Dùng: đối đầu căng thẳng trước giao chiến, nguy hiểm cận kề, thế lực áp đảo; Tránh: phiêu lưu vui, chiến thắng, lãng mạn". Ví dụ AMBIENCE: "Dùng: hang băng, gió lạnh luồn hang, không gian đá kín; Tránh: gió đồng trống, thành phố, phòng trong nhà". Ví dụ SFX: "Dùng: xích sắt đứt, kim loại gãy vỡ, mắt xích bật mạnh; Tránh: kính vỡ, gỗ gãy, kim loại va nhẹ".\n'
          new_rule = '            12. Mỗi requirement BẮT BUỘC thêm local_hint bằng tiếng Việt, tối đa 300 ký tự, đúng dạng "Sắc thái: ...; Dùng: ...; Tránh: ..." để dùng cùng một schema với toàn bộ thư viện. Sắc thái mô tả bản chất âm nghe được (nguồn/vật liệu/cường độ/nhịp/không gian); Dùng nêu 2–5 tình huống phù hợp; Tránh nêu 2–4 near-miss dễ chọn sai. Không kể lại cốt truyện, không tên nhân vật, ID hay tên file. Ví dụ MUSIC: "Sắc thái: dây trầm căng, nhịp tăng dần; Dùng: đối đầu trước giao chiến, nguy hiểm cận kề; Tránh: chiến thắng, lãng mạn". Ví dụ AMBIENCE: "Sắc thái: hang băng kín, gió lạnh vang nhẹ; Dùng: hang băng, đường hầm băng; Tránh: đồng trống, thành phố". Ví dụ SFX: "Sắc thái: xích sắt bật gãy mạnh; Dùng: xích đứt, mắt xích văng; Tránh: kính vỡ, gỗ gãy".\n'
          replace_exact(prompt, old_rule, new_rule, 'prompt local_hint schema')

          replace_exact(
              matcher,
              '''    private data class LocalHint(\n        val raw: String,\n        val use: LocalText,\n        val avoid: LocalText,\n    ) {\n        val isPresent: Boolean get() = use.tokens.isNotEmpty() || avoid.tokens.isNotEmpty()\n    }\n''',
              '''    private data class LocalHint(\n        val raw: String,\n        val shade: LocalText,\n        val use: LocalText,\n        val avoid: LocalText,\n    ) {\n        val isPresent: Boolean get() = shade.tokens.isNotEmpty() || use.tokens.isNotEmpty() || avoid.tokens.isNotEmpty()\n    }\n''',
              'matcher LocalHint shade field',
          )
          replace_exact(
              matcher,
              '            get() = hints.flatMapTo(linkedSetOf()) { it.use.tokens + it.avoid.tokens }\n',
              '            get() = hints.flatMapTo(linkedSetOf()) { it.shade.tokens + it.use.tokens + it.avoid.tokens }\n',
              'matcher local candidate tokens',
          )
          replace_exact(
              matcher,
              '''    fun isDecisive(match: Match?): Boolean {\n        if (match == null || !match.accepted) return false\n        if (match.selectionScore < LOCAL_NETWORK_SKIP_FIT || match.avoidCoverage >= MAX_CONFLICT) return false\n        return when (match.metadataQuality) {\n            "STRUCTURED" -> match.contextScore >= DECISIVE_CONTEXT_SCORE\n            else -> match.coverage >= EXACT_QUERY_COVERAGE && match.coreCoverage >= CORE_PRESENT_COVERAGE\n        }\n    }\n''',
              '''    fun isDecisive(match: Match?): Boolean {\n        if (match == null || !match.accepted || match.avoidCoverage >= MAX_CONFLICT) return false\n        return when (match.metadataQuality) {\n            "STRUCTURED" -> {\n                val descriptionDecisive = match.contextScore >= DECISIVE_CONTEXT_SCORE\n                val exactWithContext =\n                    match.selectionScore >= LOCAL_NETWORK_SKIP_FIT &&\n                        match.coverage >= EXACT_QUERY_COVERAGE &&\n                        match.coreCoverage >= CORE_PRESENT_COVERAGE &&\n                        match.contextScore >= DECISIVE_EXACT_MIN_CONTEXT_SCORE\n                descriptionDecisive || exactWithContext\n            }\n            else ->\n                match.selectionScore >= LOCAL_NETWORK_SKIP_FIT &&\n                    match.coverage >= EXACT_QUERY_COVERAGE &&\n                    match.coreCoverage >= CORE_PRESENT_COVERAGE\n        }\n    }\n''',
              'matcher decisive gate',
          )
          replace_exact(
              matcher,
              '''        val titleQueryCoverage = tokenCoverage(queryTokens, indexed.englishTitleTokens)\n        val metadataQueryCoverage = tokenCoverage(queryTokens, indexed.englishMetadataTokens)\n        val queryCoverage = max(titleQueryCoverage, metadataQueryCoverage * 0.92)\n        val queryAvoidCoverage = tokenCoverage(queryTokens, indexed.englishAvoidTokens)\n        val coreCoverage = profile.coreToken?.let { core ->\n            max(\n                if (core in indexed.englishTitleTokens) 1.0 else 0.0,\n                if (core in indexed.englishMetadataTokens) 0.92 else 0.0,\n            )\n        } ?: 0.0\n        val eventCoverage = profile.eventToken?.let { event ->\n            max(\n                if (event in indexed.englishTitleTokens) 1.0 else 0.0,\n                if (event in indexed.englishMetadataTokens) 0.92 else 0.0,\n            )\n        } ?: 0.0\n''',
              '''        val titleQueryCoverage = tokenCoverage(queryTokens, indexed.englishTitleTokens)\n        val metadataQueryCoverage = tokenCoverage(queryTokens, indexed.englishMetadataTokens)\n        // Metadata is the semantic source of truth. A very good filename remains useful evidence,\n        // but can no longer outrank a contradictory structured description by itself.\n        val queryCoverage = max(metadataQueryCoverage, titleQueryCoverage * TITLE_QUERY_EVIDENCE_WEIGHT)\n        val queryAvoidCoverage = tokenCoverage(queryTokens, indexed.englishAvoidTokens)\n        val coreCoverage = profile.coreToken?.let { core ->\n            max(\n                if (core in indexed.englishMetadataTokens) 1.0 else 0.0,\n                if (core in indexed.englishTitleTokens) TITLE_CORE_EVIDENCE_WEIGHT else 0.0,\n            )\n        } ?: 0.0\n        val eventCoverage = profile.eventToken?.let { event ->\n            max(\n                if (event in indexed.englishMetadataTokens) 1.0 else 0.0,\n                if (event in indexed.englishTitleTokens) TITLE_CORE_EVIDENCE_WEIGHT else 0.0,\n            )\n        } ?: 0.0\n''',
              'matcher metadata over title evidence',
          )
          replace_exact(
              matcher,
              '''        val useScore = if (hintAware) average(profile.hints.map { hint ->\n            val direct = localSimilarity(hint.use, indexed.sections.use)\n            val shade = localSimilarity(hint.use, indexed.sections.shade) * 0.82\n            val fallback = localSimilarity(hint.use, indexed.sections.all) * 0.62\n            max(direct, max(shade, fallback))\n        }) else 0.0\n        val shadeScore = if (hintAware) average(profile.hints.map { localSimilarity(it.use, indexed.sections.shade) }) else 0.0\n        val allScore = if (hintAware) average(profile.hints.map { localSimilarity(it.use, indexed.sections.all) }) else 0.0\n        val hintConflict = if (hintAware) profile.hints.maxOf { hint ->\n            max(\n                localSimilarity(hint.use, indexed.sections.avoid),\n                localSimilarity(hint.avoid, indexed.sections.use),\n            )\n        } else 0.0\n        val avoidCoverage = max(queryAvoidCoverage, hintConflict)\n        val contextScore = max(useScore, max(shadeScore * 0.86, allScore * 0.66))\n''',
              '''        val useScore = if (hintAware) average(profile.hints.map { hint ->\n            val direct = localSimilarity(hint.use, indexed.sections.use)\n            val shadeToUse = localSimilarity(hint.shade, indexed.sections.use) * 0.45\n            val useToShade = localSimilarity(hint.use, indexed.sections.shade) * 0.55\n            val fallback = max(\n                localSimilarity(hint.use, indexed.sections.all),\n                localSimilarity(hint.shade, indexed.sections.all),\n            ) * 0.45\n            max(max(direct, shadeToUse), max(useToShade, fallback))\n        }) else 0.0\n        val shadeScore = if (hintAware) average(profile.hints.map { hint ->\n            val expectedShade = if (hint.shade.tokens.isNotEmpty()) hint.shade else hint.use\n            max(\n                localSimilarity(expectedShade, indexed.sections.shade),\n                localSimilarity(hint.use, indexed.sections.shade) * 0.70,\n            )\n        }) else 0.0\n        val allScore = if (hintAware) average(profile.hints.map { hint ->\n            max(\n                localSimilarity(hint.use, indexed.sections.all),\n                localSimilarity(hint.shade, indexed.sections.all),\n            )\n        }) else 0.0\n        val hintConflict = if (hintAware) profile.hints.maxOf { hint ->\n            max(\n                max(\n                    localSimilarity(hint.use, indexed.sections.avoid),\n                    localSimilarity(hint.shade, indexed.sections.avoid),\n                ),\n                max(\n                    localSimilarity(hint.avoid, indexed.sections.use),\n                    localSimilarity(hint.avoid, indexed.sections.shade),\n                ),\n            )\n        } else 0.0\n        val avoidCoverage = max(queryAvoidCoverage, hintConflict)\n        val contextScore = max(useScore, max(shadeScore * 0.94, allScore * 0.62))\n''',
              'matcher structured description scores',
          )
          replace_exact(
              matcher,
              '''        val structuredBonus = if (semanticMetadata) 0.06 else if (indexed.sections.allText.length >= 24) 0.02 else 0.0\n        val titleBonus = titleQueryCoverage * 0.04\n        val repetitionPenalty = repetitionPenalty(currentTrack, nowMillis)\n        val finalScore = if (hintAware && semanticMetadata) {\n            // Rich Vietnamese Dùng/Sắc thái/Tránh metadata: AI local_hint is the main evidence.\n            useScore * 0.56 +\n                shadeScore * 0.13 +\n                allScore * 0.09 +\n                queryCoverage * 0.12 +\n                structuredBonus +\n                titleBonus -\n                avoidCoverage * 0.72 -\n                repetitionPenalty\n''',
              '''        val structuredBonus = if (semanticMetadata) 0.06 else if (indexed.sections.allText.length >= 24) 0.02 else 0.0\n        val titleBonus = titleQueryCoverage * 0.02\n        val repetitionPenalty = repetitionPenalty(currentTrack, nowMillis)\n        val finalScore = if (hintAware && semanticMetadata) {\n            // Vietnamese structured metadata is primary; filename/query evidence is deliberately\n            // secondary so renamed files and Freesound imports compete on meaning, not provenance.\n            useScore * 0.52 +\n                shadeScore * 0.22 +\n                allScore * 0.10 +\n                queryCoverage * 0.08 +\n                structuredBonus +\n                titleBonus -\n                avoidCoverage * 0.78 -\n                repetitionPenalty\n''',
              'matcher structured weights',
          )
          replace_exact(
              matcher,
              '''        val selectionScore = (\n            max(contextEvidence, queryEvidence) -\n                avoidCoverage * 0.45 -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)\n''',
              '''        val selectionBase = if (hintAware && semanticMetadata && contextEvidence > 0.0) {\n            contextEvidence * 0.65 + queryEvidence * 0.35\n        } else {\n            queryEvidence\n        }\n        val selectionScore = (\n            selectionBase -\n                avoidCoverage * 0.48 -\n                repetitionPenalty * 0.50\n            ).coerceIn(0.0, 1.0)\n''',
              'matcher semantic selection blend',
          )
          replace_exact(
              matcher,
              '''    private fun parseLocalHint(raw: String): LocalHint {\n        val value = raw.trim()\n        val lower = value.lowercase(Locale.ROOT)\n        val useAt = firstMarker(lower, "dùng:", "dung:")\n        val avoidAt = firstMarker(lower, "tránh:", "tranh:")\n        if (useAt < 0 && avoidAt < 0) {\n            return LocalHint(raw = value, use = localText(localNormalize(value)), avoid = EMPTY_LOCAL_TEXT)\n        }\n\n        val useMarkerLength = markerLengthAt(lower, useAt, "dùng:", "dung:")\n        val avoidMarkerLength = markerLengthAt(lower, avoidAt, "tránh:", "tranh:")\n        val use = if (useAt >= 0) {\n            val start = (useAt + useMarkerLength).coerceAtMost(value.length)\n            val end = avoidAt.takeIf { it > start } ?: value.length\n            localNormalize(value.substring(start, end))\n        } else ""\n        val avoid = if (avoidAt >= 0) {\n            val start = (avoidAt + avoidMarkerLength).coerceAtMost(value.length)\n            localNormalize(value.substring(start))\n        } else ""\n        return LocalHint(raw = value, use = localText(use), avoid = localText(avoid))\n    }\n''',
              '''    private fun parseLocalHint(raw: String): LocalHint {\n        val value = raw.trim()\n        val lower = value.lowercase(Locale.ROOT)\n        val shadeAt = firstMarker(lower, "sắc thái:", "sac thai:")\n        val useAt = firstMarker(lower, "dùng:", "dung:")\n        val avoidAt = firstMarker(lower, "tránh:", "tranh:")\n        if (shadeAt < 0 && useAt < 0 && avoidAt < 0) {\n            return LocalHint(\n                raw = value,\n                shade = EMPTY_LOCAL_TEXT,\n                use = localText(localNormalize(value)),\n                avoid = EMPTY_LOCAL_TEXT,\n            )\n        }\n\n        fun slice(start: Int, markerLength: Int, endCandidates: List<Int>): String {\n            if (start < 0) return ""\n            val contentStart = (start + markerLength).coerceAtMost(value.length)\n            val end = endCandidates.filter { it > contentStart }.minOrNull() ?: value.length\n            return localNormalize(value.substring(contentStart, end))\n        }\n\n        val shade = slice(\n            shadeAt,\n            markerLengthAt(lower, shadeAt, "sắc thái:", "sac thai:"),\n            listOf(useAt, avoidAt),\n        )\n        val use = slice(\n            useAt,\n            markerLengthAt(lower, useAt, "dùng:", "dung:"),\n            listOf(avoidAt),\n        )\n        val avoid = slice(\n            avoidAt,\n            markerLengthAt(lower, avoidAt, "tránh:", "tranh:"),\n            emptyList(),\n        )\n        return LocalHint(raw = value, shade = localText(shade), use = localText(use), avoid = localText(avoid))\n    }\n''',
              'matcher local hint parser',
          )
          replace_exact(
              matcher,
              '''        val avoidText = slice(avoidAt, markerLengthAt(lower, avoidAt, "tránh:", "tranh:"), emptyList())\n''',
              '''        val provenanceAt = listOf(\n            lower.indexOf("freesound_id:"),\n            lower.indexOf("freesound_user:"),\n            lower.indexOf("freesound_license:"),\n            lower.indexOf("freesound_url:"),\n        ).filter { it >= 0 }.minOrNull() ?: -1\n        val avoidText = slice(\n            avoidAt,\n            markerLengthAt(lower, avoidAt, "tránh:", "tranh:"),\n            listOf(provenanceAt),\n        )\n''',
              'matcher provenance boundary',
          )
          replace_exact(
              matcher,
              '''    private const val DECISIVE_CONTEXT_SCORE = 0.56\n    private const val CONTEXT_ONLY_SCORE = 0.40\n    private const val LOCAL_NETWORK_SKIP_FIT = 0.80\n''',
              '''    private const val DECISIVE_CONTEXT_SCORE = 0.72\n    private const val DECISIVE_EXACT_MIN_CONTEXT_SCORE = 0.30\n    private const val CONTEXT_ONLY_SCORE = 0.46\n    private const val LOCAL_NETWORK_SKIP_FIT = 0.77\n    private const val TITLE_QUERY_EVIDENCE_WEIGHT = 0.88\n    private const val TITLE_CORE_EVIDENCE_WEIGHT = 0.92\n''',
              'matcher confidence constants',
          )
          replace_exact(
              matcher,
              '''    private val LOCAL_STOPWORDS = setOf(\n        "và", "hoặc", "nhưng", "của", "cho", "trong", "ngoài", "khi", "sau", "trước", "với", "đến",\n        "đang", "được", "không", "một", "những", "các", "này", "đó", "thì", "mà", "theo", "rất", "hơi",\n        "and", "or", "the", "a", "an", "with", "for", "from", "into", "this", "that",\n    )\n''',
              '''    private val LOCAL_STOPWORDS = setOf(\n        "và", "hoặc", "nhưng", "của", "cho", "trong", "ngoài", "khi", "sau", "trước", "với", "đến",\n        "đang", "được", "không", "một", "những", "các", "này", "đó", "thì", "mà", "theo", "rất", "hơi",\n        "cảnh", "tiếng", "âm", "thanh", "hiệu", "ứng", "sắc", "thái", "dùng", "tránh", "phù", "hợp",\n        "tạo", "có", "là", "nền", "nghe", "được", "kéo", "dài", "ngắn", "liên", "tục",\n        "and", "or", "the", "a", "an", "with", "for", "from", "into", "this", "that",\n    )\n''',
              'matcher Vietnamese semantic stopwords',
          )

          replace_exact(
              resolver,
              '''        if (!hasLocalContext) {\n            if (isManagedFreesoundTrack(track)) return track\n            return Mode3LibraryAssetMatcher.strongMatch(need, track)?.track\n        }\n\n        val contextualBest = Mode3LibraryAssetMatcher.bestMatch(\n''',
              '''        if (!hasLocalContext) {\n            return Mode3LibraryAssetMatcher.strongMatch(need, track)?.track\n        }\n\n        val contextualBest = Mode3LibraryAssetMatcher.bestMatch(\n''',
              'resolver source-neutral cache without context',
          )
          replace_exact(
              resolver,
              '''        if (contextualBest != null) {\n            return track.takeIf { it.id == contextualBest.track.id }\n        }\n\n        return track.takeIf(::isManagedFreesoundTrack)\n''',
              '''        if (contextualBest != null) {\n            return track.takeIf { it.id == contextualBest.track.id }\n        }\n\n        return null\n''',
              'resolver source-neutral cache with context',
          )
          replace_exact(
              resolver,
              '''            val result = importer.importPreview(\n                sound = remote,\n                kind = seed.need.kind,\n                normalizationTargetLufs = normalizationTarget(seed.need.kind),\n            )\n''',
              '''            val result = importer.importPreview(\n                sound = remote,\n                kind = seed.need.kind,\n                normalizationTargetLufs = normalizationTarget(seed.need.kind),\n                semanticDescription = semanticDescriptionForImport(seed.need),\n            )\n''',
              'resolver persist semantic description on import',
          )
          replace_exact(
              resolver,
              '''    private suspend fun normalizationTarget(kind: AudioAssetKind): Float = when (kind) {\n''',
              '''    private fun semanticDescriptionForImport(need: FreesoundAutoSearchNeed): String =\n        need.usages.asSequence()\n            .map(FreesoundAutoRequirement::localContext)\n            .map(String::trim)\n            .filter(String::isNotBlank)\n            .distinct()\n            .maxByOrNull(String::length)\n            ?.take(300)\n            .orEmpty()\n\n    private suspend fun normalizationTarget(kind: AudioAssetKind): Float = when (kind) {\n''',
              'resolver semantic description helper',
          )

          replace_exact(
              importer,
              '''    suspend fun importPreview(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n    ): Result<FreesoundImportResult> = withContext(Dispatchers.IO) {\n''',
              '''    suspend fun importPreview(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n        semanticDescription: String = "",\n    ): Result<FreesoundImportResult> = withContext(Dispatchers.IO) {\n''',
              'importer semanticDescription parameter',
          )
          replace_exact(
              importer,
              '            importPreviewLocked(sound, kind, normalizationTargetLufs)\n',
              '            importPreviewLocked(sound, kind, normalizationTargetLufs, semanticDescription)\n',
              'importer forward semantic description',
          )
          replace_exact(
              importer,
              '''    private suspend fun importPreviewLocked(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n    ): Result<FreesoundImportResult> {\n''',
              '''    private suspend fun importPreviewLocked(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n        semanticDescription: String,\n    ): Result<FreesoundImportResult> {\n''',
              'importer locked semantic parameter',
          )
          replace_exact(
              importer,
              '''                normalizationTargetLufs = normalizationTargetLufs,\n                previewUrl = previewUrl,\n''',
              '''                normalizationTargetLufs = normalizationTargetLufs,\n                semanticDescription = semanticDescription,\n                previewUrl = previewUrl,\n''',
              'importer candidate semantic forwarding',
          )
          replace_exact(
              importer,
              '''    private suspend fun importPreviewCandidate(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n        previewUrl: String,\n''',
              '''    private suspend fun importPreviewCandidate(\n        sound: FreesoundSound,\n        kind: AudioAssetKind,\n        normalizationTargetLufs: Float,\n        semanticDescription: String,\n        previewUrl: String,\n''',
              'importer candidate semantic parameter',
          )
          replace_exact(
              importer,
              '''            val tagsCsv = tagsForImport(\n                kind = kind,\n                description = sound.description,\n                soundId = sound.id,\n''',
              '''            val tagsCsv = tagsForImport(\n                kind = kind,\n                description = semanticDescription.trim().ifBlank { sound.description },\n                soundId = sound.id,\n''',
              'importer semantic tags content',
          )
          PY
      - name: Validate patch text
        run: |
          git diff --check
          git diff --stat
      - name: Commit semantic fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
