name: Temporary extended code comment cleanup

on:
  push:
    branches:
      - chore/remove-code-comments-20260816

permissions:
  contents: write

concurrency:
  group: comment-cleanup-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: chore/remove-code-comments-20260816
          fetch-depth: 0

      - name: Restore primary scanner from audit commit
        shell: bash
        run: |
          git show 7fed091a430964573228dcbf06b63b6289cf6ef9:.github/workflows/temp-remove-code-comments.yml > /tmp/old-cleanup.yml
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/old-cleanup.yml").read_text(encoding="utf-8")
          match = re.search(r"printf '%s' '([^']+)' \| base64 -d \| gzip -d", text)
          if not match:
              raise SystemExit("embedded scanner payload not found")
          Path("/tmp/scanner.b64").write_text(match.group(1), encoding="ascii")
          PY
          base64 -d /tmp/scanner.b64 | gzip -d > /tmp/remove_code_comments.py
          python3 -m py_compile /tmp/remove_code_comments.py

      - name: Remove Kotlin Java XML YAML shell and config comments
        run: python3 /tmp/remove_code_comments.py --apply --report /tmp/comment-report-primary.json

      - name: Remove Python comments and inventory extensions
        shell: bash
        run: |
          cat > /tmp/cleanup_python_comments.py <<'PY'
          import io
          import json
          import pathlib
          import re
          import subprocess
          import tokenize
          from collections import Counter

          LEGAL = (
              "copyright", "spdx-", "licensed under", "apache license", "mit license",
              "mozilla public license", "gnu general public license", "gnu lesser general public license",
              "permission is hereby granted", "all rights reserved", "redistribution and use"
          )

          def tracked():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]

          def legal(text):
              low = text.lower()
              return any(marker in low for marker in LEGAL)

          def clean_python(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              removals = []
              kept = 0
              try:
                  tokens = list(tokenize.generate_tokens(io.StringIO(text).readline))
              except (tokenize.TokenError, IndentationError, SyntaxError):
                  return None
              for token in tokens:
                  if token.type != tokenize.COMMENT:
                      continue
                  line_no, col = token.start
                  raw = token.string
                  stripped = raw.lstrip()
                  if line_no == 1 and stripped.startswith("#!"):
                      kept += 1
                      continue
                  if line_no <= 2 and re.search(r"coding\s*[:=]\s*[-\w.]+", raw):
                      kept += 1
                      continue
                  if legal(raw):
                      kept += 1
                      continue
                  removals.append((line_no - 1, col, token.end[1], raw))
              for line_idx, start, end, _ in sorted(removals, reverse=True):
                  line = lines[line_idx]
                  lines[line_idx] = line[:start] + line[end:]
              new = "".join(lines)
              if new != text:
                  pathlib.Path(path).write_text(new, encoding="utf-8", newline="")
              return {
                  "path": path,
                  "removed": len(removals),
                  "removed_lines": len(removals),
                  "legal_or_required_preserved": kept,
                  "changed": new != text,
              }

          paths = tracked()
          counts = Counter()
          for path in paths:
              suffix = pathlib.Path(path).suffix.lower() or "<none>"
              counts[suffix] += 1
          entries = []
          skipped = []
          for path in paths:
              if not path.lower().endswith(".py"):
                  continue
              try:
                  result = clean_python(path)
              except (UnicodeDecodeError, OSError) as exc:
                  skipped.append({"path": path, "error": str(exc)})
                  continue
              if result is None:
                  skipped.append({"path": path, "error": "tokenize_failed"})
              elif result["removed"] or result["legal_or_required_preserved"]:
                  entries.append(result)
          report = {
              "files_scanned": sum(1 for p in paths if p.lower().endswith(".py")),
              "files_changed": sum(1 for e in entries if e["changed"]),
              "comments_removed": sum(e["removed"] for e in entries),
              "comment_lines_removed": sum(e["removed_lines"] for e in entries),
              "legal_or_required_preserved": sum(e["legal_or_required_preserved"] for e in entries),
              "skipped": skipped,
              "files": entries,
          }
          pathlib.Path("/tmp/python-comment-report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          pathlib.Path("/tmp/extension-inventory.json").write_text(
              json.dumps({"tracked_files": len(paths), "extensions": dict(sorted(counts.items()))}, indent=2),
              encoding="utf-8",
          )
          print("PYTHON_COMMENT_SUMMARY=" + json.dumps({k: report[k] for k in report if k not in ("files", "skipped")}, sort_keys=True))
          print("TRACKED_EXTENSION_COUNTS=" + json.dumps(dict(sorted(counts.items())), sort_keys=True))
          if skipped:
              print("PYTHON_SKIPPED=" + json.dumps(skipped, ensure_ascii=False))
          PY
          python3 /tmp/cleanup_python_comments.py
          cp /tmp/python-comment-report.json /tmp/python-comment-report-before.json

      - name: Remove PowerShell comments
        shell: pwsh
        run: |
          $legalMarkers = @(
            "copyright", "spdx-", "licensed under", "apache license", "mit license",
            "mozilla public license", "gnu general public license", "gnu lesser general public license",
            "permission is hereby granted", "all rights reserved", "redistribution and use"
          )
          $paths = @(git ls-files '*.ps1')
          $files = @()
          $totalRemoved = 0
          $totalLines = 0
          $totalPreserved = 0
          foreach ($path in $paths) {
            $text = [System.IO.File]::ReadAllText($path)
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
            $remove = @()
            $preserved = 0
            foreach ($token in $tokens) {
              if ($token.Kind -ne [System.Management.Automation.Language.TokenKind]::Comment) { continue }
              $raw = $token.Text
              $low = $raw.ToLowerInvariant()
              $keep = $raw.TrimStart().StartsWith('#requires', [System.StringComparison]::OrdinalIgnoreCase)
              if (-not $keep) {
                foreach ($marker in $legalMarkers) {
                  if ($low.Contains($marker)) { $keep = $true; break }
                }
              }
              if ($keep) {
                $preserved++
                continue
              }
              $remove += $token
            }
            $newText = $text
            foreach ($token in ($remove | Sort-Object { $_.Extent.StartOffset } -Descending)) {
              $start = $token.Extent.StartOffset
              $length = $token.Extent.EndOffset - $start
              $newText = $newText.Remove($start, $length)
            }
            if ($newText -ne $text) {
              [System.IO.File]::WriteAllText($path, $newText, [System.Text.UTF8Encoding]::new($false))
            }
            $removedLines = 0
            foreach ($token in $remove) {
              $removedLines += (($token.Text -split "`n").Count)
            }
            $totalRemoved += $remove.Count
            $totalLines += $removedLines
            $totalPreserved += $preserved
            if ($remove.Count -gt 0 -or $preserved -gt 0) {
              $files += [ordered]@{
                path = $path
                removed = $remove.Count
                removed_lines = $removedLines
                required_or_legal_preserved = $preserved
                changed = ($newText -ne $text)
              }
            }
          }
          $report = [ordered]@{
            files_scanned = $paths.Count
            files_changed = @($files | Where-Object { $_.changed }).Count
            comments_removed = $totalRemoved
            comment_lines_removed = $totalLines
            required_or_legal_preserved = $totalPreserved
            files = $files
          }
          $remaining = 0
          foreach ($path in $paths) {
            $verifyText = [System.IO.File]::ReadAllText($path)
            $verifyTokens = $null
            $verifyErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($verifyText, [ref]$verifyTokens, [ref]$verifyErrors)
            foreach ($token in $verifyTokens) {
              if ($token.Kind -ne [System.Management.Automation.Language.TokenKind]::Comment) { continue }
              $raw = $token.Text
              $low = $raw.ToLowerInvariant()
              $keep = $raw.TrimStart().StartsWith('#requires', [System.StringComparison]::OrdinalIgnoreCase)
              if (-not $keep) {
                foreach ($marker in $legalMarkers) {
                  if ($low.Contains($marker)) { $keep = $true; break }
                }
              }
              if (-not $keep) { $remaining++ }
            }
          }
          if ($remaining -ne 0) { throw "PowerShell removable comments remain: $remaining" }
          $report.removable_remaining = $remaining
          $report | ConvertTo-Json -Depth 6 | Set-Content -Path /tmp/powershell-comment-report.json -Encoding utf8
          $summary = [ordered]@{
            files_scanned = $report.files_scanned
            files_changed = $report.files_changed
            comments_removed = $report.comments_removed
            comment_lines_removed = $report.comment_lines_removed
            required_or_legal_preserved = $report.required_or_legal_preserved
          } | ConvertTo-Json -Compress
          Write-Output "POWERSHELL_COMMENT_SUMMARY=$summary"

      - name: Verify scanners and stage non-workflow cleanup
        shell: bash
        run: |
          python3 /tmp/remove_code_comments.py --check --report /tmp/comment-report-primary-after.json
          python3 /tmp/cleanup_python_comments.py
          if git diff -- .github/workflows | grep -q .; then
            git checkout -- .github/workflows
          fi
          git status --short
          git add -A

      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        with:
          name: extended-code-comment-audit-${{ github.run_id }}
          path: |
            /tmp/comment-report-primary.json
            /tmp/comment-report-primary-after.json
            /tmp/python-comment-report-before.json
            /tmp/python-comment-report.json
            /tmp/powershell-comment-report.json
            /tmp/extension-inventory.json

      - name: Commit and push non-workflow cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No non-workflow cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove code comments across project'
          git push origin HEAD:chore/remove-code-comments-20260816
