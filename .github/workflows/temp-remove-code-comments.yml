name: Temporary code comment cleanup

on:
  push:
    branches:
      - chore/remove-code-comments-20260816

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: chore/remove-code-comments-20260816
          fetch-depth: 0

      - name: Restore comment cleanup tool
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/remove_code_comments.py
          python3 -m py_compile /tmp/remove_code_comments.py

      - name: Audit and remove comments
        run: python3 /tmp/remove_code_comments.py --apply --report /tmp/comment-report-before.json

      - name: Verify no removable comments remain
        run: python3 /tmp/remove_code_comments.py --check --report /tmp/comment-report-after.json

      - name: Upload detailed audit
        uses: actions/upload-artifact@v7
        with:
          name: code-comment-audit-${{ github.run_id }}
          path: |
            /tmp/comment-report-before.json
            /tmp/comment-report-after.json

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/temp-remove-code-comments.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'Remove code comments'
          git push origin HEAD:chore/remove-code-comments-20260816
