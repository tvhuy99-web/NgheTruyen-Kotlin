name: Temp XPK Main Integration

on:
  push:
    branches:
      - agent/xpk-main-integration
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: temp-xpk-main-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/xpk-main-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-main-integration
          fetch-depth: 0

      - name: Squash feature branch onto current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/xpk-six-parity-fixes
          set +e
          git merge --squash origin/agent/xpk-six-parity-fixes
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            expected="app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt"
            if [ "$unresolved" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unresolved"
              exit "$merge_status"
            fi
            python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/nghetruyen/app/playback/ReaderPlaybackService.kt')
          s = p.read_text(encoding='utf-8')
          start_marker = '<<<<<<< HEAD\n'
          mid_marker = '=======\n'
          end_marker = '>>>>>>> origin/agent/xpk-six-parity-fixes\n'
          start = s.index(start_marker)
          mid = s.index(mid_marker, start)
          end = s.index(end_marker, mid)
          ours = s[start + len(start_marker):mid]
          theirs = s[mid + len(mid_marker):end]
          ours = ours.replace('    @Volatile private var narrationReloadPending = false\n\n', '')
          replacement = theirs.rstrip('\n') + '\n\n' + ours.lstrip('\n')
          s = s[:start] + replacement + s[end + len(end_marker):]
          if any(marker in s for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('Conflict marker remained after resolution')
          p.write_text(s, encoding='utf-8')
          PY
            git add "$expected"
          fi
          rm .github/workflows/temp-xpk-main-integration.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate strict parity
        run: python3 scripts/check_xpk_strict_parity.py

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Commit integrated tree
        shell: bash
        run: |
          git add -A
          git commit -m "fix: integrate XPK narration and voice switch semantics"
          git push origin HEAD:agent/xpk-main-integration
