name: Temp XPK Main Integration

on:
  push:
    branches:
      - agent/xpk-main-integration

permissions:
  contents: write

concurrency:
  group: temp-xpk-main-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/xpk-main-integration
          fetch-depth: 0

      - name: Squash feature branch onto current main
        shell: bash
        run: |
          git fetch origin main agent/xpk-six-parity-fixes
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || true
          git merge --squash origin/agent/xpk-six-parity-fixes
          rm .github/workflows/temp-xpk-main-integration.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate strict parity
        run: python3 scripts/check_xpk_strict_parity.py

      - name: Assemble debug APK
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Commit integrated tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate XPK narration and voice switch semantics"
          git push origin HEAD:agent/xpk-main-integration
