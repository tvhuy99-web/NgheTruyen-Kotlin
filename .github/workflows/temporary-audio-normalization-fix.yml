name: Temporary audio normalization fix

on:
  push:
    branches:
      - fix/audio-normalization-and-category-move
    paths:
      - .github/workflows/temporary-audio-normalization-fix.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/audio-normalization-and-category-move
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Remove stale music-normalization overwrite
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          text = path.read_text(encoding='utf-8')
          stale_save = '                    settings.setSceneMusicTargetLufs(musicTargetLufs)\n'
          stale_requeue = '                    musicTracks.forEach { SceneMusicAnalysisWorker.enqueue(context, it.id, musicTargetLufs) }\n'
          assert text.count(stale_save) == 1, f'Expected one stale target save, found {text.count(stale_save)}'
          assert text.count(stale_requeue) == 1, f'Expected one stale requeue, found {text.count(stale_requeue)}'
          text = text.replace(stale_save, '')
          text = text.replace(stale_requeue, '')
          path.write_text(text, encoding='utf-8')

      - name: Commit the targeted fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-audio-normalization-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt .github/workflows/temporary-audio-normalization-fix.yml
          git commit -m "Fix stale background music normalization overwrite"
          git push origin HEAD:fix/audio-normalization-and-category-move

      - name: Compile debug Kotlin
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
