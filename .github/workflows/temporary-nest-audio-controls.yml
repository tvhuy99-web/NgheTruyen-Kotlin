name: Temporary nest audio controls

'on':
  push:
    branches:
      - feat/ai-sound-director
    paths:
      - .github/workflows/temporary-nest-audio-controls.yml

permissions:
  contents: write

jobs:
  patch-reader-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-sound-director
          fetch-depth: 0
      - name: Move AI audio controls into Background Music
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt')
          text = path.read_text(encoding='utf-8')

          outside = '''                ReaderMenuButton("NHẠC NỀN") { showReaderOptions = false; showMusicDialog = true }
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(
                    modifier = Modifier.fillMaxWidth(),
                )
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
'''
          replacement = '''                ReaderMenuButton("NHẠC NỀN") { showReaderOptions = false; showMusicDialog = true }
'''
          if text.count(outside) != 1:
              raise SystemExit(f'Expected exactly one outer AI audio block, found {text.count(outside)}')
          text = text.replace(outside, replacement, 1)

          anchor = '''            title = { Text("NHẠC NỀN") },
            text = { Column(Modifier.heightIn(max = 620.dp).verticalScroll(rememberScrollState())) {
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
'''
          nested = '''            title = { Text("NHẠC NỀN") },
            text = { Column(Modifier.heightIn(max = 620.dp).verticalScroll(rememberScrollState())) {
                vn.nghetruyen.app.ui.components.AudioDirectionLayerSwitches(
                    modifier = Modifier.fillMaxWidth(),
                )
                HorizontalDivider(Modifier.padding(vertical = 8.dp))
                Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one music dialog anchor, found {text.count(anchor)}')
          text = text.replace(anchor, nested, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-nest-audio-controls.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: nest AI audio controls inside background music"
          git push origin HEAD:feat/ai-sound-director
