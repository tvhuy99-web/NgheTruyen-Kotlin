name: Temporary verify audio fixes

on:
  push:
    branches:
      - fix/audio-normalization-and-category-move
    paths:
      - .github/workflows/temporary-verify-audio-fixes.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/audio-normalization-and-category-move
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile debug Kotlin
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Record successful verification and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-verify-audio-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-verify-audio-fixes.yml
          git commit -m "Verify audio fixes compile"
          git push origin HEAD:fix/audio-normalization-and-category-move
