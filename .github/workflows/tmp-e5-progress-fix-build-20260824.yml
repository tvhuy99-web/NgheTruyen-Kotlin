name: Build E5 Progress Fix APK

on:
  push:
    branches:
      - build/e5-progress-fix-20260824
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-progress-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Apply E5 and normalization fixes
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            ci/e5-progress-fix/1.patch \
            ci/e5-progress-fix/2.patch \
            ci/e5-progress-fix/3.patch \
            ci/e5-progress-fix/4.patch \
            ci/e5-progress-fix/5.patch \
            ci/e5-progress-fix/6.patch \
            ci/e5-progress-fix/7a.patch \
            ci/e5-progress-fix/7b.patch \
            ci/e5-progress-fix/8.patch; do
            echo "Applying $p"
            git apply --check "$p"
            git apply "$p"
          done
          git diff --check

      - name: Build debug APK
        shell: bash
        run: |
          BUILD_SHA="$(git rev-parse HEAD)"
          env -u GITHUB_SHA NGHETRUYEN_BUILD_SHA="$BUILD_SHA" ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk
          sha256sum dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk > dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk.sha256
          stat -c '%s' dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk > dist/apk-size-bytes.txt
          git rev-parse HEAD > dist/source-commit.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-E5-Progress-Normalization-Fix-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk
            dist/NgheTruyen-E5-Progress-Normalization-Fix-20260824.apk.sha256
            dist/apk-size-bytes.txt
            dist/source-commit.txt
