name: Temporary Gradle Cache Export Target

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  export-cache:
    if: github.event.pull_request.head.ref == 'fix/mode3-resolution-quality-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Warm Gradle dependencies without tests
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -x test -x connectedAndroidTest -x lint

      - name: Pack reusable Gradle cache
        shell: bash
        run: |
          mkdir -p dist/cache-root/.gradle/caches dist/cache-root/.gradle/wrapper
          cp -a "$HOME/.gradle/caches/modules-2" dist/cache-root/.gradle/caches/
          for d in "$HOME"/.gradle/caches/transforms-* "$HOME"/.gradle/caches/jars-*; do
            if [ -d "$d" ]; then cp -a "$d" dist/cache-root/.gradle/caches/; fi
          done
          cp -a "$HOME/.gradle/wrapper/dists" dist/cache-root/.gradle/wrapper/
          find dist/cache-root -type f \( -name '*.lock' -o -name 'gc.properties' \) -delete || true
          cat > dist/cache-root/README-GRADLE-CACHE.txt <<'EOF'
NgheTruyen-Kotlin Gradle cache

Copy the .gradle folder into your user home directory.
Linux/macOS: ~/.gradle
Windows: %USERPROFILE%\.gradle

Includes dependency artifacts, available transforms/jars, and Gradle wrapper distributions.
Android SDK is not included.
EOF
          tar -C dist/cache-root -czf dist/NgheTruyen-Gradle-Cache-20260824.tar.gz .gradle README-GRADLE-CACHE.txt
          sha256sum dist/NgheTruyen-Gradle-Cache-20260824.tar.gz > dist/NgheTruyen-Gradle-Cache-20260824.tar.gz.sha256
          du -h dist/NgheTruyen-Gradle-Cache-20260824.tar.gz

      - name: Upload Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Gradle-Cache-20260824
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/NgheTruyen-Gradle-Cache-20260824.tar.gz
            dist/NgheTruyen-Gradle-Cache-20260824.tar.gz.sha256

      - name: Report run ID to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `GRADLE_CACHE_EXPORT_RUN_ID=${context.runId}`
            })
