name: Export Gradle Cache for Local Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-local-gradle-cache-20260824.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Warm all APK dependencies
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -x test -x connectedAndroidTest -x lint

      - name: Pack reusable Gradle cache
        shell: bash
        run: |
          mkdir -p dist/cache-root/.gradle/caches dist/cache-root/.gradle/wrapper
          cp -a "$HOME/.gradle/caches/modules-2" dist/cache-root/.gradle/caches/
          for d in "$HOME"/.gradle/caches/transforms-* "$HOME"/.gradle/caches/jars-* "$HOME"/.gradle/caches/*/kotlin-dsl; do
            if [ -d "$d" ]; then cp -a "$d" dist/cache-root/.gradle/caches/; fi
          done
          cp -a "$HOME/.gradle/wrapper/dists" dist/cache-root/.gradle/wrapper/
          find dist/cache-root -type f \( -name '*.lock' -o -name 'gc.properties' \) -delete || true
          cat > dist/cache-root/README-GRADLE-CACHE.txt <<'EOF'
          NgheTruyen-Kotlin Gradle cache for offline/local build.
          Copy the .gradle folder into the build user's home directory or point GRADLE_USER_HOME to it.
          Includes Maven/Gradle dependency artifacts and Gradle wrapper distribution.
          Android SDK is not included.
          EOF
          tar -C dist/cache-root -czf dist/NgheTruyen-Gradle-Cache-20260824.tar.gz .gradle README-GRADLE-CACHE.txt
          sha256sum dist/NgheTruyen-Gradle-Cache-20260824.tar.gz > dist/NgheTruyen-Gradle-Cache-20260824.tar.gz.sha256
          du -h dist/NgheTruyen-Gradle-Cache-20260824.tar.gz

      - name: Upload Gradle cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-Gradle-Cache-20260824
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/NgheTruyen-Gradle-Cache-20260824.tar.gz
            dist/NgheTruyen-Gradle-Cache-20260824.tar.gz.sha256
