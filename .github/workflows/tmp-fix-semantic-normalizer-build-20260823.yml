name: Temporary Semantic Normalizer Fix + APK

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/tmp-fix-semantic-normalizer-build-20260823.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 .github/scripts/tmp_fix_semantic_normalizer_20260823.py

      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/vn/nghetruyen/app/ui/components/AudioDescriptionNormalizationDialog.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundImporter.kt
          git diff --cached --check
          git commit -m "fix: harden audio semantics and description normalization"
          git push origin HEAD:fix/mode3-resolution-quality-20260822

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Build debug APK only - no tests
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NgheTruyen-semantic-normalizer-fixed-20260823.apk
          sha256sum dist/NgheTruyen-semantic-normalizer-fixed-20260823.apk | tee dist/NgheTruyen-semantic-normalizer-fixed-20260823.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NgheTruyen-semantic-normalizer-fixed-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/NgheTruyen-semantic-normalizer-fixed-20260823.apk
            dist/NgheTruyen-semantic-normalizer-fixed-20260823.apk.sha256
