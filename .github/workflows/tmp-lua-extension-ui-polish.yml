name: Temporary Lua extension UI parity polish

on:
  push:
    branches:
      - agent/lua-extension-ui-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'polish Lua extension UI parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lua-extension-ui-parity
      - name: Polish parity details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''                        } else {\n                            ReferenceActionButton(\n                                text = "KIỂM TRA NATIVE",''', '''                        } else if (pack.runtimeMode == "NATIVE_LUA_COMPAT") {\n                            ReferenceActionButton(\n                                text = "KIỂM TRA NATIVE",''', 1)
          text = text.replace('''                if (selectedRepository.generatedAtEpochMs <= 0L) append(" - BẢN LƯU")\n''', '', 1)
          text = text.replace('''            text = (if (repositoryFilter == "all") "✓ " else "") + "TẤT CẢ",''', '''            text = if (repositoryFilter == "all") "TẤT CẢ ✓" else "TẤT CẢ",''', 1)
          text = text.replace('''            text = (if (repositoryFilter == "installed") "✓ " else "") + "ĐÃ CÀI",''', '''            text = if (repositoryFilter == "installed") "ĐÃ CÀI ✓" else "ĐÃ CÀI",''', 1)
          text = text.replace('''            text = (if (repositoryFilter == "updates") "✓ " else "") + "CẬP NHẬT",''', '''            text = if (repositoryFilter == "updates") "CẬP NHẬT ✓" else "CẬP NHẬT",''', 1)
          required = [
              'else if (pack.runtimeMode == "NATIVE_LUA_COMPAT")',
              '"TẤT CẢ ✓"',
              '"ĐÃ CÀI ✓"',
              '"CẬP NHẬT ✓"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing polish markers: {missing}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          git commit -m "polish Lua extension UI parity"
          git push origin HEAD:agent/lua-extension-ui-parity
