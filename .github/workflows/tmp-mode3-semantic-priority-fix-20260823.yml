name: Temporary Mode3 Semantic Priority Fix

on:
  push:
    branches:
      - fix/mode3-resolution-quality-20260822
    paths:
      - '.github/workflows/tmp-mode3-semantic-priority-fix-20260823.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/mode3-resolution-quality-20260822
          fetch-depth: 0

      - name: Apply semantic-priority fixes
        run: python3 .github/scripts/tmp_mode3_semantic_priority_fix_20260823.py

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'LOCAL_USE_WEIGHT = 0.40' app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt
          grep -q 'HARD_REMOTE_TITLE_IDENTITY_CONFLICT' app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt
          grep -q 'FreesoundImporter.hasValidNormalization(track)' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -q 'FreesoundSemanticCandidate' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt
          grep -q 'RETRY_ACTION_TERMS' app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt

      - name: Commit real source only and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/tmp-mode3-semantic-priority-fix-20260823.yml
          rm -f .github/scripts/tmp_mode3_semantic_priority_fix_20260823.py
          git add -A \
            app/src/main/java/vn/nghetruyen/app/freesound/Mode3LibraryAssetMatcher.kt \
            app/src/main/java/vn/nghetruyen/app/freesound/FreesoundAutoAudioResolver.kt \
            .github/workflows/tmp-mode3-semantic-priority-fix-20260823.yml \
            .github/scripts/tmp_mode3_semantic_priority_fix_20260823.py
          git diff --cached --check
          git commit -m "fix: prioritize local semantic descriptions and harden Mode 3"
          git push origin HEAD:fix/mode3-resolution-quality-20260822
