name: Validate compact UI merge

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/compact-merge-runner-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge compact UI history while preserving current validated UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/compact-ui-parity
          git checkout -B agent/compact-ui-integrated origin/main
          git merge --no-ff -X ours origin/agent/compact-ui-parity -m "Merge compact UI parity into main"
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git status --short >&2
            exit 1
          fi
          git checkout origin/main -- \
            app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt \
            app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          git add app/src/main/java/vn/nghetruyen/app/ui/screens/ReaderScreen.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/screens/StoryDetailScreen.kt \
                  app/src/main/java/vn/nghetruyen/app/ui/components/GlobalVoiceRoleEditorDialog.kt
          git commit --amend --no-edit

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 cryptography

      - name: Run project validation gate
        run: bash scripts/m0_gate.sh
