name: Resolve vBook overlap

on:
  push:
    branches:
      - agent/vbook-main-integration
    paths:
      - .github/workflows/vbook-integration-resolve.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v6
        with:
          ref: agent/vbook-main-integration
          fetch-depth: 0

      - name: Three-way merge overlapping app files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/vbook-complete
          base="$(git merge-base origin/main origin/agent/vbook-complete)"
          echo "MERGE_BASE=$base"
          files=(
            app/src/main/java/vn/nghetruyen/app/ui/AppViewModel.kt
            app/src/main/java/vn/nghetruyen/app/ui/NgheTruyenApp.kt
            app/src/main/java/vn/nghetruyen/app/ui/ReferenceNgheTruyenApp.kt
            app/src/main/java/vn/nghetruyen/app/ui/screens/PersonalScreen.kt
          )
          conflict_count=0
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            ours="$(mktemp)"
            ancestor="$(mktemp)"
            theirs="$(mktemp)"
            merged="$(mktemp)"
            git show "origin/main:$file" > "$ours"
            git show "$base:$file" > "$ancestor"
            git show "origin/agent/vbook-complete:$file" > "$theirs"
            if git merge-file -p "$ours" "$ancestor" "$theirs" > "$merged"; then
              cp "$merged" "$file"
              echo "CLEAN_MERGE=$file"
            else
              conflict_count=$((conflict_count + 1))
              cp "$ours" "$file"
              echo "CONFLICT_FALLBACK_TO_MAIN=$file"
              grep -n -B 18 -A 28 -E '^(<<<<<<<|=======|>>>>>>>)' "$merged" || true
            fi
            rm -f "$ours" "$ancestor" "$theirs" "$merged"
          done
          echo "CONFLICT_COUNT=$conflict_count"
          rm -f .github/workflows/vbook-integration-resolve.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git commit -m "fix(vbook): three-way merge current main app wiring"
          git push origin HEAD:agent/vbook-main-integration
