name: Verify UI parity compile

on:
  push:
    branches:
      - agent/settings-a11y-labels
    paths:
      - .github/workflows/verify-ui-parity.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and record result
        shell: bash
        run: |
          set +e
          python3 scripts/check_ui_control_parity.py > UI_PARITY_CHECK.log 2>&1
          PARITY_CODE=$?
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin > UI_COMPILE_FULL.log 2>&1
          COMPILE_CODE=$?
          set -e
          tail -n 500 UI_COMPILE_FULL.log > UI_CONTROL_PARITY_COMPILE.log
          {
            if [ "$PARITY_CODE" -eq 0 ]; then echo 'UI_CONTROL_PARITY=PASS'; else echo 'UI_CONTROL_PARITY=FAIL'; fi
            if [ "$COMPILE_CODE" -eq 0 ]; then echo 'KOTLIN_COMPILE=PASS'; else echo 'KOTLIN_COMPILE=FAIL'; fi
          } > UI_CONTROL_PARITY_VERIFIED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UI_CONTROL_PARITY_VERIFIED.txt UI_CONTROL_PARITY_COMPILE.log UI_PARITY_CHECK.log
          if ! git diff --cached --quiet; then
            git commit -m 'test: record UI parity verification details'
            git push origin HEAD:agent/settings-a11y-labels
          fi
          test "$PARITY_CODE" -eq 0
          test "$COMPILE_CODE" -eq 0
