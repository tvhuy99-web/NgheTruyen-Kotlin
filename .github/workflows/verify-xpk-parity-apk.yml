name: Verify XPK Parity APK

on:
  push:
    branches:
      - agent/xpk-parity-v290
    paths:
      - ".github/workflows/verify-xpk-parity-apk.yml"

permissions:
  contents: read

concurrency:
  group: verify-xpk-parity-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap verified Gradle Wrapper
        shell: bash
        run: |
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          ./scripts/bootstrap-wrapper.sh

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload verification APK
        uses: actions/upload-artifact@v7
        with:
          name: NgheTruyen-v2.9.0-xpk-parity-verify
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
